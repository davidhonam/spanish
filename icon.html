<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden}
  .icon{position:relative;width:100vw;height:100vh;
    background:radial-gradient(125% 125% at 30% 20%, #f0b429 0%, #d4350f 46%, #6e1208 100%)}
  .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font:700 60vw/1 Georgia,"Times New Roman",-apple-system,serif;
    color:#fff;text-shadow:0 2vw 7vw rgba(0,0,0,.4);transform:translateY(-5vh)}
  .stripe{position:absolute;left:0;right:0;bottom:0;height:15vh;display:flex;
    box-shadow:0 -1vh 4vh rgba(0,0,0,.25)}
  .stripe div:first-child,.stripe div:last-child{flex:1;background:#AA151B}
  .stripe div:nth-child(2){flex:1.4;background:#F1BF00}
</style></head><body>
  <div class="icon">
    <div class="glyph">ñ</div>
    <div class="stripe"><div></div><div></div><div></div></div>
  </div>
</body></html>

er."},{"id":1330,"es":"Por favor, no te olvides de enviar la carta.","en":"Don't forget to post the letter, please."},{"id":1331,"es":"Por favor, háblame acerca de tu ciudad en tu siguiente carta.","en":"Please tell me about your town in your next letter."},{"id":1332,"es":"Los niños van a ser una lastre para mi, por eso quiero seguir sin ellos.","en":"The children will be a drag on me, so I want to go without them."},{"id":1333,"es":"Se van a ir en tres días, es decir, el 10 de junio.","en":"They are leaving in three days, that is to say June 10th."},{"id":1334,"es":"De la manera que van las cosas, un conflicto armado puede muy bien ser inevitable.","en":"The way things are going, an armed conflict may well be unavoidable."},{"id":1335,"es":"Las chicas buenas van al cielo, las chicas malas van a todas partes.","en":"Good girls go to heaven, bad girls go everywhere."},{"id":1336,"es":"¡Si no obtengo mi billetera de vuelta para mañana, van a rodar cabezas !","en":"If I don't get my wallet back by tomorrow, heads will roll!"},{"id":1337,"es":"Debemos coger esas manzanas altiro, o si no se van a pudrir.","en":"We have to pick those apples right now, otherwise they'll decay."},{"id":1338,"es":"Cuando iba a la escuela, vi a mi tío.","en":"I saw my uncle on the way to school."},{"id":1339,"es":"Como iba diciendo, no voy a hacer nada.","en":"As l was saying, I won't do anything."},{"id":1340,"es":"Pensé que iba a estar enojado, pero para mi sorpresa, él sonrió.","en":"I thought he would be angry but, to my surprise, he smiled."},{"id":1341,"es":"Juan me dijo que no se iba a atrasar, pero todavía no se aparece.","en":"Tom told me he wouldn't be late, but he still hasn't shown up."},{"id":1342,"es":"Cuando era joven, me iba al colegio caminando.","en":"I walked to school when I was young."},{"id":1343,"es":"Cuando era joven, me iba caminando al colegio.","en":"I walked to school when I was young."},{"id":1344,"es":"Él iba a aceptar la oferta, pero se lo pensó mejor.","en":"He was going accept the offer, but thought better of it."},{"id":1345,"es":"En el auto de camino a casa, él iba haciendo planes para el día siguiente.","en":"In the car on the way home, he was making plans for the next day."},{"id":1346,"es":"Hablando de música, ¿qué tipo de música te gusta ?","en":"Talking of music, what kind of music do you like?"},{"id":1347,"es":"Le gusta no sólo la música, también los deportes.","en":"He likes not only music but sports."},{"id":1348,"es":"Me gusta escuchar música, y aún más tocar.","en":"I like listening to music, and playing music even more."},{"id":1349,"es":"A fin de cuentas, lo que cuenta en la música es el talento.","en":"After all, it is talent that counts in music."},{"id":1350,"es":"Ella dijo que tenía veinte años de edad, lo cual no era cierto.","en":"She said she was twenty years old, which was not true."},{"id":1351,"es":"En su cumpleaños, tomé un tren a la ciudad en la cual él vivía.","en":"On his birthday, I took a train to the town in which he lived."},{"id":1352,"es":"Él no dijo nada, lo cual le hizo enfadar.","en":"He said nothing, which made her angry."},{"id":1353,"es":"Él dijo que no conocía al hombre, lo cual era mentira.","en":"He said he did not know the man, which was a lie."},{"id":1354,"es":"Fue un hombre enviado de Dios, el cual se llamaba Juan.","en":"There came a man who was sent from God; his name was John."},{"id":1355,"es":"No dije nada, lo cual le hizo enfadar.","en":"I said nothing, which made him angry."},{"id":1356,"es":"Ella dijo que estaba mala, lo cual fue mentira.","en":"She said that she was ill, which was a lie."},{"id":1357,"es":"Sea cual sea la razón, ellos no se casaron.","en":"Whatever the reason, they did not marry."},{"id":1358,"es":"Juan hizo una y otra vez la misma pregunta, pero nunca tuvo una respuesta.","en":"Tom asked the same question over and over, but never got an answer."},{"id":1359,"es":"Juan siempre quiso visitar a Maria, pero nunca tuvo la oportunidad.","en":"Tom always wanted to visit Mary, but he never had the chance."},{"id":1360,"es":"A pesar de ser viejo y tullido, tuvo el valor suficiente para hacer el trabajo.","en":"Old and crippled, he had courage enough to do the work."},{"id":1361,"es":"Juan quería besar a Maria, pero no tuvo la osadía de intentarlo.","en":"Tom wanted to kiss Mary, but he didn't have the nerve to try."},{"id":1362,"es":"Por su enfermedad, tuvo que inevitablemente dejar el colegio.","en":"Illness forced him to give up school."},{"id":1363,"es":"Cuando estuvo en Los Ángeles, ella tuvo al menos seis trabajos diferentes.","en":"When she was in Los Angeles, she had at least six different jobs."},{"id":1364,"es":"Siendo huérfano, mi padre tuvo que comenzar a ganar dinero a los diez.","en":"Being an orphan, my father had to start earning money at ten."},{"id":1365,"es":"En un comienzo, él tuvo problemas acostumbrándose a vivir en su nueva casa.","en":"At first he had trouble adjusting to living in his new house."},{"id":1366,"es":"Él se fue a París, donde vivió durante cinco años.","en":"He went to Paris, where he lived for five years."},{"id":1367,"es":"Ella, durante su vida, crió a nueve niños.","en":"She brought up nine children in her life."},{"id":1368,"es":"Duermo mucho durante el día, así que se siente como si diera saltos por el tiempo.","en":"I sleep a lot during the day, so it feels like I'm warping through time."},{"id":1369,"es":"Hasta donde yo sé, no hubo problemas durante el primer semestre.","en":"As far as I know, there were no problems during the first semester."},{"id":1370,"es":"El Sol brilla durante el día, la Luna durante la noche.","en":"The sun shines during the day; the moon during the night."},{"id":1371,"es":"Lo esperé durante una hora en la estación, pero él no vino.","en":"I waited for him at the station for an hour, but he didn't show up."},{"id":1372,"es":"Yo me quedé de vacaciones allí, durante ese tiempo disfruté de surfear.","en":"I spent my summer vacation there, during which I enjoyed surfing."},{"id":1373,"es":"Durante las vacaciones, iré a Francia.","en":"During summer, I'm going to go to France."},{"id":1374,"es":"Cuando se acaba el verano, los días se hacen más y más cortos.","en":"When summer is over, the days grow shorter and shorter."},{"id":1375,"es":"Juan compró una cámara hace un par de días, pero ya la perdió.","en":"Tom bought a camera just a couple of days ago, but he's already lost it."},{"id":1376,"es":"Y si ves a Tom, dile buenos días de mi parte.","en":"And if you see Tom, say hello to him for me."},{"id":1377,"es":"Ella cocina para él todos los días, pero él no lo aprecia.","en":"She cooks for him every day, but he doesn't appreciate it."},{"id":1378,"es":"Como amigo, le di mi opinión.","en":"As the friend, I gave an opinion."},{"id":1379,"es":"Tenía algo de tiempo libre, así que di vueltas por la ciudad.","en":"I had some free time, so I wandered around town."},{"id":1380,"es":"Cuando quieras engañar al mundo, di la verdad.","en":"When you want to fool the world, tell the truth."},{"id":1381,"es":"De hecho, aquí estás haciendo dos preguntas.","en":"You're actually asking two questions there."},{"id":1382,"es":"Papá, ¿qué estabas haciendo ?","en":"Father, What were you just doing?"},{"id":1383,"es":"Si miras alrededor, verás a muchas personas haciendo lo mismo.","en":"If you look around, you'll see many people doing the same thing."},{"id":1384,"es":"Cuando él vino, yo estaba haciendo la tarea.","en":"When he came, I was doing my homework."},{"id":1385,"es":"No te preocupes, Tom, lo estás haciendo bien.","en":"Don't worry Tom, you are doing well."},{"id":1386,"es":"No te preocupes, lo estás haciendo bien.","en":"Don't worry, you're doing well."},{"id":1387,"es":"Sin embargo, el niño se quedó lejos por un largo tiempo.","en":"But the boy stayed away for a long time."},{"id":1388,"es":"Después de que todos se fueran, se quedó sin amigos.","en":"After everyone left, he remained, friendless."},{"id":1389,"es":"Él estaba enfermo, así que se quedó en cama el día entero.","en":"He was ill, so he lay in bed all day long."},{"id":1390,"es":"Sin embargo, el color quedó diferente al de la muestra de su catálogo.","en":"However, the color was different from the sample color in your catalog."},{"id":1391,"es":"Como él no sabía qué decir, se quedó callado.","en":"As he didn't know what to say, he remained silent."},{"id":1392,"es":"En el principio cuando vio su tamaño, mi ingenua novia quedó deslumbrada.","en":"When she first saw the size of it, my naive girlfriend was blown away."},{"id":1393,"es":"Después del desastre, casi no quedó agua en la isla.","en":"After the disaster, there was scarcely any water left on the island."},{"id":1394,"es":"Por favor, cierra la puerta con llave antes de salir.","en":"Please lock the door before you go out."},{"id":1395,"es":"Una vez que tienes un mal hábito, puede ser difícil salir de él.","en":"Once you've got into a bad habit, it can be difficult to get out of it."},{"id":1396,"es":"Cuando estaba por salir de casa, recibí una llamada de ella.","en":"When I was about to leave my house, I got a telephone call from her."},{"id":1397,"es":"Permiso por favor, tengo que salir.","en":"Please excuse me, I have to leave."},{"id":1398,"es":"No he leído esta nueva novela, y tampoco lo ha hecho mi hermana.","en":"I haven't read this new novel, and my sister hasn't either."},{"id":1399,"es":"Si es posible, me gustaría recibir nueva información acerca de este caso.","en":"If possible, I'd like to receive new information about this case."},{"id":1400,"es":"Si quieres una bicicleta nueva, mejor empieza a ahorrar.","en":"If you want a new bike, you'd better start saving up."},{"id":1401,"es":"De verdad necesito algo de ropa nueva, pensó Dima.","en":"I really need some new clothes, thought Dima."},{"id":1402,"es":"Iba a comprar una mesa nueva, pero mi marido ya arregló la pata rota.","en":"I was going to buy a new table, but my husband fixed the broken leg."},{"id":1403,"es":"¿Cuál es la capital de los Estados Unidos, Washington o Nueva York ?","en":"Which is the capital of the United States, Washington or New York?"},{"id":1404,"es":"Por lo visto, nunca se ponen de acuerdo en nada.","en":"They never seem to get together on anything."},{"id":1405,"es":"De hecho, he visto esta película antes.","en":"Actually, I've seen this movie before."},{"id":1406,"es":"He visto varias veces la película, pero me gustaría verla de nuevo.","en":"I've seen the film many times, but I'd like to see it again."},{"id":1407,"es":"Así que, ¿qué quieres saber ?","en":"So what do you want to know?"},{"id":1408,"es":"Si me vas a matar, quiero saber por qué.","en":"If you're going to kill me, I want to know why."},{"id":1409,"es":"Por no saber su dirección, no le escribió.","en":"Not knowing his address, she didn't write to him."},{"id":1410,"es":"Hablando de Maria, hace bastante tiempo que no la veo.","en":"Speaking of Mary, I have not seen her for a long time."},{"id":1411,"es":"Ya que he vivido en Tokio antes, conozco bastante bien la ciudad.","en":"Since I lived in Tokyo, I know that city pretty well."},{"id":1412,"es":"Si yo fuera tú, me iría a mi casa y descansaría bastante.","en":"If I were you, I would go home and take a good rest."},{"id":1413,"es":"Este parque es bastante grande, tiene un montón de árboles y muchas flores.","en":"This park is pretty big; it has a lot of trees and many flowers."},{"id":1414,"es":"Dijo que me amaba, lo que me sorprendió bastante.","en":"He told me he loved me, which surprised me quite a lot."},{"id":1415,"es":"Mi chino no es perfecto, pero pude entender bastante de lo que él habló.","en":"My Chinese is not perfect, but I could understand enough of what he said."},{"id":1416,"es":"Ahora que Juan está desempleado, tiene bastante tiempo libre.","en":"Now that Tom is unemployed, he has quite a bit of free time."},{"id":1417,"es":"La carretera estaba bastante embarrada, y lo que es peor, empezó a llover.","en":"The road was quite muddy, and, what is worse, it began to rain."},{"id":1418,"es":"Es un buen restaurante, pero es bastante caro.","en":"It's a good restaurant, but it's quite expensive."},{"id":1419,"es":"Por lo que yo sé, él es una persona que mantiene su promesa.","en":"As far as I know, he is a person who keeps his promises."},{"id":1420,"es":"Quiero hacer una llamada de persona a persona, por favor.","en":"Make it a person-to-person call, please."},{"id":1421,"es":"Él es un tipo de persona que llama al pan, pan y al vino, vino.","en":"He is a type of a person who calls a spade a spade."},{"id":1422,"es":"No lo he conocido en persona, pero lo conozco.","en":"I haven't met him in person, but I know of him."},{"id":1423,"es":"Fuera de casa, Juan es otra persona.","en":"John is another person outside home."},{"id":1424,"es":"Sí, tengo seguro.","en":"Yes, I have insurance."},{"id":1425,"es":"En efecto, no puedo estar seguro de que Juan no haya tomado el dinero.","en":"I can't really be certain that Tom didn't take the money."},{"id":1426,"es":"Entonces, ¿estás seguro de que no quieres ir a Boston ?","en":"So, you're sure you don't want to go to Boston?"},{"id":1427,"es":"Si Maria abofeteó a Tom, estoy seguro de que se lo merecía.","en":"If Mary slapped Tom, I'm sure he deserved it."},{"id":1428,"es":"El pasado, pasado está.","en":"The past is the past."},{"id":1429,"es":"Si llueve pasado mañana, me quedaré en casa.","en":"If it rains the day after tomorrow, I'll stay at home."},{"id":1430,"es":"Si llueve pasado mañana, me quedo en casa.","en":"If it rains the day after tomorrow, I will stay at home."},{"id":1431,"es":"Por favor, ven a almorzar a mi casa pasado mañana.","en":"Please come over for lunch the day after tomorrow."},{"id":1432,"es":"¿Cómo fue el fin de semana pasado, Nancy ?","en":"How was last weekend, Nancy?"},{"id":1433,"es":"Quiero estar allí, ya sabes.","en":"I want to be there, you know."},{"id":1434,"es":"No, nunca estuve allí.","en":"No, I've never been there."},{"id":1435,"es":"Si lo hubiese sabido, habría ido allí.","en":"If I had known it, I would have gone there."},{"id":1436,"es":"¿Vive ella cerca de usted, señor ?","en":"Does she live near you, sir?"},{"id":1437,"es":"No puede pasar, señor.","en":"You may not pass, sir."},{"id":1438,"es":"Estoy buscando trabajo, señor.","en":"I am looking for a job, sir."},{"id":1439,"es":"Anoche, el señor A me llamó para decirme que no podría asistir a la reunión de hoy.","en":"Last night, Mr. A called me up to say he couldn't attend today's meeting."},{"id":1440,"es":"Éste es el último tren, señor.","en":"This is the last train, sir."},{"id":1441,"es":"¿Cuál es su nombre, señor ?","en":"What is your name, sir?"},{"id":1442,"es":"Señor, usted no puede estacionar su coche aquí.","en":"Sir, you are not allowed to park your car here."},{"id":1443,"es":"El próximo domingo, vamos a hacer una fiesta para el señor Oka.","en":"Next Sunday we are going to have a party for Mr Oka."},{"id":1444,"es":"No, señor, soy alemán.","en":"No, Sir, I am German."},{"id":1445,"es":"Tenemos algo especial para usted, señor.","en":"We have something special for you, sir."},{"id":1446,"es":"Juan no come carne, y Maria tampoco.","en":"Tom doesn't eat meat and neither does Mary."},{"id":1447,"es":"Ella no come carne, ¿verdad ?","en":"She doesn't eat meat, does she?"},{"id":1448,"es":"Si Juan no se come esto, por favor, dáselo a Maria.","en":"If Tom doesn't eat this, please give it to Mary."},{"id":1449,"es":"Juan come con la mano izquierda, pero escribe con la derecha.","en":"Tom eats with his left hand, but he writes with his right."},{"id":1450,"es":"Si tienes hambre, come algo.","en":"If you’re hungry, have something to eat."},{"id":1451,"es":"Si estás ocupado, puedo hacerlo por ti.","en":"If you're busy, I can do that for you."},{"id":1452,"es":"Por favor, háblame acerca de ti y tu familia.","en":"Please tell me about you and your family."},{"id":1453,"es":"Cuando el río suena, agua lleva.","en":"There is no smoke without fire."},{"id":1454,"es":"A menudo, el temor a un mal nos lleva a otro peor.","en":"Often the fear of one evil leads us into a worse."},{"id":1455,"es":"La edad no lleva a la madurez, a menos que seas un queso.","en":"Age doesn't lead to maturity, unless you're a cheese."},{"id":1456,"es":"De primero, lleva sopa.","en":"The first course is soup."},{"id":1457,"es":"Hoy, María lleva un vestido nuevo.","en":"Mary is wearing a new dress today."},{"id":1458,"es":"Hoy está muy soleado, así que todo el mundo lleva gafas de sol.","en":"Today it's very sunny, so everyone is wearing sunglasses."},{"id":1459,"es":"Ella ha visto un montón de cosas locas, pero ésta se lleva las palmas.","en":"She has seen a lot of crazy things but this one took the cake."},{"id":1460,"es":"Da igual lo que diga, ella siempre me lleva la contraria.","en":"It doesn't matter what I say, she always contradicts me."},{"id":1461,"es":"Antes del desayuno, ella lleva su perro al parque.","en":"She takes her dog to the park before breakfast."},{"id":1462,"es":"Por la cara que lleva, ahora está de mal humor.","en":"From the look on his face, he is in a bad mood now."},{"id":1463,"es":"Lo siento, te quiero.","en":"I'm sorry, I love you."},{"id":1464,"es":"Lo siento, no tengo dinero.","en":"Sorry, I don't have any money."},{"id":1465,"es":"Lo siento, mi papá no está en casa.","en":"I'm sorry, my dad is not at home."},{"id":1466,"es":"Por cierto, ¿de dónde eres ?","en":"By the way, where are you from?"},{"id":1467,"es":"¿Podría decirme por dónde se va a la estación, por favor ?","en":"Could you tell me the way to the station, please?"},{"id":1468,"es":"¿Podrías decirme por dónde se va a la estación, por favor ?","en":"Could you tell me the way to the station, please?"},{"id":1469,"es":"Ella le preguntó dónde vivía, pero él era demasiado listo para decírselo.","en":"She asked him where he lived, but he was too smart to tell her."},{"id":1470,"es":"Por favor, averigua dónde está ella.","en":"Please find out where she is."},{"id":1471,"es":"¿Podrían decirme por dónde se va a la estación, por favor ?","en":"Could you tell me the way to the station, please?"},{"id":1472,"es":"No sé de dónde vienes, y él tampoco.","en":"I don't know where you're from, and neither does he."},{"id":1473,"es":"Te gusta el inglés, ¿no es cierto ?","en":"You like English, don't you?"},{"id":1474,"es":"Si fuera posible, uno debería vivir dos veces.","en":"If possible, one should live twice."},{"id":1475,"es":"Debería estar estudiando inglés, pero quiero ir a ver una película.","en":"I should be studying English, but I want to watch a movie."},{"id":1476,"es":"Si viene, ¿qué debería decirle ?","en":"If he comes, what should I say to him?"},{"id":1477,"es":"Por ser un vino tan caro, realmente debería saber mejor que esto.","en":"For being such an expensive wine, it really should taste better than this."},{"id":1478,"es":"Estoy un poco borracho, creo que debería de dejar de beber ya.","en":"I'm a bit drunk. I think I should stop drinking now."},{"id":1479,"es":"Maria quiere perder algo de grasa, pero Juan cree que no debería.","en":"Mary wants to lose some fat, but Tom thinks that she shouldn't."},{"id":1480,"es":"Debería estar estudiando inglés, pero prefiero ver una película.","en":"I should be studying English, but I'd rather watch a movie."},{"id":1481,"es":"Debería estudiar ahora, pero prefiero quedarme en Tatoeba.","en":"I should study now, but I prefer staying on Tatoeba."},{"id":1482,"es":"Él quiere tarta, pero no la necesita.","en":"He wants a cake but doesn’t need it."},{"id":1483,"es":"Es rico, ¡no necesita dinero !","en":"He's rich. He doesn't need money!"},{"id":1484,"es":"Juan necesita dormir al menos nueve horas por noche, o si no no funciona.","en":"Tom needs at least nine hours of sleep every night or he can't function."},{"id":1485,"es":"Para conducir un coche, se necesita el carnet de conducir.","en":"To drive a car, you need a license."},{"id":1486,"es":"Por si acaso lo necesita, lleve usted dinero.","en":"Take some money just in case you need it."},{"id":1487,"es":"Si usted necesita ayuda, no dude en llamarme.","en":"If you need help, feel free to call me."},{"id":1488,"es":"Lo que se necesita ahora son acciones, no palabras.","en":"Not words but action is needed now."},{"id":1489,"es":"Por lo que yo sé, no hubo problemas en el primer semestre.","en":"As far as I am aware, there were no problems during the first semester."},{"id":1490,"es":"Para hacer el cuento corto, él se casó con su primer amor.","en":"To make a long story short, he married his first love."},{"id":1491,"es":"Cuando él terminó la carrera en primer lugar, fue una victoria para el país entero.","en":"It was a victory for the whole country when he finished first in the race."},{"id":1492,"es":"El primer grupo estudia en la mañana, y el segundo en la noche.","en":"The first group studies in the morning, the second in the evening."},{"id":1493,"es":"En primer lugar, la felicidad está relacionada con el dinero.","en":"Firstly, happiness is related to money."},{"id":1494,"es":"Dale chance John, es su primer día en el trabajo.","en":"Cut him some slack, John. It's his first day on the job."},{"id":1495,"es":"Bill se levantó tan temprano, que cogió el primer tren.","en":"Bill got up so early that he caught the first train."},{"id":1496,"es":"Por favor, llame a su primer testigo.","en":"Please call your first witness."},{"id":1497,"es":"Si estuviera de llover, él no iría.","en":"If it were to rain, he would not go."},{"id":1498,"es":"Si ella estuviera aquí ahora, le diría la verdad.","en":"If she were here now, I would tell her the truth."},{"id":1499,"es":"Si estuviera en tu situación, haría lo mismo.","en":"If I were in your situation, I would do the same thing."},{"id":1500,"es":"Si estuviera feliz, tocaría mucho mejor.","en":"If I were happy, I would play much better."},{"id":1501,"es":"Si Juan estuviera en problemas, Maria lo sabría.","en":"If Tom were in trouble, Mary would know."},{"id":1502,"es":"Si por casualidad el coche estuviera en malas condiciones, iré en autobús.","en":"If anything should be wrong with my car, I would go by bus."},{"id":1503,"es":"Si estuviera en su lugar, todavía no me rendiría.","en":"If I were in her place, I wouldn't give up yet."},{"id":1504,"es":"Si yo estuviera en tu posición, no haría ese trabajo.","en":"If I were in your position I wouldn't do that job."},{"id":1505,"es":"Nunca voy a entender a las mujeres, dijo Tom.","en":"I'll never understand women, said Tom."},{"id":1506,"es":"Antes, en este país, las mujeres no solían hablar acerca de política.","en":"Women didn't use to talk politics in this country."},{"id":1507,"es":"Me gustan las mujeres, pero no me llevo bien con ellas.","en":"I like women but I don't get along with them."},{"id":1508,"es":"Como un todo, eran un buen grupo.","en":"They were a good group as a whole."},{"id":1509,"es":"Cuando yo tenía tu edad, las cosas eran muy distintas.","en":"When I was your age, things were very different."},{"id":1510,"es":"Su hija, al igual que su hijo, eran famosos.","en":"His daughter, as well as his son, were famous."},{"id":1511,"es":"Algunos estudiantes eran de Asia, y otros de Europa.","en":"Some of the students were from Asia and the others were from Europe."},{"id":1512,"es":"Sin duda alguna, esos eran recuerdos de mi vida pasada.","en":"Those were without a doubt memories from my past life."},{"id":1513,"es":"Ellos estaban atacando a la gente, no eran personas pacificas.","en":"They were attacking people, not peaceful people."},{"id":1514,"es":"En los primeros días de la historia americana, los negros eran esclavos.","en":"In the early days of American history, blacks lived in slavery."},{"id":1515,"es":"Las canciones viejas eran mucho, mucho mejores.","en":"The old songs were much, much better."},{"id":1516,"es":"Para él, sus principios eran irrefutables.","en":"For him, his principles were irrefutable."},{"id":1517,"es":"Los trabajadores eran alérgicos a la cosecha, también estornudaron sobre ella.","en":"The workers were allergic to the harvest, and they also sneezed upon her."},{"id":1518,"es":"Ahora estoy ocupado, no puedo jugar contigo.","en":"I am busy now and can't play with you."},{"id":1519,"es":"Ella sabe jugar a tenis, y yo también.","en":"She can play tennis, and so can I."},{"id":1520,"es":"Por lo general, vale la pena jugar el juego de la vida.","en":"As a rule, the game of life is worth playing."},{"id":1521,"es":"A causa de la lluvia, no pudimos jugar al tenis fuera.","en":"Because of the rain, we weren't able to play tennis outside."},{"id":1522,"es":"Si hace calor, voy a nadar. Cuando llueve, me gusta jugar al ajedrez.","en":"When it's hot, I go swim. When it rains, I like to play chess."},{"id":1523,"es":"Si tú quieres, yo te enseño a jugar ajedrez.","en":"If you like, I will teach you to play chess."},{"id":1524,"es":"Soy demasiado grande para jugar con bichos, dijo el muchacho.","en":"I'm too old to be playing with bugs, said the boy."},{"id":1525,"es":"Me gusta jugar deportes por la diversión, no por la competencia.","en":"I like to play sport for fun not for competition."},{"id":1526,"es":"Era una guerra que, en realidad, ninguna nación quería.","en":"It was a war no nation really wanted."},{"id":1527,"es":"Lo que es yo, no tengo ninguna queja.","en":"As for me, I have nothing to complain of."},{"id":1528,"es":"Sorprendentemente, no había ninguna persona en el pueblo.","en":"To my surprise, there were no people in the village."},{"id":1529,"es":"Si no fuera por el agua, ninguna criatura podría vivir.","en":"If it were not for water no creature could live."},{"id":1530,"es":"Juan dio un montón de sugerencias, pero no me gustó ninguna de ellas.","en":"Tom gave a lot of suggestions, but I didn't like any of them."},{"id":1531,"es":"No sé si lo pueda hacer, pero lo voy a intentar.","en":"I don't know whether I can do it, but I'll try."},{"id":1532,"es":"No importa lo cansado que pueda estar, tengo que trabajar.","en":"No matter how tired I might be, I have to work."},{"id":1533,"es":"Por más extraño que pueda sonar, lo que Juan dijo es verdad.","en":"As strange as it may sound, what Tom said is true."},{"id":1534,"es":"Tan extraño como pueda sonar, lo que dijo Juan es lo que pasó verdaderamente.","en":"As strange as it may sound, what Tom said is what really happened."},{"id":1535,"es":"Lo que pueda ir mal, irá mal.","en":"Whatever can go wrong will go wrong."},{"id":1536,"es":"Yo entiendo tu punto de vista, pero aun así no estoy de acuerdo.","en":"I get your point, but I still don't agree."},{"id":1537,"es":"Cuando llegué a la estación, el tren estaba a punto de irse.","en":"When I arrived at the station, the train was just about to leave."},{"id":1538,"es":"Estás viviendo un sueño, y el sueño está a punto de terminar.","en":"You are living a dream, and the dream is about to end."},{"id":1539,"es":"Claramente, este es el punto más importante.","en":"Clearly, this is the most important point."},{"id":1540,"es":"Y cuando me haya ido, no le digas que estoy muerto.","en":"And when I've gone, don't tell him I'm dead."},{"id":1541,"es":"Por favor, llámeme en cuanto haya decidido lo que quiere hacer.","en":"Please call me when you have decided what you would like to do."},{"id":1542,"es":"Puede que ella haya discutido con él, pero no creo que pudiera pegarle.","en":"She may have argued with him, but I don't think she could have hit him."},{"id":1543,"es":"Según su opinión, él es el mejor músico que ella haya visto.","en":"In her opinion, he is the best musician she has ever seen."},{"id":1544,"es":"Por favor, espérese hasta que haya acabado de escribir esta carta.","en":"Please wait until I have finished writing this letter."},{"id":1545,"es":"De camino a casa, Maria se encontró con John.","en":"On her way home, Mary came across John."},{"id":1546,"es":"Si no te sabes el camino, pregúntale a un policía.","en":"If you don't know the way, ask a policeman."},{"id":1547,"es":"La felicidad no es el objetivo, si no que el camino.","en":"Happiness isn't the destination, happiness is the journey."},{"id":1548,"es":"La educación es el camino a la felicidad, la paz, la rectitud y el éxito.","en":"Education is the path to happiness, peace, righteousness, and success."},{"id":1549,"es":"¿Podrías enseñarme el camino, por favor ?","en":"Will you please show me the way?"},{"id":1550,"es":"Él me prestó dos libros, de los cuales aún no he leído ninguno.","en":"He lent me two books, neither of which I have read as yet."},{"id":1551,"es":"Juan tiene un montón de libros de religión, pero él nunca los leyó.","en":"Tom has a lot of religious books, but he has never read them."},{"id":1552,"es":"Los domingos, Juan no hace nada más que leer libros.","en":"Tom does nothing but read books on Sundays."},{"id":1553,"es":"Debido a la televisión, niños y niñas no quieren leer libros.","en":"Because of TV, boys and girls don't want to read books."},{"id":1554,"es":"Mientras seas joven, lee tantos libros como puedas.","en":"Read as many books as you can while you are young."},{"id":1555,"es":"Me parece bien que todavía existan libros, pero me dan sueño.","en":"I think it is good that books still exist, but they do make me sleepy."},{"id":1556,"es":"A causa del mal tiempo, el avión llegó con tres horas de retraso.","en":"Because of bad weather, the plane arrived three ours late."},{"id":1557,"es":"Juan llegó tarde a clase, como suele ser habitual en él.","en":"Tom was late for class, as is often the case."},{"id":1558,"es":"Como suele suceder con ella, no llegó a tiempo.","en":"As is often the case with her, she didn't show up on time."},{"id":1559,"es":"Como suele suceder con él, llegó tarde a clase hoy.","en":"As is often the case with him, he was late for class today."},{"id":1560,"es":"Llegó media hora más tarde, así que todos se enojaron con él.","en":"He arrived half an hour late, so everyone was angry with him."},{"id":1561,"es":"Como sucede a menudo, Mike llegó tarde a la reunión esta tarde.","en":"As is often the case, Mike was late for the meeting this afternoon."},{"id":1562,"es":"No sabes lo que es, ¿verdad ?","en":"You don't know what it is, do you?"},{"id":1563,"es":"Tú sabes algo, ¿verdad ?","en":"You know something, don't you?"},{"id":1564,"es":"No sabes nadar bien, ¿verdad ?","en":"You can't swim well, can you?"},{"id":1565,"es":"Sabes de eso, ¿cierto ?","en":"You know about that, don't you?"},{"id":1566,"es":"Hace mucho calor hoy, ¿no ?","en":"It's very hot today, isn't it?"},{"id":1567,"es":"Juan tiene que ir, incluso si llueve.","en":"Tom has to go even if it rains."},{"id":1568,"es":"De hecho, él incluso la amaba.","en":"In fact, he even loved her."},{"id":1569,"es":"Incluso si es verdad, apenas importa.","en":"Even if it is true, it matters little."},{"id":1570,"es":"Juan siempre insiste en que él tiene razón, incluso cuando todos sabemos que está equivocado.","en":"Tom always insists that he's right even when we all know that he's wrong."},{"id":1571,"es":"Incluso cuando me senté al sol, tenía frío.","en":"Even when I sat in the sun, I was cold."},{"id":1572,"es":"El clima aquí es muy suave, así que rara vez nieva aquí incluso cuando es invierno.","en":"The climate here is very mild, so it seldom snows here even in the winter."},{"id":1573,"es":"Puesto que mi habitación está orientada al sur, no es tan fría incluso cuando es invierno.","en":"Since my room faces south, it isn't so cold even in the winter."},{"id":1574,"es":"Tenéis que ir, incluso si no queréis.","en":"You've got to go even if you don't want to."},{"id":1575,"es":"Su inglés no es malo, viendo que él ha estudiado por sólo dos años.","en":"His English is not bad, seeing that he has studied for only two years."},{"id":1576,"es":"O sea, mi papá es dos años mayor que mi mamá.","en":"That is, Father is two years older than Mother."},{"id":1577,"es":"Mi esposa normalmente no bebe café por la noche, y yo tampoco.","en":"My wife usually doesn't drink coffee at night. I don't either."},{"id":1578,"es":"Si el dolor sigue, tiene que ir al médico.","en":"If the pain continues you have to go to the doctor."},{"id":1579,"es":"No esta noche, tengo dolor de cabeza.","en":"Not tonight, I have a headache."},{"id":1580,"es":"Cuando pienso en aquellos estudiantes, me da dolor de cabeza.","en":"When I think about those students, it gives me a headache."},{"id":1581,"es":"Tenía un terrible dolor de cabeza, así que me fui a acostar temprano.","en":"I had a bad headache. That's why I went to bed early."},{"id":1582,"es":"Aún tengo un dolor de cabeza, pero me estoy sintiendo mejor esta mañana.","en":"I still have a headache, but I'm feeling better this morning."},{"id":1583,"es":"Juan no podía soportar más el dolor, así que se pegó un tiro.","en":"Tom couldn't bear the pain any more so he shot himself."},{"id":1584,"es":"Yo sentí su dolor, y sufrí con ellos.","en":"I felt their pain, and suffered with them."},{"id":1585,"es":"No comas demasiado, no te vaya a dar dolor de tripa.","en":"Don't get a stomachache by eating too much."},{"id":1586,"es":"Cada vez que ella tosía, sentía mucho dolor.","en":"Every time she coughed, she felt a great deal of pain."},{"id":1587,"es":"Por cierto, tengo que decirte una cosa.","en":"By the way, I have something to tell you."},{"id":1588,"es":"Los perros, los gatos y los caballos son animales.","en":"The dogs, the cats, and the horses are animals."},{"id":1589,"es":"Por favor, no alimente a los animales.","en":"Do not feed the animals."},{"id":1590,"es":"No alimente a los animales, por favor.","en":"Please don't feed the animals."},{"id":1591,"es":"Me gustan los animales, por ejemplo, los gatos y perros.","en":"I like animals, for example, cats and dogs."},{"id":1592,"es":"Algunos animales, como los tigres, comen carne.","en":"Some animals, as tigers, eat meat."},{"id":1593,"es":"Todos los animales son iguales, pero algunos son más iguales que otros.","en":"All animals are equal, but some animals are more equal than others."},{"id":1594,"es":"Ayer hacía frío, pero hoy hace aún más frío.","en":"It was cold yesterday, but it is still colder today."},{"id":1595,"es":"Linda no baila mucho ahora, pero sé que antes sí lo hacía a menudo.","en":"Linda does not dance much now, but I know she used to a lot."},{"id":1596,"es":"Mi padre era funcionario, y mi madre tampoco hacía nada.","en":"My father was a civil servant, and my mother wasn't doing anything either."},{"id":1597,"es":"La vela se hacía más y más corta, hasta que se apagó.","en":"The candle grew shorter and shorter, until at last it went out."},{"id":1598,"es":"Brillaba el sol y hacía bueno, así que me tomé el día libre.","en":"The sun was shining and it was warm, so I took the day off."},{"id":1599,"es":"No hacía falta que se diera prisa, ha llegado demasiado pronto.","en":"You needn't have hurried; you've arrived too early."},{"id":1600,"es":"Hacía calor, así es que abrí la ventana.","en":"It was warm, so I opened the window."},{"id":1601,"es":"Como hacía mucho calor, fuimos a bañarnos.","en":"It was so hot that we went swimming."},{"id":1602,"es":"Al comer, el plato más grande es siempre la mesa.","en":"When eating, the largest plate is always the table."},{"id":1603,"es":"Tokio es, por mucho, la ciudad más grande de Japón.","en":"Tokyo is by far the largest city in Japan."},{"id":1604,"es":"No es un cuarto muy grande, pero es hermoso.","en":"It's not a big room, but it's beautiful."},{"id":1605,"es":"A ser posible, me gustaría cambiar esto por una talla más grande.","en":"If it's possible, I'd like to exchange this for a larger size."},{"id":1606,"es":"Mi padre solía fumar, pero ya no.","en":"My father used to smoke, but now he doesn't."},{"id":1607,"es":"Él solía decirlo, pero ahora ya no.","en":"He used to say so, but now he doesn't."},{"id":1608,"es":"Cuando yo era pequeño, él solía venir a vernos a menudo.","en":"He would often come to see us when I was a child."},{"id":1609,"es":"Solía fumar mucho, pero ahora lo he dejado.","en":"I used to smoke a lot, but I have given up smoking now."},{"id":1610,"es":"Ahora Juan no tiene mascota, pero solía tener un perro.","en":"Tom doesn't have a pet now, but he used to have a dog."},{"id":1611,"es":"Cada mañana, esa mujer solía ir a la playa y correr tres millas.","en":"Every morning that woman used to go to the beach and run three miles."},{"id":1612,"es":"Cuando yo era joven, solía ir a ver partidos de béisbol.","en":"When I was young, I would often go to watch baseball games."},{"id":1613,"es":"Yo sé como resolver el problema, pero se me pidió que no te lo dijera.","en":"I know how to solve the problem, but I've been asked not to tell you."},{"id":1614,"es":"Juan le pidió a Maria que se quede, pero ella no quiso.","en":"Tom asked Mary to stay, but she didn't want to."},{"id":1615,"es":"Cuando consiguió estar a solas con ella, él le pidió una cita.","en":"When he got her alone for a moment, he asked for a date."},{"id":1616,"es":"Ella le pidió que entrara a su casa, pero él se negó.","en":"She asked him to come into her house, but he refused."},{"id":1617,"es":"Ella sacó mi bicicleta frente a mis ojos, ¡ni siquiera me la pidió !","en":"She took my bicycle before my eyes; she didn't even ask me for it!"},{"id":1618,"es":"Pobre como era, no pidió prestado dinero a nadie.","en":"Poor as he was, he did not borrow money from others."},{"id":1619,"es":"Ella le pidió que le llamara más tarde, pero a él se le olvidó.","en":"She asked him to call her later, but he forgot to."},{"id":1620,"es":"Le pidió que entrara a su casa, pero él se negó.","en":"She asked him to come into her house, but he refused."},{"id":1621,"es":"Juan le pidió a Maria que le diera un masaje, pero ella no quería.","en":"Tom asked Mary to give him a massage, but she didn't want to."},{"id":1622,"es":"Juan no quiere estudiar francés, pero tiene que hacerlo.","en":"Tom doesn't want to study French, but he has to."},{"id":1623,"es":"Quiero estudiar francés, pero no tengo tiempo.","en":"I'd like to study French, but I don't have the time."},{"id":1624,"es":"No quiero que hagas eso, Tom.","en":"I don't want you to do that, Tom."},{"id":1625,"es":"Sí, quiero que tú lo hagas.","en":"Yeah, I want you to do it."},{"id":1626,"es":"No hagas eso, por favor.","en":"Please don't do that."},{"id":1627,"es":"Hagas lo que hagas, no olvides esto.","en":"Whatever you do, don't forget this."},{"id":1628,"es":"Si llueve mañana, no iré.","en":"If it rains tomorrow, I won't go."},{"id":1629,"es":"Venga él o no, yo iré.","en":"Whether he comes or not, I'll go."},{"id":1630,"es":"Iré, haga el tiempo que haga.","en":"I will go, be the weather what it may."},{"id":1631,"es":"Si te vas a comportar de esta forma, me iré.","en":"If you’re going to be like this I’ll just leave."},{"id":1632,"es":"Hoy iré a visitar a mi amiga, que está enferma y no puede salir de casa.","en":"Today I shall go visit my friend, who is ill and has to stay home."},{"id":1633,"es":"Siempre que el tiempo esté despejado, iré allí.","en":"Providing the weather is clear, I'll go there."},{"id":1634,"es":"Sí, iré contigo.","en":"Yes, I'll go with you."},{"id":1635,"es":"Su número de habitación, por favor.","en":"Your room number, please?"},{"id":1636,"es":"Dígame su nombre y su número de teléfono, por favor.","en":"Please tell me your name and telephone number."},{"id":1637,"es":"Lo siento, creo que se ha equivocado de número.","en":"Sorry, but I think you've got the wrong number."},{"id":1638,"es":"Lo siento, parece que ha marcado mal el número.","en":"I'm sorry, you seem to have misdialed the phone."},{"id":1639,"es":"Si el hubiera sabido su número de teléfono, habría podido llamarla.","en":"If he had known her phone number, he could have called her up."},{"id":1640,"es":"Me gustaría hacer una llamada a Tokio, Japón. El número es 3202-5625.","en":"I'd like to make a call to Tokyo, Japan. The number is 3202-5625."},{"id":1641,"es":"Si supiera su número de teléfono, podría llamarla.","en":"If he knew her phone number, he could call her."},{"id":1642,"es":"De hecho, es cierto.","en":"As a matter of fact, it is true."},{"id":1643,"es":"Si quieres venir con nosotros, ven con nosotros.","en":"If you want to come with us, come with us."},{"id":1644,"es":"Por favor, ven a hablar conmigo.","en":"Please come to talk to me."},{"id":1645,"es":"Como no tenía nada que hacer, vi la televisión.","en":"Having nothing to do, I watched television."},{"id":1646,"es":"Por cierto, lo vi a él ayer.","en":"By the way, I saw him yesterday."},{"id":1647,"es":"Sin nada que hacer, vi televisión.","en":"Having nothing to do, I watched television."},{"id":1648,"es":"Aún a pesar de que ya vi esta película, decidí verla otra vez.","en":"Even though I already saw this movie, I decided to see it again."},{"id":1649,"es":"Cuando lo vi, me dejó sin aliento.","en":"When I saw it, it took my breath away."},{"id":1650,"es":"Entré en el cuarto, donde vi a los niños sentados en el sofá.","en":"I went into the room, where I found the children sitting on the sofa."},{"id":1651,"es":"Si él no viene, nosotros no iremos.","en":"If he doesn't come, we won't go."},{"id":1652,"es":"Según ella, él no viene.","en":"According to her, he isn't coming."},{"id":1653,"es":"Si él viene, pues mucho mejor.","en":"If he comes, so much the better."},{"id":1654,"es":"Volverá a casa el domingo que viene, es decir, el día 10.","en":"She will return home next Sunday, that is, the tenth."},{"id":1655,"es":"Si él no viene, ¿qué harás entonces ?","en":"If he doesn't come, what will you do then?"},{"id":1656,"es":"Aunque su casa queda cerca, yo rara vez la veo.","en":"Although her house is nearby, I seldom see her."},{"id":1657,"es":"Como vivo cerca de la escuela, vuelvo a casa para el almuerzo.","en":"Because I live near the school, I come home for lunch."},{"id":1658,"es":"Si lo miras de cerca, no ves nada.","en":"If you look closely, you don't see anything."},{"id":1659,"es":"Ella se acostó aquí, cerca de mí.","en":"She went to bed here, near me."},{"id":1660,"es":"Como vivo cerca de la escuela, vuelvo a casa a comer.","en":"Because I live near the school, I come home for lunch."},{"id":1661,"es":"Si acaso él tenía algo que decir, esas palabras se quedaron sin decir.","en":"If he had something to say, the words were left unspoken."},{"id":1662,"es":"Se trata de oraciones, no de palabras.","en":"It's all about sentences. Not words."},{"id":1663,"es":"Hay un tiempo para muchas palabras, y tambien hay un tiempo para dormir.","en":"There is a time for many words, and there is also a time for sleep."},{"id":1664,"es":"Cuando la cosa va de memorizar palabras en inglés, no hay nadie que le supere.","en":"When it comes to learning English words by heart, nobody can beat him."},{"id":1665,"es":"Por un instante, me quedé sin palabras.","en":"For a moment, I was left speechless."},{"id":1666,"es":"Desde el otro lado de la habitación, ella gesticuló las palabras te quiero.","en":"From across the room she mouthed the words I love you."},{"id":1667,"es":"Por favor, llama antes de entrar.","en":"Please knock on the door before you enter."},{"id":1668,"es":"Abre la puerta y déjame entrar, por favor.","en":"Open the door and let me in, please."},{"id":1669,"es":"Por favor, quítese los zapatos antes de entrar a la casa.","en":"Please remove your shoes before entering the house."},{"id":1670,"es":"Si te conociera mejor, tal vez te habría dejado entrar.","en":"If I knew you better, perhaps I would have let you in."},{"id":1671,"es":"En Japón, la gente se quita los zapatos al entrar en una casa.","en":"In Japan people take off their shoes when they enter a house."},{"id":1672,"es":"Nada más entrar, se cayó.","en":"The instant he came in, he fell down."},{"id":1673,"es":"Por favor, golpeá la puerta antes de entrar.","en":"Please knock before you come in."},{"id":1674,"es":"Sabemos lo que somos, pero no lo que podríamos ser.","en":"We know what we are, but know not what we may be."},{"id":1675,"es":"La Tierra es tan solo una pequeña isla, y nosotros somos pequeños isleños.","en":"The Earth is just a little island and we are little islanders."},{"id":1676,"es":"Ellos saben muy bien quiénes somos, y qué somos capaces de hacer.","en":"They know very well who we are, and what we can do."},{"id":1677,"es":"Ellos saben muy bien quiénes somos, y de qué somos capaces.","en":"They know very well who we are, and what we can do."},{"id":1678,"es":"Somos buenos amigos, pero tenemos poco en común.","en":"You and I are good friends, but we have little in common."},{"id":1679,"es":"Como con el diario de mañana todos somos genios, él pudo explicar por qué perdieron el partido.","en":"With 20/20 hindsight, he could tell why they lost the game."},{"id":1680,"es":"Como a toro pasado todos somos Manolete, él pudo explicar por qué perdieron el partido.","en":"With 20/20 hindsight, he could tell why they lost the game."},{"id":1681,"es":"Tom, me siento muy sola esta noche.","en":"Tom, I feel very alone tonight."},{"id":1682,"es":"Puedes conducir mi coche, si lo haces con cuidado.","en":"You can use my car as long as you drive it carefully."},{"id":1683,"es":"Tal y como haces la cama, así duermes en ella.","en":"As you make your bed, you must lie on it."},{"id":1684,"es":"Es porque no la haces, no porque no puedes hacerla.","en":"It is because you do not do it, not because you are not able to do it."},{"id":1685,"es":"Si tú haces nuevos amigos, no olvides a los viejos.","en":"If you make new friends, don't forget the old ones."},{"id":1686,"es":"Si alguna vez haces algo para herir a Tom, te mataré.","en":"If you ever do anything to hurt Tom, I'll kill you."},{"id":1687,"es":"Cuando hablas con los demás, lo haces con los brazos cruzados.","en":"When you talk to others, you're doing it with your arms crossed."},{"id":1688,"es":"¡Mira lo que haces, casi matas a Juan !","en":"Watch what you're doing, you almost killed Tom!"},{"id":1689,"es":"Tendrás que hacerlo, te guste o no.","en":"You'll have to do it, whether you like it or not."},{"id":1690,"es":"Si quieres guerra, tendrás guerra.","en":"If you want war, you'll get war."},{"id":1691,"es":"Si quieres más detalles que eso, tendrás que preguntarle a mi jefe.","en":"If you want more details than that, you'll have to ask my boss."},{"id":1692,"es":"Si quieres más detalles sobre eso, tendrás que preguntar a mi jefe.","en":"If you want more details about that, you'll have to ask my boss."},{"id":1693,"es":"Si te esfuerzas un poco más, seguro que tendrás éxito.","en":"A little more effort, and you will succeed."},{"id":1694,"es":"Si eres buena chica, tendrás caramelos.","en":"If you are a good girl, you shall have candy."},{"id":1695,"es":"Él no es médico, es profesor.","en":"He is not a doctor but a teacher."},{"id":1696,"es":"No soy médico, sino profesor.","en":"I'm not a doctor, but a teacher."},{"id":1697,"es":"No soy médico, soy profesor.","en":"I'm not a doctor, but a teacher."},{"id":1698,"es":"En la ciudad, todos conocen su nombre.","en":"Everyone in town knows his name."},{"id":1699,"es":"Ella intentó abrir la puerta, pero le fue imposible.","en":"She tried to open the door, which she found impossible."},{"id":1700,"es":"Por mucho que intentaba, no pudo abrir la puerta.","en":"No matter how he tried, he could not open the door."},{"id":1701,"es":"Intenté abrir la puerta, pero no pude porque estaba cerrada con llave.","en":"I tried to open the door, but I couldn't as it was locked."},{"id":1702,"es":"Al abrir la puerta, rompí la cerradura.","en":"In opening the door, I broke the lock."},{"id":1703,"es":"Cuando me vio, el perro corrió hacia mí.","en":"Seeing me, the dog rushed up to me."},{"id":1704,"es":"Por favor, no vuelvas a mirar hacia aquí.","en":"Please don't look over here again."},{"id":1705,"es":"Antes de que llegaras, él salió hacia Londres.","en":"Prior to your arrival, he left for London."},{"id":1706,"es":"Con un martillo y clavos en la mano, ella se dirigió directamente hacia acá.","en":"With a hammer and nails in her hand, she headed straight here."},{"id":1707,"es":"Si yo fuera un ave, volaría hacia ti.","en":"Were I a bird, I would fly to you."},{"id":1708,"es":"¿Podemos vernos el veintiocho de febrero, hacia las tres ?","en":"Can we meet February 28, around 3:00 pm?"},{"id":1709,"es":"Los pájaros volaron hacia el sur, en busca del calor.","en":"The birds flew south in search of warmth."},{"id":1710,"es":"El caballo, sintiendo que por fin era libre, comenzó a trotar hacia el oeste.","en":"The horse, feeling it was finally free, began trotting west."},{"id":1711,"es":"No vengas a por mí, no hace falta.","en":"Don't come to pick me up. There's no need to."},{"id":1712,"es":"¿Le falta experiencia, no ?","en":"She lacks experience, doesn't she?"},{"id":1713,"es":"Dado que no es la temporada de lluvia, no hace falta un paraguas.","en":"Since it's not the rainy season, there's no need for an umbrella."},{"id":1714,"es":"No hace falta decirlo, la salud está por sobre la riqueza.","en":"Needless to say, health is above wealth."},{"id":1715,"es":"No hace falta que venga a la oficina, puede tomarse el día libre.","en":"You don't need to come to the office, you can take the day off."},{"id":1716,"es":"Les falta un ideal, una razón para levantarse por la mañana.","en":"They lack an ideal, a reason to get up in the morning."},{"id":1717,"es":"Bien oigo el mensaje, solo me falta la fe.","en":"I hear the message just fine; it's faith that I lack."},{"id":1718,"es":"Lo que le falta en carisma, ella lo compensa con trabajo duro.","en":"What she lacks in charisma she makes up for with hard work."},{"id":1719,"es":"Tras un día, ellos estaban en Francia.","en":"Within one day, they were in France."},{"id":1720,"es":"Los niños estaban sentados en línea, viendo la televisión.","en":"The children were sitting in a line, watching television."},{"id":1721,"es":"Cuando ellos estaban de vacaciones, sus vecinos cuidaron al perro.","en":"While they were away on holiday, their neighbours looked after the dog."},{"id":1722,"es":"Sin embargo, algunas personas entre el público no estaban satisfechas con los resultados.","en":"However, some people in the audience were not pleased with the results."},{"id":1723,"es":"Las niñas no estaban asustadas, pero sí los niños.","en":"The girls were not afraid, but the boys were."},{"id":1724,"es":"Al principio, sentí que ellos estaban en los correcto en despedirme.","en":"At first, I felt they were right to have fired me."},{"id":1725,"es":"Juan y Maria estaban invitados, así que se sintieron obligados a ir.","en":"Tom and Mary were invited, so they felt obligated to go."},{"id":1726,"es":"Propuse el plan a mis compañeros de clase, algunos de los cuales estaban en contra de él.","en":"I proposed the plan to my classmates, some of whom were against it."},{"id":1727,"es":"Al llegar a casa, mis hermanas estaban cocinando.","en":"My sisters were cooking when I came home."},{"id":1728,"es":"Si tú crees que él tiene suficiente experiencia en eso, yo lo contrataré.","en":"If you think that he's experienced enough with that, I'll hire him."},{"id":1729,"es":"Es suficiente por hoy, estoy cansado.","en":"That's enough for today. I'm tired."},{"id":1730,"es":"Si no fuera por el aire, no podríamos vivir en la Tierra.","en":"If it were not for air, we could not live on the earth."},{"id":1731,"es":"No vivo para comer, como para vivir.","en":"I don't live to eat; I eat to live."},{"id":1732,"es":"Sin importar lo que pase, Juan siempre llega a tiempo.","en":"No matter what happens, Tom always shows up on time."},{"id":1733,"es":"Sin importar lo duro que trabaje, él no va a poder aprobar los exámenes.","en":"No matter how hard he may work, he will not be able to pass the exams."},{"id":1734,"es":"Yo me decidí a realizar el trabajo, sin importar cuán difícil pueda ser.","en":"I made up my mind to do the work however hard it may be."},{"id":1735,"es":"Me rindo. Sin importar lo que haga, tú nunca pareces estar satisfecho.","en":"I give up. No matter what I do, you never seem to be satisfied."},{"id":1736,"es":"Sin importar lo que diga, ella siempre me contradice.","en":"It doesn't matter what I say, she always contradicts me."},{"id":1737,"es":"No me rendiré, sin importar lo que digas.","en":"I won't quit, no matter what you say."},{"id":1738,"es":"Hubiese tenido un poco más de dinero, lo habría comprado.","en":"Had I had a little more money, I would have bought it."},{"id":1739,"es":"Si hubiera trabajado duro en aquel tiempo, habría tenido éxito.","en":"If he had worked hard at that time, he would have succeeded."},{"id":1740,"es":"Hace mucho tiempo, hubo un joven hombre.","en":"A long time ago, there was a young man."},{"id":1741,"es":"¿Y de ahí, qué hubo ?","en":"Hello there, what's new?"},{"id":1742,"es":"Él golpeó la puerta muchas veces, pero no hubo respuesta.","en":"He knocked at the door again and again, but there was no answer."},{"id":1743,"es":"Según las noticias en televisión, hubo un accidente de avión en India.","en":"According to TV news, there was a plane crash in India."},{"id":1744,"es":"Según el periódico de hoy, anoche hubo un incendio en esta ciudad.","en":"According to today's paper, there was a fire in this town last night."},{"id":1745,"es":"Según el periódico, hubo un gran incendio anoche.","en":"According to the newspaper, there was a big fire last night."},{"id":1746,"es":"El año pasado, hubo más nacimientos que defunciones.","en":"Last year, there were more births than deaths."},{"id":1747,"es":"Se fue de Japón, para nunca más volver.","en":"She left Japan, never to return home again."},{"id":1748,"es":"Dile a Juan que puede volver después del almuerzo, por favor.","en":"Please tell Tom he can come back after lunch."},{"id":1749,"es":"Maria deseaba poder volver en el tiempo, antes de que se casara con Tom.","en":"Mary wished that she could go back in time before she married Tom."},{"id":1750,"es":"Puede que parezca una locura, pero creo que quiero volver y hacerlo otra vez.","en":"This may sound crazy, but I think I want to go back and do it again."},{"id":1751,"es":"Cuando salí de la cárcel, no tenía intención de volver a cometer otro crimen.","en":"When I got out of jail, I had no intention of committing another crime."},{"id":1752,"es":"Cuando uno tiene un sueño maravilloso, no desea volver a la realidad.","en":"When one has a wonderful dream, one doesn't wish to come down to earth."},{"id":1753,"es":"Me gustaría aprender a tocar el piano, la guitarra o la flauta.","en":"I would like to learn to play the piano, guitar or flute."},{"id":1754,"es":"En mi país, es difícil aprender alemán.","en":"In my country, it's difficult to learn German."},{"id":1755,"es":"Juan quiere aprender a boxear, pero a su madre le parece demasiado peligroso.","en":"Tom wants to learn boxing, but his mother thinks it's too dangerous."},{"id":1756,"es":"Quien no está dispuesto a aprender, no está dispuesto a enseñar.","en":"One who is not willing to learn is not worth teaching."},{"id":1757,"es":"La buena nutrición también es una ciencia, y como tal, se puede aprender.","en":"Good nutrition is also a science and, as such, can be learnt."},{"id":1758,"es":"Juan quiere aprender a boxear, pero su madre cree que es demasiado peligroso.","en":"Tom wants to learn boxing, but his mother thinks it's too dangerous."},{"id":1759,"es":"¿Cuál es más viejo, este libro, o aquel ?","en":"Which is older, this book or that one?"},{"id":1760,"es":"Puedo ser viejo, pero todavía puedo andar en bicicleta.","en":"I may be old, but I can still ride a bike."},{"id":1761,"es":"Vivir es hacerse viejo, nada más.","en":"Living is growing old, nothing more."},{"id":1762,"es":"Mamá, si no me gusta la comida, ¿me la tengo que comer ?","en":"Mommy, if I don't like the food, do I have to eat it?"},{"id":1763,"es":"No tengo mucho tiempo, así que me dejaré caer por un restaurante de comida rápida.","en":"I don't have much time, so I'm going to drop in at a fast-food restaurant."},{"id":1764,"es":"Viviendo solo, realmente extraño la comida de mi mamá.","en":"Living on my own, I really miss my mom's cooking."},{"id":1765,"es":"La comida no era buena, pero al menos era barata.","en":"The food wasn't good, but at least it was cheap."},{"id":1766,"es":"Por favor, vuelve dentro de media hora.","en":"Please come back after half an hour."},{"id":1767,"es":"Cuando hayas terminado con el libro, vuelve a ponerlo donde lo encontraste.","en":"When you're done with the book, put it back where you found it."},{"id":1768,"es":"El próximo lunes, mi tío vuelve de Estados Unidos.","en":"My uncle comes back from America next Monday."},{"id":1769,"es":"Te esperaré, vuelve mañana por la noche.","en":"I will wait here for you. Come back tomorrow evening."},{"id":1770,"es":"Mientras más escucho, más interesante se vuelve.","en":"The more I hear, the more interesting it becomes."},{"id":1771,"es":"Esta página no está bien impresa, así que vuelve a imprimirla.","en":"This page is not nicely printed so print it again."},{"id":1772,"es":"Según los científicos, la atmósfera se vuelve más caliente año tras año.","en":"According to scientists, the atmosphere is getting warmer year after year."},{"id":1773,"es":"Un vaso de leche, por favor.","en":"Please give me a glass of milk."},{"id":1774,"es":"¿Me podría dar un vaso con hielo, por favor ?","en":"Can I have a cup with ice please?"},{"id":1775,"es":"Un vaso de agua con gas, por favor.","en":"A glass of sparkling water, please."},{"id":1776,"es":"No puedo caminar rápido, pero puedo hacerlo por un largo tiempo.","en":"I can't walk fast, but I can walk for a long time."},{"id":1777,"es":"Juan esperó un largo tiempo a Maria, pero nunca apareció.","en":"Tom waited a long time for Mary, but she never showed up."},{"id":1778,"es":"A lo largo de los años, mi madre me mintió acerca de tantas cosas.","en":"Over the years my mother lied to me about so many things."},{"id":1779,"es":"Según el pronóstico del tiempo a largo plazo, parece que viene un invierno no muy frío.","en":"According to the long-term forecast, a mild winter seems to be ahead."},{"id":1780,"es":"A mi hijo le gustan los deportes al aire libre, tales como béisbol, tenis y fútbol.","en":"My son likes outdoor sports, such as baseball, tennis and soccer."},{"id":1781,"es":"Para su sorpresa, el ladrón resultó ser su propio hijo.","en":"To his surprise, the thief turned out to be his own son."},{"id":1782,"es":"No, éste es el DVD de mi hijo.","en":"No, this is my son's DVD."},{"id":1783,"es":"¿Éste es tu hijo, Betty ?","en":"Is this your son, Betty?"},{"id":1784,"es":"Hijo, ayúdame a arreglar mi auto.","en":"Son, help me fix my car."},{"id":1785,"es":"Al final de la historia, la pobre huérfana se casa con el hijo del rey.","en":"At the end of the story, the poor orphan girl marries the king's son."},{"id":1786,"es":"Quisiera una taza de café, por favor.","en":"I'd like a cup of coffee, please."},{"id":1787,"es":"Dame una taza de té, por favor.","en":"Please give me a cup of tea."},{"id":1788,"es":"Deme una taza de té, por favor.","en":"Please give me a cup of tea."},{"id":1789,"es":"Deme una taza de leche, por favor.","en":"Please give me a cup of milk."},{"id":1790,"es":"Hablemos esto con una taza de té, ¿te parece ?","en":"Let's talk over a cup of tea, shall we?"},{"id":1791,"es":"Por favor, hazme una taza de café.","en":"Please make me a cup of coffee."},{"id":1792,"es":"¿Qué te parecería una taza de té u otra cosa, si es que no estás apurado ?","en":"How about a cup of tea or something, if you aren't in a hurry?"},{"id":1793,"es":"Creemos que alguien, y sabemos muy bien quién, usó la taza del jefe.","en":"We think someone, and we know very well who, used the boss's cup."},{"id":1794,"es":"Tráigame una taza de té, por favor.","en":"Please bring a cup of tea to me."},{"id":1795,"es":"Juan no dejó de fumar, así que Maria salió de la pieza.","en":"Tom didn't stop smoking, so Mary left the room."},{"id":1796,"es":"Él no salió, se sentó.","en":"He did not go out, he sat down."},{"id":1797,"es":"Cuando él me vio, salió corriendo.","en":"When he saw me, he ran away."},{"id":1798,"es":"Cuando me vio, salió corriendo.","en":"When he saw me, he ran away."},{"id":1799,"es":"En una mañana lluviosa, salió de casa temprano para llegar a tiempo al colegio.","en":"On a rainy morning he left his house early so as to be in time for school."},{"id":1800,"es":"Tan pronto como sintió su casa sacudirse, salió de una carrera al jardín.","en":"As soon as he felt his house shake, he rushed out into the garden."},{"id":1801,"es":"Ella apenas salió de la universidad, así que no tiene experiencia.","en":"She is fresh from college, so she has no experience."},{"id":1802,"es":"¿Me podrías pasar la sal, por favor ?","en":"Could you pass me the salt, please?"},{"id":1803,"es":"¿Me podrías alcanzar la sal, por favor ?","en":"Could you pass me the salt, please?"},{"id":1804,"es":"¿Me podrías ayudar, por favor ?","en":"Could you assist me, please?"},{"id":1805,"es":"Por cierto, Mike, podrías decirme cómo se llega a tu casa.","en":"By the way, Mike, please tell me how to get to your house."},{"id":1806,"es":"Si él fuera a llegar tarde, tú podrías comenzar la conferencia sin él.","en":"If he should arrive late, you may start the conference without him."},{"id":1807,"es":"Si no hubieras seguido los consejos del doctor, en este momento podrías estar enfermo.","en":"If you had not followed the doctor's advice then, you might be ill now."},{"id":1808,"es":"Has venido aquí en el momento justo. ¿Te podrías probar el modelo nuevo, por favor ?","en":"You come right in time. Can you please try the new model?"},{"id":1809,"es":"¿Me podrías traer un cuchillo limpio, por favor ?","en":"Could you please bring me a clean knife?"},{"id":1810,"es":"¿Lo podrías expresar en palabras más sencillas, por favor ?","en":"Will you please put that in simpler words?"},{"id":1811,"es":"Si no lo hago ahora, nunca lo haré.","en":"If I don't do it now, I never will."},{"id":1812,"es":"Hoy es lunes, así que haré lo que siempre hago los lunes.","en":"Today is Monday, so I'll do what I always do on Monday."},{"id":1813,"es":"Por supuesto, debemos dar lo mejor.","en":"Of course, we must do our best."},{"id":1814,"es":"El tiempo es una cosa preciosa, así que le debemos dar el mejor uso.","en":"Time is a precious thing, so we should make the best use of it."},{"id":1815,"es":"Si conocemos su rostro, se lo debemos a él que nos dejó su autorretrato.","en":"If we know his face, we owe it to himself who left us his self-portrait."},{"id":1816,"es":"Sobre todas las cosas, no debemos ser egoístas.","en":"Above all things, we must not be selfish."},{"id":1817,"es":"Por favor, cuéntame acerca de ti y tu familia.","en":"Please tell me about you and your family."},{"id":1818,"es":"Ella declara que no sabe nada acerca de él, pero yo no le creo.","en":"She claims that she knows nothing about him, but I don't believe her."},{"id":1819,"es":"Por favor, háblame acerca de tu viaje.","en":"Please tell me about your trip."},{"id":1820,"es":"Si vuelvo a oír una frase más acerca del tenis, me volveré loco.","en":"If I hear one more sentence about tennis, I'll go crazy."},{"id":1821,"es":"Como tenía un poco de fiebre, me quedé en la cama.","en":"Since I had a slight fever, I stayed in bed."},{"id":1822,"es":"Como no me encontraba bien, me quedé en casa ese día.","en":"Not feeling well, I stayed home on that day."},{"id":1823,"es":"Como ya era bien entrada la noche y yo estaba muy cansado, me quedé en una posada.","en":"Since it was late at night and I was very tired, I stayed at an inn."},{"id":1824,"es":"Estaba lloviendo, así que me quedé en casa.","en":"It was raining, so I stayed home."},{"id":1825,"es":"Como estaba lloviendo, me quedé en casa.","en":"Since it was raining, I stayed home."},{"id":1826,"es":"Como llovió, me quedé en casa.","en":"Since it rained, I ":2140,"es":"Por favor, llámame en cuanto llegues a Londres.","en":"Please call me as soon as possible when you arrive in London."},{"id":2141,"es":"Por favor, sólo déjame sola.","en":"Please just leave me alone."},{"id":2142,"es":"Déjame el diccionario, por favor.","en":"Lend me your dictionary, please."},{"id":2143,"es":"Ya que estoy aquí, déjame ayudarte.","en":"Since I'm here, let me help you."},{"id":2144,"es":"Bueno, déjame decirte.","en":"Well, let me tell you."},{"id":2145,"es":"Déjame recoger a tu hermana en la estación, por favor.","en":"Please let me pick up your sister at the station."},{"id":2146,"es":"Por favor, déjame en paz.","en":"Please leave me alone."},{"id":2147,"es":"Mamá, no quiero ir con el abuelo. Déjame aquí.","en":"Mom, I don't want to go with Grandpa. Leave me here."},{"id":2148,"es":"Tengo que trabajar, así que lárgate y déjame en paz.","en":"I've got work to do, so piss off and leave me alone."},{"id":2149,"es":"No le digas eso, ¡por favor !","en":"Don't tell him that, please!"},{"id":2150,"es":"Por favor, no digas eso.","en":"Please don't say that."},{"id":2151,"es":"Si no tenés nada que decir, no digas nada.","en":"If you don't have anything to say, don't say anything."},{"id":2152,"es":"Digas lo que digas, no te creo.","en":"Whatever you say, I won't believe you."},{"id":2153,"es":"Cuando no puedas hacer lo que quieras, haz lo que puedas.","en":"When you cannot do what you want, you do what you can."},{"id":2154,"es":"Primero que todo, haz tus deberes.","en":"Do your homework first of all."},{"id":2155,"es":"Para darte de baja, haz click aquí.","en":"To unsubscribe, click here."},{"id":2156,"es":"Por favor, haz algo al respecto.","en":"Please do something about it."},{"id":2157,"es":"Mírame, y haz lo mismo.","en":"Look on me, and do likewise."},{"id":2158,"es":"Haz lo que dicte tu corazón, él nunca miente.","en":"Follow your heart, for it never lies."},{"id":2159,"es":"Si no entiendes, haz una pregunta.","en":"If you don't understand

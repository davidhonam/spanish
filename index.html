halcón.","en":"Betty may be pretty, but she shoots a gun with the precision of a hawk."},{"id":5890,"es":"Después, no hablé con ellos.","en":"Afterwards, I did not speak with them."},{"id":5891,"es":"Yo sí hablé, pero nadie me escuchó.","en":"I did speak, but no one listened to me."},{"id":5892,"es":"El hombre con el que hablé era alemán, no americano.","en":"The man to whom I spoke was a German, not an American."},{"id":5893,"es":"Sin importar cuan enfadado estuviera, él nunca recurría a la violencia.","en":"No matter how angry he was, he would never resort to violence."},{"id":5894,"es":"Considerando la violencia del impacto, él debe haber muerto instantáneamente.","en":"Considering the violence of the impact, he must have died instantly."},{"id":5895,"es":"Por lo tanto, el término tiene dos usos distintos.","en":"Thus the term has two distinct usages."},{"id":5896,"es":"Las cajas de metal son sin lugar a dudas más resistentes, pero mucho más caras.","en":"Metal cases are undoubtedly tougher, but much more expensive."},{"id":5897,"es":"Las cajas son rectangulares, no cuadradas.","en":"The boxes are rectangular, not square."},{"id":5898,"es":"No solo se negó a ayudarme, sino que además me regañó.","en":"Not only did he refuse to help me, but also he scolded me."},{"id":5899,"es":"Juan acusó a Maria de haberle robado su dinero, pero ella lo negó.","en":"Tom accused Mary of stealing his money, but she denied it."},{"id":5900,"es":"Por desgracia, Juan se negó a ayudarnos.","en":"Unfortunately, Tom refused to help us."},{"id":5901,"es":"Al hablar, todos se quedaron mudos.","en":"When he spoke, everyone became silent."},{"id":5902,"es":"Sorprenderse, extrañarse, es comenzar a entender.","en":"To be surprised, to wonder, is to begin to understand."},{"id":5903,"es":"Antes de nada, debemos despedir al cocinero.","en":"First of all, we must dismiss the cook."},{"id":5904,"es":"Si me quiere despedir, despídame.","en":"If you want to fire me, fire me."},{"id":5905,"es":"Para sto al colgar el teléfono, volvió a sonar.","en":"As soon as I hung up, the phone started ringing again."},{"id":5922,"es":"No, y tampoco está debajo de la silla.","en":"No, and it is also not under the chair."},{"id":5923,"es":"No soy un pez de verdad, sólo soy un peluche.","en":"I'm not a real fish, I'm just a mere plushy."},{"id":5924,"es":"Un tiburón es un pez, mientras que un delfín es un mamífero.","en":"A shark is a fish while a dolphin is a mammal."},{"id":5925,"es":"Este perro y ese pez son míos, pero aquel pájaro no.","en":"This dog and that fish are mine, but that bird not."},{"id":5926,"es":"Una vez que atrapas al pez, ya no necesitas el anzuelo.","en":"Once you've caught the fish, you no longer need the bait."},{"id":5927,"es":"La ballena no es un pez, sino un mamífero.","en":"The whale is not a fish but a mammal."},{"id":5928,"es":"Bueno, solo tienes que pedirle su ayuda.","en":"Well, you have only to ask for his help."},{"id":5929,"es":"Si de verdad te gusta Maria, deberías pedirle que salga contigo.","en":"If you really like Mary, you should ask her out."},{"id":5930,"es":"Debes pedirle perdón, y hacerlo de inmediato.","en":"You must apologize to her, and do it at once."},{"id":5931,"es":"Si haces el esfuerzo, puedes mejorar tu inglés.","en":"You can improve your English if you try."},{"id":5932,"es":"Desafortunadamente, no puedes llevarlo contigo.","en":"Unfortunately, you cannot bring him along."},{"id":5933,"es":"Cuanto más alto es un árbol, más difícil es escalarlo.","en":"The taller a tree is, the harder it is to climb."},{"id":5934,"es":"Cuando estaba a punto de caerse al río, se afirmó de el árbol.","en":"As he was about to fall into the river, he took hold of the tree."},{"id":5935,"es":"Cada año, este árbol da deliciosos duraznos.","en":"This tree bears good peaches every year."},{"id":5936,"es":"Les dije a los niños que estuvieran en silencio, pero ellos siguieron haciendo ruido.","en":"I told the children to be quiet, but they just kept on being noisy."},{"id":5937,"es":"Intenté cambiar de tema, pero ellos siguieron hablando de política.","en":"I tried to change the subject, but they went on talking about politics."},{"id":5938,"es":"A pesar de estar heridos, siguieron peleando.","en":"Though wounded, they continued to fight."},{"id":5939,"es":"El martes, habré terminado de leer este libro.","en":"I will have finished reading this book by Tuesday."},{"id":5940,"es":"Después de tres meses, se acostumbró a la vida de la ciudad.","en":"After three months, he got used to the life in the town."},{"id":5941,"es":"Pasados tres meses, ya estaba acostumbrado a la vida de la ciudad.","en":"After three months, he got used to the life in the town."},{"id":5942,"es":"Aparentemente, obtendremos un aumento dentro de dos meses.","en":"Apparently, we'll be getting a raise within two months."},{"id":5943,"es":"Pocos meses más tarde, Israel invadió Egipto.","en":"A few months later, Israel invaded Egypt."},{"id":5944,"es":"Sí, eso sí puedo cantarlo de memoria.","en":"Yes. This one I can sing from memory."},{"id":5945,"es":"Antes de nada, apréndete la fórmula de memoria.","en":"First of all, learn the formula by heart."},{"id":5946,"es":"Si mi memoria es correcta, ellos son primos.","en":"They are cousins, if I remember rightly."},{"id":5947,"es":"Caminando de regreso desde su casa, rebusqué frenéticamente en mi memoria.","en":"Walking back from his house, I frantically searched through my memory."},{"id":5948,"es":"Con todo el debido respeto, yo pienso que ambos tenían algunos puntos válidos.","en":"With all due respect, I think they both had valid points."},{"id":5949,"es":"Por favor, mueve esta piedra de aquí a allí.","en":"Please move this stone from here to there."},{"id":5950,"es":"En casa, mi padre no mueve ni un dedo.","en":"My father doesn't lift a finger at home."},{"id":5951,"es":"Al verlo en la foto, lo reconocí de inmediato.","en":"Having seen him in the picture, I recognized him at once."},{"id":5952,"es":"En lugar de ir yo mismo, envié un regalo.","en":"Instead of going myself, I sent a gift."},{"id":5953,"es":"Se te ha olvidado darle las gracias a Juan por el regalo, ¿verdad ?","en":"You forgot to thank Tom for the present, didn't you?"},{"id":5954,"es":"Cuando voy a ver a mi nieto, siempre le regalo algo.","en":"When I go to see my grandson, I always give him something."},{"id":5955,"es":"¿Puede envolverlo para regalo, por favor ?","en":"Can you gift-wrap this, please?"},{"id":5956,"es":"Por favor, retira los platos.","en":"Please take the dishes away."},{"id":5957,"es":"Ya que tú preparaste la comida, yo fregaré los platos.","en":"Since you did the cooking, I'll do the dishes."},{"id":5958,"es":"En la mesa, las servilletas se colocan a la derecha de los platos.","en":"In the table, the napkins are placed at right of the plates."},{"id":5959,"es":"Poné estos platos en el armario, por favor.","en":"Put these dishes inside the drawer, please."},{"id":5960,"es":"Juan barría el piso de la cocina, mientras Maria lavaba los platos.","en":"Tom swept the kitchen floor while Mary washed the dishes."},{"id":5961,"es":"Vendemos platos de metal, papel, y madera.","en":"We sell metal, paper, and wooden plates."},{"id":5962,"es":"La protección absoluta de la vida privada en Facebook es una ilusión, no existe en realidad.","en":"Absolute privacy on Facebook is an illusion. It doesn't exist in reality."},{"id":5963,"es":"Mientras haya esperanza, existe la posibilidad.","en":"As long as you have hope, a chance remains."},{"id":5964,"es":"La inspiración existe, pero tiene que encontrarte trabajando.","en":"Inspiration exists, but it has to find you working."},{"id":5965,"es":"Un pasajero se desmayó, pero la azafata lo reanimó.","en":"A passenger fainted, but the stewardess brought him around."},{"id":5966,"es":"Si es posible, me gustaría recibir algunas pistas.","en":"I'd like to get some hints, if possible."},{"id":5967,"es":"Si buscas las letras, realmente no significan mucho.","en":"If you look at the lyrics, they don't really mean much."},{"id":5968,"es":"En el siglo VI, los anglosajones adoptaron las letras romanas.","en":"In the 6th century, the Anglo-Saxons adopted Roman characters."},{"id":5969,"es":"Este día, los vivos envidiarán a los muertos.","en":"This day, the living shall envy the dead."},{"id":5970,"es":"Compramos una mesa de billar, pero aún no jugamos ni una partida.","en":"We bought a pool table but have yet to play a single game."},{"id":5971,"es":"El destino baraja las cartas, nosotros jugamos.","en":"Fate shuffles the cards; we play."},{"id":5972,"es":"Ella no me ha visitado el domingo, sino el lunes.","en":"She visited me, not on Sunday, but on Monday."},{"id":5973,"es":"Trabajé el domingo, así que tuve el lunes libre.","en":"I worked on Sunday, so I had Monday off."},{"id":5974,"es":"Damas y caballeros, permítanme decir algunas palabras de bienvenida.","en":"Ladies and gentlemen, please allow me to say a few words of welcome."},{"id":5975,"es":"Ellos agitaron banderas, para dar la bienvenida a la princesa.","en":"They waved flags to welcome the princess."},{"id":5976,"es":"¿Qué fue primero, el huevo o la gallina ?","en":"Which came first, the chicken or the egg?"},{"id":5977,"es":"No puedo comer huevo crudo, tiene que estar cocido.","en":"I can't eat a raw egg; it must be cooked."},{"id":5978,"es":"Podés hacer una torta con harina, leche y un huevo.","en":"You can make a cake with flour, milk and an egg."},{"id":5979,"es":"Se crió cerca del mar, pero odia nadar.","en":"She grew up near the sea, yet she hates swimming."},{"id":5980,"es":"Por favor, asegúrese de tomar una dosis tres veces al día.","en":"Please be sure to take one dose three times a day."},{"id":5981,"es":"A las 9, esta tienda está cerrada.","en":"This store is closed at nine."},{"id":5982,"es":"Me gustaría que Quim Monzo me autografiara mi libro, pero me da mucha vergüenza preguntarle.","en":"I'd like Quim Monzo to autograph my book, but I'm too ashamed r."},{"id":6000,"es":"No sé si sería apropiado. Verá usted, yo no trabajo aquí.","en":"Maybe that wouldn't be appropriate. You see, I don't work here."},{"id":6001,"es":"Cuando vaya a Rumania, verá más.","en":"When you go to Romania, you will see more."},{"id":6002,"es":"Debido a su hábito de malgastar el dinero, no pudo casarse.","en":"Because of his habit of wasting money, he couldn't get married."},{"id":6003,"es":"Antes de casarse, Maria era bailarina.","en":"Before Mary got married, she was a dancer."},{"id":6004,"es":"¡No grites, los vecinos te oirán !","en":"Don't shout, the neighbours will hear you!"},{"id":6005,"es":"Eres bueno escuchando, ¿por qué no te callas ?","en":"You are good in listening, why don't you shut up?"},{"id":6006,"es":"George, si no estás escuchando la radio, apágala.","en":"George, if you are not listening to the radio, turn it off."},{"id":6007,"es":"Necesito hablar con vos. Es urgente. Decime, te estoy escuchando.","en":"I need to talk to you. It's urgent. Tell me, I'm listening."},{"id":6008,"es":"Tú harás lo que ella dice, y triunfarás.","en":"You'll do what she says and you'll succeed."},{"id":6009,"es":"Si comprás un automóvil nuevo, ¿qué harás con el viejo ?","en":"If you buy a new car, what will you do with the old one?"},{"id":6010,"es":"Ella baila bien, pero tiene que moverse más.","en":"She dances well, but she has to move more."},{"id":6011,"es":"Maria no baila mucho ahora, pero sé que antes bailaba mucho.","en":"Mary doesn't dance much now, but I know she used to a lot."},{"id":6012,"es":"Si estudiara arduamente, él podría pasar el examen.","en":"If he studied hard, he would pass the test."},{"id":6013,"es":"Por favor, ¿cómo puedo llegar al centro ?","en":"Please, how can I get to the center?"},{"id":6014,"es":"De cierta manera, París es el centro del mundo.","en":"Paris is the center of the world, in a way."},{"id":6015,"es":"Hace muchos años atrás, visité el centro de Hiroshima.","en":"Many years ago, I visited the center 57,"es":"¿Me explicarías las reglas, por favor ?","en":"Would you please explain the rules to me?"},{"id":6558,"es":"En cuanto al ajedrez, yo sólo conozco las reglas.","en":"As for chess, I just know the rules."},{"id":6559,"es":"Por favor, obedezcan las reglas del colegio.","en":"Please follow the school rules."},{"id":6560,"es":"Canta algo, por favor.","en":"Sing something, please."},{"id":6561,"es":"Suéltame el brazo, por favor. Me lastimas.","en":"Please let go of my arm. You're hurting me."},{"id":6562,"es":"Discúlpeme pero, ¿dónde está es departamento de calzado masculino ?","en":"Excuse me, but where is the men's shoe department?"},{"id":6563,"es":"¿Podrías enseñarme el número de tu celular, por favor ?","en":"Could you tell me your mobile number please?"},{"id":6564,"es":"Usted realmente tiene suerte, ¿no ?","en":"You really are lucky, aren't you?"},{"id":6565,"es":"Intentó solucionar el problema, pero no tuvo suerte.","en":"He tried to solve the problem, but had no luck."},{"id":6566,"es":"No toque la mercancía, por favor.","en":"Please do not touch the merchandise."},{"id":6567,"es":"Él está sordo, pero sabe leer los labios.","en":"He is deaf, but knows how to read lips."},{"id":6568,"es":"Tienes los labios azules, deberías salir del agua.","en":"Your lips are blue. You should get out of the water."},{"id":6569,"es":"Él es sordo, pero sabe leer los movimientos de los labios.","en":"He is deaf, but knows how to read lips."},{"id":6570,"es":"No te preocupes, mis labios están sellados.","en":"Don't worry. My lips are sealed."},{"id":6571,"es":"Si realmente le gustase, me llamaría más a menudo.","en":"If he really liked me he would call me more often."},{"id":6572,"es":"Por favor, apunta lo que voy a decir.","en":"Please write down what I am going to say."},{"id":6573,"es":"Por favor, apunta lo que dice Tom.","en":"Please write down what Tom says."},{"id":6574,"es":"Apunta tu nombre, por favor.","en":"Please write down your name."},{"id":6575,"es":"Cuando no estás aquí, te echo de menos.","en":"I miss you when you're not here."},{"id":6576,"es":"Respeto tu opinión, Tom.","en":"I respect your opinion, Tom."},{"id":6577,"es":"Respeto a mi profesor de inglés, el Sr. Taniguchi.","en":"I respect my English teacher, Mr. Taniguchi."},{"id":6578,"es":"Gracias, lo entendí todo.","en":"Thanks, I understood everything."},{"id":6579,"es":"Ese es el espíritu, señor Suzuki.","en":"That's the spirit, Mr Suzuki."},{"id":6580,"es":"Espíritu, ¿estás ahí ?","en":"Spirit, are you there?"},{"id":6581,"es":"La materia, como ves, desaparece, solo el espíritu permanece.","en":"Matter, you see, disappears, only the spirit remains."},{"id":6582,"es":"No solo estás equivocado tú, sino yo también.","en":"Not only you but also I am wrong."},{"id":6583,"es":"Estás equivocado, ese no es el caso.","en":"You're wrong. That's not the case."},{"id":6584,"es":"O él está equivocado, o yo.","en":"Either he is wrong or I am."},{"id":6585,"es":"Yo pienso que podría llover hoy, pero podría estar equivocado.","en":"I think it might rain today, but I could be wrong."},{"id":6586,"es":"Ahora que lo pienso, está equivocado.","en":"Come to think of it, he is wrong."},{"id":6587,"es":"Sea como sea, yo estoy equivocado.","en":"However that may be, I am wrong."},{"id":6588,"es":"A mi consternación, mi billetera había desaparecido.","en":"To my dismay, my wallet was gone."},{"id":6589,"es":"Use el baño que está bajando las escaleras, por favor.","en":"Please use the bathroom downstairs."},{"id":6590,"es":"Aquí viene nuestro maestro, Robert Brown.","en":"Here comes our teacher, Robert Brown."},{"id":6591,"es":"Él luce muy vigoroso, considerando su edad.","en":"He looks very vigorous, considering his age."},{"id":6592,"es":"¡Santo cielo, qué enorme caja !","en":"My heavens, what an enormous box!"},{"id":6593,"es":"Por favor, perdóneme por llegar tarde.","en":"Please pardon me for coming late."},{"id":6594,"es":"Perdóneme, ¿puedo pasar ?","en":"Excuse me, could I get past?"},{"id":6595,"es":"Contesta el teléfono, por favor.","en":"Answer the phone, please."},{"id":6596,"es":"¿Puedo aparcar aquí ? No, no puedes.","en":"May I park here? No, you can't."},{"id":6597,"es":"¿Puedo aparcar aquí ? No, no puede.","en":"May I park here? No, you can't."},{"id":6598,"es":"En verano, la gente prefiere el mar.","en":"In summer, people prefer the sea."},{"id":6599,"es":"Juan come el arroz con cuchara, pero Maria prefiere usar palillos.","en":"Tom uses a spoon to eat rice, but Mary prefers to use chopsticks."},{"id":6600,"es":"Mientras conduces, estate atento a los baches.","en":"While driving, mind the potholes."},{"id":6601,"es":"Princesa, no se beba la poción.","en":"Princess, don't drink the potion."},{"id":6602,"es":"La conozco de vista, pero nunca he hablado con ella.","en":"I know her by sight, but I've never spoken to her."},{"id":6603,"es":"Cállate, ya has hablado bastante.","en":"Shut up! You're talking too much."},{"id":6604,"es":"No exponga la consola al polvo, humo o al vapor.","en":"Do not expose the console to dust, smoke or steam."},{"id":6605,"es":"Por favor, baraja las cartas cuidadosamente.","en":"Please shuffle the cards carefully."},{"id":6606,"es":"¿Me pasas una engrapadora, por favor ?","en":"Will you please lend me a stapler?"},{"id":6607,"es":"Tráigame una hoja de papel, por favor.","en":"Bring me a sheet of paper, please."},{"id":6608,"es":"¿Podrías bajarle a la tele, por favor ?","en":"Would you please turn down the TV?"},{"id":6609,"es":"Yo dije, ¿Podrías bajarle a tu televisor, por favor ?","en":"I said, Could you please turn your television down?"},{"id":6610,"es":"¿Puede deletrear su nombre, por favor ?","en":"Could you spell your name, please?"},{"id":6611,"es":"Si me ayudas, trataré otra vez.","en":"If you help me, I'll try it again."},{"id":6612,"es":"Si usted no quiere hablar sobre eso, intentaré entenderla.","en":"If you don't want to bring that matter up, I'll try to understand you."},{"id":6613,"es":"Si usted me "In case of fire, break this window."},{"id":6631,"es":"Suertudo con las cartas, sin suerte en el amor.","en":"Lucky at cards, unlucky in love."},{"id":6632,"es":"Ese hábito es adquirido, no innato.","en":"That habit is acquired, not innate."},{"id":6633,"es":"En relación a esto, yo soy el culpable.","en":"In relation to this, I am to blame."},{"id":6634,"es":"Gracias a Dios, por fin llegaron.","en":"Thank God, they finally arrived."},{"id":6635,"es":"Quería comprar un oso de peluche gigante en Ken's, pero no estaba a la venta.","en":"I wanted to buy a huge stuffed bear at Ken's but it was not for sale."},{"id":6636,"es":"La pobreza es, en cierto sentido, una bendición.","en":"Poverty is, in a sense, a blessing."},{"id":6637,"es":"Dices pobre, pero hay muchos grados de pobreza.","en":"You say poor, but there are many degrees of poverty."},{"id":6638,"es":"Damas y caballeros, estoy muy feliz de estar acá.","en":"Ladies and Gentlemen, I'm very happy to be here."},{"id":6639,"es":"Caballeros, ¡suban la tapa ! A las damas también les gusta sentarse en seco.","en":"Gentlemen, lift the toilet seat! Ladies also like to sit dry."},{"id":6640,"es":"Damas y caballeros, me gustaría que escuchasen mi opinión.","en":"Ladies and gentlemen, I would like you to listen to my opinion."},{"id":6641,"es":"¡Buenos días, damas y caballeros !","en":"Good morning, ladies and gentlemen!"},{"id":6642,"es":"Damas y caballeros, ahora comenzaremos la película.","en":"Ladies and Gentlemen, now we will start the movie."},{"id":6643,"es":"Damas y caballeros, siéntense por favor.","en":"Ladies and gentlemen, please sit down."},{"id":6644,"es":"¿Podría sacarme una foto, por favor ?","en":"Would you please take my picture?"},{"id":6645,"es":"Por favor, mira la foto que he elegido.","en":"Please take a look at the picture that I chose."},{"id":6646,"es":"Por favor, dame una foto tuya.","en":"Please, give me a picture of yours."},{"id":6647,"es":"Mostrame tu foto, por favor.","en":"Please show me your picture."},{"id":6648,"es":"La sabiduría me persigue, pero yo soy más rápido.","en":"Wisdom pursues me, but I am faster."},{"id":6649,"es":"Repite después de mí, por favor.","en":"Please repeat after me."},{"id":6650,"es":"Generalmente hablando, la historia se repite.","en":"Generally speaking, history repeats itself."},{"id":6651,"es":"La historia no se repite, pero rima.","en":"History does not repeat itself, but it does rhyme."},{"id":6652,"es":"Necesito una cuchara, un tenedor y un cuchillo. Gracias.","en":"I need a spoon, a fork, and a knife. Thank you."},{"id":6653,"es":"En casa de herrero, cuchillo de palo.","en":"The cobbler's children go barefoot."},{"id":6654,"es":"Mozo, necesito un cuchillo.","en":"Waiter, I need a knife."},{"id":6655,"es":"En latín, el verbo tiene seis infinitivos.","en":"The Latin verb has six infinitives."},{"id":6656,"es":"Lo siento, ¿puede repetir, por favor ?","en":"I'm sorry, could you repeat that please?"},{"id":6657,"es":"¿Puedes repetir la pregunta, por favor ?","en":"Can you please repeat the question?"},{"id":6658,"es":"Si suspendes este examen, tendrás que repetir curso.","en":"If you flunk this exam, you'll have to repeat the course."},{"id":6659,"es":"Una habitación para dos con baño, por favor.","en":"A room for two with bath, please."},{"id":6660,"es":"Por favor, traeme algunos vasos.","en":"Please bring me some glasses."},{"id":6661,"es":"Despeja estos vasos, por favor.","en":"Please put these glasses away."},{"id":6662,"es":"Por favor, habla tan claramente como sea posible.","en":"Please speak as clearly as possible."},{"id":6663,"es":"Claramente, Juan no quería ir.","en":"Evidently, Tom didn't want to go."},{"id":6664,"es":"Si Lola no te dice claramente que sí, deberías tomártelo como un no.","en":"If Lola doesn't say yes clearly, you'd better take it as a no."},{"id":6665,"es":"Le conté nuestros planes, pero no le hizo tilín.","en":"I told him of our plans, but he seemed uninterested."},{"id":6666,"es":"Sí, eso sucede <script>
"use strict";
const CARDS = JSON.parse(document.getElementById('carddata').textContent);
const TOTAL = CARDS.length;
const STORE_KEY = 'spanish_srs_v1';
const DAY = 86400000;

// ---------- persistence ----------
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && s.cards) return s; }catch(e){}
  return fresh();
}
function fresh(){
  const cards = {};
  CARDS.forEach(c => cards[c.id] = {id:c.id, ease:2.5, intervalD:0, reps:0, due:0, lapses:0});
  return {cards, lastVoice:null, speed:0.9, newPerDay:20, autoplay:true, log:{}, streak:{count:0, last:null}, sessionNew:0};
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

// ---------- scheduling (SM-2 variant) ----------
function newPerDay(){ return state.newPerDay ?? 20; }
function now(){ return Date.now(); }
function dayKey(ts){ return new Date(ts).toISOString().slice(0,10); }

function dueQueue(){
  const t = now();
  const due = [], fresh = [];
  for(const c of CARDS){
    const s = state.cards[c.id];
    if(s.reps === 0) fresh.push(c);
    else if(s.due <= t) due.push(c);
  }
  due.sort((a,b)=> state.cards[a.id].due - state.cards[b.id].due);
  const room = Math.max(0, newPerDay() - state.sessionNew);
  return {due, fresh: fresh.slice(0, room), totalNew: fresh.length, totalDue: due.length};
}

function grade(card, q){ // q: 0 again,1 hard,2 good,3 easy
  const s = state.cards[card.id];
  const wasNew = s.reps === 0;
  if(q === 0){
    s.reps = Math.max(1, s.reps); s.lapses++;
    s.ease = Math.max(1.3, s.ease - 0.2);
    s.intervalD = 0; s.due = now() + 60*1000;
  } else {
    if(s.reps === 0){ s.intervalD = q===1?1:q===2?1:3; }
    else if(s.reps === 1){ s.intervalD = q===1?2:q===2?3:5; }
    else { const m = q===1?1.2:q===2?s.ease:s.ease*1.3; s.intervalD = Math.round(s.intervalD * m); }
    if(q===1) s.ease = Math.max(1.3, s.ease - 0.15);
    if(q===3) s.ease = s.ease + 0.15;
    s.intervalD = Math.max(1, s.intervalD);
    s.due = now() + s.intervalD * DAY;
    s.reps++;
  }
  if(wasNew && q!==0){ state.sessionNew++; }
  if(!state.log) state.log = {};
  const k = dayKey(now());
  const d = state.log[k] || (state.log[k] = {reviews:0, again:0});
  d.reviews++; if(q===0) d.again++;
  bumpStreak();
  save();
}
function bumpStreak(){
  const today = new Date().toDateString();
  if(state.streak.last === today) return;
  const y = new Date(Date.now()-DAY).toDateString();
  state.streak.count = (state.streak.last === y) ? state.streak.count+1 : 1;
  state.streak.last = today;
}

// ---------- TTS (fallback when an audio file is missing) ----------
let voices = [], chosenVoice = null;
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v=>/es|spanish|español|castellano/i.test(v.lang+v.name));
  let idx = voices.findIndex(v=>v.name===state.lastVoice);
  if(idx<0) idx = voices.findIndex(v=>/es-ES|es-MX|Monica|Mónica|Paulina|Jorge|Juan/i.test(v.name+v.lang));
  if(idx<0) idx = 0;
  chosenVoice = voices[idx] || null;
  const vs = document.getElementById('setVoice'); if(vs) fillVoiceSelect(vs);
}
function fillVoiceSelect(sel){
  if(!voices.length){ sel.innerHTML='<option>No Spanish voice installed</option>'; return; }
  sel.innerHTML = voices.map((v,i)=>`<option value="${i}"${v===chosenVoice?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  sel.onchange = e=>{ chosenVoice = voices[+e.target.value]; if(chosenVoice){ state.lastVoice = chosenVoice.name; save(); } };
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

let curUtter = null, curAudio = null;
const AUDIO_DIR = 'audio/';   // s_<id>.mp3
function stopAudio(){
  speechSynthesis.cancel();
  if(curAudio){ curAudio.pause(); curAudio = null; }
  document.querySelectorAll('.play.playing,.miniplay.playing').forEach(b=>b.classList.remove('playing'));
}
function speak(text, btn){
  if(!('speechSynthesis' in window)) return;
  stopAudio();
  const u = new SpeechSynthesisUtterance(text);
  if(chosenVoice){ u.voice = chosenVoice; u.lang = chosenVoice.lang; } else { u.lang='es-ES'; }
  u.rate = state.speed || 0.9;
  if(btn){ btn.classList.add('playing'); u.onend = u.onerror = ()=>btn.classList.remove('playing'); }
  curUtter = u; speechSynthesis.speak(u);
}
function playFile(file, fallbackText, btn){
  stopAudio();
  const a = new Audio(AUDIO_DIR + file);
  a.playbackRate = state.speed || 0.9;
  if(btn) btn.classList.add('playing');
  const clear = ()=>{ if(btn) btn.classList.remove('playing'); };
  a.onended = clear;
  a.onerror = ()=>{ clear(); if(curAudio===a) curAudio=null; speak(fallbackText, btn); };
  curAudio = a;
  a.play().catch(()=>{ clear(); if(curAudio===a) curAudio=null; speak(fallbackText, btn); });
}
function playCard(c, btn){ playFile('s_'+c.id+'.mp3', c.es, btn); }

// ---------- view ----------
const main = document.getElementById('main');
let queue = [], current = null, flipped = false;

function refillQueue(){
  const {due, fresh} = dueQueue();
  queue = [...due, ...fresh];
}
function nextCard(){
  flipped = false;
  refillQueue();
  const t = now();
  queue = queue.filter(c => state.cards[c.id].reps===0 || state.cards[c.id].due <= t + 1);
  current = queue[0] || null;
  render();
}

function statsLine(){
  const {totalDue} = dueQueue();
  const learned = CARDS.filter(c=>state.cards[c.id].reps>0).length;
  document.getElementById('stats').innerHTML =
    'Due <b>'+totalDue+'</b> · New <b>'+Math.max(0,newPerDay()-state.sessionNew)+'</b> · Learned <b>'+learned+'</b>/'+TOTAL;
  document.getElementById('streak').textContent = state.streak.count>0 ? '🔥 '+state.streak.count+'-day streak' : '';
}

function render(){
  statsLine();
  if(!current){
    main.innerHTML = '<div class="empty"><h2>🎉 All caught up</h2><p>No cards due right now. Come back later, or your relapsed cards will reappear shortly.</p></div>';
    return;
  }
  const c = current;
  if(!flipped){
    main.innerHTML = `
    <div class="card" id="frontCard" style="cursor:pointer">
      <div class="cardtop">
        <div class="trans" style="margin:0">${esc(c.en)}</div>
        <span class="tap">tap card to reveal the Spanish</span>
      </div>
      <div class="controls"><button class="show" id="showBtn">Show answer</button></div>
    </div>`;
    document.getElementById('frontCard').onclick = ()=> flip();
  } else {
    main.innerHTML = `
    <div class="card">
      <div class="cardtop">
        <div class="sentence">${esc(c.es)}</div>
      </div>
      <div class="playrow"><button class="play" id="playBtn" title="Play (R)">▶</button></div>
      <div class="divider"></div>
      <div class="trans" style="font-size:18px;color:var(--muted)">${esc(c.en)}</div>
      <div class="controls">
        <button class="grade g-again" data-q="0">Again<small>&lt;1m</small></button>
        <button class="grade g-hard" data-q="1">Hard<small id="iv1"></small></button>
        <button class="grade g-good" data-q="2">Good<small id="iv2"></small></button>
        <button class="grade g-easy" data-q="3">Easy<small id="iv3"></small></button>
      </div>
    </div>`;
    document.getElementById('playBtn').onclick = ()=> playCard(c, document.getElementById('playBtn'));
    document.querySelectorAll('.grade').forEach(b=> b.onclick = ()=>{ grade(c, +b.dataset.q); nextCard(); });
    setIvPreview(c);
    if(state.autoplay!==false) playCard(c, document.getElementById('playBtn'));   // play Spanish on reveal
  }
}
function setIvPreview(c){
  const fmt = d => d===0?'<1d': d<30? d+'d' : Math.round(d/30)+'mo';
  const s = state.cards[c.id];
  const peek = q=>{
    let iv; if(q===1){iv = s.reps<=1?(s.reps===0?1:2):Math.round(s.intervalD*1.2);}
    else if(q===2){iv = s.reps===0?1:s.reps===1?3:Math.round(s.intervalD*s.ease);}
    else {iv = s.reps===0?3:s.reps===1?5:Math.round(s.intervalD*s.ease*1.3);}
    return Math.max(1,iv); };
  const e1=document.getElementById('iv1'), e2=document.getElementById('iv2'), e3=document.getElementById('iv3');
  if(e1) e1.textContent=fmt(peek(1)); if(e2) e2.textContent=fmt(peek(2)); if(e3) e3.textContent=fmt(peek(3));
}
function flip(){ flipped = true; render(); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// ---------- controls ----------
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
  if(overlayEl.classList.contains('open')){ if(e.key==='Escape') closeModal(); return; }
  if(e.code==='Space'){ e.preventDefault(); if(current && !flipped) flip(); }
  else if(e.key==='r'||e.key==='R'){ if(flipped && current) playCard(current, document.getElementById('playBtn')); }
  else if(flipped && current && ['1','2','3','4'].includes(e.key)){ grade(current, +e.key-1); nextCard(); }
});

// export / import / reset
function exportProgress(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'spanish-srs-progress-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Progress exported');
}
document.getElementById('importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ const s=JSON.parse(r.result); if(!s.cards) throw 0;
    CARDS.forEach(c=>{ if(!s.cards[c.id]) s.cards[c.id]={id:c.id,ease:2.5,intervalD:0,reps:0,due:0,lapses:0}; });
    state=s; save(); loadVoices(); closeModal(); nextCard(); toast('Progress imported');
  }catch(err){ toast('Invalid file'); } };
  r.readAsText(f); e.target.value='';
};
function importProgress(){ document.getElementById('importFile').click(); }
function resetProgress(){
  if(confirm('Reset all progress? This cannot be undone (export first to keep a backup).')){
    state = fresh(); save(); closeModal(); nextCard(); toast('Progress reset');
  }
}
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// ================= modal framework =================
const overlayEl = document.getElementById('overlay');
const modalBox = document.getElementById('modalBox');
function openModal(title, bodyHtml){
  modalBox.innerHTML =
    '<div class="modalhead"><h2>'+title+'</h2><div class="spacer"></div><button class="closex" id="modalClose">×</button></div>'+
    '<div class="modalbody" id="modalBody">'+bodyHtml+'</div>';
  overlayEl.classList.add('open');
  stopAudio();
  document.getElementById('modalClose').onclick = closeModal;
}
function closeModal(){ overlayEl.classList.remove('open'); modalBox.innerHTML=''; statsLine(); }
overlayEl.addEventListener('click', e=>{ if(e.target===overlayEl) closeModal(); });

function cardStatus(c){
  const s = state.cards[c.id];
  if(s.reps===0) return {key:'new', label:'New'};
  if(s.due <= now()) return {key:'due', label:'Due'};
  if(s.intervalD >= 21) return {key:'mature', label:'Mature'};
  return {key:'learn', label:'Learning'};
}

// ================= settings =================
document.getElementById('settingsBtn').onclick = ()=>{
  openModal('Settings', `
    <div class="setrow">
      <div class="lbl"><b>New cards per day</b><span>How many unseen sentences to introduce daily</span></div>
      <input type="range" id="setNew" min="0" max="100" step="5" value="${newPerDay()}">
      <div class="num" id="setNewN">${newPerDay()}</div>
    </div>
    <div class="setrow">
      <div class="lbl"><b>Audio speed</b><span>Playback rate for Spanish audio</span></div>
      <input type="range" id="setSpd" min="0.5" max="1" step="0.05" value="${state.speed||0.9}">
      <div class="num" id="setSpdN">${(state.speed||0.9).toFixed(2)}×</div>
    </div>
    <div class="setrow">
      <div class="lbl"><b>Autoplay audio</b><span>Play the sentence automatically when a card appears</span></div>
      <input type="checkbox" id="setAuto" ${state.autoplay!==false?'checked':''} style="width:22px;height:22px">
    </div>
    <div class="setrow">
      <div class="lbl"><b>Voice (fallback)</b><span>Browser voice used when a clip is missing</span></div>
      <select id="setVoice" style="max-width:200px"></select>
    </div>
    <div class="secttitle">Data</div>
    <div class="setrow" style="gap:10px; flex-wrap:wrap">
      <button class="iconbtn" id="setExport">⬇ Export progress</button>
      <button class="iconbtn" id="setImport">⬆ Import progress</button>
      <button class="iconbtn" id="setReset" style="color:var(--again)">⟳ Reset progress</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">Progress auto-saves on this device. Export to back up or move to another device.</div>`);
  const sn=document.getElementById('setNew'), snN=document.getElementById('setNewN');
  sn.oninput=()=>{ state.newPerDay=+sn.value; snN.textContent=sn.value; save(); statsLine(); };
  const sp=document.getElementById('setSpd'), spN=document.getElementById('setSpdN');
  sp.oninput=()=>{ state.speed=+sp.value; spN.textContent=(+sp.value).toFixed(2)+'×'; save(); };
  document.getElementById('setAuto').onchange=e=>{ state.autoplay=e.target.checked; save(); };
  fillVoiceSelect(document.getElementById('setVoice'));
  document.getElementById('setExport').onclick=exportProgress;
  document.getElementById('setImport').onclick=importProgress;
  document.getElementById('setReset').onclick=resetProgress;
};

// ================= stats dashboard =================
document.getElementById('statsBtn').onclick = ()=>{
  const t=now();
  let learned=0, mature=0, learning=0, neu=0, dueNow=0, easeSum=0, leeches=0;
  for(const c of CARDS){
    const s=state.cards[c.id];
    if(s.lapses>=4) leeches++;
    if(s.reps===0){ neu++; continue; }
    learned++; easeSum+=s.ease;
    if(s.due<=t) dueNow++;
    if(s.intervalD>=21) mature++; else learning++;
  }
  const log=state.log||{};
  const days=[]; for(let i=13;i>=0;i--){ const k=dayKey(t-i*DAY); const d=log[k]||{reviews:0,again:0}; days.push({k,rev:d.reviews}); }
  const maxRev=Math.max(1,...days.map(d=>d.rev));
  let rev30=0, again30=0;
  for(let i=0;i<30;i++){ const d=log[dayKey(t-i*DAY)]; if(d){ rev30+=d.reviews; again30+=d.again; } }
  const retention = rev30? Math.round((1-again30/rev30)*100) : null;
  const revToday = (log[dayKey(t)]||{reviews:0}).reviews;
  const fc=[0,0,0,0,0,0,0];
  for(const c of CARDS){ const s=state.cards[c.id]; if(s.reps===0) continue; const dd=Math.ceil((s.due-t)/DAY); if(dd>=0&&dd<7) fc[dd]++; }
  const maxFc=Math.max(1,...fc);
  const avgEase = learned? (easeSum/learned).toFixed(2) : '–';

  const barsRev = days.map(d=>`<div class="bar"><div class="val">${d.rev||''}</div><div class="fill" style="height:${Math.round(d.rev/maxRev*70)}%"></div><div class="cap">${d.k.slice(5)}</div></div>`).join('');
  const barsFc = fc.map((n,i)=>`<div class="bar future"><div class="val">${n||''}</div><div class="fill" style="height:${Math.round(n/maxFc*70)}%"></div><div class="cap">${i===0?'today':'+'+i+'d'}</div></div>`).join('');
  const pct=n=>learned? (n/TOTAL*100):0;
  const matbar = `<div class="matbar">
      <div style="background:var(--good);width:${pct(mature)}%" title="Mature">${mature>140?mature:''}</div>
      <div style="background:var(--hard);width:${pct(learning)}%" title="Learning">${learning>140?learning:''}</div>
      <div style="background:var(--panel2);color:var(--muted);width:${neu/TOTAL*100}%" title="New">${neu>400?neu:''}</div>
    </div>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px">
      <span><span style="color:var(--good)">■</span> Mature ${mature}</span>
      <span><span style="color:var(--hard)">■</span> Learning ${learning}</span>
      <span><span style="color:var(--muted)">■</span> New ${neu}</span>
    </div>`;

  openModal('Statistics', `
    <div class="statgrid">
      <div class="stat"><div class="n">${learned}<span style="font-size:14px;color:var(--muted)">/${TOTAL}</span></div><div class="l">Sentences learned</div></div>
      <div class="stat"><div class="n good">${mature}</div><div class="l">Mature (≥21d)</div></div>
      <div class="stat"><div class="n warn">${dueNow}</div><div class="l">Due now</div></div>
      <div class="stat"><div class="n acc">${retention===null?'–':retention+'%'}</div><div class="l">Retention (30d)</div></div>
      <div class="stat"><div class="n">${revToday}</div><div class="l">Reviews today</div></div>
      <div class="stat"><div class="n">${avgEase}</div><div class="l">Avg ease</div></div>
      <div class="stat"><div class="n">${state.streak.count||0}</div><div class="l">Day streak 🔥</div></div>
      <div class="stat"><div class="n ${leeches?'warn':''}">${leeches}</div><div class="l">Leeches (4+ lapses)</div></div>
    </div>
    <div class="secttitle">Collection</div>
    ${matbar}
    <div class="secttitle">Reviews — last 14 days</div>
    <div class="bars">${barsRev}</div>
    <div class="secttitle">Due forecast — next 7 days</div>
    <div class="bars">${barsFc}</div>
    ${leeches?`<div class="cramwrap" style="margin-top:18px"><button class="iconbtn" id="studyLeeches">Study ${leeches} leech${leeches>1?'es':''} now</button></div>`:''}
  `);
  const lb=document.getElementById('studyLeeches');
  if(lb) lb.onclick=()=>{ const set=CARDS.filter(c=>(state.cards[c.id].lapses||0)>=4); startCram(set,'Leeches'); };
};

// ================= browse / search / cram =================
document.getElementById('browseBtn').onclick = openBrowse;
function openBrowse(){
  openModal('Browse &amp; Search', `
    <div class="browsebar">
      <input type="text" id="bq" placeholder="Search Spanish or English…" autocomplete="off">
      <select id="bstatus"><option value="">All status</option><option value="new">New</option><option value="learn">Learning</option><option value="mature">Mature</option><option value="due">Due</option></select>
    </div>
    <div class="browsecount" id="bcount"></div>
    <div class="cramwrap" style="margin-bottom:12px"><button class="iconbtn" id="cramBtn">▶ Cram these (no scheduling)</button></div>
    <div class="blist" id="blist"></div>`);
  const q=document.getElementById('bq'), st=document.getElementById('bstatus');
  let shown=[];
  function matches(){
    const term=q.value.trim().toLowerCase(), s=st.value;
    shown = CARDS.filter(c=>{
      if(s && cardStatus(c).key!==s) return false;
      if(!term) return true;
      return (c.es+' '+c.en).toLowerCase().includes(term);
    });
    return shown;
  }
  function draw(){
    const list=matches();
    document.getElementById('bcount').textContent = list.length+' sentence'+(list.length===1?'':'s');
    document.getElementById('blist').innerHTML = list.slice(0,400).map(c=>{
      const stt=cardStatus(c);
      return `<div class="brow" data-id="${c.id}">
        <div class="browtop">
          <button class="miniplay" data-id="${c.id}" title="Play">▶</button>
          <span class="bes">${esc(c.es)}</span>
          <span class="badge ${stt.key}">${stt.label}</span>
        </div>
        <div class="bdetail"><div class="bex"><div class="en">${esc(c.en)}</div></div></div>
      </div>`;
    }).join('') + (list.length>400?'<div class="browsecount">Showing first 400 — refine your search.</div>':'');
    document.querySelectorAll('#blist .brow').forEach(r=>{
      r.onclick=e=>{ if(e.target.closest('.miniplay')) return; r.classList.toggle('open'); };
    });
    document.querySelectorAll('#blist .miniplay').forEach(b=> b.onclick=()=>{
      const c=CARDS[+b.dataset.id]; playCard(c, b);
    });
  }
  q.oninput=draw; st.onchange=draw;
  document.getElementById('cramBtn').onclick=()=>{ if(shown.length) startCram(shown.slice(),'Cram'); };
  draw(); q.focus();
}

// cram: flip-through of a fixed set, no SRS changes
function startCram(set, label){
  let i=0, flip=false;
  function show(){
    const c=set[i];
    if(!flip){
      modalBox.querySelector('#modalBody').innerHTML = `
        <div class="cramwrap" style="color:var(--muted);font-size:12px;margin-bottom:14px">${label} · ${i+1} / ${set.length}</div>
        <div class="card" style="box-shadow:none;border:none;background:transparent">
          <div class="cardtop"><div class="trans" style="margin:0">${esc(c.en)}</div><span class="tap">tap to reveal the Spanish</span></div>
          <div class="controls"><button class="show" id="cramShow">Show answer</button></div>
        </div>`;
      modalBox.querySelector('#cramShow').onclick=()=>{ flip=true; show(); };
    } else {
      modalBox.querySelector('#modalBody').innerHTML = `
        <div class="cramwrap" style="color:var(--muted);font-size:12px;margin-bottom:14px">${label} · ${i+1} / ${set.length}</div>
        <div class="card" style="box-shadow:none;border:none;background:transparent">
          <div class="cardtop"><div class="sentence">${esc(c.es)}</div></div>
          <div class="playrow"><button class="play" id="cramPlay">▶</button></div>
          <div class="divider"></div><div class="trans" style="font-size:18px;color:var(--muted)">${esc(c.en)}</div>
          <div class="controls">
            <button class="iconbtn" id="cramPrev" ${i===0?'disabled':''}>← Prev</button>
            <button class="iconbtn" id="cramNext">${i===set.length-1?'Done':'Next →'}</button>
          </div>
        </div>`;
      modalBox.querySelector('#cramPlay').onclick=()=> playCard(c, modalBox.querySelector('#cramPlay'));
      if(state.autoplay!==false) playCard(c, modalBox.querySelector('#cramPlay'));   // play Spanish on reveal
      modalBox.querySelector('#cramPrev').onclick=()=>{ if(i>0){i--;flip=false;show();} };
      modalBox.querySelector('#cramNext').onclick=()=>{ if(i<set.length-1){i++;flip=false;show();} else openBrowse(); };
    }
  }
  openModal('Cram', '');
  show();
}

// new-day session reset of sessionNew counter
(function(){
  const today=new Date().toDateString();
  if(state.streak.last !== today){ state.sessionNew = 0; save(); }
})();

nextCard();
</script>

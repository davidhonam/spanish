:"No suelo ver muchas películas, pero no puedo resistirme a un buen documental.","en":"I don't watch a lot of movies, but I can't resist a good documentary."},{"id":3808,"es":"Recoge el bolígrafo del suelo, por favor.","en":"Please pick up the pen from the floor."},{"id":3809,"es":"En Canadá dormimos sobre una cama, no en el suelo.","en":"In Canada we sleep in a bed, not on the floor."},{"id":3810,"es":"No, suelo verlos en la tele, en casa.","en":"No, usually I watch them at home on TV."},{"id":3811,"es":"Suelo levantarme a las siete y acostarme a las once, salvo los domingos.","en":"I usually get up at seven and go to bed at eleven except on Sundays."},{"id":3812,"es":"En un agujero en el suelo, allí vivía un hobbit.","en":"In a hole in the ground there lived a hobbit."},{"id":3813,"es":"Después de llover y estando el suelo húmedo, es más sencillo quitar la maleza.","en":"After it rains and the ground is damp, it's easier to pull weeds."},{"id":3814,"es":"La nieve se acumuló en el suelo, creando un gruesa y dura capa de hielo.","en":"The snow lay on the ground, frozen into a thick, hard crust."},{"id":3815,"es":"No, no tengo miedo de los fantasmas.","en":"No, I'm not afraid of ghosts."},{"id":3816,"es":"Te sientes solo, ¿verdad ?","en":"You feel lonesome, don't you?"},{"id":3817,"es":"Sé cómo te sientes, pero se acabó.","en":"I know how you feel, but it's over."},{"id":3818,"es":"Te sientes sola, ¿verdad ?","en":"You feel lonesome, don't you?"},{"id":3819,"es":"Si te sientes amenazada, no dudes en venir a mi casa.","en":"If you feel threatened, don't hesitate in coming to my house."},{"id":3820,"es":"No te sientes en la mesa, podría romperse.","en":"Don't sit on the table. It could break."},{"id":3821,"es":"¿Cómo te sientes esta mañana ? Bastante bien, gracias.","en":"How are you feeling this morning? Pretty good, thanks."},{"id":3822,"es":"Quizá ahora que sabes la verdad, te sentirás mejor.","en":"Now that you know the truth, perhaps you'll feel better."},{"id":3823,"es":"Si duermes un poco, te sentirás mucho mejor.","en":"If you sleep for a while, you will feel much better."},{"id":3824,"es":"Si descansas lo suficiente cada noche, te sentirás mucho mejor.","en":"If you get enough rest every night, you'll feel much better."},{"id":3825,"es":"Siéntate aquí, te sentirás mejor.","en":"Sit here, you'll feel better."},{"id":3826,"es":"Siéntate y descansa, te sentirás mucho mejor.","en":"Sit back and rest, and you will feel much better."},{"id":3827,"es":"Tom, me quiero quedar contigo.","en":"Tom, I want to stay with you."},{"id":3828,"es":"En ese caso, ellos van a quedar atrasados.","en":"In that case, they fall behind."},{"id":3829,"es":"Iba a intentar quedar en la Universidad de Tokio, pero cambié de idea.","en":"I was going to try to get into Tokyo University, but I've changed my mind."},{"id":3830,"es":"Espero que podamos quedar de nuevo. Sí, no veré el momento de que ocurra.","en":"I hope we can get together again. Yes, I'll be looking forward to it."},{"id":3831,"es":"Por favor, háblame en inglés.","en":"Please speak to me in English."},{"id":3832,"es":"Por favor, háblame acerca de tus pasatiempos.","en":"Please tell me about your hobbies."},{"id":3833,"es":"¡Vamos ! Háblame, Trang.","en":"Come on! Talk to me, Trang."},{"id":3834,"es":"Lo siento, ese vuelo está lleno.","en":"I'm sorry, that flight is full."},{"id":3835,"es":"Lo lamento, el vuelo ya está lleno.","en":"Sorry, the flight is already full."},{"id":3836,"es":"Lo lamento, el vuelo está lleno.","en":"I'm sorry, the flight is full."},{"id":3837,"es":"Ahora tengo que marcharme, están llamando para mi vuelo.","en":"Now I have to leave, they're calling for my flight."},{"id":3838,"es":"Lo siento, este vuelo está completo.","en":"I'm sorry, this flight is full."},{"id":3839,"es":"Nuestro vuelo sale a mediodía, y llegará a Okinawa a la 1:30.","en":"Our plane leaves at noon, arriving in Okinawa at 1:30."},{"id":3840,"es":"Recientemente, han habido señales de que la economía está tomando vuelo.","en":"Recently, there have been signs that the economy is picking up steam."},{"id":3841,"es":"Este es mi primer vuelo. Estoy nervioso, dice Hiroshi.","en":"This is my first flight. I'm nervous, says Hiroshi."},{"id":3842,"es":"¿Qué te gusta más, el verano o el invierno ?","en":"Which do you like better, summer or winter?"},{"id":3843,"es":"El invierno está por caer, pronto las montañas se cubrirán de nieve.","en":"With winter coming on, the mountains will soon be covered with snow."},{"id":3844,"es":"El invierno está al caer, pronto las montañas se cubrirán de nieve.","en":"With winter coming on, the mountains will soon be covered with snow."},{"id":3845,"es":"Hablando de Suiza, ¿has estado alguna vez allí en invierno ?","en":"Talking of Switzerland, have you ever been there in winter?"},{"id":3846,"es":"Te amaré siempre, no importa lo que pase.","en":"I'll always love you, no matter what happens."},{"id":3847,"es":"Si le das otra oportunidad, dará lo mejor de si.","en":"If you gave him another chance, he'd do his best."},{"id":3848,"es":"Si das lo mejor de ti, nadie te culpará.","en":"If you do your best, no one will blame you."},{"id":3849,"es":"Si te das prisa, le superarás.","en":"If you hurry, you will overtake him."},{"id":3850,"es":"Si te das prisa, le alcanzarás.","en":"If you hurry, you'll catch up with him."},{"id":3851,"es":"Si te das prisa, puedes lograrlo.","en":"If you hurry, you can make it."},{"id":3852,"es":"No queremos que este se dañe, ¿o no ?","en":"We don't want this to get damaged, do we?"},{"id":3853,"es":"Solo queremos ayudarte, Tom.","en":"We only want to help you, Tom."},{"id":3854,"es":"Si ocurre de nuevo, queremos estar preparados.","en":"If it happens again, we want to be ready."},{"id":3855,"es":"Hoy en día, Juan no toca piano.","en":"Tom doesn't play the piano nowadays."},{"id":3856,"es":"Toca el piano, así como la guitarra.","en":"She plays piano as well as the guitar."},{"id":3857,"es":"Te toca a ti fregar los platos, ayer lo hice yo.","en":"It's your turn to do the washing up. I did it yesterday."},{"id":3858,"es":"Ella canta, él toca la guitarra y nosotros bailamos.","en":"She sings, he plays the guitar and we dance."},{"id":3859,"es":"En caso de incendio, toca la campana.","en":"In case of fire, ring the bell."},{"id":3860,"es":"Toca el violín, por favor.","en":"Please play the violin."},{"id":3861,"es":"Ella canta, él toca la guitarra y nosotras bailamos.","en":"She sings, he plays the guitar and we dance."},{"id":3862,"es":"Te equivocas: él toca el contrabajo, no el trombón.","en":"You're mistaken. He plays bass, not trombone."},{"id":3863,"es":"El verdadero problema no es si las máquinas piensan, es si acaso las personas piensan.","en":"The real problem is not whether machines think but whether men do."},{"id":3864,"es":"Y sin embargo, también lo contrario es siempre verdadero.","en":"And yet, the contrary is always true as well."},{"id":3865,"es":"El verdadero valor de un hombre no yace tanto en lo que tiene, sino en lo que es.","en":"The true value of a man lies not so much in what he has as in what he is."},{"id":3866,"es":"Un verdadero alemán no soporta a los franceses, aunque con gusto se beba sus vinos.","en":"A true German can't stand the French, yet willingly he drinks their wines."},{"id":3867,"es":"Obviamente, el teorema es verdadero para conjuntos finitos.","en":"Obviously, the theorem is true for finite sets."},{"id":3868,"es":"Lo siento, pero no puedo ir contigo.","en":"I'm sorry, but I can't go with you."},{"id":3869,"es":"Lo siento, no puedo ir contigo.","en":"I'm sorry I cannot go with you."},{"id":3870,"es":"Si tienes algo que decir, dímelo a la cara.","en":"If you have something to say, say it to my face."},{"id":3871,"es":"Vista de lejos, esta piedra se parece a una cara humana.","en":"Seen from a distance, the stone looks like a human face."},{"id":3872,"es":"Ese rumor no es cierto, ¿verdad ?","en":"That rumour is not true, is it?"},{"id":3873,"es":"En realidad, solo se trataba de un rumor.","en":"Actually, it was only a rumor."},{"id":3874,"es":"Descubrí que el rumor era, en parte, cierto.","en":"I found the rumor to be true to a certain extent."},{"id":3875,"es":"Hasta donde yo sé, el rumor es falso.","en":"As far as I know, the rumor is not true."},{"id":3876,"es":"Por desgracia, ese rumor es cierto.","en":"Unfortunately, that rumor is true."},{"id":3877,"es":"Me he acabado de comer, así que no tengo hambre.","en":"I've just eaten so I'm not hungry."},{"id":3878,"es":"Habiendo acabado la clase, los estudiantes se fueron rápidamente.","en":"The class being over, the students left quickly."},{"id":3879,"es":"Ah, se nos ha acabado el azúcar.","en":"Ah, we have run short of sugar."},{"id":3880,"es":"Cuando te hayas acabado el libro, déjalo donde lo encontraste.","en":"When you're done with the book, put it back where you found it."},{"id":3881,"es":"Finalmente, la Primera Guerra Mundial había acabado oficialmente.","en":"Finally, World War One was officially over."},{"id":3882,"es":"Y colorín colorado, este cuento se ha acabado.","en":"And they all lived happily ever after."},{"id":3883,"es":"¡No me mires así, yo no he hecho nada malo !","en":"Don't look at me that way, I haven't done anything bad."},{"id":3884,"es":"Él es rico, pero es malo.","en":"He is rich, but he is unkind."},{"id":3885,"es":"En mi opinión, quedarse levantado hasta tarde es malo para la salud.","en":"In my opinion, staying up late is bad for one's health."},{"id":3886,"es":"Lo mezclamos con lo bueno, no lo malo.","en":"We mix with the good, not with the bad."},{"id":3887,"es":"Sea bueno o malo, hagámoslo de todos modos.","en":"Whether it's good or not, let's do it anyway."},{"id":3888,"es":"Soy muy malo con los nombres, pero nunca olvido una cara.","en":"I'm really bad with names, but I never forget a face."},{"id":3889,"es":"Vivimos allí mucho tiempo, junto al río.","en":"We lived there a long time, by the river."},{"id":3890,"es":"Nosotros vivimos en una sociedad, no sólo en una economía.","en":"We live in a society; not just in an economy."},{"id":3891,"es":"Comemos para vivir, no vivimos para comer.","en":"We eat to live, not live to eat."},{"id":3892,"es":"No vivimos para comer, comemos para vivir.","en":"Not for eating do we live, but for living, we eat."},{"id":3893,"es":"Como vivimos en el campo, hay poco que hacer para divertirse.","en":"Living in the country, we have few amusements."},{"id":3894,"es":"Alabamos el pasado, pero vivimos el presente.","en":"We praise the good old times, but live today."},{"id":3895,"es":"A pesar de mis órdenes, no vinieron.","en":"They didn't come in spite of my orders."},{"id":3896,"es":"Mis padres son ingleses, pero vinieron a Brasil en el 2001.","en":"My parents are English, but they came to Brazil in 2001."},{"id":3897,"es":"Mientras él hablaba, imágenes vinieron a mi mente.","en":"As he spoke, pictures came into my mind."},{"id":3898,"es":"Nunca odies a un hombre, sino como mucho, lo que él hace o piensa.","en":"Never hate a man, but at most hate what he does or thinks."},{"id":3899,"es":"Lo amo, pero él piensa que lo odio.","en":"I love him, but he thinks I hate him."},{"id":3900,"es":"Juan no cree a María, piensa que miente.","en":"Tom doesn't believe Mary. He thinks she's lying."},{"id":3901,"es":"Cuando piensa, se rasca la cabeza.","en":"When he thinks, he scratches his head."},{"id":3902,"es":"Nadie piensa, pero todos opinan.","en":"No one thinks, but everyone has their opinions."},{"id":3903,"es":"Sra. Roland, ¿qué piensa usted sobre este problema ?","en":"Mrs. Roland, what do you think of this problem?"},{"id":3904,"es":"Por amor a la humanidad, ¡aprende tu idioma, por favor !","en":"Please, for the love of mankind, learn your language."},{"id":3905,"es":"Si quieres aprender bien un idioma, apréndelo por tu cuenta.","en":"If you want to learn a language well, learn it by yourself."},{"id":3906,"es":"A pesar de las dificultades de idioma, todos nos hicimos amigos rápido.","en":"In spite of the language difficulty, we soon become friends."},{"id":3907,"es":"Saber un idioma es una cosa, enseñarlo es otra.","en":"To know a language is one thing, and to teach it is another."},{"id":3908,"es":"Ustedes saben lo que quiero, ¿no ?","en":"You know what I want, don't you?"},{"id":3909,"es":"De repente, todas las luces se apagaron.","en":"Suddenly all the lights went out."},{"id":3910,"es":"De alguna forma, hoy luces distinto.","en":"Somehow, you look different today."},{"id":3911,"es":"Ah, se empezaron a prender las luces de la calle.","en":"Oh, the streetlights have turned on."},{"id":3912,"es":"Luces, cámara y acción.","en":"Lights, camera, action!"},{"id":3913,"es":"Lo siento, no tengo cambio más pequeño.","en":"I'm sorry, I don't have smaller change."},{"id":3914,"es":"Tú eres joven. Yo, en cambio, soy muy mayor.","en":"You are young. I, on the other hand, am very old."},{"id":3915,"es":"Si necesitas un cambio de ritmo, ¿por qué no vienes a visitarnos ?","en":"If you need a change of pace, why don't you come for a visit?"},{"id":3916,"es":"Si hay cualquier cambio en el horario, haceme el favor de avisar.","en":"If there is any change in the timetable, please let me know."},{"id":3917,"es":"Para muchos, el cambio parece inevitable.","en":"To many, change seems inevitable."},{"id":3918,"es":"Yo iré al mar, en cambio tú, irás al colegio.","en":"I will go to the sea, but you, on the other hand, will go to school."},{"id":3919,"es":"Perdone, pero no tengo cambio.","en":"Forgive me, but I have no change."},{"id":3920,"es":"Las operaciones de cambio de sexo, ahora son deducibles.","en":"Sex change operations are now tax-deductible."},{"id":3921,"es":"Al ver a su madre, el niño perdido rompió en llanto.","en":"Seeing his mother, the lost child burst into tears."},{"id":3922,"es":"La realidad es, que él rompió la ventana.","en":"The fact is, he broke the window."},{"id":3923,"es":"Confundida por su descuidado error, rompió en llanto.","en":"Confused by her careless mistake, she burst into tears."},{"id":3924,"es":"Venga a mi casa, por favor.","en":"Please come to my house."},{"id":3925,"es":"Le veré, a no ser que venga demasiado tarde.","en":"I'll see him if he doesn't come too late."},{"id":3926,"es":"Venga conmigo, por favor.","en":"Come with me, please."},{"id":3927,"es":"Por favor, pásate cuando te venga bien.","en":"Please drop in when it is convenient for you."},{"id":3928,"es":"Ya que nunca he comido aquí antes, no sé que recomendar.","en":"Since I've never eaten here before, I don't know what to recommend."},{"id":3929,"es":"Aparte de algo de fruta, él no ha comido nada.","en":"Apart from some fruit, he hasn't eaten anything."},{"id":3930,"es":"No he comido desde el desayuno, tengo hambre.","en":"I haven't eaten since breakfast; I'm hungry."},{"id":3931,"es":"Ahora que hemos comido, vámonos.","en":"Now that we have eaten up, let's go."},{"id":3932,"es":"Ya habrás comido almuerzo, ¿cierto ?","en":"You have eaten lunch, haven't you?"},{"id":3933,"es":"A Maria le gusta Japón, ¿o no ?","en":"Mary likes Japan, doesn't she?"},{"id":3934,"es":"Soy japonés, pero no vivo en Japón.","en":"I'm Japanese, but I don't live in Japan."},{"id":3935,"es":"Ella tiene un buen dominio de inglés, a pesar de haberse criado en Japón.","en":"She has a good command of English though she was brought up in Japan."},{"id":3936,"es":"Ella es estadounidense, pero vive en el Reino Unido.","en":"She is American, but she lives in England."},{"id":3937,"es":"¿Cuál es mayor, Japón o el Reino Unido ?","en":"Which is larger, Japan or Britain?"},{"id":3938,"es":"Los Estados Unidos son una república, el Reino Unido no.","en":"The United States is a republic - the United Kingdom is not."},{"id":3939,"es":"¡Un caballo, un caballo ! ¡Mi reino por un caballo !","en":"A horse! A horse! My kingdom for a horse!"},{"id":3940,"es":"Abre los ojos, por favor.","en":"Open your eyes please."},{"id":3941,"es":"Como él estaba cansado, estaba sentado en el sofá con los ojos cerrados.","en":"Since he was tired, he was sitting on the sofa with his eyes closed."},{"id":3942,"es":"Para mi mayor sorpresa, sus ojos se fijaron en mí y sonrió.","en":"To my great surprise, her eyes fixed on me and she smiled."},{"id":3943,"es":"Por favor, cerrad los ojos.","en":"Close your eyes, please."},{"id":3944,"es":"¡En la Rusia Soviética, el río te nada !","en":"In Soviet Russia, river swims you!"},{"id":3945,"es":"En la Rusia soviética, ¡las frases te escriben a ti !","en":"In Soviet Russia, sentence writes you!"},{"id":3946,"es":"En la Rusia soviética, ¡el ordenador usa al usuario !","en":"In Soviet Russia, the computer uses the user!"},{"id":3947,"es":"En la Rusia soviética, ¡la televisión observa a la audiencia !","en":"In Soviet Russia, television watches the audience!"},{"id":3948,"es":"En la Rusia soviética, ¡la radio escucha al oyente !","en":"In Soviet Russia, radio listens to the listener!"},{"id":3949,"es":"El primer satéilte artificial fue el Sputnik 1, lanzado por Rusia en 1957.","en":"The first artificial satellite was Sputnik 1, launched by Russia in 1957."},{"id":3950,"es":"No queríamos ir, pero tuvimos que hacerlo.","en":"We didn't want to go, but we had to."},{"id":3951,"es":"Nos íbamos a casar en mayo, pero tuvimos que posponer la boda hasta junio.","en":"We were to be married in May but had to postpone the marriage until June."},{"id":3952,"es":"Houston, aquí tuvimos un problema.","en":"Houston, we've had a problem here."},{"id":3953,"es":"No aceptaban tarjetas de crédito, y tuvimos que dejar el lugar.","en":"They didn't take credit cards, and we had to leave the place."},{"id":3954,"es":"¿Alguien podría explicar esto, por favor ?","en":"Could anyone explain this, please?"},{"id":3955,"es":"Si me dejas hablar, podré explicar todo.","en":"If you allow me to speak, I'll be able to explain everything."},{"id":3956,"es":"El general supo explicar perfectamente la derrota a posteriori, pero no había previsto nada en absoluto.","en":"The general had 20/20 hindsight about the defeat, but no foresight at all."},{"id":3957,"es":"Ella estaba muy enferma, y se mandó a traer un médico.","en":"She was very ill, and a doctor was sent for."},{"id":3958,"es":"¿Me podés traer un martillo de la cocina, por favor ?","en":"Could you get a hammer for me from the kitchen please?"},{"id":3959,"es":"¿Me podés traer una almohada y una colcha, por favor ?","en":"Could you bring me a pillow and blanket, please?"},{"id":3960,"es":"Si nos apuramos, creo que la hacemos.","en":"I think we'll make it if we hurry."},{"id":3961,"es":"Ven a Albania, ahí siempre hacemos buen café.","en":"Come to Albania, we always make good coffee there."},{"id":3962,"es":"Tatoeba: ¿has oído hablar alguna vez de las peleas de oraciones ? Sí, eso es lo que hacemos para divertirnos.","en":"Tatoeba: Ever heard of sentence fights? Yeah, that's what we do for fun."},{"id":3963,"es":"Si hacemos eso, debemos ser castigados.","en":"Were we to do such a thing, we should be punished."},{"id":3964,"es":"Oh, no hacemos eso aquí en España.","en":"Oh, we don't do that here in Spain."},{"id":3965,"es":"¡Mierda, mi polola ya volvió ! ¿Qué hacemos ?","en":"Crap! My girlfriend is already back! What should we do?!"},{"id":3966,"es":"Mi padre sí que juega al golf, pero no lo hace bien.","en":"My father does play golf, but not well."},{"id":3967,"es":"¡Papá, juega conmigo a las miradas !","en":"Daddy, let's have a staring contest."},{"id":3968,"es":"Vamos, juega conmigo, ¡estoy tan aburrido !","en":"Come on, play with me, I'm so bored!"},{"id":3969,"es":"Y así, cada ciudadano juega un rol indispensable.","en":"And so each citizen plays an indispensable role."},{"id":3970,"es":"Venga, juega conmigo, ¡me aburro !","en":"Come on, play with me, I'm so bored!"},{"id":3971,"es":"Además de fumar, mi padre bebe.","en":"Besides smoking, my father drinks."},{"id":3972,"es":"¿Que bebe usted por lo general, vino o cerveza ?","en":"Which do you usually drink, wine or beer?"},{"id":3973,"es":"El apetito entra cuando se come, pero la sed se va cuando se bebe.","en":"Appetite comes with eating, but the thirst goes away with drinking."},{"id":3974,"es":"Todos los días, Kate bebe mucha leche.","en":"Kate drinks a lot of milk every day."},{"id":3975,"es":"Aparte de fumar, mi padre bebe.","en":"Besides smoking, my father drinks."},{"id":3976,"es":"Si él no bebe, morirá.","en":"If he doesn't drink, he will die."},{"id":3977,"es":"El que bebe, beberá.","en":"He who drinks, will drink."},{"id":3978,"es":"Juan no bebe café, pero fuma cigarros.","en":"Tom doesn't drink coffee, but he smokes cigarettes."},{"id":3979,"es":"Si quieres hacer eso, no voy a tratar de detenerte.","en":"If you want to do that, I'm not going to try and stop you."},{"id":3980,"es":"Él dijo, La administración japonesa debe aprender como tratar con los trabajadores americanos.","en":"Japanese management must learn how to deal with American workers, he said."},{"id":3981,"es":"Habiendo fallado dos veces, William ya no quería tratar otra vez.","en":"Having failed twice, William didn't want to try again."},{"id":3982,"es":"Si fallo, debería tratar nuevamente.","en":"If I should fail, I would try again."},{"id":3983,"es":"Mira, los niños están caminando descalzos en el agua.","en":"Look, the boys are walking barefoot in the water."},{"id":3984,"es":"De casualidad, vi a mi amigo caminando en la distancia.","en":"It happened that I saw my friend walking in the distance."},{"id":3985,"es":"No te quedes en la cama, a menos que puedas ganar dinero en la cama.","en":"Don't stay in bed, unless you can make money in bed."},{"id":3986,"es":"Si tengo suerte, podría ganar.","en":"I may win if I'm lucky."},{"id":3987,"es":"La pregunta clave no es lo que puedo ganar, sino lo que tengo para perder.","en":"The key question is not what can I gain but what do I have to lose."},{"id":3988,"es":"América es un lugar encantador para vivir, si estás aquí para ganar dinero.","en":"America is a lovely place to be, if you are here to earn money."},{"id":3989,"es":"Ni te molestes, él va a ganar de todas formas.","en":"Don't even bother, he'll win anyway."},{"id":3990,"es":"Lo más importante no es ganar, sino participar.","en":"The important thing is not to win but to take part."},{"id":3991,"es":"Bill va a ganar, ¿no cierto ?","en":"Bill will win, won't he?"},{"id":3992,"es":"Recuerda, el respeto lo es todo.","en":"Remember, respect is everything."},{"id":3993,"es":"Perdona a tu enemigo, pero recuerda el nombre de ese bastardo.","en":"Forgive your enemy, but remember the name of that bastard."},{"id":3994,"es":"Los perros no son personas. Para comenzar, recuerda eso.","en":"Dogs aren't people. First of all, remember that."},{"id":3995,"es":"¡Ah, eso me recuerda a los viejos tiempos !","en":"Ah, that reminds me of the old days!"},{"id":3996,"es":"Cuando te sientas solo, recuerda los momentos felices que pasamos juntos.","en":"When you feel lonely, remember the happy moments we spent together."},{"id":3997,"es":"En tiempos de abundancia, recuerda los tiempos de hambruna.","en":"In times of abundance, remember the times of famine."},{"id":3998,"es":"Por lo demás, es correcto.","en":"It is otherwise correct."},{"id":3999,"es":"Como en todo lo demás, hay algo bello en el pecado.","en":"As in everything else, there's something beautiful about sin."},{"id":4000,"es":"Puedes mentir a todos los demás, pero no puedes mentirte a ti mismo.","en":"You can lie to everyone else, but you can't lie to yourself."},{"id":4001,"es":"Cuando se enteró del éxito de los demás, se puso verde de envidia.","en":"Upon finding out about the others' success, she turned green with envy."},{"id":4002,"es":"Aunque ha estado en el hospital, él mantuvo el ritmo de los demás estudiantes.","en":"Though he had been in the hospital, he kept up with other students."},{"id":4003,"es":"Esta flor es amarilla, pero todas las demás son azules.","en":"This flower is yellow, but all the others are blue."},{"id":4004,"es":"Puede que viva solo, pero al menos no tengo que responder ante nadie.","en":"I may live alone but at least I don't have to answer to anyone."},{"id":4005,"es":"¿Puedes limitarte a responder a la pregunta, por favor ? No tenemos todo el día.","en":"Could you just please answer the question? We don't have all day."},{"id":4006,"es":"Lo siento, tengo que responder a los mensajes.","en":"I'm sorry, I have to answer messages."},{"id":4007,"es":"¿Podéis limitaros a responder a la pregunta, por favor ? No tenemos todo el día.","en":"Could you just please answer the question? We don't have all day."},{"id":4008,"es":"La tarta de manzana de su tía estaba exquisita, así que se sirvió una segunda porción.","en":"His aunt's apple pie was delicious, so he had a second helping."},{"id":4009,"es":"La tarta de manzana de su tía era deliciosa, así que se sirvió otra ración.","en":"His aunt's apple pie was delicious, so he had a second helping."},{"id":4010,"es":"Mi tío es delgado, pero mi tía es robusta.","en":"My uncle is slender, but my aunt is stout."},{"id":4011,"es":"Ayer compré un perro. Por desgracia, mi tía lo cocinó para la cena.","en":"Yesterday I bought a dog. Sadly my aunt cooked it for dinner."},{"id":4012,"es":"Si por casualidad mi equipo pierde con el tuyo, yo me comeré mi sombrero.","en":"I'll eat my hat if, by some chance, my team loses to yours."},{"id":4013,"es":"Para la final, cada equipo trajo su bandera al estadio.","en":"Each team carried their flag into the stadium for the finals."},{"id":4014,"es":"Tal como predijo Max, nuestro equipo perdió.","en":"Just as Max predicted, our team lost."},{"id":4015,"es":"Más rápido, más alto, más fuerte.","en":"Faster, higher, stronger."},{"id":4016,"es":"Tu coche es rápido, pero el mío es más rápido.","en":"Your car is fast, but mine is faster."},{"id":4017,"es":"Por favor, averigua donde se encuentra.","en":"Please find out where he is."},{"id":4018,"es":"Por favor, encuentra una solución al problema.","en":"Please find a solution to the problem."},{"id":4019,"es":"Encuentra la solución, por favor.","en":"Please find the solution."},{"id":4020,"es":"Quien busca, encuentra.","en":"Those who search, find."},{"id":4021,"es":"Nuestra firma se encuentra al borde de la quiebra, me da vergüenza decirlo.","en":"Our firm is on the verge of bankruptcy, I'm ashamed to say."},{"id":4022,"es":"Cuando leo este libro, siempre encuentro algo nuevo.","en":"When I read this book, I always find something new in it."},{"id":4023,"es":"Como he dormido muy bien esta noche, me encuentro muy bien esta mañana.","en":"Having slept well last night, I feel very fine this morning."},{"id":4024,"es":"Cada vez que encuentro algo que me gusta, es demasiado caro.","en":"Whenever I find something I like, it's too expensive."},{"id":4025,"es":"Dejé mi paraguas aquí, pero ahora no lo encuentro.","en":"I left my umbrella here, but now I can't find it."},{"id":4026,"es":"Cada mañana, me encuentro con Mihaela en el metro.","en":"I meet Mihaela every morning at the subway."},{"id":4027,"es":"No encuentro a Tom. Él aún no se ha marchado, ¿no ?","en":"I can't find Tom. He hasn't already gone and left, has he?"},{"id":4028,"es":"No te veré hoy. De todas formas, te veré mañana.","en":"I won't see you today. I'll see you tomorrow, however."},{"id":4029,"es":"Con estos ojos, veré arder a las montañas.","en":"With these eyes, I shall see mountains burn."},{"id":4030,"es":"Espere un minuto, por favor. Veré si está adentro.","en":"Hold on a minute, please. I'll see if he is in."},{"id":4031,"es":"Buenas noches, Tatoeba. Te veré mañana.","en":"Good night, Tatoeba. See you tomorrow."},{"id":4032,"es":"Tu hermano se casó, ¿no ?","en":"Your brother got married, didn't he?"},{"id":4033,"es":"Usted se casó, ¿cierto ?","en":"You got married, didn't you?"},{"id":4034,"es":"Juan se casó con su amor del instituto, Maria.","en":"Tom married his high school crush Mary."},{"id":4035,"es":"Cuan udió francés.","en":"Before going to France, Mr. Suzuki studied French."},{"id":4111,"es":"Aunque no venga, tendremos que empezar.","en":"Even if he doesn't come, we'll have to begin."},{"id":4112,"es":"Más pronto o más tarde, tendremos que afrontar el problema seriamente.","en":"Sooner or later, we'll have to tackle the problem in earnest."},{"id":4113,"es":"Su oferta es muy tentadora, pero tendremos que pensárnoslo.","en":"Your offer is very attractive, but we will have to think about it."},{"id":4114,"es":"Algunas personas son buenas, algunas son malas.","en":"Some people are good, some people are bad."},{"id":4115,"es":"Por supuesto, para que una vieja alfombra tenga valor debe estar en buenas condiciones.","en":"Of course, to be valuable, an old carpet must be in good condition."},{"id":4116,"es":"A todo el mundo, buenas noches, buenas tardes, y buen día.","en":"To the whole world - good night, good day and good morning."},{"id":4117,"es":"Mientras las buenas personas no hagan nada, el mal triunfará.","en":"As long as good people do nothing, evil will triumph."},{"id":4118,"es":"Buenas noches, ¿cómo estás ?","en":"Good evening, how are you?"},{"id":4119,"es":"Buenas tardes. Tú eres nuestro nuevo vecino, si no me equivoco.","en":"Good afternoon. You are our new neighbor, if I'm not mistaken?"},{"id":4120,"es":"Buenas tardes, ¿cómo estás ?","en":"Good evening, how are you?"},{"id":4121,"es":"Buenas tardes, ¿cómo están ?","en":"Good evening, how are you?"},{"id":4122,"es":"Buenas noches, que duermas bien.","en":"Good night, sleep tight."},{"id":4123,"es":"Si él hubiera conocido los hechos, el accidente se podría haber evitado.","en":"Had he known the facts, the accident might have been avoided."},{"id":4124,"es":"Si no hubiera estado comiendo mientras conducía, no habría tenido un accidente.","en":"If he hadn't been eating while driving, he wouldn't have had an accident."},{"id":4125,"es":"Este accidente no tiene nada que ver conmigo, oficial.","en":"This accident e en contacto conmigo.","en":"If there's anything urgent, you can get in touch with me."},{"id":4141,"es":"Cuando uso lentes de contacto, se me secan los ojos y se ponen rojos.","en":"When I use contacts my eyes feel dry and become red."},{"id":4142,"es":"En caso de emergencia, póngase en contacto con mi agente.","en":"In case of an emergency, get in touch with my agent."},{"id":4143,"es":"En serio, mantente en contacto.","en":"Seriously, stay in touch."},{"id":4144,"es":"Él fue a París, que es la capital de Francia.","en":"He went to Paris, which is the capital of France."},{"id":4145,"es":"Mi tío vive en Madrid, la capital de España.","en":"My uncle lives in Madrid, the capital of Spain."},{"id":4146,"es":"Londres, la capital de Inglaterra, se ubica en el Támesis.","en":"London, the capital of England, is on the Thames."},{"id":4147,"es":"La capital de Ecuador es Quito, en la provincia montañosa de Pichincha","en":"The capital of Ecuador is Quito, in the mountainous province of Pichincha."},{"id":4148,"es":"Madrid, capital de España, es una ciudad maravillosa.","en":"Madrid, the capital of Spain, is a marvelous city."},{"id":4149,"es":"Mira con atención, o no verás a la madre de Jane.","en":"Look carefully, or you will miss Jane's mother."},{"id":4150,"es":"Si miras bien, verás que la caja tiene un fondo falso.","en":"If you look carefully, you'll see that the box has a false bottom."},{"id":4151,"es":"No importa a donde en Holanda vayas, verás molinos.","en":"No matter where you go in Holland, you'll see windmills."},{"id":4152,"es":"Por donde vayas en Holanda, verás molinos de viento.","en":"Go where you will in Holland, you will see windmills."},{"id":4153,"es":"No puedo hablar Inglés, y mucho menos alemán.","en":"I can't speak English, much less German."},{"id":4154,"es":"Él no sabe hablar inglés, mucho menos alemán.","en":"He cannot speak English, much less German."},{"id":4155,"es":"Él no sabe inglés, mucho menos alemán.","en":"He knows no English, not to mention German."},{"id":4156,"es":"¿Eres alemán, o no ?","en":"You're German, right?"},{"id":4157,"es":"Sí, él ya lo ha escrito.","en":"Yes, he has already written it."},{"id":4158,"es":"Como no me ha escrito, no sé a qué hora llegará.","en":"As she hasn't written to me, I don't know what time she will arrive."},{"id":4159,"es":"Por favor, perdóname por no haberte escrito en tanto tiempo.","en":"Please forgive me for not having written for a long time."},{"id":4160,"es":"El reporte era pobre, como si hubiera sido escrito en un apuro.","en":"As it had been written in haste, the report was poor."},{"id":4161,"es":"Perdóname por no haberte escrito antes, por favor.","en":"Please forgive me for not having written sooner."},{"id":4162,"es":"Juan compró un par de zapatos baratos, pero no le duraron mucho tiempo.","en":"Tom bought a pair of cheap shoes, but they didn't last very long."},{"id":4163,"es":"¿Estuviste alguna vez en Nueva York ? Si, estuve allí un par de veces.","en":"Have you ever been to New York? Yes, I've been there a couple of times."},{"id":4164,"es":"Mátenlos, porque el Señor reconoce quiénes son los suyos.","en":"Kill them, for the Lord knows those who are His."},{"id":4165,"es":"Maria cree que es la novia de Tom, pero para Tom, ella es solo una amiga.","en":"Mary thinks that she's Tom's boyfriend, but for Tom, she's just a friend."},{"id":4166,"es":"Ella le cree, diga lo que diga.","en":"She believes him, whatever he says."},{"id":4167,"es":"Si no me cree, vaya y véalo por sí mismo.","en":"If you don't believe me, go and see for yourself."},{"id":4168,"es":"Él es un realista, y no cree que los milagros sean posibles.","en":"He's a realist, and doesn't believe that miracles are possible."},{"id":4169,"es":"Albert, yo espero que tú estés conmigo en los problemas.","en":"Albert, I hope you'll stand by me if I get in trouble."},{"id":4170,"es":"Espero que no te moleste que lo mencione, pero sabes que te amo.","en":"I hope you don't mind my mentioning this, but you know that I love you."},{"id":4171,"es":"Espero que venga, porque el cubo de basura está lleno.","en":"I hope it'll come, because the trash can is full."},{"id":4172,"es":"No espero nada, no temo nada: soy libre.","en":"I hope for nothing, I fear for nothing, I am free."},{"id":4173,"es":"Si tuvieras cualquier problema, no dudes en venir conmigo.","en":"If you should have any trouble, don't hesitate to come to me."},{"id":4174,"es":"Si tuvieras una máquina del tiempo, ¿qué año visitarías ?","en":"If you had a time machine, which year would you visit?"},{"id":4175,"es":"Si tuvieras un millón de dólares, ¿qué harías ?","en":"If you had a million dollars, what would you do?"},{"id":4176,"es":"Supón que tuvieras un millón de yenes, ¿qué harías con ellos ?","en":"Supposing you had one million yen, what would you do with it?"},{"id":4177,"es":"Supón que tuvieras mil dólares, ¿qué harías con ellos ?","en":"Suppose you had a thousand dollars, what would you do with it?"},{"id":4178,"es":"Supón que tuvieras diez millones de yenes, ¿qué harías ?","en":"Suppose you had ten million yen, what would you do?"},{"id":4179,"es":"Por favor, devuelve el libro cuando hayas terminado de leerlo.","en":"Please return the book when you have finished reading it."},{"id":4180,"es":"Una vez que hayas hecho una promesa, debes mantenerla.","en":"Once you have made a promise, you should keep it."},{"id":4181,"es":"Querido, ¿irás a hacer las compras por mí ?","en":"Honey, will you go shopping for me?"},{"id":4182,"es":"¿Si él hubiera estado allí, habrías querido venir ?","en":"Had he been there, would you have wanted to come?"},{"id":4183,"es":"Siempre he querido ver un dragón, pero los dragones no son criaturas reales.","en":"I have always wanted to see a dragon, but dragons are not real creatures."},{"id":4184,"es":"Él es un gran entrenador, querido por todos sus jugadores.","en":"He's a great coach and is loved by all his players."},{"id":4185,"es":"Mi querido amigo: no importa adonde v uro.","en":"As he is a married man, he has to think of the future."},{"id":4200,"es":"Tal vez un día las máquinas puedan pensar, pero nunca podrán reír.","en":"Machines may one day think, but they'll never laugh."},{"id":4201,"es":"Estabas nada más que escuchando la charla, sin pensar.","en":"You were just listening to the talk, without thinking."},{"id":4202,"es":"Juan quería irse, pero Maria quería quedarse un poco más.","en":"Tom wanted to leave, but Mary wanted to stay a little longer."},{"id":4203,"es":"Tatoeba está enferma ahora, debería quedarse en la cama.","en":"Tatoeba is sick right now. She should stay in bed."},{"id":4204,"es":"Cuando Shishir sale a traducir, es mejor quedarse adentro.","en":"When the Shishir comes out to translate, it's best to remain indoors."},{"id":4205,"es":"Si alguna vez decides vender tu antigua colección de grabaciones, ¡quiero prioridad sobre el resto !","en":"If you ever decide to sell your old record collection, I want first dibs!"},{"id":4206,"es":"Me gustaría tres veintes, seis cincos, y el resto en unos.","en":"I'd like three twenties, six fives, and the rest in ones."},{"id":4207,"es":"Esta flor es amarilla, pero el resto son azules.","en":"This flower is yellow, but all the others are blue."},{"id":4208,"es":"Sea cual sea la autopista por la que te decidas, va a estar abarrotada de autos y camiones.","en":"Whichever highway you decide on, it will be crowded with cars and trucks."},{"id":4209,"es":"En el desierto, los camellos son más importantes que los autos para transportarse.","en":"In the desert, camels are more important than cars for transportation."},{"id":4210,"es":"Si el número de autos incrementa, también lo hará el tráfico.","en":"If the number of cars increases, so will the traffic."},{"id":4211,"es":"Había autos en llamas, murieron personas, y nadie pudo ayudarlos.","en":"There were cars burning, people dying, and nobody could help them."},{"id":4212,"es":"El valor de un hombre reside en lo que es, no en lo que tiene.","en":"A man's worth lies in what he is, not in what he has."},{"id":4213,"es":"No importa cómo lo hagas, los resultados serán los mismos.","en":"No matter how you do it, the results will be the same."},{"id":4214,"es":"Puedes tener resultados mediocres ahora, o estupendos resultados después.","en":"You can have mediocre results now, or outstanding results later."},{"id":4215,"es":"Ayer, Juan no tenía nada para comer.","en":"Tom had nothing to eat yesterday."},{"id":4216,"es":"Ella no fue a comprar ayer, ¿verdad ?","en":"She didn't go shopping yesterday, did she?"},{"id":4217,"es":"Hoy, ella está mucho mejor que ayer.","en":"She's much better today than yesterday."},{"id":4218,"es":"Primero, no tengo nada de dinero. Segundo, no tengo tiempo.","en":"First, I don't have any money. Second, I don't have the time."},{"id":4219,"es":"El Amazonas es el segundo río más largo del mundo, después del Nilo.","en":"The Amazon is the second longest river in the world, next to the Nile."},{"id":4220,"es":"Primero, estoy ocupado; segundo, no me interesa.","en":"For one thing, I'm busy; for another, I'm not interested."},{"id":4221,"es":"¡Espérame, espera un segundo !","en":"Wait for me, wait a second!"},{"id":4222,"es":"El segundo plato lleva garbanzos, pollo, carne, chorizo y patatas.","en":"The second course has chickpeas, chicken, meat, sausage and potato."},{"id":4223,"es":"Por cierto, ¿estás libre esta tarde ?","en":"By the way, are you free this afternoon?"},{"id":4224,"es":"Yo estoy libre todo el día, llegaré a verte a cualquier hora que te acomode.","en":"I am free all day, I'll come and see you at any time that suits you."},{"id":4225,"es":"De haber estado libre, se habría ido de pesca.","en":"If he had been free, he would have gone fishing."},{"id":4226,"es":"No vengas tarde, ¿de acuerdo ?","en":"Don't come late, okay?"},{"id":4227,"es":"Tom, quiero que vengas conmigo.","en":"Tom, I want you to come with me."},{"id":4228,"es":"Para decirlo francamente, no quiero ación amena.","en":"When meeting a person for the first time, keep the conversation light."},{"id":4302,"es":"Si prometes algo, mantén tu palabra.","en":"If you promise something, keep your word."},{"id":4303,"es":"Estuve bien, ¿no ?","en":"I was good, wasn't I?"},{"id":4304,"es":"Recientemente, estuve pensando en lo que quiero hacer con mi vida.","en":"Recently, I've been thinking about what I want to do with my life."},{"id":4305,"es":"Estuve toda la semana solo, y anhelaba una conversación.","en":"I spent the whole week alone, and I longed for conversation."},{"id":4306,"es":"¡No me des las gracias a mí, dale las gracias a Juan !","en":"Don't thank me, thank Tom!"},{"id":4307,"es":"¡No se lo des a él, dámelo a mí !","en":"Don't give it to him. Give it to me."},{"id":4308,"es":"Antes de que te des cuenta, saldrás en los periódicos.","en":"Next thing you know, you'll be in the papers."},{"id":4309,"es":"No te des por vencido, y aprobarás el examen.","en":"Stick at it, and you'll pass the exam."},{"id":4310,"es":"Hace buen día, ¿no ? ¿Por qué no damos un paseo ?","en":"It's a nice day, isn't it? Why not go out for a walk?"},{"id":4311,"es":"Mientras más aprendemos, más nos damos cuenta de nuestra ignorancia.","en":"The more we learn, the better we realize our ignorance."},{"id":4312,"es":"Si nos damos prisa, lo lograremos.","en":"If we hurry, we'll make it."},{"id":4313,"es":"Si es necesario, vendré mañana a las nueve.","en":"If necessary, I'll come at nine tomorrow."},{"id":4314,"es":"No, favor de marcar nueve primero.","en":"No, please dial nine first."},{"id":4315,"es":"Salgo de la casa a las ocho y cuarto, y llego al colegio a las nueve menos cuarto.","en":"I leave the house at 8.15 and arrive at school at 8.45."},{"id":4316,"es":"En Italia, en el verano no oscurece hasta cerca de las nueve en punto.","en":"In Italy, during summer, it doesn't get dark until about nine o'clock."},{"id":4317,"es":"Tom, hay algo que quiero darte.","en":"Tom, there's something I wan  el cristianismo, el islam y el judaísmo.","en":"The three big monotheistic religions are Christianity, Islam and Judaism."},{"id":4421,"es":"Los buenos artistas copian, los grandes artistas roban.","en":"Good artists copy, great artists steal."},{"id":4422,"es":"¡Me asustan las grandes, negras y peludas tarántulas !","en":"I'm scared of big, black, hairy tarantulas!"},{"id":4423,"es":"Por favor, cuéntame de tu problema.","en":"Please tell me about your problem."},{"id":4424,"es":"Por favor cuéntame lo que ocurrió, extraoficialmente por supuesto.","en":"Please tell me what happened, off the record of course."},{"id":4425,"es":"¿Puedes pasarme el periódico, por favor ?","en":"Can you please pass me the newspaper?"},{"id":4426,"es":"¿Podrías pasarme la pimienta, por favor ?","en":"Could you pass me the pepper, please?"},{"id":4427,"es":"Disculpe, ¿podría pasarme la sal y la pimienta ?","en":"Excuse me, could you pass me the salt and pepper?"},{"id":4428,"es":"Juan quería ayudar a Maria a rastrillar las hojas, pero ella estaba usando el único rastrillo.","en":"Tom wanted to help Mary rake the leaves, but she was using the only rake."},{"id":4429,"es":"En otoño, las hojas caen de los árboles.","en":"In autumn, leaves fall from trees."},{"id":4430,"es":"El frío viento del norte, volvió las hojas marrones.","en":"The cold north wind turned the leaves brown."},{"id":4431,"es":"El fuerte, violento viento azotó para tirar las hojas de los árboles.","en":"The strong, gusty wind strived to strip the leaves off the trees."},{"id":4432,"es":"En invierno, las hojas secas vuelan por el aire.","en":"In winter, the dry leaves fly around in the air."},{"id":4433,"es":"¿Los gatos comen murciélagos, o los murciélagos comen gatos ?","en":"Do cats eat bats or do bats eat cats?"},{"id":4434,"es":"Algunos animales, como los leones, comen carne.","en":"Some animals, such as lions, eat meat."},{"id":4435,"es":"Por lo general, los occidentales no comen pescado crudo.","en":"Generally speaking, Westerners don't eat fish raw."},{"id":4436,"es":"Cuando lo escuchó, lo único que hizo fue llorar.","en":"When she heard it, she just cried."},{"id":4437,"es":"Intenté animarla, pero lo único que ella quería era estar sola.","en":"I tried to cheer her up, but all she wanted was to be alone."},{"id":4438,"es":"¿Tienes algún hermano ? No, soy hijo único.","en":"Do you have any siblings? No, I'm an only child."},{"id":4439,"es":"Escucha, forastero. La guerra es el único intercambio que ofrecemos.","en":"Listen, foreigner. War is all the trade we offer."},{"id":4440,"es":"De ser posible, me gustaría que participaras en la próxima reunión.","en":"If it's at all possible, I'd like you to take part in the next meeting."},{"id":4441,"es":"La próxima vez que hagas eso, estás despedido.","en":"The next time you do that, you're fired."},{"id":4442,"es":"El examen se llevará a cabo este mismo día, la próxima semana, dijo el profesor.","en":"The examination will be held this day next week, said the teacher."},{"id":4443,"es":"La próxima vez, deberías usar algo más apropiado.","en":"Next time, you should wear something more appropriate."},{"id":4444,"es":"Si yo fuera tú, me quedaría callado.","en":"If I were you, I would stay quiet."},{"id":4445,"es":"Si yo fuera vos, me quedaría callado.","en":"If I were you, I would stay quiet."},{"id":4446,"es":"En cuanto oyó el timbre, contestó el teléfono.","en":"As soon as she heard the bell ring, she answered the telephone."},{"id":4447,"es":"Esperé la respuesta, pero nadie contestó.","en":"I waited for the answer but nobody answered."},{"id":4448,"es":"Ya estoy casada, contestó Maria.","en":"I’m already married, replied Mary."},{"id":4449,"es":"Él solía amarme, contestó ella tristemente.","en":"He used to love me, she answered sadly."},{"id":4450,"es":"Mientras más viejo me hago, con más claridad recuerdo cosas que nunca pasaron.","en":"The older I get, the more clearly I remember things that never happened."},{"id":4451,"es":"Yo cocino o to school, I will not talk to him anymore."},{"id":4515,"es":"Si no va al colegio, no le hablaré más.","en":"If he doesn't go to school, I will not talk to him anymore."},{"id":4516,"es":"Cuando tenía tu edad, yo iba y volvía al colegio en bicicleta todos los días.","en":"When I was your age, I bicycled to and from school every day."},{"id":4517,"es":"Cuando abrí la puerta, Juan estaba parado ahí en un traje.","en":"When I opened the door, Tom was standing there wearing a suit."},{"id":4518,"es":"Cuando abrí la puerta, vi que ella estaba durmiendo.","en":"When I opened the door, I saw that she was sleeping."},{"id":4519,"es":"Cuando abrí la puerta del frigorífico, se cayó una manzana.","en":"When I opened the door of the refrigerator, an apple fell out."},{"id":4520,"es":"Abrí la caja, estaba vacía.","en":"I opened the box — it was empty."},{"id":4521,"es":"Cuando abrí las cortinas, estaba nevando.","en":"When I opened the curtains, it was snowing."},{"id":4522,"es":"Bueno, chicas, ya es hora de que nos vayamos.","en":"Well, girls, it's time to go."},{"id":4523,"es":"Él es muy generoso, así que vayamos con él.","en":"He's very generous, so let's go with him."},{"id":4524,"es":"Como hoy día tengo el día libre, vayamos a la costa.","en":"Since I'm off duty today, let's go to the coast."},{"id":4525,"es":"Él es generoso, así que vayamos con él.","en":"He's generous, so let's go with him."},{"id":4526,"es":"Si no puedo majenar una moto, mucho menos podría manejar un carro.","en":"I cannot drive a motorcycle, much less a car."},{"id":4527,"es":"Si no puedo manejar una moto, menos puedo manejar un carro.","en":"I cannot drive a motorcycle, much less a car."},{"id":4528,"es":"Súbete al coche, nena. Vamos a manejar a Madagascar.","en":"Get in the car, babe. We're driving to Madagascar."},{"id":4529,"es":"No hay nada como los viejos tiempos, cuando tú y yo éramos jóvenes.","en":"There is no time like the time when you and I were young."},{"id":4530,"es":"Los tiempos cambian, y nosotros con ellos.","en":"Times change, and we change in them."},{"id":4531,"es":"Cuando estás cansado, no hay nada como darse un baño.","en":"When you feel tired, there is nothing like taking a bath."},{"id":4532,"es":"Él puede darse el lujo de comprar una casa, ni hablar de un coche.","en":"He can afford to buy a house, to say nothing of a car."},{"id":4533,"es":"Después de darse un baño, Juan cenó.","en":"After taking a bath, Tom ate dinner."},{"id":4534,"es":"Por desgracia, el pleno empleo ya no puede darse por sentado.","en":"Unfortunately, full employment can no longer be taken for granted."},{"id":4535,"es":"He aparcado en doble fila, ¿podría darse prisa ?","en":"I'm double-parked. Could you hurry it up?"},{"id":4536,"es":"¿Si hubiera un tifón mañana, yo no tendría que ir a trabajar ?","en":"If there's a typhoon tomorrow, does that mean I don't need to go to work?"},{"id":4537,"es":"Si él no viera tanta televisión, tendría más tiempo para los estudios.","en":"If he did not watch so much television, he would have more time for study."},{"id":4538,"es":"Si fuera tú, tendría éxito.","en":"If I were you I'd be able to succeed."},{"id":4539,"es":"Sin Tom, Maria no tendría nadie a quien acudir.","en":"Without Tom, Mary would have no one to turn to."},{"id":4540,"es":"Pase lo que pase, tienes que mantener la calma.","en":"Whatever happens, you must keep calm."},{"id":4541,"es":"Con el TV encendido, ¿cómo puedes mantener la mente en tus estudios ?","en":"With the T.V. on, how can you keep your mind on your studies?"},{"id":4542,"es":"Por favor, no escriba en este libro de la biblioteca.","en":"Please do not write in this library book."},{"id":4543,"es":"Sí, la conocí en la biblioteca ayer.","en":"Yes, I met her in the library yesterday."},{"id":4544,"es":"Él es, por así decirlo, un ratón de biblioteca.","en":"He is, so to speak, a bookworm."},{"id":4545,"es":"Mi hermano pide prestado un libro nuevo de la biblioteca, todos los días.","en":"Every day, my brother ike rain, don't you?"},{"id":4561,"es":"Con esta lluvia, él no vendrá.","en":"He won't come in a rain like this."},{"id":4562,"es":"Te enseñaré a programar, pero no hoy.","en":"I will teach you to program, but not today."},{"id":4563,"es":"Sígueme, y yo te enseñaré el camino.","en":"Follow me and I will show you the way."},{"id":4564,"es":"Si así lo deseas, te enseñaré a jugar ajedrez.","en":"If you like, I will teach you to play chess."},{"id":4565,"es":"Sígueme, y te enseñaré el camino.","en":"Follow me and I will show you the way."},{"id":4566,"es":"En general, los jóvenes de hoy no están interesados en la política.","en":"In general, young people today are not interested in politics."},{"id":4567,"es":"En general, a los jóvenes no les gusta la formalidad.","en":"In general, young people dislike formality."},{"id":4568,"es":"Los jóvenes conocen las reglas, pero los viejos conocen las excepciones.","en":"The young man knows the rules, but the old man knows the exceptions."},{"id":4569,"es":"Después de abrazar a Tom, María cogió su maleta y se fue.","en":"After hugging Tom, Mary picked up her suitcase and left."},{"id":4570,"es":"Juan cogió la botella, pero tuvo problemas para abrirla.","en":"Tom picked up the bottle, but had trouble opening it."},{"id":4571,"es":"Por error, cogió el sombrero equivocado.","en":"He picked up the wrong hat by mistake."},{"id":4572,"es":"Ella le gritó, pero él no la oyó.","en":"She shouted to him, but he didn't hear her."},{"id":4573,"es":"Ella gritó pidiendo ayuda, pero no vino nadie.","en":"She shouted for help, but no one came."},{"id":4574,"es":"Ella gritó pidiendo auxilio, pero nadie le oyó.","en":"She cried for help, but nobody heard her."},{"id":4575,"es":"Por desgracia, no tendré mucho tiempo libre.","en":"Unfortunately I will not have much free time."},{"id":4576,"es":"Mataste a mi padre, y hoy tendré mi venganza.","en":"You killed my father, and today I'll have my vengeance."},{"id":4577,"es":"Me temo que tendré que enseñart ilo of tuna fish fillets please?"},{"id":4609,"es":"El presidente quiere la paz, ¿verdad ?","en":"The President desires peace, doesn't he?"},{"id":4610,"es":"Sí, hablé con el presidente de la empresa.","en":"Yes, I spoke with the company president."},{"id":4611,"es":"El presidente Kennedy fue asesinado, pero su leyenda perdurará para siempre.","en":"President Kennedy was killed, but his legend will live on forever."},{"id":4612,"es":"Si pudieras volver en el tiempo, ¿qué cambiarías ?","en":"If you could go back in time, what would you change?"},{"id":4613,"es":"Si me pudieras prestar dinero, estaría agradecido.","en":"If you could loan me some money, I'd be grateful."},{"id":4614,"es":"Si tan solo pudieras hablar inglés, serías perfecto.","en":"If you could only speak English, you would be perfect."},{"id":4615,"es":"Si no fuese por el agua, los humanos no podrían sobrevivir.","en":"If it were not for water, humans could not survive."},{"id":4616,"es":"Desde que me casé, he dejado de trabajar.","en":"Since I got married, I've quit working."},{"id":4617,"es":"Debido a la falta de evidencias claras, el prisionero fue dejado en libertad.","en":"In the absence of firm evidence the prisoner was set free."},{"id":4618,"es":"Nosotros tenemos las mismas intenciones, pero no el mismo modo de actuar.","en":"We have the same intentions, but not the same modus operandi."},{"id":4619,"es":"Como estaba lloviendo, nos quedamos en casa.","en":"Since it was raining, we stayed at home."},{"id":4620,"es":"Nos quedamos atrasados en un embotellamiento, por eso nos tenemos que apurar.","en":"We've been delayed by a traffic jam, so we'll need to hurry."},{"id":4621,"es":"Si nos quedamos aquí, seremos una presa fácil.","en":"If we stay here, we'll be sitting ducks."},{"id":4622,"es":"Nos quedamos atrapados en un atasco, lo que hizo que llegáramos veinte minutos tarde.","en":"We got stuck in a traffic jam, which made us twenty minutes late."},{"id":4623,"es":"Incluso si tiene problemas, Mac y worried about his daughter's health."},{"id":4638,"es":"Juan sabía que la ensalada es buena para la salud, así que comía al menos una al día.","en":"Tom knew that salads were healthy, so he ate at least one salad a day."},{"id":4639,"es":"En mi opinión, el alcohol no es necesariamente malo para tu salud.","en":"In my opinion, alcohol is not necessarily bad for your health."},{"id":4640,"es":"Dejando esto de lado, él tenía una buena salud.","en":"Aside from this, he was in good health."},{"id":4641,"es":"Mi hermana menor tiene dos hijos, lo que significa que yo tengo dos sobrinos.","en":"My younger sister has two sons, which means I have two nephews."},{"id":4642,"es":"Si no sabes qué significa una palabra, búscala en un diccionario.","en":"If you don't know the meaning of a word, look it up in a dictionary."},{"id":4643,"es":"No se qué significa esa palabra, pero trataré de averiguarlo.","en":"I don't know what that word means, but I'll try to find out."},{"id":4644,"es":"Todos los pasajeros murieron, pero él sobrevivió.","en":"All the passengers died, but he survived."},{"id":4645,"es":"Infortunadamente, pocos pasajeros sobrevivieron a la catástrofe.","en":"Unfortunately, few passengers survived the catastrophe."},{"id":4646,"es":"Ella prometió casarse con él, pero no lo hizo.","en":"She promised to marry him, but she didn't."},{"id":4647,"es":"Prometió que vendría, pero no vino.","en":"He promised to come, and didn't."},{"id":4648,"es":"Juan prometió venir, pero aún no ha aparecido.","en":"Tom promised to come, but hasn't showed up yet."},{"id":4649,"es":"Él fue a París, donde la conoció.","en":"He went to Paris, where he first met her."},{"id":4650,"es":"Por mucho que lo intente, él no tendrá éxito.","en":"However hard he may try, he won't succeed."},{"id":4651,"es":"El nuevo puente tendrá 1,5 km de largo.","en":"The new bridge will be as long as 1.5 km."},{"id":4652,"es":"Me llamaron a la oficina primero, estando mi nombre a la cabeza de la lista.","en":"I was de cumpleaños.","en":"Please put some candles on the birthday cake."},{"id":5027,"es":"Corta la tarta con un cuchillo, por favor.","en":"Please cut the cake with a knife."},{"id":5028,"es":"La felicidad de un hombre no depende de lo que tiene, sino de lo que es.","en":"A man's happiness doesn't depend on what he has, but on what he is."},{"id":5029,"es":"Ahora que eres mayor, decidir qué hacer depende de ti.","en":"Now that you are grown-up, it is up to you to decide what to do."},{"id":5030,"es":"Es posible que vaya allí, pero depende de las circunstancias.","en":"I may go there, but that depends."},{"id":5031,"es":"Todo depende de vuestra relación, que es sincera.","en":"It all depends on your true relationship."},{"id":5032,"es":"Juan parece estar muy enfadado, ¿verdad ?","en":"Tom seems very angry, doesn't he?"},{"id":5033,"es":"No te preocupes, no estoy enfadado contigo.","en":"Don't worry. I am not mad at you."},{"id":5034,"es":"Lejos de estar contento, mi padre está muy enfadado.","en":"Far from being pleased, my father is very angry."},{"id":5035,"es":"Él estaba enfadado, pero me escuchó con paciencia.","en":"He was angry, but he listened to me patiently."},{"id":5036,"es":"No, no estoy enfadado contigo, sólo estoy decepcionado.","en":"No, I'm not mad at you, I'm just disappointed."},{"id":5037,"es":"Si un día te vas, me pondré muy triste.","en":"If one day you leave, I will be very sad."},{"id":5038,"es":"Es triste no ser amado, pero es mucho más triste no ser capaz de amar.","en":"It is sad not to be loved, but it is much sadder not to be able to love."},{"id":5039,"es":"Estaba triste, pero Juan me animó.","en":"I was sad, but Tom cheered me up."},{"id":5040,"es":"Triste como estaba, le dijo adiós con una sonrisa.","en":"Sad as she was, she said good-bye to him with a smile."},{"id":5041,"es":"Fue un año seco, y muchos animales murieron de hambre.","en":"It was a dry year, and many animals starved."},{"id":5042,"es":"Por desgracia, murieron muchos japoneses.","en":"Sadly, many Japanese people died."},{"id":5043,"es":"Cuento con usted, no se vaya a echar atrás.","en":"I'm counting on you not to back out."},{"id":5044,"es":"Por favor, coloca este libro encima del todo.","en":"Please put this book on the very top."},{"id":5045,"es":"Coloque las cajas una encima de la otra, por favor.","en":"Place the boxes one above the other, please."},{"id":5046,"es":"Si no cumples con tu deber, la gente te mirará por encima del hombro.","en":"If you don't do your duty, people will look down on you."},{"id":5047,"es":"Lamentablemente, me estoy muriendo por encima de mis posibilidades.","en":"Alas, I am dying beyond my means."},{"id":5048,"es":"Al ser cogido por sorpresa, no se me ocurrió nada que decir.","en":"Taken by surprise, I couldn't think of anything to say."},{"id":5049,"es":"La fiesta sorpresa para Laura no es esta noche, sino mañana por la noche.","en":"The surprise party for Laura is not tonight, but tomorrow night."},{"id":5050,"es":"Date prisa, o si no, perdemos el tren.","en":"Hurry up, or we'll miss the train."},{"id":5051,"es":"Tenemos que jugar limpio, tanto si ganamos como si perdemos.","en":"We have to play fair, whether we win or lose."},{"id":5052,"es":"Lo siento, no tienes permiso para hacerlo.","en":"I'm sorry, you are not allowed to."},{"id":5053,"es":"Muéstreme su permiso de conducción, por favor.","en":"Could I see your driver's license?"},{"id":5054,"es":"Permiso, tengo que bajarme en la siguiente parada.","en":"Excuse me, I have to get off at the next stop."},{"id":5055,"es":"Si hubiera cogido ese avión, ahora estaría muerto.","en":"If I had taken that plane, I would be dead now."},{"id":5056,"es":"Si hubiéramos cogido ese avión, ahora estaríamos muertas.","en":"If we'd taken that plane, we'd be dead now."},{"id":5057,"es":"Has cogido peso, ¿verdad ?","en":"You've put on weight, haven't you?"},{"id":5058,"es":"Después de recibir un fuerte impacto en la cabeza, el hombre solo decía incoherencias.","en":"After receiving a hefty blow to the head, the man spoke only gibberish."},{"id":5059,"es":"Mientras yo hablaba, él no decía nada.","en":"While I was speaking, he said nothing."},{"id":5060,"es":"Mi abuela siempre decía, no respires y bebas al mismo tiempo.","en":"My grandmother always said, Don’t breathe and drink at the same time."},{"id":5061,"es":"Había un cartel que decía, Prohibido pisar el césped.","en":"There was a sign saying, Keep off the grass."},{"id":5062,"es":"Antiguamente, la misa se decía en latín.","en":"The mass used to be said in Latin."},{"id":5063,"es":"La invitación decía regalos no, por favor.","en":"The invitation said, No gifts, please."},{"id":5064,"es":"Por favor, despiértame mañana por la mañana a las 6.","en":"Please wake me up at 6 tomorrow morning."},{"id":5065,"es":"Éstas son las gafas de Tom, no las mías.","en":"These are Tom's glasses, not mine."},{"id":5066,"es":"Si me compras un helado, te doy un beso.","en":"If you buy me an ice cream, I'll kiss you."},{"id":5067,"es":"Solo soy un estudiante, nada más.","en":"I'm only a student, that and nothing more."},{"id":5068,"es":"Soy profesor, no soy estudiante.","en":"I am a teacher, not a student."},{"id":5069,"es":"Si eres un estudiante, actúa como tal.","en":"If you are a student, behave as such."},{"id":5070,"es":"No, no soy maestro. Soy solo un estudiante.","en":"No, I'm not a teacher. I'm only a student."},{"id":5071,"es":"Por favor, llena este balde con agua.","en":"Please fill this bucket with water."},{"id":5072,"es":"Escribí la composición apurado, así que debe de estar llena de errores.","en":"I wrote the composition in haste, so it must be full of mistakes."},{"id":5073,"es":"Escribí la composición con apuro, por lo que debe estar llena de errores.","en":"I wrote the composition in haste, so it must be full of mistakes."},{"id":5074,"es":"El Ruiseñor Samurai, una historia de samurais llena de humanidad y humor.","en":"The Nightingale Samurai A samurai tale full of humanity and humour."},{"id":5075,"es":"Ahora no se necesitan palabras, sino acción.","en":"Not words but action is needed now."},{"id":5076,"es":"Las mujeres necesitan ser amadas, no comprendidas.","en":"Women are meant to be loved, not to be understood."},{"id":5077,"es":"La vida es dura, pero yo soy más dura.","en":"Life is hard, but I am harder."},{"id":5078,"es":"A fin de cuentas, nada dura para siempre.","en":"After all, nothing remains forever."},{"id":5079,"es":"La pintura estaba un poco dura, así que tuve que revolverla.","en":"The paint was a little hard, so it had to be stirred."},{"id":5080,"es":"Nuestra profesora es muy dura de cabeza, ¿o no ?","en":"Our teacher is really stubborn, or not?"},{"id":5081,"es":"Cuanto más alto suban, más dura será la caída.","en":"The bigger they come, the harder they fall."},{"id":5082,"es":"Si la pintamos de blanco, la habitación se volverá más luminosa.","en":"White paint will brighten the room."},{"id":5083,"es":"¿Es usted chino, señor ?","en":"Are you Chinese, sir?"},{"id":5084,"es":"Por favor, responda en chino o en inglés.","en":"Please reply in Chinese or English."},{"id":5085,"es":"Puedo hablar chino, pero no puedo leerlo.","en":"I can speak Chinese, but I cannot read it."},{"id":5086,"es":"Estudié inglés, francés y chino.","en":"I studied English, French and Chinese."},{"id":5087,"es":"Ella puede hablar chino, pero no Mandarín.","en":"She can speak Chinese, but she can't speak Mandarin."},{"id":5088,"es":"Sé hablar chino, pero no leerlo.","en":"I can speak Chinese, but I cannot read it."},{"id":5089,"es":"Ven, come las frutas en la cocina.","en":"Come, eat the fruits in the kitchen."},{"id":5090,"es":"Ellos venden frutas, pan, tortas y muchas otras cosas.","en":"They sell fruit, bread, cakes, and many other things."},{"id":5091,"es":"En Gran Bretaña, es tradición comer tartaletas de frutas en la época navideña.","en":"In Britain, mince pies are traditionally eaten at Christmas time."},{"id":5092,"es":"Para merendar, ella come frutas o nueces.","en":"For snacks, she eats fruit or nuts."},{"id":5093,"es":"Sí, yo tengo una hija.","en":"Yes, I have a daughter."},{"id":5094,"es":"Tal madre, tal hija.","en":"Like mother, like daughter."},{"id":5095,"es":"Amo a ambos, a mi hija y a mi hijo.","en":"I love both my daughter and my son."},{"id":5096,"es":"Por favor, ayude a mi hija.","en":"Please, help my daughter."},{"id":5097,"es":"La madre tan solo abrazó firmemente a su hija, sin decir nada más.","en":"The mother just held tightly onto her daughter, saying nothing else."},{"id":5098,"es":"Si yo muero, encárgate de la educación de mi hija.","en":"I'll leave my daughter's education to you, after I'm gone."},{"id":5099,"es":"Por favor, perdóname por no contestar tu carta.","en":"Please forgive me for not answering your letter."},{"id":5100,"es":"Por favor, perdóname por decir una mentira.","en":"Please forgive me for telling a lie."},{"id":5101,"es":"Todavía no ha parado de llover, ¿verdad ?","en":"The rain hasn't stopped yet, has it?"},{"id":5102,"es":"Actualmente, Juan está parado.","en":"Tom is currently unemployed."},{"id":5103,"es":"Juan se quedó parado inmóvil, escuchando cuidadosamente.","en":"Tom stood motionless, listening carefully."},{"id":5104,"es":"El sushi está bien, pero la comida tailandesa es aún mejor.","en":"Sushi is good, but Thai dishes are better."},{"id":5105,"es":"El sushi es bueno, pero los platos tailandeses son mejores.","en":"Sushi is good, but Thai dishes are better."},{"id":5106,"es":"¿Cuál te gusta más, sushi o tempura ?","en":"What do you like more, sushi or tempura?"},{"id":5107,"es":"Tú comiste sushi ayer, ¿cierto ?","en":"You ate sushi yesterday, didn't you?"},{"id":5108,"es":"No habléis de trabajo, estamos de vacaciones.","en":"Don't talk about work. We're on vacation."},{"id":5109,"es":"Me fui de vacaciones, y mis plantas siguen vivas.","en":"I went on vacation, and my plants are still alive."},{"id":5110,"es":"En cuanto a mí, no confío para nada en él.","en":"As for me, I don't trust him at all."},{"id":5111,"es":"Por favor, escríbame una carta en cuanto llegue.","en":"Please send me a letter as soon as you arrive."},{"id":5112,"es":"Cuando llegue la primavera, voy a empezar a practicar un nuevo deporte.","en":"When spring arrives, I'm going to take up a new sport."},{"id":5113,"es":"Tan pronto como llegue ella, comenzaremos.","en":"As soon as she comes, we will begin."},{"id":5114,"es":"Cuando llegue la primavera, voy a practicar un nuevo deporte.","en":"When spring arrives, I am going to take up a new sport."},{"id":5115,"es":"Cuando ella llegue, háblale.","en":"When she arrives, talk to her."},{"id":5116,"es":"Apenas llegue, avíseme.","en":"Let me know as soon as he comes."},{"id":5117,"es":"Al día siguiente, todos teníamos una resaca tremenda.","en":"On the following day, we all had terrible hangovers."},{"id":5118,"es":"Él también se irá, ¿verdad ?","en":"He'll go, too, won't he?"},{"id":5119,"es":"Vamos, todo irá bien.","en":"Come on, everything will be alright."},{"id":5120,"es":"Los manzanos se hicieron viejos, y se plantaron nuevos.","en":"The apple trees grew old and new ones were planted."},{"id":5121,"es":"Todavía soy el novio de María, creo...","en":"I'm still Mary's boyfriend, I think."},{"id":5122,"es":"A veces, mi novio flirtea con otras chicas.","en":"My boyfriend sometimes flirts with other girls."},{"id":5123,"es":"Mientras ella distraía a Tom, su novio le robó la billetera.","en":"While she distracted Tom, her boyfriend stole his wallet."},{"id":5124,"es":"A Beth, su flojo novio le pidió hacer su tarea de historia.","en":"Beth was asked by her lazy boyfriend to do his history homework."},{"id":5125,"es":"Yo dudo de todo, incluso de mis propias dudas.","en":"I doubt everything, even my own doubts."},{"id":5126,"es":"Si no tenemos cuidado, el tigre pronto seguirá el camino del dodo.","en":"If we're not careful, the tiger will soon go the way of the dodo."},{"id":5127,"es":"¿Qué es más fuerte, un tigre o un león ?","en":"Which is stronger, a tiger or a lion?"},{"id":5128,"es":"Podés decirle a un gato tigre chico, tanto como a un tigre gato grande.","en":"You may as well call a cat a small tiger as call a tiger a big cat."},{"id":5129,"es":"¿Si un tigre se saliera de la jaula, qué harías ?","en":"If a tiger should come out of the cage, what would you do?"},{"id":5130,"es":"Tú quieres respuestas, ¿verdad ?","en":"You want answers, don't you?"},{"id":5131,"es":"Si no te sabes las respuestas, adivina.","en":"If you don't know the answers, guess."},{"id":5132,"es":"A veces, las preguntas nos proporcionan más información que las respuestas.","en":"Sometimes, questions provide us with more information than answers."},{"id":5133,"es":"Él hizo trampa en el examen, copiando las respuestas de su amigo.","en":"He cheated on the test by copying his friend's answers."},{"id":5134,"es":"Por favor, revise sus respuestas.","en":"Please check your answers."},{"id":5135,"es":"Si no conoces las respuestas, adivina.","en":"If you don't know the answers, guess."},{"id":5136,"es":"No hay preguntas estúpidas, sólo respuestas estúpidas.","en":"There are no stupid questions, only stupid answers."},{"id":5137,"es":"Siendo cuestionado por sus políticas, el candidato solo dio respuestas vagas.","en":"Questioned about his policies, the candidate gave only vague answers."},{"id":5138,"es":"Ella le pidió que se quedase, pero él tenía que irse a trabajar.","en":"She asked him to stay, but he had to go to work."},{"id":5139,"es":"Venid, niños, es hora de irse a dormir.","en":"Come on, children, it's time for bed."},{"id":5140,"es":"Me levanté a las seis, tomé desayuno y luego fui al colegio.","en":"I got up at six, ate breakfast and then went to school."},{"id":5141,"es":"En cuanto tomé asiento, caí dormido.","en":"As soon as I sat down, I fell asleep."},{"id":5142,"es":"Estaba planeando llamarle, pero cambié de parecer y no lo hice.","en":"I was planning to call him, but changed my mind and didn't."},{"id":5143,"es":"Intentaba llamarle a ella, pero lo olvidé.","en":"I meant to call her, but I forgot to."},{"id":5144,"es":"Puedes llamarle tonto, pero no puedes llamarle cobarde.","en":"You may call him a fool, but you cannot call him a coward."},{"id":5145,"es":"Sólo en teoría, el proyecto es posible.","en":"Only in theory, the project is possible."},{"id":5146,"es":"A Jason, que estaba a cargo del proyecto, lo destituyeron por corrupción.","en":"Jason, who was in charge of the project, was dismissed for corruption."},{"id":5147,"es":"Jason, quien estaba a cargo del proyecto, fué echado por corrupción.","en":"Jason, who was in charge of the project, was dismissed for corruption."},{"id":5148,"es":"En cuanto acabó su reunión, se pusieron a trabajar.","en":"As soon as their meeting was over, they set to work."},{"id":5149,"es":"Le pusieron Robert, como su padre.","en":"He was named Robert after his father."},{"id":5150,"es":"¡Avestruz ! , y todos pusieron la cabeza debajo de la mesa.","en":"Ostrich!—and everyone stuck their heads under the table."},{"id":5151,"es":"Si no está en Tatoeba, no es una oración.","en":"If it isn't on Tatoeba, it isn't a sentence."},{"id":5152,"es":"Al haberse marchado él, Maria se quedó sola en esta oración.","en":"He gone, Mary remained thus alone in this sentence."},{"id":5153,"es":"Por favor, rompe el enlace de esta oración del inglés.","en":"Please unlink this sentence from English."},{"id":5154,"es":"Por favor, enlaza esta oración al español.","en":"Please link this sentence to Spanish."},{"id":5155,"es":"No entiendes esta oración, ¿verdad ?","en":"You can't understand this sentence, can you?"},{"id":5156,"es":"La pintura está en el Louvre, París.","en":"The painting is in the Louvre, Paris."},{"id":5157,"es":"La pintura se ve genial, pero la colgaste un poco chueca.","en":"The painting looks great, but you hung it a little crooked."},{"id":5158,"es":"Era una noche muy, muy caliente.","en":"It was a very, very hot night."},{"id":5159,"es":"Caliente el agua, por favor.","en":"Please heat the water."},{"id":5160,"es":"Como el baño está muy caliente, le echaré algo de agua fría.","en":"As the bath is too hot, I will run some cold water into it."},{"id":5161,"es":"A menudo él comete errores, pero no es tonto.","en":"He often makes mistakes, but he is no fool."},{"id":5162,"es":"Ella es muy cuidadosa, así que casi nunca comete errores.","en":"She is very careful, so she seldom makes mistakes."},{"id":5163,"es":"No te preocupes, todo el mundo comete un error.","en":"Don't worry, everyone makes mistakes."},{"id":5164,"es":"Si comete otro error, le despedirán.","en":"If he makes one more mistake, he'll be fired."},{"id":5165,"es":"Lo siento, solo quería ayudar.","en":"I'm sorry, I just wanted to help."},{"id":5166,"es":"Ahora que estás aquí, puedes ayudar a limpiar.","en":"Now that you are here, you can help do the cleaning."},{"id":5167,"es":"Si nos quieres ayudar, solo pregunta.","en":"If you want us to help, just ask."},{"id":5168,"es":"En esencia, la historia humana es una historia de ideas.","en":"Human history is in essence a history of ideas."},{"id":5169,"es":"La raza humana tiene un arma realmente efectiva, y ésa es la risa.","en":"The human race has one really effective weapon and that is laughter."},{"id":5170,"es":"En muchas partes, la naturaleza está amenazada por actividad humana.","en":"In many places, nature is threatened by human activity."},{"id":5171,"es":"Lo lamento, pero sencillamente es imposible.","en":"I'm sorry, but it's just not possible."},{"id":5172,"es":"Sin saber qué decir, sencillamente sonrió.","en":"Not knowing what to say, she just smiled."},{"id":5173,"es":"Emet tiene mucho interés en el fútbol, pero sencillamente no sabe como jugarlo.","en":"Emet is very interested in soccer, but simply does not know how to play."},{"id":5174,"es":"Traté de razonar con él, pero sencillamente no escucha.","en":"I've tried reasoning with him but he just won't listen."},{"id":5175,"es":"No quería coger un resfriado, así que no fui a esquiar.","en":"I didn't want to catch a cold, so I didn't go skiing."},{"id":5176,"es":"Si vos me enseñás tu idioma, yo te enseño el mío.","en":"If you teach me your language, I teach you mine."},{"id":5177,"es":"Sígueme, que te enseño el camino.","en":"Follow me and I will show you the way."},{"id":5178,"es":"Si quieres, te enseño ajedrez.","en":"If you like, I will teach you to play chess."},{"id":5179,"es":"Tengo un abrigo, pero no tengo sombrero.","en":"I have a coat, but I have no hat."},{"id":5180,"es":"La mujer se probó un sombrero detrás de otro, luego se marchó de la sombrerería.","en":"The woman tried on one hat after another, then left the hat shop."},{"id":5181,"es":"Ahora bien, pongo esta carta en el sombrero. ¿Ves ?","en":"Now, I put this card into the hat. See?"},{"id":5182,"es":"Veo que estás ocupado, así que iré directo al grano.","en":"I can see you're busy, so I'll get right to the point."},{"id":5183,"es":"Cuando ella se desmayó, la llevamos directo a la clínica.","en":"We took her straight to the clinic as soon as she fainted."},{"id":5184,"es":"¡Muchas gracias por el enlace, a mí me gusta traducir y aprender idiomas !","en":"Thanks a lot for the link, I love translating and learning languages!"},{"id":5185,"es":"Hace poco encontré nuevos diccionarios, en otros idiomas.","en":"Recently I found new dictionaries, in other languages."},{"id":5186,"es":"Además de los idiomas, también estoy interesado en la tecnología.","en":"Apart from languages, I'm also interested in technology."},{"id":5187,"es":"El griego y el latín son idiomas útiles, por eso los estudio.","en":"Greek and Latin are useful languages. That's why I study them."},{"id":5188,"es":"El Papúa Nueva Guinea, 850 idiomas diferentes son hablados por los papúes.","en":"In Papua New Guinea, there are 850 different languages spoken by Papuans."},{"id":5189,"es":"Cambiá la bandera, por favor.","en":"Please change the flag."},{"id":5190,"es":"La bandera de Francia es azul, blanca y roja.","en":"The French flag is blue, white, and red."},{"id":5191,"es":"La bandera francesa es azul, blanca y roja.","en":"The French flag is blue, white and red."},{"id":5192,"es":"Hoy se supone que llueve, ¿o no ?","en":"It is supposed to rain today, isn't it?"},{"id":5193,"es":"Sé que se supone que yo disfrutara esta clase, pero no.","en":"I know that I'm supposed to enjoy this class, but I don't."},{"id":5194,"es":"Cuando pone esa carita, es porque está nervioso.","en":"If he makes that face it's because he's nervous."},{"id":5195,"es":"En otoño, toda la montaña se pone roja.","en":"The whole mountain turns red in autumn."},{"id":5196,"es":"Si quieres ser creíble, dile a la gente sólo lo que creen.","en":"If you want to be credible, tell people only what they believe."},{"id":5197,"es":"Algunas personas creen en Dios; otras, no.","en":"Some people believe in God and others don't."},{"id":5198,"es":"Distintas personas creen en distintas cosas, pero solo hay una verdad.","en":"Different people believe in different things, but there is only one truth."},{"id":5199,"es":"Todos creen en la victoria, aunque sea improbable.","en":"Everyone believes in victory, even when this is unlikely."},{"id":5200,"es":"Ella siempre dice cosas lindas sobre él, en especial cuando está cerca.","en":"She always says nice things about him, especially when he's around."},{"id":5201,"es":"En caso que el envío se retrase, contamos con un seguro especial de retrasos.","en":"In case the shipment is delayed, we have special delay insurance."},{"id":5202,"es":"Ahora estoy leyendo, tú estás leyendo y él está leyendo: todos estamos leyendo.","en":"Now I'm reading, you're reading and he's reading; we're all reading."},{"id":5203,"es":"Maria estaba sentada sola, leyendo un libro.","en":"Mary was sitting alone, reading a book."},{"id":5204,"es":"Está leyendo un libro, dejémosle solo.","en":"He is reading a book. Let's leave him alone."},{"id":5205,"es":"Tan pronto como descifre cómo enviar dinero, te enviaré algo.","en":"As soon as I can figure out how to send money, I'll send you some."},{"id":5206,"es":"Un caballero lo intentó contactar durante su ausencia, señor.","en":"A gentleman called in your absence, sir."},{"id":5207,"es":"Si se te mojan los pies, te dará un catarro.","en":"If your feet get wet, you'll get a cold."},{"id":5208,"es":"Ella siempre pareció feliz, pero nunca lo fue.","en":"She always looked, but never was, happy."},{"id":5209,"es":"Echaron sal en su té para reírse un rato, pero a él no le pareció gracioso.","en":"They put salt in his tea just for a laugh but he didn't find it funny."},{"id":5210,"es":"Aquella vez, Juan estaba almorzando con Maria.","en":"Tom was eating lunch with Mary at that time."},{"id":5211,"es":"Me voy a sentar en aquella banca, al lado de la farola.","en":"I'm going to sit on the bench over there, next to the street lamp."},{"id":5212,"es":"Después de aquella caída, ella es afortunada de estar viva.","en":"After that fall she's lucky to be alive."},{"id":5213,"es":"Aquella noche se puso enfermo, con dolor de estómago.","en":"That night, he became sick with pains in his stomach."},{"id":5214,"es":"Mira, no quiero que digas nada.","en":"Look, I don't want you to say anything."},{"id":5215,"es":"Mira, estoy un poco ocupado.","en":"Look, I'm a little busy."},{"id":5216,"es":"Mira, ahí viene tu tren.","en":"Look, here comes your train."},{"id":5217,"es":"Mira, mi casa no está tan sucia como la tuya.","en":"Look, my house is not as dirty as yours."},{"id":5218,"es":"A decir verdad, ella es mi novia.","en":"To tell the truth, she is my girlfriend."},{"id":5219,"es":"Lo siento, ya tengo novia.","en":"I'm sorry, but I already have a girlfriend."},{"id":5220,"es":"Tengo una novia nueva, ¿no sabías ?","en":"I got a new girlfriend; you didn't know?"},{"id":5221,"es":"Si quieres ir ahí, no voy a intentar detenerte.","en":"If you want to go there, I'm not going to try and stop you."},{"id":

a minute. I want to tell you something."},{"id":2938,"es":"También tenía que decirte otra cosa, pero lo olvidé.","en":"I had to say you also another thing, but I forgot it."},{"id":2939,"es":"Si me dices tu nombre, puedo decirte el mío.","en":"If you tell me your name, I can tell you mine."},{"id":2940,"es":"Podría decirte que te quiero, pero estaría mintiendo.","en":"I could tell you that I love you, but I'd be lying."},{"id":2941,"es":"Cuanto peor es el malo, mejor es la película.","en":"The worse the baddie, the better the film."},{"id":2942,"es":"Me preguntaba, ¿te gustaría ir a ver una película conmigo esta noche ?","en":"I was wondering, would you like to go to a movie with me tonight?"},{"id":2943,"es":"¿Podrías escribir tu nombre aquí, por favor ?","en":"Would you please write your name here?"},{"id":2944,"es":"Lo siento, no tengo un lápiz para escribir.","en":"I'm sorry I have no pencil to write with."},{"id":2945,"es":"Lo siento, no he podido escribir antes porque estaba enfermo.","en":"I'm sorry, I couldn't write earlier because I was ill."},{"id":2946,"es":"Dame un pedazo de papel para escribir, por favor.","en":"Please give me a piece of paper to write on."},{"id":2947,"es":"No puedo pensar con ese ruido, dijo ella, mirando fijamente su máquina de escribir.","en":"I can't think with that noise, she said, as she stared at the typewriter."},{"id":2948,"es":"Cuando estaba en la escuela, odiaba de todo corazón escribir ensayos.","en":"When I was in school, I really hated writing essays."},{"id":2949,"es":"Para Hawking, escribir este libro no fue fácil.","en":"For Hawking, writing this book was not easy."},{"id":2950,"es":"Ella comenzó a escribir un informe a las ocho, terminándolo a las doce.","en":"She began writing a report at eight, finishing it at twelve."},{"id":2951,"es":"Al no haber tenido noticias suyas, le volví a escribir.","en":"Not having heard from him, I wrote to him again."},{"id":2952,"es":"Juan no quería que te dijera esto, pero él perdió su trabajo.","en":"Tom didn't want me to tell you this, but he just lost his job."},{"id":2953,"es":"Él es bajo, pero fuerte.","en":"He is short, but strong."},{"id":2954,"es":"Cuanto más baja es la presión, más bajo es el punto de ebullición.","en":"When pressure is lower, the boiling point is lower."},{"id":2955,"es":"De los dos muchachos, él es el más bajo.","en":"He is the shorter of the two boys."},{"id":2956,"es":"¿Podrías hablar más bajo, por favor ? Estoy con una resaca...","en":"Could you lower your voice please? I'm really hung over."},{"id":2957,"es":"¿Podrías hablar más bajo, por favor ? Tengo una buena resaca.","en":"Could you lower your voice please? I'm really hung over."},{"id":2958,"es":"Cuando era una niñita, siempre había querido vivir bajo el agua.","en":"When I was a young girl, I always wanted to live underwater."},{"id":2959,"es":"Esta mañana, la temperatura ha caído bajo el cero.","en":"The temperature has fallen below zero this morning."},{"id":2960,"es":"No me puedo permitir un coche de segunda mano, mucho menos un coche nuevo.","en":"I can't afford to buy a used car, much less a new car."},{"id":2961,"es":"Lo siento, sólo quería echar una mano.","en":"I'm sorry, I just wanted to help."},{"id":2962,"es":"Mi mano está tan entumecida con el frío, que no puedo mover los dedos.","en":"My hand is so numb with cold that I can't move my fingers."},{"id":2963,"es":"Mi mano está tan dormida con el frío, que no puedo mover los dedos.","en":"My hand is so numb with cold that I can't move my fingers."},{"id":2964,"es":"Dame una mano con mi tarea, por favor.","en":"Please give me a hand with my homework."},{"id":2965,"es":"¿Tengo que facturar este equipaje, o puedo llevarlo en la mano ?","en":"Do I have to check this luggage, or can it be carry-on?"},{"id":2966,"es":"Perdona, ¿puedes echarme una mano aquí, por favor ?","en":"Hey, could you give me a hand over here, please?"},{"id":2967,"es":"Me gusta caminar, especialmente a la mañana.","en":"I like walking, especially in the morning."},{"id":2968,"es":"El ascensor estaba fuera de servicio, y tuvimos que caminar hasta el quinto piso.","en":"The elevator was out of order and we had to walk to the fifth floor."},{"id":2969,"es":"Sintiéndose cansado de caminar por el campo, él se tomó una siesta.","en":"Feeling tired from walking in the countryside, he took a nap."},{"id":2970,"es":"El coche se descompuso, por lo que tenían que caminar.","en":"The car broke down, so they had to walk."},{"id":2971,"es":"En Asia, comúnmente el hombre va delante de la mujer al caminar.","en":"In Asia men usually precede women when walking."},{"id":2972,"es":"Por más rápido que fueras a caminar, no podrás alcanzarlo a él.","en":"However fast you may walk, you can't catch up with him."},{"id":2973,"es":"Si se te olvidó todo, ¿entonces por qué yo recuerdo todo ?","en":"If you've forgotten everything, then why do I remember everything?"},{"id":2974,"es":"Estudié francés hace mucho tiempo, pero ahora todo lo que recuerdo es bonjour.","en":"I studied French a long time ago, but now all I remember is bonjour."},{"id":2975,"es":"Si mal no recuerdo, nos vimos por última vez hace tres años.","en":"As far as I can remember, it was three years ago that we last met."},{"id":2976,"es":"Si recuerdo bien, esa es la canción que Juan cantó en la boda de Maria.","en":"If I remember correctly, that's the song Tom sang at Mary's wedding."},{"id":2977,"es":"Si él te sigue amenazando, entonces deberías ir donde la policía.","en":"If he keeps threatening you, then you should go to the police."},{"id":2978,"es":"Aunque mi coche es muy viejo, sigue funcionando muy bien.","en":"Although my car is very old, it still runs very well."},{"id":2979,"es":"¿Podrías hablar un poco más fuerte, por favor ?","en":"Could you speak a little louder please?"},{"id":2980,"es":"¿Podría hablar más fuerte ? , no le escucho.","en":"Could you speak up? I can't hear you."},{"id":2981,"es":"Si eres fuerte, yo soy fuerte.","en":"If you are strong, I am strong."},{"id":2982,"es":"Él era pequeño, pero fuerte.","en":"He was small, but strong."},{"id":2983,"es":"¡Más rápido, más alto, más fuerte !","en":"Faster, higher, stronger!"},{"id":2984,"es":"Cuando finalmente dieron con él, ya era demasiado tarde.","en":"When they finally found him, it was too late."},{"id":2985,"es":"Finalmente, mi hermana se casó.","en":"Finally, my sister got married."},{"id":2986,"es":"Finalmente, terminé este trabajo.","en":"Finally, I'm done with this work."},{"id":2987,"es":"¿Podrías no fumar en esta sala, por favor ?","en":"Could you please not smoke in this room?"},{"id":2988,"es":"No hay nadie en la sala de estar, pero el televisor está encendido.","en":"Nobody is in the living room, but the TV is on."},{"id":2989,"es":"Cuando el juez habla, todos los que están en la sala escuchan.","en":"When the judge speaks, everyone in the courtroom listens."},{"id":2990,"es":"La sala era tan grande como para contener a más de 1,000 personas.","en":"The hall was so large as to hold more than 1,000 people."},{"id":2991,"es":"Esta sala es mi dormitorio, y la otra es mi oficina.","en":"This room is my bedroom, and the other one is my office."},{"id":2992,"es":"Bob, ayúdame llevar esta maleta a la sala de estar.","en":"Bob, help me carry his suitcase to the living room."},{"id":2993,"es":"Esta es una sala de reuniones, no una sala de espera.","en":"This is a meeting room, not a waiting room."},{"id":2994,"es":"Esta sala no es un cine, pero se puede proyectar una película aquí.","en":"This hall isn't a movie theater, but you can project a movie in here."},{"id":2995,"es":"¡Dije que esta es una sala de reuniones, no un dormitorio !","en":"I said that this was a meeting room, not a bedroom!"},{"id":2996,"es":"Cuando el profesor se volteó, él se escabulló de la sala.","en":"When the lecturer turned round, he sneaked out of the classroom."},{"id":2997,"es":"Lo siento, pero no puedo recordar su nombre.","en":"I'm sorry to say I don't remember your name."},{"id":2998,"es":"¿Qué canción es esta ? La he escuchado antes, pero no logro recordar su nombre.","en":"What's this song? I've heard it before, but I can't remember the name."},{"id":2999,"es":"Algunos son buenos para recordar sus sueños, otros los olvidan.","en":"Some people are good at remembering their dreams, others forget theirs."},{"id":3000,"es":"Mi memoria me falló. Por más que traté, no pude recordar su nombre.","en":"My memory failed me. I just couldn't remember his name."},{"id":3001,"es":"No importó cuanto me devanara los sesos, no fui capaz de recordar ese nombre.","en":"No matter how I racked my brain, I couldn't remember that name."},{"id":3002,"es":"Después de abofetear a Tom, Maria se fue corriendo de la habitación.","en":"After slapping Tom, Mary ran out of the room."},{"id":3003,"es":"Corriendo lo más rápido que pude, logré alcanzar a mi amigo.","en":"Running as fast as I could, I was able to catch up with my friend."},{"id":3004,"es":"En caso de una emergencia, debes salir corriendo de la casa mediante esta salida.","en":"If there's an emergency, you must run out of the house through this exit."},{"id":3005,"es":"Tan pronto como oyó el choque, salió corriendo de su casa.","en":"As soon as he heard the crash, he rushed out of the house."},{"id":3006,"es":"Juan se vistió rápidamente, luego salió corriendo por la puerta.","en":"Tom dressed himself quickly, then ran out the door."},{"id":3007,"es":"Fui corriendo al colegio, pero la campana ya había sonado.","en":"I ran to school, but the bell had already rung."},{"id":3008,"es":"El mundo es un libro, y aquellos que no viajan leen sólo una página.","en":"The world is a book, and those who do not travel read only a page."},{"id":3009,"es":"En aquellos días, poca gente podía viajar al extranjero.","en":"In those days, few people could travel abroad."},{"id":3010,"es":"En aquellos tiempos, solía levantarme a las seis todas las mañanas.","en":"In those days, I used to get up at six every morning."},{"id":3011,"es":"A pesar de todo esto, perdoné a aquellos que mataron a mis niños.","en":"Despite all this, I forgave the people who killed my children."},{"id":3012,"es":"Aquellos que aman demasiado, odian con el mismo extremo.","en":"Those who love too much, hate in like extreme."},{"id":3013,"es":"Desde una edad temprana, los niños aprenden a excluir a aquellos que no son como ellos mismos.","en":"From a young age children learn to ostracise those who aren't like them."},{"id":3014,"es":"Aquellos hombres holgazanes, una y otra vez desatienden sus deberes.","en":"Those lazy men neglect their duties over and over again."},{"id":3015,"es":"Deberías ser lo suficientemente razonable para no beber, al menos mientras estás enfermo.","en":"You should have enough sense not to drink, at least during your illness."},{"id":3016,"es":"No se puede beber agua de mar, porque es demasiado salada.","en":"You can't drink seawater because it's too salty."},{"id":3017,"es":"Agua que no has de beber, déjala correr.","en":"Don't be a dog in the manger."},{"id":3018,"es":"Y para peor, últimamente ha empezado a beber alcohol.","en":"And, to make the matter worse, he has taken to drinking."},{"id":3019,"es":"A una mujer, cuyo marido está muerto, se le llama viuda.","en":"A woman whose husband is dead is called a widow."},{"id":3020,"es":"El edificio cuyo techo puedes ver allá, es nuestra iglesia.","en":"The building whose roof you can see over there is our church."},{"id":3021,"es":"Mi hermana se casó con el Sr. Sato, cuyo padre es el amigo de mi madre.","en":"My sister married Mr Sato, whose father is my mother's friend."},{"id":3022,"es":"Ayer fui a ver a Roberto, cuyo padre es un piloto.","en":"Yesterday I went to see Robert, whose father is a pilot."},{"id":3023,"es":"Margaret, cuyo padre conociste el sábado pasado, es una muy buena tenista.","en":"Margaret, whose father you met last Sunday, is a very good tennis player."},{"id":3024,"es":"La casa, cuyo techo puedes ver, es del Sr. Baker.","en":"The house whose roof you can see is Mr Baker's."},{"id":3025,"es":"La novela, cuyo autor es un famoso cantante, se está vendiendo bien.","en":"The novel, the author of which is a famous singer, is selling well."},{"id":3026,"es":"El área, cuyo centro se ubica aquí, fue bombardeada.","en":"The area the center of which is here was bombed."},{"id":3027,"es":"Roger Vercel, cuyo verdadero nombre es Roger Crétin, es un escritor francés.","en":"Roger Vercel, whose true name is Roger Crétin, is a French writer."},{"id":3028,"es":"Si hubiera sabido la dirección de él, le hubiera escrito.","en":"Had I known his address, I would have written to him."},{"id":3029,"es":"Si hubiera sabido su dirección, le habría escrito.","en":"If I had known his address, I would have written."},{"id":3030,"es":"Si lo hubiera sabido, habría cambiado mi plan.","en":"If I had known about it, I would have changed my plan."},{"id":3031,"es":"En el país de los ciegos, el hombre de un solo ojo es el rey.","en":"In the country of the blind, the one-eyed man is king."},{"id":3032,"es":"Al comienzo, el rey estaba satisfecho con él.","en":"The king was pleased with him at first."},{"id":3033,"es":"¡El rey ha muerto, que viva el rey !","en":"The king is dead, long live the king!"},{"id":3034,"es":"Una república es una nación cuya cabeza no es un rey ni una reina, sino un presidente.","en":"A republic is a nation whose head is not a king or queen, but a president."},{"id":3035,"es":"En el reino de los ciegos, el tuerto es rey.","en":"In the country of the blind, the one-eyed man is king."},{"id":3036,"es":"Hoy un niño rey, mañana un tirano.","en":"Today a child acting like a king, tomorrow a tyrant."},{"id":3037,"es":"Cuando crezca, quiero ser un rey.","en":"When I grow up, I want to be a king."},{"id":3038,"es":"Hablando del rey de Roma, por la puerta se asoma.","en":"Speak of the devil..."},{"id":3039,"es":"Espera aquí hasta que él venga, por favor.","en":"Please wait here until he comes."},{"id":3040,"es":"Espera un momento, por favor.","en":"Hold on a moment, please."},{"id":3041,"es":"Por favor, espera media hora.","en":"Please wait half an hour."},{"id":3042,"es":"Si espera un momento, pondré a Jane en el teléfono.","en":"If you hold on a moment, I will get Jane on the phone."},{"id":3043,"es":"Cuando llegues allí, espera un rato.","en":"When you get there, wait for a while."},{"id":3044,"es":"La línea está ocupada. Por favor, permanezca a la espera.","en":"The line is busy now. Please hold the line."},{"id":3045,"es":"Espera, espera sólo un momentito.","en":"Wait, wait just a little while."},{"id":3046,"es":"Tom, quiero ir con vos.","en":"I want to go with you, Tom."},{"id":3047,"es":"Estoy muy feliz por vos, Tom.","en":"I'm so happy for you, Tom."},{"id":3048,"es":"Vos sos el amigo de Tom, ¿verdad ?","en":"You're Tom's friend, aren't you?"},{"id":3049,"es":"No sos vos, ¡soy yo !","en":"It's not you, it's me!"},{"id":3050,"es":"Si yo fuese vos, me quedaría fuera de eso.","en":"If I were you, I'd stay away from that."},{"id":3051,"es":"Tengo una sorpresa para vos, Tom.","en":"I've got a surprise for you, Tom."},{"id":3052,"es":"Si vos pensás eso de mí, ¿qué puedo hacer ?","en":"What can I do if you think that way about me?"},{"id":3053,"es":"Te estoy pidiendo que hagas esto, porque confío en vos.","en":"I'm asking you to do this because I trust you."},{"id":3054,"es":"Juan y vos solían ir a pescar juntos, ¿no ?","en":"You and Tom used to go fishing together, didn't you?"},{"id":3055,"es":"De vez en cuando, él deja su paraguas en el tren.","en":"Once in a while, he leaves his umbrella on the train."},{"id":3056,"es":"Si el agua deja de fluir, el más probable que es por una retorcedura en la manguera.","en":"If the water stops flowing, it's most likely from a kink in the hose."},{"id":3057,"es":"Deja de cantar esa canción, por favor.","en":"Please stop singing that song."},{"id":3058,"es":"Por favor, deja los canales en paz.","en":"Please stop changing channels."},{"id":3059,"es":"Por favor, deja de hacer zapping.","en":"Please stop changing channels."},{"id":3060,"es":"Deja de darme la lata, estoy ocupado.","en":"Stop pestering me, I'm busy."},{"id":3061,"es":"Por favor, deja de silbar.","en":"Please stop whistling."},{"id":3062,"es":"Deja el cigarro, por favor.","en":"Please give up smoking."},{"id":3063,"es":"Por Dios, deja de llorar.","en":"In the name of mercy, stop crying."},{"id":3064,"es":"Se me olvidó, respondió ella.","en":"I forgot, she answered."},{"id":3065,"es":"No respondió al teléfono, así que le mandé un correo.","en":"He did not answer the phone, so I sent him an email."},{"id":3066,"es":"Le pregunté varias veces, pero simplemente no respondió.","en":"I asked him several times, but he simply didn't reply."},{"id":3067,"es":"Esto es más barato que un sombrero nuevo, respondió Susan.","en":"That's cheaper than a new hat, Susan answers."},{"id":3068,"es":"Eso es muy amable de tu parte, respondió Willie.","en":"That's very nice of you, Willie answered."},{"id":3069,"es":"Solo estoy pensando acerca de mi deseo, respondió el pequeño conejo negro.","en":"I'm just thinking about my wish, replied the little black rabbit."},{"id":3070,"es":"Golpeé la puerta, pero nadie respondió.","en":"I banged on the door, but nobody answered."},{"id":3071,"es":"Sí, pero ella se acaba de ir.","en":"Yes, but she just left."},{"id":3072,"es":"El teléfono acaba de sonar, ¿no ?","en":"The telephone was just ringing, wasn't it?"},{"id":3073,"es":"Él no puede tener hambre, acaba de comer.","en":"He cannot be hungry; he has just had lunch."},{"id":3074,"es":"Acaba de dejar de llover, así que vámonos.","en":"The rain just stopped, so let's leave."},{"id":3075,"es":"La lluvia acaba de parar, así que vámonos.","en":"The rain just stopped, so let's leave."},{"id":3076,"es":"Juan no puede tener hambre, acaba de cenar.","en":"Tom can't be hungry. He's just eaten dinner."},{"id":3077,"es":"Dame un café, por favor.","en":"Give me a coffee, please."},{"id":3078,"es":"Dame algo de agua, ¡y hazlo rápido !","en":"Give me some water, and make it quick!"},{"id":3079,"es":"Entre tú y yo, Lisa, sabemos que simplemente no me agrada Nick.","en":"Between you and me, Lisa, we know that I simply don't like Nick."},{"id":3080,"es":"En mi trabajo, a veces simplemente determino un área con una cinta métrica.","en":"In my work, I sometimes simply determine an area with a tape measure."},{"id":3081,"es":"Si no me conocías así, entonces simplemente no me conocías.","en":"If you didn't know me that way then you simply didn't know me."},{"id":3082,"es":"Si algo va mal, simplemente échale la culpa al traductor.","en":"If something goes wrong, just blame it on the translator."},{"id":3083,"es":"Una verdad matemática no es simple ni complicada, simplemente es.","en":"A mathematical truth is neither simple nor complicated; it is."},{"id":3084,"es":"Pues, simplemente me acordé.","en":"Well, I just remembered."},{"id":3085,"es":"Cuando probé explicarle mis motivos, él simplemente se puso más furioso.","en":"When I tried to explain my reasons he simply became even angrier."},{"id":3086,"es":"Ésta es la moto de Tom, creo.","en":"This is Tom's motorcycle, I think."},{"id":3087,"es":"Ésta no es mi opinión, es sólo lo que he traducido.","en":"This isn't my opinion, it's just what I've translated."},{"id":3088,"es":"Ésta es mi mujer, Edita.","en":"This is my wife Edita."},{"id":3089,"es":"Comúnmente no me asustan las películas, pero ésta me superó.","en":"I'm usually not scared by movies, but this one got to me."},{"id":3090,"es":"No hable tan rápido, por favor.","en":"Please don't speak so fast."},{"id":3091,"es":"Por favor, hable más rápido.","en":"Please speak more quickly."},{"id":3092,"es":"Yo puedo ser antisocial, pero eso no significa que no hable con la gente.","en":"I may be antisocial, but it doesn't mean I don't talk to people."},{"id":3093,"es":"Por favor, hable más fuerte para que todos puedan escucharlo.","en":"Please speak more loudly so that everybody can hear you."},{"id":3094,"es":"Soy un extranjero y no sé checo muy bien. Por favor, hable despacio.","en":"I'm a foreigner and I don't know Czech very well. Please, speak slowly."},{"id":3095,"es":"Hable más despacio, por favor.","en":"Please speak more slowly."},{"id":3096,"es":"Por favor, hable más despacio.","en":"Please speak more slowly."},{"id":3097,"es":"Hable más despacio, ¡por favor !","en":"Speak more slowly, please!"},{"id":3098,"es":"Por favor hable despacio, así puedo entenderlo.","en":"Please speak slowly, so I can understand you."},{"id":3099,"es":"No estás ocupado, ¿no ?","en":"You're not busy, right?"},{"id":3100,"es":"Tenía la intención de ir con ella, pero estuve demasiado ocupado.","en":"I intended to go with her, but I was too busy."},{"id":3101,"es":"Ponle un poco más de leche a mi té, por favor.","en":"Add a little more milk to my tea, please."},{"id":3102,"es":"Dos cafés con leche, por favor.","en":"Two coffees with milk, please."},{"id":3103,"es":"Debido a su edad, la vaca ya no dará más leche.","en":"Due to its age, the cow will no longer give milk."},{"id":3104,"es":"Gracias por darme algo de comer, estaba muerto de hambre.","en":"Thank you for giving me something to eat. I was really hungry."},{"id":3105,"es":"Estaba a punto de darme por vencido, cuando de repente encontré la solución.","en":"I was on the point of giving up when I suddenly hit upon the solution."},{"id":3106,"es":"Gracias por darme algo de comer, estaba muy hambriento.","en":"Thank you for giving me something to eat. I was really hungry."},{"id":3107,"es":"¿Puede usted darme el plano del metro, por favor ?","en":"Could I have a subway map, please?"},{"id":3108,"es":"¿Podrías darme la llave inglesa de 12 mm, por favor ?","en":"Could you give me the 12mm wrench please?"},{"id":3109,"es":"Disculpe, ¿puede darme fuego ?","en":"May I trouble you for a light?"},{"id":3110,"es":"Lo siento, no puedo quedarme mucho tiempo.","en":"I'm sorry, I can't stay long."},{"id":3111,"es":"No puedo quedarme con éste reloj, tengo que devolvérselo a Tom.","en":"I can't keep this watch. I have to give it back to Tom."},{"id":3112,"es":"¿Puedo quedarme así hasta mañana por la mañana, abrazándote ?","en":"Shall I stay like this until morning embracing you?"},{"id":3113,"es":"Pensándolo bien, decidí quedarme en casa.","en":"After careful thought, I elected to stay at home."},{"id":3114,"es":"Estoy cansada, pero no puedo quedarme dormida.","en":"I'm tired, but I can't fall asleep."},{"id":3115,"es":"Normalmente, lo que dices es verdad.","en":"What you say is usually true."},{"id":3116,"es":"Lo que dices es correcto en cierto sentido, pero la hizo enfadar.","en":"What you said is right in a sense, but it made her angry."},{"id":3117,"es":"No, no puedo creerme lo que dices.","en":"No, I cannot believe what you say."},{"id":3118,"es":"Cuando lo dices, suenas como papá.","en":"When you say this, you sound just like father."},{"id":3119,"es":"Como todo el mundo sabe, el aire es una mezcla de gases.","en":"As everyone knows, air is a mixture of gases."},{"id":3120,"es":"John está seguro, el aire fresco es una cosa buena.","en":"John is sure, that fresh air is a good thing."},{"id":3121,"es":"Sin aire, en la luna no puede haber viento ni ruido.","en":"Without air there can be no wind or sound on the moon."},{"id":3122,"es":"Deje entrar algo de aire fresco, por favor.","en":"Please let in some fresh air."},{"id":3123,"es":"Sin aire, el hombre no puede existir.","en":"Men can not exist without air."},{"id":3124,"es":"El aire, como la comida, es una necesidad humana básica.","en":"Air, like food, is a basic human need."},{"id":3125,"es":"Dado que no tengo trabajo, no puedo ahorrar dinero.","en":"Since I don't have a job, I can't save money."},{"id":3126,"es":"Si me hubiera dado cuenta de lo que tramabas, no lo habría concedido.","en":"Had I realized what you intended, I wouldn't have agreed."},{"id":3127,"es":"A pesar d olor ?","en":"The style is nice, but do you have it in a different color?"},{"id":3238,"es":"Sí, es bonito, pero no me gusta el color rojo.","en":"Yes, it's pretty, but I don't like red."},{"id":3239,"es":"¿Qué color te gusta más, el azul o el verde ?","en":"Which color do you prefer, blue or green?"},{"id":3240,"es":"¿Qué color prefieren, el azul o el verde ?","en":"Which color do you prefer, blue or green?"},{"id":3241,"es":"Nuestras camisas son todas del mismo color, pero todas de tamaños diferentes.","en":"Our shirts are all the same color but are all different sizes."},{"id":3242,"es":"¿Qué color prefiere, el azul o el verde ?","en":"Which color do you prefer, blue or green?"},{"id":3243,"es":"Juan llamó a Maria, pero la línea estaba ocupada.","en":"Tom called Mary, but the line was busy."},{"id":3244,"es":"Llegada a la estación, ella llamó a su hermano.","en":"Arriving at the station, she called up her brother."},{"id":3245,"es":"A su llegada a la estación, él llamó un taxi.","en":"On his arrival at the station, he called a taxi."},{"id":3246,"es":"Creemos que alguien, y sabemos muy bien quién, llamó a la Policía.","en":"We think someone, and we know very well who, called the police."},{"id":3247,"es":"Porque no me quiero casar, mi abuela me llamó tullido.","en":"Because I don't want to marry, my grandmother called me a cripple."},{"id":3248,"es":"Cuando ella llamó, di un salto.","en":"When she called, I jumped up."},{"id":3249,"es":"Juan llamó a Maria para disculparse, pero le colgó.","en":"Tom called Mary to apologize to her, but she hung up on him."},{"id":3250,"es":"El clima frío es terrible, ¿no es así ?","en":"The cold weather is terrible, isn't it?"},{"id":3251,"es":"Era el término del invierno, y el clima estaba muy helado.","en":"It was the end of winter, and the weather was very cold."},{"id":3252,"es":"El invierno está aquí, y el clima se está poniendo helado.","en":"Winter is here, and the weather's getting cold."},{"id":3253,"es":"Por lo general, :3340,"es":"Ella sólo tiene dos años, pero ya sabe contar hasta 100.","en":"She is two years old, but she can already count to 100."},{"id":3341,"es":"Cuando tenías dos años, sabías contar hasta diez.","en":"When you were two years old, you could count to ten."},{"id":3342,"es":"Cuando tenías dos años, ya podías contar hasta diez.","en":"When you were two years old, you could already count to ten."},{"id":3343,"es":"Todos nosotros sabemos hablar francés, así que hablemos en francés.","en":"All of us can speak French, so let's speak French."},{"id":3344,"es":"Por lo que sabemos, Juan podría estar en Boston.","en":"For all we know, Tom could be in Boston."},{"id":3345,"es":"Mientras más aprendemos, más nos damos cuenta de lo poco que sabemos.","en":"The more we learn, the more we realize how little we know."},{"id":3346,"es":"Por favor, acepte nuestras disculpas por no haber cubierto su solicitud antes.","en":"Please accept our apologies for not filling your order sooner."},{"id":3347,"es":"El cielo está bajo nuestros pies, como también sobre nuestras cabezas.","en":"Heaven is under our feet as well as over our heads."},{"id":3348,"es":"A pesar de nuestras felicitaciones, frunció el ceño y dio la espalda.","en":"In spite of our congratulations, he frowned and turned away."},{"id":3349,"es":"Debemos aprovechar al máximo nuestras vacaciones, ya que son muy cortas.","en":"We must make the most of our vacation, as it is so short."},{"id":3350,"es":"Oremos a Dios, y Él contestará a todas nuestras plegarias.","en":"Let's pray to God, and He will answer our prayers."},{"id":3351,"es":"Luego de muchos debates, decidimos pasar nuestras vacaciones en España.","en":"After much debate, we decided to spend our holidays in Spain."},{"id":3352,"es":"La tierra puede satisfacer nuestras necesidades, pero no nuestra avaricia.","en":"The earth can satisfy our needs but not our greed."},{"id":3353,"es":"Nuestras virtudes son, en su mayoría, sólo vicios disfrazados.","en":"Our virtues are, most often, only disguised vices."},{"id":3354,"es":"Según el pronóstico del tiempo, va a llover mañana.","en":"According to the weather forecast, it is going to rain tomorrow."},{"id":3355,"es":"Perdón, ¿sabe cuál es el pronóstico para mañana ?","en":"Excuse me, do you know what is the weather forecast for tomorrow?"},{"id":3356,"es":"Según el pronóstico del tiempo, nevará esta noche.","en":"According to the weather report, it will snow tonight."},{"id":3357,"es":"Inesperadamente, el pronóstico del tiempo de ayer se cumplió.","en":"Unexpectedly the weather forecast came true yesterday."},{"id":3358,"es":"Inesperadamente, el pronóstico del tiempo se cumplió ayer.","en":"Unexpectedly the weather forecast came true yesterday."},{"id":3359,"es":"Contra todo pronóstico, ganaron con facilidad.","en":"Contrary to expectations, they won with ease."},{"id":3360,"es":"Normalmente, los gatos odian a los perros.","en":"Cats usually hate dogs."},{"id":3361,"es":"¡Me quedaré de pie, gracias !","en":"I'll stand, thank you!"},{"id":3362,"es":"Para el mundo sos alguien, pero para alguien sos el mundo.","en":"For the world, you are somebody, but for somebody you are the world."},{"id":3363,"es":"No sos muy feliz, ¿no ?","en":"You're not very happy, are you?"},{"id":3364,"es":"Él es un bolacero, y vos sos otro.","en":"He's a liar, and you're another."},{"id":3365,"es":"Vos no sos el Sr. Lima. No, soy su hijo.","en":"You aren't Mr. Lima. No, I'm his son."},{"id":3366,"es":"Por favor, cierra la puerta que está detrás de ti.","en":"Please shut the door behind you."},{"id":3367,"es":"Cierra los ojos, por favor.","en":"Close your eyes, please."},{"id":3368,"es":"Si tienes algo que decir, dilo ahora o cierra la boca.","en":"If you have something to say, say it now or pipe down."},{"id":3369,"es":"De noche, Juan cierra con llave sus puertas.","en":"Tom keeps his doors locked at night."},{"id":3370,"es":"Haré tus compras, limpiaré la casa y te haré la cena por ti.","en":"I'll do your shopping, clean up the house, and cook your dinner for you."},{"id":3371,"es":"Hoy es nuestro aniversario, así que hagamos de esta una cena especial.","en":"Today is our anniversary so let's make this a special dinner."},{"id":3372,"es":"La cena está lista, así que podemos comer cuando queramos.","en":"Dinner is ready, so we can eat whenever we want."},{"id":3373,"es":"Después de una cena abundante, Willie le dio las gracias al anfitrión.","en":"After a hearty dinner, Willie thanked the host."},{"id":3374,"es":"Yo tomo venganza para el desayuno, el almuerzo y la cena.","en":"I have revenge for breakfast, lunch, and dinner."},{"id":3375,"es":"Después de terminar la cena, se divirtieron jugando a las cartas.","en":"Dinner finished, they enjoyed playing cards."},{"id":3376,"es":"Él volverá en dos horas; mientras tanto, preparemos la cena.","en":"He'll be back in two hours. In the meantime, let's prepare dinner."},{"id":3377,"es":"Por el aspecto del cielo, parece que va a llover.","en":"Judging from the look of the sky, it is likely to rain."},{"id":3378,"es":"Cuando me levanté para ir a la escuela, la luna todavía era visible en el cielo.","en":"When I got up to go to school, the moon was still visible in the sky."},{"id":3379,"es":"Tengo hambre, así que voy a buscar algo para comer.","en":"I'm hungry, so I'm going to get something to eat."},{"id":3380,"es":"Vaya a buscar un médico inmediatamente, por favor.","en":"Send for a doctor at once."},{"id":3381,"es":"Con todo el dinero gastado, empezamos a buscar trabajo.","en":"All the money spent, we started looking for work."},{"id":3382,"es":"No hace falta saberlo todo, basta con saber en dónde buscar.","en":"You don't need to know everything, you just need to know where to search."},{"id":3383,"es":"Los vehículos, al menos cada tres meses, se inspeccionan para buscar defectos.","en":"The vehicles are inspected for defects at least every three months."},{"id":3384,"es":"Cuando íbamos a buscar a Mónica, vimos algo aterrador."," les."},{"id":3599,"es":"No estás satisfecho, ¿verdad ?","en":"You're not satisfied, are you?"},{"id":3600,"es":"De todas formas, estaba satisfecho con los resultados.","en":"At any rate, he was satisfied with the results."},{"id":3601,"es":"Estaría muy satisfecho, si pudieras venir.","en":"I should be very pleased if you could come."},{"id":3602,"es":"Estaba, hasta cierto punto, satisfecho con el resultado.","en":"He was, to some degree, satisfied with the result."},{"id":3603,"es":"Me rindo. No importa lo que haga, nunca pareces estar satisfecho.","en":"I give up. No matter what I do, you never seem to be satisfied."},{"id":3604,"es":"Cuando él dejó de correr, estaba satisfecho.","en":"When he stopped running, he was satisfied."},{"id":3605,"es":"Si tuviera 25% más de ingresos, estaría más satisfecho con mi vida.","en":"If I had 25% more income, I'd be more satisfied with my life."},{"id":3606,"es":"Buenos días, ¿en qué le puedo servir ?","en":"Good day, how may I help you?"},{"id":3607,"es":"Buenos días, dijo Juan con una sonrisa.","en":"Good morning, said Tom with a smile."},{"id":3608,"es":"Buenos días, ¿es usted el señor Ogawa ?","en":"Hello, are you Mr Ogawa?"},{"id":3609,"es":"Buenos días, ¿desea comer algo ?","en":"Good morning, would you like something to eat?"},{"id":3610,"es":"Amigos buenos, uno entre cientos.","en":"Good friends are one in a hundred."},{"id":3611,"es":"Me dieron la bienvenida cálidamente, así que me sentí en casa.","en":"They welcomed me warmly, so I felt at home."},{"id":3612,"es":"Es extraño decirlo, pero no sentí dolor alguno.","en":"Strange to say, I didn't feel any pain."},{"id":3613,"es":"Cuando me besó, sentí que fue sincera conmigo.","en":"When she kissed me, I felt she was honest with me."},{"id":3614,"es":"Aunque parezca mentira, no sentí ningún dolor en absoluto.","en":"Strangely enough, I didn't feel any pain at all."},{"id":3615,"es":"¿Me puede llevar al aeropuerto, por favor ?","en":"Can you take me to the airport, please?"},{"id":3616,"es":"Intentasteis llevar a cabo el plan, pero no lo lograsteis.","en":"You tried to carry out the plan but you didn't succeed."},{"id":3617,"es":"Él conoce el universo, y no se conoce a sí mismo.","en":"He knows the universe and doesn't know himself."},{"id":3618,"es":"¡Ay ! Usted no me conoce, señor.","en":"Alas! You do not know me, Sir."},{"id":3619,"es":"Con esta peluca, este bigote y las gafas nadie me conoce.","en":"With this wig, this mustache and the glasses, nobody recognizes me."},{"id":3620,"es":"Mujeres, su perfidia no conoce límites.","en":"Women, their treachery knows no limits."},{"id":3621,"es":"Sí, ya ha empezado.","en":"Yes, it has already started."},{"id":3622,"es":"Como he perdido tanto, al fin he empezado a encontrarme a mí mismo.","en":"As I lost so much, I finally started to find myself."},{"id":3623,"es":"He empezado la escuela, y hasta ahora no me desagrada.","en":"School has started and I like it so far."},{"id":3624,"es":"Para mi decepción, él ya había empezado.","en":"To my disappointment, he had already started."},{"id":3625,"es":"No empieces si tienes miedo, y una vez empezado no temas.","en":"Do not start if afraid, once begun do not be afraid."},{"id":3626,"es":"¿Has terminado ? No, de hecho ni siquiera he empezado.","en":"Have you finished? On the contrary, I have not even begun yet."},{"id":3627,"es":"Justo cuando él había empezado a agarrarle el hilo, fue despedido.","en":"Just as he was getting the hang of things, he got fired."},{"id":3628,"es":"Al principio él no me gustaba, pero ahora sí.","en":"At first I did not like him, but now I do."},{"id":3629,"es":"Al principio ella no me gustó, pero ahora sí.","en":"I didn't like her at first, but now I do."},{"id":3630,"es":"Al principio no me gustaba el rock, pero ahora sí.","en":"At first I did not like rock music, but now I do."},{"id":3631,"es":"Este nuevo estado podría ser, en principio, cualquier estado microscópico.","en":"This new state could in principle be any microscopic state."},{"id":3632,"es":"Para el campesino, las frutas son más importantes que las flores.","en":"For the peasant, fruits are more important than flowers."},{"id":3633,"es":"Vamos, hablemos de flores.","en":"Come on, let us talk about flowers."},{"id":3634,"es":"Por favor, riega las flores.","en":"Please water the flowers."},{"id":3635,"es":"De hecho, las flores son las creadoras de la miel.","en":"In effect, flowers are the creators of honey."},{"id":3636,"es":"Él le envió algunas flores, además de una bonita tarjeta.","en":"He sent her some flowers, along with a pretty card."},{"id":3637,"es":"La chica de esta imagen lleva una corona, no de oro, sino de flores.","en":"The girl in the picture is wearing a crown not of gold but of flowers."},{"id":3638,"es":"Cuando Juan se paró ante una señal de stop, se le caló el motor.","en":"When Tom stopped for a stop sign, his engine stalled."},{"id":3639,"es":"Como el semáforo se puso rojo, paró el coche.","en":"Because the traffic light turned red, he stopped his car."},{"id":3640,"es":"Aunque paró de llover, el viento seguía soplando con fuerza.","en":"Though it stopped raining, the wind was still blowing hard."},{"id":3641,"es":"Donde antes estaba la frontera de la ciencia, ahora se encuentra su centro.","en":"Where the frontier of science once was is now the centre."},{"id":3642,"es":"La política es la ciencia de cómo quién coge qué, cuándo y por qué.","en":"Politics is the science of how who gets what, when and why."},{"id":3643,"es":"La vida no es una ciencia exacta, es un arte.","en":"Life is not an exact science, it is an art."},{"id":3644,"es":"El arte no es una ciencia exacta, es un arte.","en":"Art is not an exact science, it's an art."},{"id":3645,"es":"Si la geometría es la ciencia del espacio, ¿cuál es la ciencia del tiempo ?","en":"If geometry is the science of space, what is the science of time?"},{"id":3646,"es":"Si la ciencia progresa, seremos capaces de resolver tales problemas.","en":"If science makes progress, we'll be able to solve such problems."},{"id":3647,"es":"Estudia astronomía, o la ciencia de las estrellas.","en":"He studies astronomy, or the science of stars."},{"id":3648,"es":"Él es un poco lento, pero por otro lado él es un buen estudiante.","en":"He is a little slow, but otherwise he is a good student."},{"id":3649,"es":"¿Puedes mirar al otro lado, por favor ?","en":"Can you please look the other way?"},{"id":3650,"es":"Por un lado él es gentil, pero por el otro, él es perezoso.","en":"On one hand he is kind, but on the other hand he is lazy."},{"id":3651,"es":"Es verdad, dijo John.","en":"That's right, said John."},{"id":3652,"es":"Aparentemente, Juan no quería ir a la boda de Maria y John.","en":"Tom apparently didn't want to go to Mary and John's wedding."},{"id":3653,"es":"John estaba de pie, solo en el cuarto, con los brazos cruzados.","en":"John was standing alone in the room with his arms folded."},{"id":3654,"es":"¡Hola, John ! ¿Cómo estás ?","en":"Hello, John! How are you?"},{"id":3655,"es":"Normalmente, ¿cómo decides que vas a comer ?","en":"How do you usually decide what to eat?"},{"id":3656,"es":"Normalmente, a los niños les gustan los caramelos.","en":"In general, children are fond of candy."},{"id":3657,"es":"Normalmente, ella se levanta temprano.","en":"She usually gets up early."},{"id":3658,"es":"Juan normalmente pesca desde el muelle, pero a veces pesca desde la playa.","en":"Tom usually fishes off the dock, but sometimes he fishes from the shore."},{"id":3659,"es":"Lo que es hasta ahora, el viaje ha sido muy divertido.","en":"So for we have enjoyed our journey very much."},{"id":3660,"es":"Mr Smith, que me dejó su coche para este viaje, es un rico abogado.","en":"Mr Smith, whose car I borrowed for this trip, is a rich lawyer."},{"id":3661,"es":"El viaje en avión es rápido; el viaje por mar es, sin embargo, relajante.","en":"Air travel is fast; sea travel is, however, restful."},{"id":3662,"es":"Feliz aquél que, como Ulises, hizo un hermoso viaje.","en":"Happy is he who has, like Ulysses, made a wonderful journey."},{"id":3663,"es":"Si hay algo que debe ser llamado sagrado, es el cuerpo humano.","en":"If anything is to be called sacred, it's the human body."},{"id":3664,"es":"El cuerpo del hombre es mortal, pero su alma es inmortal.","en":"A man's body dies, but his soul is immortal."},{"id":3665,"es":"Si hay algo sagrado, el cuerpo humano es sagrado.","en":"If anything is sacred the human body is sacred."},{"id":3666,"es":"Traté de levantarme, pero mi cuerpo estaba pesado como plomo.","en":"I attempted to get up, but my body was heavy as lead."},{"id":3667,"es":"El sonido era irritante, pero inofensivo para el cuerpo humano.","en":"The sound was annoying but harmless to the human body."},{"id":3668,"es":"Cuando nuestros dedos se tocaron, un escalofrío recorrió mi cuerpo.","en":"As our fingers touched, I felt a shiver run through me."},{"id":3669,"es":"Los insectos presentan el cuerpo dividido en cabeza, tórax y abdomen.","en":"The body of an insect is divided into head, thorax and abdomen."},{"id":3670,"es":"Esta mañana hace mucho viento, ¿no ?","en":"There's a lot of wind this morning, isn't there?"},{"id":3671,"es":"Hoy hace mucho viento, ¿no ?","en":"It's pretty windy today, no?"},{"id":3672,"es":"Hoy hace viento, ¿verdad ?","en":"It is windy today, isn't it?"},{"id":3673,"es":"Ella corrió hasta donde mí, y su cabello volaba con el viento.","en":"She ran up to me, her hair flying in the wind."},{"id":3674,"es":"Ella estaba de pie en la playa, con su cabello ondeando al viento.","en":"She stood on the beach with her hair waving in the wind."},{"id":3675,"es":"Si disminuye el viento, iremos.","en":"If the wind dies down, we'll go."},{"id":3676,"es":"Con el viento, el humo se desvaneció.","en":"The smoke vanished with the wind."},{"id":3677,"es":"Tenía su nombre en la punta de la lengua, pero no lograba recordarlo.","en":"His name was on the tip of my tongue, but I couldn't remember it."},{"id":3678,"es":"Según mi opinión, el alemán es la mejor lengua del mundo.","en":"In my opinion, German is the best language in the world."},{"id":3679,"es":"Si usted quiere aprender bien una lengua, estúdiela por su cuenta.","en":"If you want to learn a language well, learn it yourself."},{"id":3680,"es":"Si quieres aprender bien una lengua, apréndela por ti mismo.","en":"If you want to learn a language well, learn it yourself."},{"id":3681,"es":"Me gustaría añadir una nueva lengua en Tatoeba, ¿qué tengo que hacer ?","en":"I'd like to add a new language in Tatoeba, what do I have to do?"},{"id":3682,"es":"Ella me gusta, pero a veces su lengua afilada me irrita mucho.","en":"I like her, but sometimes her sharp tongue irritates me so much."},{"id":3683,"es":"Él está cansado, y yo también.","en":"He is tired, and so am I."},{"id":3684,"es":"Está cansado, ¿no es así ?","en":"You are tired, aren't you?"},{"id":3685,"es":"Tú estás cansado, y yo también.","en":"You are tired, and so am I."},{"id":3686,"es":"Estoy muy cansado, pero bien.","en":"I am very tired, but well."},{"id":3687,"es":"Había reparado mi reloj, pero se rompió de nuevo.","en":"I had had my watch repaired, but it broke again."},{"id":3688,"es":"Scott primero cambió un reloj por un libro, luego el libro por dinero.","en":"Scott first changed a watch for a book, then the book for money."},{"id":3689,"es":"Cuanto más tiempo pasaba en París, más me gustaba.","en":"The longer I stayed in Paris, the more I liked it."},{"id":3690,"es":"Cuando era chico, me gustaba cazar luciérnagas y guardarlas en un frasco.","en":"As a child, I liked catching fireflies and putting them inside a jar."},{"id":3691,"es":"Al día siguiente, Isabela volvió a casa.","en":"The next day, Isabela came back home."},{"id":3692,"es":"Yo estaba cansado y lo que es peor, tenía sueño.","en":"I was tired and, what is worse, I was sleepy."},{"id":3693,"es":"Según él, sí.","en":"According to him, yes."},{"id":3694,"es":"Según lo que oí, el fue a Estados Unidos a estudiar biología.","en":"According to what I heard, he went over to America to study biology."},{"id":3695,"es":"Según Tom, Maria es una fiera en la cama.","en":"According to Tom, Mary is wild in bed."},{"id":3696,"es":"Cuando él se jubiló, su hijo tomó el mando de su negocio.","en":"When he retired, his son took over his business."},{"id":3697,"es":"A pesar de su advertencia, él se tomó el asunto a la ligera.","en":"Despite her warning, he made little of the matter."},{"id":3698,"es":"Me tomó bastante tiempo, pero finalmente logré convencerlo.","en":"It took a long time, but in the end I was able to convince him."},{"id":3699,"es":"Juan cenó, pero no tomó postre.","en":"Tom ate dinner, but he didn't eat any dessert."},{"id":3700,"es":"Hasta donde yo sé, esta es la única traducción disponible.","en":"As far as I know, this is the only translation available."},{"id":3701,"es":"Aunque decidí ir a la fiesta, no la espero con entusiasmo.","en":"Though I have decided to go to the party, I'm not looking forward to it."},{"id":3702,"es":"Buscaba algo de emoción, así que decidí traer las esposas.","en":"I was looking for some excitement so I decided to bring the handcuffs."},{"id":3703,"es":"Acabo de comer, así que no tengo hambre.","en":"I've just eaten so I'm not hungry."},{"id":3704,"es":"Me acabo de enterar de que está enfermo, así que lo visitaré luego.","en":"I just found out that he's sick, so I'll visit him later."},{"id":3705,"es":"¡Oye, acabo de verlo en las noticias ! ¡Rayos, me haces dudar a mis propios ojos !","en":"Man, I just saw it on the news! Damn, you're making me doubt my own eyes!"},{"id":3706,"es":"«¿Conoces a Fausto ? » «Por supuesto, le acabo de ver hace un rato.»","en":"Do you know Faust? Of course, I've just seen it a little while ago."},{"id":3707,"es":"¿Has terminado ? Al contrario, acabo de empezar.","en":"Are you done? On the contrary, we've just been getting started."},{"id":3708,"es":"Le llamé la atención varias veces, pero él no para de hablar.","en":"I warned him many times, but he won't stop talking."},{"id":3709,"es":"Cuando era pequeño, mi padre me habló varias veces del Pabellón de Oro.","en":"When I was young, my father often talked to me about the Golden Pavilion."},{"id":3710,"es":"Hemos discutido el problema varias veces, pero ha sido inútil.","en":"We have discussed the problem several times but to no avail."},{"id":3711,"es":"Compré varias guías, pero ninguna me sirvió de ayuda.","en":"I bought several guidebooks, none of which helped me."},{"id":3712,"es":"Si hubiera podido hablar francés mejor, podría haber conseguido ese trabajo.","en":"If I could have spoken French better, I might have gotten that job."},{"id":3713,"es":"Si Bob hubiera seguido mi consejo, todo estaría en orden ahora.","en":"If Bob had taken my advice, everything would be all right now."},{"id":3714,"es":"Cuando se perdió, deseó haber seguido su consejo.","en":"When she got lost, she wished she had followed his advice."},{"id":3715,"es":"Si tuviera dinero, saldría seguido y me divertiría.","en":"If I had the money, I would often go out and have fun."},{"id":3716,"es":"Ayer fuiste al parque, ¿verdad ?","en":"You went to the park yesterday, didn't you?"},{"id":3717,"es":"No fuiste particularmente discreto, por lo que no es sorpresa que te han pillado.","en":"You weren't particularly discreet, so it's no wonder you got caught."},{"id":3718,"es":"Tú fuiste quien sugirió que comiéramos comida china, así que no te quejes.","en":"You're the one who suggested we eat Chinese food, so don't complain."},{"id":3719,"es":"¡Ajá ! Fuiste tú, ¿no ?","en":"Aha! You went, right?"},{"id":3720,"es":"Era tan pobre, que no podía comprar pan.","en":"He was so poor that he couldn't buy bread."},{"id":3721,"es":"¿Me compras algo de pan, por favor ?","en":"Will you buy me some bread, please?"},{"id":3722,"es":"Yo compré pan, café, azúcar, entre otros.","en":"I bought bread, coffee, sugar and the like."},{"id":3723,"es":"Compré pan, café, azúcar y cosas por el estilo.","en":"I bought bread, coffee, sugar and the like."},{"id":3724,"es":"Placer siempre se encuentra en pasado o en futuro, pero nunca en presente.","en":"Pleasure is always in the past or in the future, never in the present."},{"id":3725,"es":"El placer es un pecado, y a veces el pecado es un placer.","en":"Pleasure's a sin, and sometimes sin's a pleasure."},{"id":3726,"es":"No mienta nunca, ni por placer ni por miedo.","en":"Never tell a lie, either for fun or from fear."},{"id":3727,"es":"¡Querida, el placer es mío ! Si tienes alguna pregunta, házmelo saber.","en":"That's my pleasure, dear! If you have any questions, let me know!"},{"id":3728,"es":"Es un placer conocerlo, Ken.","en":"Nice to meet you, Ken."},{"id":3729,"es":"Fue un placer conocerlo, señor Tamori.","en":"It was a pleasure meeting you, Mr Tamori."},{"id":3730,"es":"Si no quieres hacerlo por Tom, hazlo por mí.","en":"If you don't want to do it for Tom, then do it for me."},{"id":3731,"es":"Por favor, hazlo por mí.","en":"Please do this for me."},{"id":3732,"es":"Hazlo ya, antes de que se te olvide.","en":"Do it right now, before you forget."},{"id":3733,"es":"Venga, hazlo por mí, no te vas a morir por conocer a mis padres.","en":"Come on, do it for me, you're not going to die for meeting my parents."},{"id":3734,"es":"Hazlo con cuidado, no me gustan las chapuzas.","en":"Do it carefully. I don't like botched jobs."},{"id":3735,"es":"Éramos dos, pero sólo teníamos un corazón.","en":"We were two, but only had one heart."},{"id":3736,"es":"Hogar es donde está el corazón, y mi corazón siempre está con mi familia.","en":"Home is where the heart is and my heart is always with my family."},{"id":3737,"es":"En su corazón, Juan sabía que él nunca regresaría.","en":"In his heart, Tom knew that he would never return."},{"id":3738,"es":"Tú me rompiste el corazón, dijo María.","en":"You broke my heart, said Mary."},{"id":3739,"es":"Para mi sorpresa, él se ganó el premio.","en":"To my surprise, he won the prize."},{"id":3740,"es":"Para nuestra sorpresa, el ganó el gran premio.","en":"To our surprise, he won the grand prize."},{"id":3741,"es":"En 1958, Brasil ganó su primera Copa del Mundo.","en":"In 1958, Brazil won its first World Cup victory."},{"id":3742,"es":"Tal como se esperaba, él ganó el premio.","en":"As was expected, he won the prize."},{"id":3743,"es":"Afortunadamente, él ganó el partido.","en":"Luckily, he won the game."},{"id":3744,"es":"Juan ganó $10,000 en la lotería.","en":"Tom won $10,000 in the lottery."},{"id":3745,"es":"Lo siento, trabajo a media jornada desde mañana por la mañana.","en":"Sorry, I've got part-time work from the morning tomorrow."},{"id":3746,"es":"Ahora estamos libres, pero tenemos una reunión en media hora.","en":"We're free right now, but we've got a meeting in a half-hour."},{"id":3747,"es":"Esperé a mi amigo durante media hora, pero no apareció.","en":"I waited half an hour for my friend, but he didn't turn up."},{"id":3748,"es":"Por favor, apaga las luces al salir.","en":"Please turn out the lights when you leave."},{"id":3749,"es":"Apaga la radio, por favor.","en":"Please turn off the radio."},{"id":3750,"es":"Por favor, apaga la radio.","en":"Please turn off the radio."},{"id":3751,"es":"Apaga la luz antes de acostarte, por favor.","en":"Please turn off the light before you go to bed."},{"id":3752,"es":"Apaga la luz cuando salgas de la pieza, por favor.","en":"Please turn off the light when you leave the room."},{"id":3753,"es":"Dos vasos de jugo de manzana, por favor.","en":"Two glasses of apple juice, please."},{"id":3754,"es":"Sí, jugo de naranja, por favor.","en":"Yes, orange juice, please."},{"id":3755,"es":"Dos vasos de jugo de naranja, por favor.","en":"Two glasses of orange juice, please."},{"id":3756,"es":"Hola, quisiera un poco de fresco jugo de naranja.","en":"Hello, I would like some fresh orange juice."},{"id":3757,"es":"Dejándolo fuera del freezer, el jugo se va a calentar.","en":"Left outside the freezer, the juice will get warm."},{"id":3758,"es":"Nosotros estábamos en el molino, cerca del campo de cáñamo.","en":"We were at the mill, near the hemp field."},{"id":3759,"es":"Después del viaje, estábamos hechos polvo.","en":"After the trip, we felt very tired."},{"id":3760,"es":"Mientras estábamos ocupados, 2 horas pasaron de nuevo.","en":"While we were busy, 2 hours passed again."},{"id":3761,"es":"Cuando nos despertamos, estábamos a la deriva en mar abierto.","en":"When we awoke, we were adrift on the open sea."},{"id":3762,"es":"Si pierdo el tren, tomaré el bus.","en":"If I miss the train, I'll get on the bus."},{"id":3763,"es":"Si mañana lloviera, nosotros vamos en bus.","en":"If it should rain tomorrow, we would go by bus."},{"id":3764,"es":"Justo en ese momento, el bus se detuvo.","en":"Just then, the bus stopped."},{"id":3765,"es":"No te quiero apresurar, pero tratemos de tomar el siguiente bus.","en":"I don't want to rush you, but let's try to catch the next bus."},{"id":3766,"es":"El bus se detuvo, pero nadie se bajó.","en":"The bus stopped, but no one got out."},{"id":3767,"es":"La Sra. Klein tiene ya ochenta y tantos, pero todavía está muy activa.","en":"Mrs. Klein is already in her eighties, but she's still very spry."},{"id":3768,"es":"Si no hubiera tantos taxis, habría menos accidentes viales.","en":"If there weren't so many taxis, there would be fewer traffic accidents."},{"id":3769,"es":"El ladrón me golpeó y me dejó un ojo morado, y entonces huyó.","en":"The thief hit me and gave me a black eye and then ran off."},{"id":3770,"es":"No soy el ladrón, ¡sos testigo !","en":"I'm not the thief, you are a witness!"},{"id":3771,"es":"Cuando todos estaban durmiendo, el ladrón se infiltró en las oficinas centrales.","en":"The thief get in the main offices when everyone was sleeping."},{"id":3772,"es":"Mentiroso hoy, ladrón mañana.","en":"Liar today, thief tomorrow."},{"id":3773,"es":"En portugués, lalau es sinónimo de ladrón.","en"

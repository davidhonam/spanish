:754,"es":"La comida es buena, y el servicio aquí es bueno.","en":"The food is good, and service is good here."},{"id":755,"es":"Aún cuando la propuesta parecía ser una buena idea, ellos la rechazaron.","en":"Although the proposal seemed like a good idea, they refused it."},{"id":756,"es":"Tu composición es muy buena, y tiene pocos errores.","en":"Your composition is very good, and it has few mistakes."},{"id":757,"es":"Como yo lo veo, esa es la mejor forma.","en":"As I see it, that is the best way."},{"id":758,"es":"Esa mujer es su esposa, creo.","en":"That woman is his wife, I think."},{"id":759,"es":"Si esa guitarra no fuera tan cara, la podría comprar.","en":"If that guitar were not so expensive, I could buy it."},{"id":760,"es":"Usted puede fumar en esa habitación, pero no debe fumar en ésta.","en":"You may smoke in that room, but you mustn't smoke in this room."},{"id":761,"es":"Esa vez, Juan era la única persona en el cuarto.","en":"Tom was the only person in the room at the time."},{"id":762,"es":"Ser, o no ser, esa es la cuestión.","en":"To be, or not to be, that is the question."},{"id":763,"es":"Ahora que lo pienso, creo que me tomaré un trozo de esa tarta.","en":"On second thought, I think I will have a slice of that pie."},{"id":764,"es":"Me preguntó si tenía experiencia en esa área, y le dije que no.","en":"He asked me if I had experience in this area, and I said no."},{"id":765,"es":"Tu madre es muy joven, ¿verdad ?","en":"Your mother is very young, isn't she?"},{"id":766,"es":"Hijo, vuelve con tu madre.","en":"Son, go back to your mother."},{"id":767,"es":"¿Me puedes dar tu nombre y número de teléfono, por favor ?","en":"May I have your name and telephone number, please?"},{"id":768,"es":"¿Puedes dar la luz, por favor ?","en":"Could you turn on the light please?"},{"id":769,"es":"Hoy, en lugar de limpiar la casa, creo que voy a dar un paseo.","en":"Instead of cleaning the house today, I think I'll take a walk."},{"id":770,"es":"Después de su sangre, lo mejor que un hombre puede dar de sí mismo es una lágrima.","en":"After his own blood, the best a man can give of himself it's a tear."},{"id":771,"es":"Si Dios está con nosotros, entonces ¿quién está en nuestra contra ?","en":"If God is with us, then who is against us?"},{"id":772,"es":"Para nuestra sorpresa, Juan vino con Maria a nuestra fiesta.","en":"To our surprise, Tom came to our party with Mary."},{"id":773,"es":"La biblioteca de nuestra escuela es pequeña, pero nueva.","en":"Our school library is small, but new."},{"id":774,"es":"A John, el chico más alto de nuestra clase, le llamamos Don Alto.","en":"John, the tallest boy in our class, is nicknamed Mr High."},{"id":775,"es":"Para llegar a los pagos de nuestra casa, vamos a tener que apretarnos el cinturón.","en":"To make our house payments, we're going to have to tighten our belts."},{"id":776,"es":"Hay muchas personas talentosas en nuestra ciudad, pero Juan no es uno de ellos.","en":"There are many talented people in our city, but Tom isn't one of them."},{"id":777,"es":"Con un poco de planificación, creo que podemos llevar a nuestra compañía a la cima.","en":"With a little planning, I think we can take our company to the top."},{"id":778,"es":"Por alguna razón, me siento más vivo por la noche.","en":"For some reason I feel more alive at night."},{"id":779,"es":"Él rara vez va a la iglesia, si es que alguna vez.","en":"He seldom, if ever, goes to church."},{"id":780,"es":"Estoy seguro de haberle visto en alguna parte, pero no me acuerdo de quién es.","en":"I am sure I met him somewhere, but I do not remember who he is."},{"id":781,"es":"Escríbeme alguna vez, ¿de acuerdo ?","en":"Write me sometime, OK?"},{"id":782,"es":"Por alguna razón, ella no podía dormir.","en":"For some reason, she couldn't sleep."},{"id":783,"es":"Si alguna vez estás en Japón, ven a verme.","en":"If you are ever in Japan, come and see me."},{"id":784,"es":"¿Perdió alguna cosa, señora ?","en":"Did you lose anything, miss?"},{"id":785,"es":"Un barco de vapor es, sin duda alguna, una ciudad por sí misma.","en":"A steamship is, without doubt, a city in itself."},{"id":786,"es":"Quisiera poner mis objetos de valor en una caja fuerte segura, si hay alguna disponible.","en":"I'd like to put my valuables in a safe deposit box, if any are available."},{"id":787,"es":"Es cierto que sabes muchas cosas, pero no se te da bien enseñarlas.","en":"Indeed you know a lot of things, but you're not good at teaching them."},{"id":788,"es":"Para muchas mujeres, el amor es lo primero.","en":"With many women, love always comes first."},{"id":789,"es":"Cuando yo era niño, pasaba muchas horas solo, leyendo en mi dormitorio.","en":"When I was a child, I would spend hours reading alone in my room."},{"id":790,"es":"Aún cuando había muchas galletas en el plato, yo comí sólo tres.","en":"Even though there were many cookies on the dish, I only ate three."},{"id":791,"es":"Yo conozco a un hombre que tiene muchas caras, pero sólo un sombrero.","en":"I know a man who has many faces but only one hat."},{"id":792,"es":"Por más que intentó, él no pudo abrir la puerta.","en":"Try as he might, he couldn't get the door open."},{"id":793,"es":"Juan trató de hablar, pero no pudo.","en":"Tom tried to speak, but couldn't."},{"id":794,"es":"Él intentó hacer feliz a su esposa, pero no pudo.","en":"He tried to make his wife happy, but he couldn't."},{"id":795,"es":"Juan intentó abrir la puerta, pero no pudo.","en":"Tom tried to open the door, but couldn't."},{"id":796,"es":"Ella pudo resolver el problema, igual que yo.","en":"She could solve the problem, and so could I."},{"id":797,"es":"¿Tom no pudo resolver el problema, o sí ?","en":"Tom couldn't solve the problem, could he?"},{"id":798,"es":"A causa de la fuerte lluvia, no pudo salir.","en":"He could not go out because of the heavy rain."},{"id":799,"es":"Si puedes, ven con nosotros.","en":"If you can, come with us."},{"id":800,"es":"Debes comer para vivir, no vivir para comer.","en":"You must eat to live. You must not live to eat."},{"id":801,"es":"Si quieres obtener algo en la vida, debes nadar contra la corriente.","en":"If you want to get something in life, you should go against the flow."},{"id":802,"es":"Antes de poder amar a los otros, debes ser capaz de amarte a ti mismo.","en":"Before you can love others, you need to be able to love yourself."},{"id":803,"es":"Haz lo que debes hacer, pase lo que pase.","en":"Do what you ought to, come what may."},{"id":804,"es":"Pase lo que pase, debes estar aquí a las nueve.","en":"No matter what happens, you must be here by nine."},{"id":805,"es":"Debes tomarte esta medicina, tanto si te gusta como si no.","en":"You must take this medicine, whether you like it or not."},{"id":806,"es":"No importa qué hagas, pero debes seguir el camino correcto.","en":"No matter what you do you must follow the right path."},{"id":807,"es":"Como hacía tanto calor, fuimos a nadar.","en":"Since it was so hot, we went swimming."},{"id":808,"es":"Me gustan tanto Susan como Betty, pero yo creo que Susan es más agradable.","en":"I like both Susan and Betty, but I think Susan is the nicer."},{"id":809,"es":"Este es un pequeño paso para el hombre, pero un gran salto para la humanidad.","en":"That's one small step for man, one giant leap for mankind."},{"id":810,"es":"Eso no es ninguna gran sorpresa, ¿o sí ?","en":"It's not much of a surprise, is it?"},{"id":811,"es":"Si él no hubiera muerto tan pronto, se hubiera convertido en un gran científico.","en":"If he had not died so young, he would have become a great scientist."},{"id":812,"es":"Ese es un gran edificio, ¿no ?","en":"That is a high building, is it not?"},{"id":813,"es":"Por lo que dices, ha de ser un gran escritor.","en":"Judging from what you say, he must be a great writer."},{"id":814,"es":"Aunque era joven, tenía que apoyar a su gran familia.","en":"Though young, he had to support his large family."},{"id":815,"es":"Según el periódico de hoy, ayer hubo un gran terremoto en Chile.","en":"According to today's paper, there was a big earthquake in Chile yesterday."},{"id":816,"es":"Negro o blanco, un gato que atrape los ratones es un gran gato.","en":"Black or white, a cat that catches mice is a great cat."},{"id":817,"es":"Según el periódico, parece que ha habido un gran incendio en Boston.","en":"According to the paper, there was a big fire in Boston."},{"id":818,"es":"Intentó, en vano, conseguir una gran cantidad de dinero de ellos.","en":"He tried, in vain, to borrow a large sum of money from them."},{"id":819,"es":"Has leído el libro, ¿no ?","en":"You've read through the book, haven't you?"},{"id":820,"es":"Por favor, ven a casa a veces.","en":"Please come home sometimes."},{"id":821,"es":"A veces voy, otras veces no.","en":"Sometimes I go and sometimes I don't."},{"id":822,"es":"A veces, Juan puede ser difícil de tratar.","en":"Tom can be difficult to deal with at times."},{"id":823,"es":"A veces hacemos lo que debemos hacer, no lo que queremos hacer.","en":"Sometimes we do what we have to do, not what we want to do."},{"id":824,"es":"Ella me agrada mucho, pero a veces me saca de las casillas.","en":"I like him a lot, but sometimes he gets on my nerves."},{"id":825,"es":"Nuestro profesor no solo habla inglés, también francés.","en":"Our teacher doesn't just speak English, but French too."},{"id":826,"es":"Por favor, cuida de nuestro perro mientras no estamos.","en":"Please take care of our dog while we're away."},{"id":827,"es":"Por favor, deje un mensaje después de la señal o algunos caramelos en nuestro buzón.","en":"Please leave a message after the beep or drop some candies in our mailbox."},{"id":828,"es":"La mañana siguiente, para nuestro alivio, él volvió a casa sano y salvo.","en":"The next morning, to our great relief, he returned home safe and sound."},{"id":829,"es":"Sin tu ayuda, no podríamos llevar a cabo nuestro plan.","en":"Without your help, we wouldn't be able to carry out our plan."},{"id":830,"es":"Padre nuestro que estás en el cielo, santificado sea tu nombre.","en":"Our Father in heaven, hallowed be your name."},{"id":831,"es":"Donde nació mi madre, está situado en el este de nuestro país.","en":"Where my mother born, it is located in the east of our country."},{"id":832,"es":"Éste no es nuestro coche, es el suyo.","en":"This is not our car, it is theirs."},{"id":833,"es":"Si no tienes cuidado, podrías tener un accidente.","en":"If you're not careful, you might have an accident."},{"id":834,"es":"Si das lo mejor, seguro que vas a tener éxito.","en":"If you do your best, you're likely to succeed."},{"id":835,"es":"Si usted no puede tener hijos, siempre tiene la opción de adoptarlos.","en":"If you can't have children, you could always adopt."},{"id":836,"es":"Decidí tratar de aprender el esperanto, sólo para tener una experiencia nueva.","en":"I decided to try to learn Esperanto, just to make a new experience."},{"id":837,"es":"Puedes tener cualquiera de los dos, pero no ambos.","en":"You can have either of these, but not both."},{"id":838,"es":"Esa mujer no es gorda, va a tener un bebé.","en":"That woman isn't fat, she is going to have a baby."},{"id":839,"es":"A juzgar por la apariencia del cielo, vamos a tener buen clima.","en":"Judging from how the sky looks, we'll be having fine weather."},{"id":840,"es":"¿Me puede traer la cuenta, por favor ?","en":"Can you bring me the bill, please?"},{"id":841,"es":"En Japón, todos los niños van a la escuela.","en":"In Japan, all children go to school."},{"id":842,"es":"Más niños, más manos.","en":"More kids, more hands."},{"id":843,"es":"Tom, tú cuida a los niños.","en":"You look after the children, Tom."},{"id":844,"es":"Uno de los niños estudia, pero los otros juegan.","en":"One of the children is studying, but the others are playing."},{"id":845,"es":"Vamos niños, es hora de dormir.","en":"Come on, children, it's time for bed."},{"id":846,"es":"Después de la muerte de su marido, sacó adelante a los dos niños ella sola.","en":"After her husband's death, she brought up the two children all by herself."},{"id":847,"es":"Hoy en día, los niños ya no juegan en la calle.","en":"These days, kids no longer play in the street."},{"id":848,"es":"Es difícil, pero lo voy a conseguir.","en":"It's hard, but I'm going to make it!"},{"id":849,"es":"El inglés es difícil, ¿verdad ?","en":"English is hard, isn't it?"},{"id":850,"es":"Entiendo lo que se dice y se escribe, pero hablar es difícil para mí.","en":"I understand what's said and written, but it's hard for me to speak."},{"id":851,"es":"Ayer no fui, de manera que tengo que ir hoy.","en":"I didn't go yesterday, so I have to go today."},{"id":852,"es":"Como estaba cansado, me fui a la cama.","en":"As I was tired, I went to bed."},{"id":853,"es":"Como ya era tarde, me fui a dormir.","en":"Since it was already late, I went to sleep."},{"id":854,"es":"Puesto que era un día agradable, me fui a caminar a los alrededores de la ciudad.","en":"It being a fine day, I took a walk in the suburbs."},{"id":855,"es":"Estoy en medio de algo, ¿me puedes llamar después ?","en":"I'm in the middle of something, can you call me back?"},{"id":856,"es":"Después de comer, siempre me da sueño.","en":"After supper, I always find myself falling asleep."},{"id":857,"es":"Por cierto, ¿crees que hay algo después de la muerte ?","en":"By the way, do you think there's anything after death?"},{"id":858,"es":"En caso de que no pueda venir, te marco antes.","en":"In case I can’t come, I’ll give you a call beforehand."},{"id":859,"es":"En ese caso, llama a la policía.","en":"In that case, call the police."},{"id":860,"es":"No odio a las mujeres, pero si fuera el caso, haría una excepción contigo.","en":"I'm not a woman hater; and if I were, I would make an exception for you."},{"id":861,"es":"En caso que quieras, yo lo haré.","en":"In case you want, I will do it."},{"id":862,"es":"En ese caso, cambiaré de idea.","en":"In that case, I'll change my mind."},{"id":863,"es":"Por favor, que alguien más lo haga.","en":"Please have someone else do it."},{"id":864,"es":"¿Puede alguien abrir la puerta, por favor ?","en":"Can someone open the door please?"},{"id":865,"es":"¿Podría alguien abrir la puerta, por favor ?","en":"Could somebody please open the door?"},{"id":866,"es":"La cosa es, que realmente no quiero.","en":"The thing is, I don't really want to."},{"id":867,"es":"A mí realmente él no me gusta, en pocas palabras, creo que es un idiota.","en":"I don't really like him, in a nutshell, I think he is an idiot."},{"id":868,"es":"De lejos, se ve mucho más joven de lo que realmente es.","en":"Seen from a distance, he looks much younger than he really is."},{"id":869,"es":"Si realmente quieres saber, ¿por qué no le preguntas a Juan ?","en":"If you really want to know, why don't you ask Tom?"},{"id":870,"es":"Ahora, esto es realmente importante.","en":"Now, this is really important."},{"id":871,"es":"Me agrada él, pero al mismo tiempo no confío realmente en él.","en":"I like him, but at the same time I don't really trust him."},{"id":872,"es":"Todas las personas que están solas, están solas porque tienen miedo de los demás.","en":"Every person who is alone is alone because they are afraid of others."},{"id":873,"es":"Los niños lo tienen todo, excepto lo que les quitamos.","en":"Children have everything, except what we take away from them."},{"id":874,"es":"Las mujeres tienen belleza, ¿pero acaso los libros también tienen belleza, no ?","en":"Women have beauty, but do books not also have beauty?"},{"id":875,"es":"En una sociedad acomodada, la mayoría de las personas tienen altos estándares de vida.","en":"In an affluent society most people have a high standard of living."},{"id":876,"es":"Estos días, los chicos tienen sus propias bicicletas.","en":"Boys have their own bikes these days."},{"id":877,"es":"Los monos también matan a gente, pero solo si tienen pistolas.","en":"Monkeys kill people too, but only if they have guns."},{"id":878,"es":"En Francia, los trabajadores tienen cuatro semanas de vacaciones pagadas al año.","en":"Workers in France receive four weeks of paid vacation each year."},{"id":879,"es":"Sí, yo igual pienso eso.","en":"Yes, I think so, too."},{"id":880,"es":"Da igual lo que digas, lo haré a mi manera.","en":"Whatever you say, I'll do it my way."},{"id":881,"es":"Le pedí a Juan que no fuera allá, pero el fue igual.","en":"I asked Tom not to go there, but he went anyway."},{"id":882,"es":"Nadie puede ser tan grande como Dios, pero cualquiera de nosotros puede ser igual de bueno.","en":"None of us can be as great as God, but any of us can be as good."},{"id":883,"es":"No puedo nadar, al igual que un pez no puede nadar.","en":"I can no more swim than a fish can walk."},{"id":884,"es":"Hazlo de nuevo, igual que antes.","en":"Do it again, just like before."},{"id":885,"es":"Él es muy inteligente, igual que su hermano.","en":"He is very intelligent, as is his brother."},{"id":886,"es":"Así que, ¿dónde quieres hacer esto ?","en":"So, where do you want to do this?"},{"id":887,"es":"Vale, esto es lo que vamos a hacer.","en":"OK, this is what we are going to do."},{"id":888,"es":"Si no quieren esto, ¿qué es lo que quieren ?","en":"If they don't want this, then what do they want?"},{"id":889,"es":"Quieres esto, ¿verdad ?","en":"You want it, don't you?"},{"id":890,"es":"Por favor, haz esto por mí.","en":"Please do this for me."},{"id":891,"es":"Sí, de verdad me gusta.","en":"Yes, I really like him."},{"id":892,"es":"Yo no tengo coche, pero mi hermana sí.","en":"I don't have a car, but my sister does."},{"id":893,"es":"Por cierto, ¿ha oído de ella desde entonces ?","en":"By the way, have you heard from her since then?"},{"id":894,"es":"Entonces, ¿tu hermano es blanco ?","en":"So, is your brother white?"},{"id":895,"es":"Vamos a comer mucho esta noche, entonces espero que no estés a régimen.","en":"We're going to eat a lot tonight so I hope you're not on a diet."},{"id":896,"es":"Entonces, hay un problema.","en":"Then there is a problem..."},{"id":897,"es":"De hecho lo conozco, pero no me acuerdo de dónde.","en":"Actually I know him, I just can't remember where from."},{"id":898,"es":"Lo hecho, hecho está.","en":"What's done cannot be undone."},{"id":899,"es":"Unos días después, vino.","en":"A few days later, he came."},{"id":900,"es":"Por favor, préstame este libro por unos pocos días.","en":"Please lend me this book for a few days."},{"id":901,"es":"Sí, ella estará contigo en unos minutos.","en":"Yes, she'll be with you in a minute."},{"id":902,"es":"Vista a lo lejos, ella parecía una mujer de unos cincuenta.","en":"Seen at a distance, she looked like a woman of about fifty."},{"id":903,"es":"Si me disculpa por unos minutos, me gustaría hacer una llamada.","en":"If you will excuse me for a few minutes, I'd like to make a call."},{"id":904,"es":"Tienes unos adorables ojos, ¿no es así ?","en":"You have lovely eyes, don't you?"},{"id":905,"es":"Los que son terroristas para unos, son la resistencia para otros.","en":"Those who are terrorists for some, are resistance for others."},{"id":906,"es":"Había unos pasajeros heridos, pero le resto estaba a salvo.","en":"Some passengers were injured, but the others were safe."},{"id":907,"es":"Si yo fuera tú, haría lo mismo.","en":"If I were you, I would also do the same."},{"id":908,"es":"Al final, todo el mundo debe aprender por sí mismo.","en":"Everyone must learn on their own in the end."},{"id":909,"es":"Cualquier cosa que hago, ella dice que puedo hacerlo mejor.","en":"Whatever I do, she says I can do better."},{"id":910,"es":"De cualquier manera, te llamo mañana.","en":"In any case, I'll call you tomorrow."},{"id":911,"es":"Cuando era joven podía recordar cualquier cosa, hubiera pasado o no.","en":"When I was younger I could remember anything, whether it happened or not."},{"id":912,"es":"Por tu amor, haría cualquier cosa.","en":"For your love, I would do anything."},{"id":913,"es":"Cuando yo era niño, podía dormir en cualquier parte.","en":"When I was a child, I could sleep anywhere."},{"id":914,"es":"Cuando era más joven, pensaba que podía hacer cualquier cosa.","en":"When I was younger, I thought I could do anything."},{"id":915,"es":"Puedes comer cualquier cosa, siempre que no comas demasiado.","en":"You may eat anything so long as you don't eat too much."},{"id":916,"es":"Cualquier cosa que te diga, no confíes en él.","en":"Don't trust him, whatever he says."},{"id":917,"es":"Nunca has oído de mí, ¿verdad ?","en":"You've never heard of me, have you?"},{"id":918,"es":"Una vez que has empezado una cosa, no la dejes.","en":"Once you've started something, don't give it up."},{"id":919,"es":"Has visto algo, ¿verdad ?","en":"You've seen something, haven't you?"},{"id":920,"es":"Si no te has comido tu plato en tres minutos, no recibirás postre.","en":"If you don't finish your plate in three minutes, you won't get dessert."},{"id":921,"es":"Has querido ir allí durante mucho tiempo, ¿no ?","en":"You have wanted to go there for a long time, haven't you?"},{"id":922,"es":"Has perdido, ¿verdad ?","en":"You lost, didn't you?"},{"id":923,"es":"Lo conozco, pero no conozco su nombre.","en":"I know him but I don’t know his name."},{"id":924,"es":"Lo conozco de vista, pero no por su nombre.","en":"I know him by sight, but not by name."},{"id":925,"es":"No sé su nombre, pero lo conozco de vista.","en":"I don't know her name, but I do know her by sight."},{"id":926,"es":"La conozco de nombre, pero no de vista.","en":"I know her by name, but not by sight."},{"id":927,"es":"¡Por favor, da la luz !","en":"Please, turn on the light!"},{"id":928,"es":"Da igual lo que pueda decir, no cambiaré de opinión.","en":"Whatever he may say, I won't change my mind."},{"id":929,"es":"Da lo mejor, y tendrás éxito.","en":"Do your best, and you will succeed."},{"id":930,"es":"Se come para vivir, no se vive para comer.","en":"We eat to live, not live to eat."},{"id":931,"es":"Vivo para comer, y no como para vivir.","en":"I live to eat, and I don't eat to live."},{"id":932,"es":"Ya han pasado casi diez años, pero eres tan bella como siempre.","en":"It's been almost ten years, but you're as beautiful as ever."},{"id":933,"es":"En su comienzo, el hombre era casi lo mismo que los otros animales.","en":"In the beginning, man was almost the same as the other animals."},{"id":934,"es":"Juan casi besó a María, pero decidió que no.","en":"Tom almost kissed Mary, but decided not to."},{"id":935,"es":"Cuando ella me dijo que estaba embarazada, casi me da un infarto.","en":"When she told me that she was pregnant, I almost had a heart attack."},{"id":936,"es":"Tras casi un mes, aún recuerdo la palabra.","en":"After almost a month I still remember the word."},{"id":937,"es":"Mi primo tiene cuatro años, pero come casi tanto como yo.","en":"My cousin is four, but he eats as much as I do."},{"id":938,"es":"El toro es más fuerte que el torero, pero casi siempre pierde.","en":"The bull is stronger than the bullfighter, but he almost always loses."},{"id":939,"es":"Cada vez que lo veo, está en cama.","en":"Every time I go to see him, he is in bed."},{"id":940,"es":"Cada vez que escucho esta canción, pienso en él.","en":"Every time I hear this song, I think of his name."},{"id":941,"es":"Cuando era niño, solía ir a la playa cada verano.","en":"When I was a child, I used to go to the seashore every summer."},{"id":942,"es":"Por favor, ven a verme cada cierto tiempo.","en":"Please come to see me from time to time."},{"id":943,"es":"Cada vez que él viene aquí, ordena el mismo plato.","en":"Every time he comes here, he orders the same dish."},{"id":944,"es":"Para cada pueblo su idioma, y un segundo común a todos.","en":"To each group of people its language, and a second, common to all."},{"id":945,"es":"Como escribió la carta muy rápido, ésta tenía muchos errores.","en":"Written too quickly, the letter had many mistakes."},{"id":946,"es":"Tengo muchos deberes, así que no puedo salir.","en":"I can't go out because I have a lot of homework."},{"id":947,"es":"Tú, John, conoces muchos países.","en":"You, John, know many countries."},{"id":948,"es":"Escribieron la carta muy rápido, así que tiene muchos errores.","en":"Written too quickly, the letter had many mistakes."},{"id":949,"es":"Por supuesto, muchos ciudadanos de la tercera edad son felices con el retiro.","en":"Of course, many senior citizens are happy with retirement."},{"id":950,"es":"Por supuesto, muchos ciudadanos de la tercera edad son felices con la jubilación.","en":"Of course, many senior citizens are happy with retirement."},{"id":951,"es":"Durante la guerra, la gente pasó muchos apuros.","en":"During the war, people went through many hardships."},{"id":952,"es":"Cada año, muchos niños son secuestrados por miembros de sus propias familias.","en":"Each year many children are kidnapped by members of their own families."},{"id":953,"es":"Hoy en día, muchos zapatos son hechos de plástico.","en":"Many shoes nowadays are made of plastics."},{"id":954,"es":"Ella tiene muchos novios, pero éste es especial.","en":"She has many boyfriends, but this one is special."},{"id":955,"es":"Él me dio algo de pan, también algo de leche.","en":"He gave me some bread, also some milk."},{"id":956,"es":"No sólo me dio el consejo, sino también el dinero.","en":"Not only did he give me advice, but also money."},{"id":957,"es":"Al fin, él se dio cuenta de que estaba equivocado.","en":"He finally realized that he was wrong."},{"id":958,"es":"Él fue fácil de engañar, y le dio algo de dinero.","en":"He was easily deceived and gave her some money."},{"id":959,"es":"De repente, Jack se dio cuenta de lo que le había ocurrido.","en":"Suddenly, Jack realized what had happened to him."},{"id":960,"es":"Por favor, cuida de mi perro mientras estoy fuera.","en":"Please take care of my dog while I am away."},{"id":961,"es":"¿Pero que le pasará a María mientras yo no esté ? , dijo Georgina con ansiedad.","en":"But what will happen to Mary while I'm gone?, said Georgina anxiously."},{"id":962,"es":"Mientras más pienso en ello, menos me gusta.","en":"The more I think of it, the less I like it."},{"id":963,"es":"Mientras tú estés aquí, me quedo.","en":"As long as you're here, I'll stay."},{"id":964,"es":"Cuida el lugar mientras no estamos, ¿bueno ?","en":"Look after the place while we're out, OK?"},{"id":965,"es":"De acuerdo, lo haré de nuevo.","en":"All right, I will do it again."},{"id":966,"es":"Él no quiere que yo vaya, pero pienso ir.","en":"He doesn't want me to go, but I mean to."},{"id":967,"es":"Bueno, al fin estamos aquí.","en":"Well, here we are at last!"},{"id":968,"es":"En fin, ella se fue a Estados Unidos.","en":"Lastly, she went to America."},{"id":969,"es":"Un vaso de vino blanco, por favor.","en":"A glass of white wine, please."},{"id":970,"es":"Ella pidió ayuda, pero nadie vino.","en":"She requested help, but no one came."},{"id":971,"es":"Cuando vino él, yo estaba escribiendo una carta.","en":"When he came, I was writing a letter."},{"id":972,"es":"Para mí, él no es un extraño.","en":"He is no stranger to me."},{"id":973,"es":"A Juan no le gusta nadar en este río, él dice que está muy contaminado.","en":"Tom doesn't like swimming in this river. He says it's too polluted."},{"id":974,"es":"En cierto sentido, lo que él dice es verdad.","en":"In a sense what he says is true."},{"id":975,"es":"Haga lo que haga, dice que puedo hacerlo mejor.","en":"Whatever I do, she says I can do better."},{"id":976,"es":"Aunque él lo dice, ella lo hará.","en":"Although he says it, she will do it."},{"id":977,"es":"Yo no confío en él, tenga cuidado con lo que dice cuando él está cerca.","en":"I don't trust him; be careful what you say when he's around."},{"id":978,"es":"Quieres estas cosas, ¿verdad ?","en":"You want this stuff, don't you?"},{"id":979,"es":"A pesar de todos nuestros esfuerzos, las cosas no se han mejorado.","en":"For all our efforts, things have not turned out better."},{"id":980,"es":"Estamos, ella y yo, en la misma clase.","en":"We are, her and I, in the same class."},{"id":981,"es":"No hables sobre el trabajo, estamos en vacaciones.","en":"Don't talk about work, we're on vacation."},{"id":982,"es":"Mientras estamos esperando, ¿por qué no me dices qué pasó ?","en":"While we're waiting, why don't you tell me what happened?"},{"id":983,"es":"No sólo estamos en la misma barca, sino que también estamos los dos mareados.","en":"Not only are we all in the same boat, but we are all seasick."},{"id":984,"es":"Ahora estamos comiendo, ¿podría volver a llamar más tarde ?","en":"We are eating now. Could you please call back later?"},{"id":985,"es":"Qué será, será.","en":"Whatever will be, will be."},{"id":986,"es":"El próximo viaje será de placer, no de trabajo.","en":"Our next trip is for pleasure, not for work."},{"id":987,"es":"Al principio será duro, pero todo es duro al principio.","en":"At the beginning it'll be tough, but everything's tough at the beginning."},{"id":988,"es":"Mientras más alto estés, más baja será la temperatura.","en":"The higher you go, the lower the temperature."},{"id":989,"es":"Tarde o temprano, el será un buen abogado.","en":"He'll make a good lawyer sooner or later."},{"id":990,"es":"El trabajo nunca se acaba, ¿verdad ?","en":"Work never ends, does it?"},{"id":991,"es":"Su auto no está acá, así que se debe haber ido.","en":"His car isn't here, so he must have gone."},{"id":992,"es":"¡La gente no, la economía debe andar bien !","en":"Not the people, but the economy must be well!"},{"id":993,"es":"No sólo tú, a mi también se me debe culpar.","en":"Not only you but also I am to blame."},{"id":994,"es":"El mundo me lo debe, así que ¡que te jodan !","en":"The world owes me, so fuck you!"},{"id":995,"es":"Él es un abogado, y debe ser tratado como tal.","en":"He is a lawyer and must be treated as such."},{"id":996,"es":"Él puede hacerlo bien, y tú lo puedes hacer incluso mejor.","en":"He can do it well, and you can do it even better."},{"id":997,"es":"Puedes hacerlo, ¿no ?","en":"You can do it, can't you?"},{"id":998,"es":"Si no quieres hacerlo, ¡no lo hagas !","en":"If you don't want to do it, don't!"},{"id":999,"es":"La única diferencia entre un loco y yo, es que yo no estoy loco.","en":"The only difference between me and a madman is that I'm not mad."},{"id":1000,"es":"Entre más conoce el idioma, menos le gusta.","en":"The better he knows the language, the less he likes it."},{"id":1001,"es":"Entre tú y yo, la idea de Juan no me atrae demasiado.","en":"Between you and me, Tom's idea doesn't appeal to me very much."},{"id":1002,"es":"Llámame entre las siete y las ocho, por favor.","en":"Please call me up between seven and eight."},{"id":1003,"es":"Cuando entre al colegio, quiero ser independiente de mis padres.","en":"I want to be independent of my parents when I enter college."},{"id":1004,"es":"Entre vosotros y yo, ¿os gusta mi hermana ?","en":"Just between you and me, do you love my sister?"},{"id":1005,"es":"Por favor, entre y siéntese.","en":"Please, come in and sit down."},{"id":1006,"es":"Si tuviera que estudiar, me quedaría en casa todos los días.","en":"If I had to study, I would stay at home every day."},{"id":1007,"es":"Si tuviera suficiente dinero, compraría el libro.","en":"If I had enough money, I would buy the book."},{"id":1008,"es":"Si yo tuviera dinero suficiente, podría ir al extranjero.","en":"If I had enough money, I could go abroad."},{"id":1009,"es":"Si yo tuviera un perro, lo llamaría Tom.","en":"If I had a dog, I'd call it Tom."},{"id":1010,"es":"Si tuviera dinero suficiente, me gustaría comprar ese lindo coche.","en":"If I had enough money, I would buy that nice car."},{"id":1011,"es":"Si tuviera el dinero, me quedaría inmediatamente con este ordenador.","en":"If I had the money, I would immediately acquire this computer."},{"id":1012,"es":"Si tuviera dinero, compraría un computador.","en":"If I had money, I'd buy a computer."},{"id":1013,"es":"¿Podría tomar un vaso de leche, por favor ?","en":"May I have a glass of milk, please?"},{"id":1014,"es":"No hace falta que vengas a la oficina, te puedes tomar el día libre.","en":"You don't need to come to the office, you can take the day off."},{"id":1015,"es":"Ahora, te voy a tomar la temperatura.","en":"Now, I'll take your temperature."},{"id":1016,"es":"Con suerte, él llegó a tiempo para tomar el tren.","en":"Being lucky, he was in time for the train."},{"id":1017,"es":"Cuando sea que quieras tomar prestado mi auto, todo lo que tienes que hacer es pedirlo.","en":"Any time you want to borrow my car, all you have to do is ask."},{"id":1018,"es":"Cuando estás cansado, no hay nada como tomar un baño.","en":"When you feel tired, there is nothing like having a bath."},{"id":1019,"es":"Dígame qué bus debo tomar para llegar a la estación, por favor.","en":"Please tell me which bus to take to get to the station."},{"id":1020,"es":"Le aconsejó que dejara de tomar esa medicina, pero él sentía que lo necesitaba.","en":"She advised him to stop taking that medicine, but he felt he needed to."},{"id":1021,"es":"Trabaja duro, o si no, tendrás que tomar el mismo curso otra vez el próximo año.","en":"Work hard, or you'll have to take the same course again next year."},{"id":1022,"es":"Juan quería irse, pero no podía.","en":"Tom wanted to leave, but he couldn't."},{"id":1023,"es":"La chica quería, pero no podía, decirle la verdad.","en":"The girl wanted to, but could not, tell him the truth."},{"id":1024,"es":"Aunque el doctor hacía todo lo que podía, el paciente se recuperaba solo lentamente.","en":"Though the doctor did his best, the patient's recovery was slow."},{"id":1025,"es":"Algunos dicen que perdió, otros que ganó, pero el punto no es ese.","en":"Some say he lost, others say he won, but that's not the point."},{"id":1026,"es":"Trae a los otros, por favor.","en":"Please bring the others."},{"id":1027,"es":"Algunos creen en Dios, pero otros no.","en":"Some believe in God, but others do not."},{"id":1028,"es":"A algunos les gusta el café, y otros prefieren el té.","en":"Some people like coffee and others prefer tea."},{"id":1029,"es":"Algunos fueron a pie, y otros en bicicleta.","en":"Some went on foot, and others by bicycle."},{"id":1030,"es":"Cierra la puerta, por favor.","en":"Please close the door."},{"id":1031,"es":"Estudié francés cuando tenía siete años, pero ahora solo me acuerdo de algunas palabras.","en":"I studied French when I was seven, but now I only remember a few words."},{"id":1032,"es":"Por favor, dame un lápiz y algunas hojas de papel.","en":"Please give me a pencil and some sheets of paper."},{"id":1033,"es":"A algunas personas les gusta más el mar, a otras les gusta más la montaña.","en":"Some people like the sea more, others like the mountains more."},{"id":1034,"es":"Por favor, espere hasta las cinco, luego él estará aquí.","en":"Please wait till five, when he will back."},{"id":1035,"es":"Por favor, espere cinco minutos.","en":"Please wait five minutes."},{"id":1036,"es":"Espere cinco minutos, por favor.","en":"Wait five minutes, please."},{"id":1037,"es":"Han pasado cinco años, aún lo recuerdo.","en":"It has been five years, I still remember it."},{"id":1038,"es":"Hace cinco días que no voy a clase, tengo que ponerme al día.","en":"I haven't been to class for five days, I have to catch up."},{"id":1039,"es":"Tiene un año y cinco meses, pero todavía no puede andar.","en":"He's a year and five months old, but he can't walk yet."},{"id":1040,"es":"Por favor, ¿puede decirme qué hora es ?","en":"Would you tell me the time, please?"},{"id":1041,"es":"Por favor, llámame de vuelta en una hora.","en":"Please call me back in an hour."},{"id":1042,"es":"Hora de morir, Tom, dijo Maria.","en":"Time to die, Tom said Mary."},{"id":1043,"es":"Tengo que ir de compras, estaré de vuelta en una hora.","en":"I have to go shopping. I'll be back in an hour."},{"id":1044,"es":"Apenas una hora pasa, pero pienso en ti con amor.","en":"Scarcely an hour goes by that I don't I think of you with love."},{"id":1045,"es":"Lo lamento, no tengo un reloj y no te puedo decir la hora.","en":"I'm sorry, I don't have a watch and I can't tell you the time."},{"id":1046,"es":"Como perdí el tren, tuve que esperar alrededor de una hora para el próximo.","en":"As I missed the train, I had to wait for the next one for about an hour."},{"id":1047,"es":"Eres nuevo aquí, ¿verdad ?","en":"You're new here, aren't you?"},{"id":1048,"es":"Hazlo de nuevo, tal como antes.","en":"Do it again, just like before."},{"id":1049,"es":"No, no es mi nuevo novio.","en":"No, he's not my new boyfriend."},{"id":1050,"es":"Juan no se compró un coche nuevo ayer, ¿verdad ?","en":"Tom didn't buy a new car yesterday, did he?"},{"id":1051,"es":"Cuanto más viejo te vuelves, más difícil se hace aprender un idioma nuevo.","en":"The older you get, the more difficult it becomes to learn a new language."},{"id":1052,"es":"En cuanto al nuevo plan, no estoy de acuerdo contigo.","en":"I cannot agree with you as regards the new plan."},{"id":1053,"es":"Una vez que se empieza a fumar, es difícil dejar ese mal hábito.","en":"Once you start smoking, it is difficult to get rid of that bad habit."},{"id":1054,"es":"Como él era pobre, tuvo que dejar la escuela.","en":"He had no choice but to give up school because of poverty."},{"id":1055,"es":"Juan odiaba la idea de dejar a Maria sola, pero él tenía que ir a trabajar.","en":"Tom hated the idea of leaving Mary alone, but he had to go to work."},{"id":1056,"es":"¿Puedo dejar un mensaje, por favor ?","en":"Can I leave a message, please?"},{"id":1057,"es":"Para empezar, tienes que dejar de fumar.","en":"First, you have to stop smoking."},{"id":1058,"es":"¿Puedes dejar de cantar, por favor ?","en":"Can you please stop singing?"},{"id":1059,"es":"¿Podrías dejar de cantar, por favor ?","en":"Would you please stop singing?"},{"id":1060,"es":"Por cierto, ¿dónde vive él ?","en":"By the way, where does he live?"},{"id":1061,"es":"Por cierto, ¿dónde vive usted ?","en":"By the way, where do you live?"},{"id":1062,"es":"Aunque vive cerca, no la veo mucho.","en":"Although she lives nearby, I rarely see her."},{"id":1063,"es":"Ella vive cerca de la playa, pero no sabe nadar.","en":"She lives near the beach, but she can't swim."},{"id":1064,"es":"Tenías razón, ya no vive en Río.","en":"You were right, he doesn't live in Rio."},{"id":1065,"es":"Él tiene dos hermanos, uno vive en Osaka y el otro en Kobe.","en":"He has two brothers, one lives in Osaka and the other in Kobe."},{"id":1066,"es":"Cuando iba a salir, se puso a llover.","en":"When I was about to leave, it began to rain."},{"id":1067,"es":"Cuando el profesor entró, ella se puso en pie.","en":"She stood up when her teacher came in."},{"id":1068,"es":"El sol se puso, así que dejaron de trabajar.","en":"The sun set, so they quit work."},{"id":1069,"es":"Apenas salió, se puso a llover.","en":"As soon as he went out, it began to rain."},{"id":1070,"es":"Ella se puso enferma, pero se recuperó rápido.","en":"She fell ill, but got well soon."},{"id":1071,"es":"Cuando Juan puso el pie en el arroyo, sintió que algo le mordía el dedo del pie.","en":"When Tom put his foot into the stream, he felt something bite his toe."},{"id":1072,"es":"John primero se puso su abrigo, y luego cogió su sombrero.","en":"First John put on his coat, and then he picked up his hat."},{"id":1073,"es":"Repentinamente, un hombre se puso frente a ellos.","en":"Suddenly, a man stepped in front of them."},{"id":1074,"es":"Tan pronto como llegamos allí, empezó a llover.","en":"As soon as we got there, it began to rain."},{"id":1075,"es":"Antes del examen, empezó a estudiar de verdad.","en":"Before the exam, he began to study in earnest."},{"id":1076,"es":"No me gustó la música rock en un principio, pero de a poco me empezó a gustar.","en":"I didn't like rock music at first, but it soon grew on me."},{"id":1077,"es":"Ella parte esta noche, pero todavía no empezó a preparar las valijas.","en":"She leaves tonight, but she still haven't started packing up the bags."},{"id":1078,"es":"Estaba planeando ir a la playa hoy, pero empezó a llover.","en":"I was planning on going to the beach today, but then it started to rain."},{"id":1079,"es":"Según iba caminando, empezó a llover.","en":"As I was walking, it began to rain."},{"id":1080,"es":"Rodeado por sus hijos, empezó su historia.","en":"Surrounded by his children, he began his story."},{"id":1081,"es":"El hombre empezó a quitarse el sombrero, las gafas y la máscara.","en":"The man began to take off his hat, glasses and mask."},{"id":1082,"es":"El perro, en cuanto me vio, empezó a ladrar.","en":"As soon as the dog saw me, it began to bark."},{"id":1083,"es":"Ahora que paró de llover, podemos ir a casa.","en":"Now that it has stopped raining, we can go home."},{"id":1084,"es":"Ya que no podemos contar con ninguna ayuda de los demás, vamos a tratar de hacerlo lo mejor posible.","en":"Since we can expect no help from others, let's try to do our best."},{"id":1085,"es":"Si sale mal esta vez, podemos intentar de nuevo.","en":"If it fails this time, we can try again."},{"id":1086,"es":"No vivimos como queremos, sino como podemos.","en":"We live, not as we wish to, but as we can."},{"id":1087,"es":"Podemos quedar en algún sitio en algún momento, o algo.","en":"You can meet me somewhere sometime or something."},{"id":1088,"es":"Si querés, nos podemos ver la próxima semana.","en":"We can meet next week if you want."},{"id":1089,"es":"Sabemos quiénes somos, pero no sabemos quiénes podemos ser.","en":"We know what we are, but know not what we may be."},{"id":1090,"es":"En cuanto terminó su trabajo, volvió a casa.","en":"As soon as he finished his work, he went home."},{"id":1091,"es":"Cuando papá volvió a casa, yo estaba viendo la televisión.","en":"When Dad came home, I was watching TV."},{"id":1092,"es":"Anoche Juan no volvió a casa, espero que esté bien.","en":"Tom didn't come home last night. I hope he's OK."},{"id":1093,"es":"Después de que muriera Tom, Maria volvió a casa de sus padres.","en":"After Tom passed away, Mary went back to her parents' home."},{"id":1094,"es":"Juan vino de un entorno pobre, pero con el tiempo se volvió bastante rico.","en":"Tom came from a poor background, but he later became quite rich."},{"id":1095,"es":"El equipo Japonés, ganador de la copa del mundo, volvió a casa enardecido por la victoria.","en":"The Japanese World Cup champion team came back home flushed with victory."},{"id":1096,"es":"Volvió a casa sin ningún percance, lo que fue un alivio para sus padres.","en":"He returned home safely, which pleased his parents."},{"id":1097,"es":"Saludó al hombre, y volvió a casa, a su normal y aburrida rutina.","en":"He greeted the man, and came back home, to his normal, boring routine."},{"id":1098,"es":"Puedes usar mi auto, si quieres.","en":"You can use my car, if you want to."},{"id":1099,"es":"¿Puedo usar tu coche, papá ?","en":"May I use your car, Dad?"},{"id":1100,"es":"Ella preguntó si podía usar el teléfono, entonces la dejé.","en":"She asked if she could use the phone, so I let her."},{"id":1101,"es":"Para mi sorpresa, él no sabía usar el diccionario.","en":"To my surprise, he didn't know how to use the dictionary."},{"id":1102,"es":"Si queremos hablar de edad en inglés, debemos usar el verbo to be.","en":"If we want to talk about ages in English, we should use the to be verb."},{"id":1103,"es":"Puedes usar mi escritorio, si quieres.","en":"You can use my desk if you want to."},{"id":1104,"es":"¿Puedo usar su baño, por favor ?","en":"Can I use your toilet, please?"},{"id":1105,"es":"¿Puedo usar tu servicio, por favor ?","en":"Can I use your toilet, please?"},{"id":1106,"es":"Para hacer un pastel, debes usar huevos, mantequilla y azúcar.","en":"In making a cake, you must use eggs, butter and sugar."},{"id":1107,"es":"Me permitiría usar su teléfono, ¿por favor ?","en":"Could I please use your phone?"},{"id":1108,"es":"Cuanto más me quedo aquí, más me gusta el lugar.","en":"The longer I stay there, the more I like the place."},{"id":1109,"es":"Este lugar es grande, ¿verdad ?","en":"This place is large, isn't it?"},{"id":1110,"es":"Tu hermana no puede nadar bien, ¿verdad ?","en":"Your sister cannot swim well, can she?"},{"id":1111,"es":"La mujer, a la que le estabas hablando aquella vez, era mi hermana.","en":"The woman you were talking to at that time was my sister."},{"id":1112,"es":"Toda la vida es sueño, y los sueños, sueños son.","en":"All life is a dream, and dreams themselves are only dreams."},{"id":1113,"es":"¡Tiene usted toda la razón, Señor Presidente !","en":"You are absolutely right, Mr Prime Minister!"},{"id":1114,"es":"No me gustaría estar en su posición, ni por toda su riqueza.","en":"I wouldn't like to be in his position, for all his wealth."},{"id":1115,"es":"¡Vamos, cuéntanos toda la historia !","en":"Come on, tell us the whole story!"},{"id":1116,"es":"En el fondo, tienes toda la razón.","en":"Basically, you're absolutely right."},{"id":1117,"es":"Según tengo entendido, él no ha sido puntual en toda su vida.","en":"As far as I know, he has never come on time."},{"id":1118,"es":"Él no mintió. De hecho, dijo toda la verdad.","en":"He didn't tell a lie. As a matter of fact, he told the whole truth."},{"id":1119,"es":"Hace un año, estábamos aquí.","en":"One year ago we were here."},{"id":1120,"es":"Este año, la navidad cae un día domingo.","en":"Christmas falls on Sunday this year."},{"id":1121,"es":"Trabaja duro, o si no, tendrás que tomar el mismo ramo otra vez el año siguiente.","en":"Work hard, or you'll have to take the same course again next year."},{"id":1122,"es":"A decir verdad, nos casamos el año pasado.","en":"To tell the truth, we got married last year."},{"id":1123,"es":"Para el año 2020, la población de esta ciudad se habrá duplicado.","en":"By the year 2020, the population of this city will have doubled."},{"id":1124,"es":"El año pasado, él pasó tres meses en el mar.","en":"Last year, he spent three months at sea."},{"id":1125,"es":"Por desgracia, mi cumpleaños sólo ocurre una vez al año.","en":"Unfortunately, my birthday is only once a year."},{"id":1126,"es":"Juan no tenía mucha hambre, así que no comió mucho.","en":"Tom wasn't very hungry, so he didn't eat much."},{"id":1127,"es":"Juan no toma mucha cerveza, pero sí que toma mucho vino.","en":"Tom doesn't drink much beer, but he sure drinks a lot of wine."},{"id":1128,"es":"Por otro lado, mucha gente muere joven.","en":"On the other hand a lot of people die young."},{"id":1129,"es":"Tienes mucha suerte, ¿sabes ? Esas cosas sólo pasan una vez en la vida.","en":"You're very lucky you know! A such thing happen only once in a lifetime."},{"id":1130,"es":"El sueño es más agradable que la muerte. Al menos, no hay mucha diferencia.","en":"Sleep is more pleasant than death. At least, there's not much difference."},{"id":1131,"es":"Por desgracia, no creo que yo fuera de mucha ayuda.","en":"Unfortunately I don't think I'd be of much help."},{"id":1132,"es":"Hay mucha gente a la que le interesan los coches, pero a mí no me dan más.","en":"Lots of people are interested in cars, but they're really nothing to me."},{"id":1133,"es":"Tenemos mucha prisa, de modo que vamos a tomar un taxi.","en":"We're in a hurry, so let's take a taxi."},{"id":1134,"es":"Algo anda mal, ¿no es así ?","en":"Something's wrong, isn't it?"},{"id":1135,"es":"Desde entonces, siempre se conoció al pueblo como el pueblo de Esteban.","en":"From that moment on, the town was recognized as Esteban's town."},{"id":1136,"es":"Desde el punto de vista de la salud, Tokio no es un lugar tan bueno para vivir.","en":"From the viewpoint of health, Tokyo is not such a good place to live."},{"id":1137,"es":"Desde este punto de vista, tienes razón.","en":"From this point of view, you are right."},{"id":1138,"es":"Desde que los hombres viven hasta ahora, nunca ha vuelto a haber otro Confucio.","en":"Since there were living men until now, there never was another Confucius."},{"id":1139,"es":"Desde el momento en que la conocí, la odio.","en":"From the moment that I met her, I hated her."},{"id":1140,"es":"Desde que se hirió en un accidente, no ha podido volver a andar.","en":"Since he was injured in an accident, he could no longer walk."},{"id":1141,"es":"Si fuera tú, no haría tal cosa.","en":"If I were you, I should not do such a thing."},{"id":1142,"es":"Tal vez no sea rico, pero al menos tengo novia, dijo Tom.","en":"I may not be rich, but at least I have a girlfriend, said Tom."},{"id":1143,"es":"Tal vez no tenga novia, pero al menos soy rico, dijo Tom.","en":"I may not have a girlfriend, but at least I'm rich, said Tom."},{"id":1144,"es":"Es joven, tal vez demasiado joven.","en":"He's young, maybe too young."},{"id":1145,"es":"Tal vez ella no es una belleza, pero tiene un buen corazón.","en":"Indeed she is not beautiful, but she is good-natured."},{"id":1146,"es":"Un vaso de agua, por favor.","en":"A glass of water, please."},{"id":1147,"es":"Si no fuera por el agua, no podríamos vivir.","en":"If it were not for water, we could not live."},{"id":1148,"es":"Dame un poco de agua, por favor.","en":"Give me some water, please."},{"id":1149,"es":"Si no fuese por el aire y el agua, nada podría vivir.","en":"If it were not for air and water, nothing could live."},{"id":1150,"es":"Dame un vaso de agua, por favor.","en":"Please give me a glass of water."},{"id":1151,"es":"Una botella de agua, por favor.","en":"A bottle of water, please."},{"id":1152,"es":"Por favor, deme un vaso de agua.","en":"Please give me a cup of water."},{"id":1153,"es":"Siempre mantén un balde de agua a mano, en caso de un incendio.","en":"Always keep a bucket of water handy, in case of fire."},{"id":1154,"es":"Si no fuera por el agua, la vida humana sería imposible.","en":"If it were not for water, human life would be impossible."},{"id":1155,"es":"¿Todos fueron ahí, o no ?","en":"Everyone's went there, no?"},{"id":1156,"es":"Fueron, por la mayoría, jóvenes.","en":"They were for the most part young people."},{"id":1157,"es":"O sea, que nuestros esfuerzos fueron para nada.","en":"In short, all our efforts resulted in nothing."},{"id":1158,"es":"Los resultados no fueron definitorios, pero yo estoy seguro de que los DNAs corresponden.","en":"The results were not definitive, but I'm sure the DNA's a match."},{"id":1159,"es":"Me quedé en el hotel, pero los demás fueron de shopping.","en":"I stayed at the hotel, but the others went shopping."},{"id":1160,"es":"Todos fueron invitados, menos yo.","en":"All were invited but me."},{"id":1161,"es":"Yo sé conducir un coche, pero Juan no.","en":"I can drive a car, but Tom can't."},{"id":1162,"es":"Aunque estaba cansado, hice lo que pude.","en":"Although I was tired, I did what I was able to do."},{"id":1163,"es":"Como mi madre estaba enferma, no pude ir.","en":"Since my mother was sick, I couldn't go there."},{"id":1164,"es":"Alguien dijo algo, pero no lo pude entender.","en":"Someone said something, but I could not understand it."},{"id":1165,"es":"La puerta estaba cerrada, así que no pude entrar.","en":"The door was locked, so I couldn't get in."},{"id":1166,"es":"No pude salir, a causa de la fuerte lluvia.","en":"I couldn't go out, due to the heavy rain."},{"id":1167,"es":"No pude asistir a la fiesta, y tampoco quería.","en":"I was unable to attend the party, nor did I want to."},{"id":1168,"es":"Pude encontrar la calle, pero no encontrar su casa.","en":"I was able to find the street, but I couldn't find her house."},{"id":1169,"es":"Sé que no fue lo que sugeriste, pero fue todo lo que pude hacer.","en":"I know it's not what you suggested, but it was all I could do."},{"id":1170,"es":"Eres su hermano, ¿verdad ?","en":"You are his brother, right?"},{"id":1171,"es":"En otras palabras, no me gusta trabajar con él.","en":"In other words, I don't like to work with him."},{"id":1172,"es":"Algunas personas dicen que él fue asesinado, otras dicen que él se mató.","en":"Some people say he was murdered, others say he killed himself."},{"id":1173,"es":"A algunas personas les gusta el deporte, a otras no.","en":"Some people like sports. Others don't."},{"id":1174,"es":"Creo que en algunos aspectos, la vida en el campo es mejor que en la ciudad.","en":"I think country life is superior to city life in some respects."},{"id":1175,"es":"Si tienes un minuto, quisiera hablar contigo sobre algunos problemas.","en":"If you have a minute, I'd like to talk to you about some problems."},{"id":1176,"es":"Algunos dicen que el bote se perdió, otros que fue tragado por una ballena.","en":"Some say the boat got lost, others say it was swallowed by a whale."},{"id":1177,"es":"Solía pasar el rato con Juan a menudo, pero estos días él no está mucho por aquí.","en":"I used to hang out with Tom a lot, but these days he's not around much."},{"id":1178,"es":"En estos momentos ella está muy ocupada, no puede hablar contigo.","en":"She is busy at present and can't speak to you."},{"id":1179,"es":"¡Necesito estos zapatos en la talla diez, por favor !","en":"I need these shoes in size ten please!"},{"id":1180,"es":"A la luz de estos hechos, puede ser necesario revisar nuestra teoría.","en":"In the light of these facts, it may be necessary to revise our theory."},{"id":1181,"es":"Estos son mis libros, esos son los suyos.","en":"These are my books, those are his."},{"id":1182,"es":"En estos tiempos, tan sólo sobrevivir es lo suficientemente difícil.","en":"Just staying alive in these times is hard enough."},{"id":1183,"es":"Estos zapatos son caros, y más encima, son demasiado chicos.","en":"These shoes are expensive, and what is more, they are too small."},{"id":1184,"es":"El próximo año, querré estos.","en":"Next year, I'll want these ones."},{"id":1185,"es":"Venga aquí a las seis, no antes.","en":"Come here at six, not before."},{"id":1186,"es":"Por favor, mañana despiértame a las seis.","en":"Please wake me up at six tomorrow."},{"id":1187,"es":"Por favor, despiértame a las seis mañana.","en":"Please wake me up at six tomorrow."},{"id":1188,"es":"Uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez.","en":"One, two, three, four, five, six, seven, eight, nine, ten."},{"id":1189,"es":"Por favor, recójame en el hotel a las seis en punto.","en":"Please pick me up at the hotel at six o'clock."},{"id":1190,"es":"Pase a buscarme al hotel a las seis en punto, por favor.","en":"Please pick me up at the hotel at six o'clock."},{"id":1191,"es":"Si a diez le quitas cuatro, entonces, te quedan seis.","en":"If you take four from ten, you have six."},{"id":1192,"es":"El mes que viene, Gary habrá estado en Japón por seis años.","en":"Gary will have been in Japan for six years next month."},{"id":1193,"es":"Si, lo he preguntado unas seis veces.","en":"Yeah, I asked about six times."},{"id":1194,"es":"Un día, los hombres llegaron a su pueblo.","en":"One day the men got to his village."},{"id":1195,"es":"En general, los hombres son más altos que las mujeres.","en":"Generally speaking, men are taller than women."},{"id":1196,"es":"En general, las mujeres pueden soportar el dolor mejor que los hombres.","en":"By and large, women can bear pain better than men."},{"id":1197,"es":"Hoy en día, las mujeres beben tanto como los hombres.","en":"Women today drink as much as men."},{"id":1198,"es":"Cuando se trata de amor, las mujeres son expertas y los hombres siempre novatos.","en":"When it comes to love, women are experts and men eternal novices."},{"id":1199,"es":"Todos los hombres son mortales, todos los griegos son hombres, por lo tanto todos los griegos son mortales.","en":"All men are mortal, all Greeks are men, therefore all Greeks are mortal."},{"id":1200,"es":"Juan conoció a Maria en una fiesta, y fue amor a primera vista.","en":"Tom met Mary at a party, and it was love at first sight."},{"id":1201,"es":"A primera vista, se ve fácil.","en":"At a first glance it seems easy."},{"id":1202,"es":"Esta es mi primera vez, así que estoy un poco nervioso.","en":"This is my first time, so I'm a little nervous."},{"id":1203,"es":"A primera vista, los dos buses se parecen.","en":"The two buses resemble each other at first glance."},{"id":1204,"es":"Cada mañana, mamá es la primera en levantarse.","en":"My mother gets up the earliest every morning."},{"id":1205,"es":"De sus dos sugerencias, creo que prefiero la primera.","en":"Of your two suggestions, I think I prefer the former."},{"id":1206,"es":"A primera vista, la cuestión parecía fácil.","en":"At first sight, the question seemed easy."},{"id":1207,"es":"Fui a Kobe, donde la conocí por primera vez.","en":"I went to Kobe, where I first met her."},{"id":1208,"es":"Si me hubieras dicho la verdad, yo no estaría enojado ahora.","en":"If you had told me the truth, I would not be angry now."},{"id":1209,"es":"Si me hubieras dicho la verdad, yo no estaría enojada ahora.","en":"If you had told me the truth, I would not be angry now."},{"id":1210,"es":"Sin su ayuda, yo estaría muerto.","en":"If I hadn't had his help, I would be dead."},{"id":1211,"es":"Sabía que él estaba enojado, pero no había pensado que él estaría así de enojado.","en":"I knew he was angry, but I didn't think he was that angry."},{"id":1212,"es":"Sé que dije que lo haría, pero hoy no puedo.","en":"I know I said I would do it, but I can't do it today."},{"id":1213,"es":"Ten en mente lo que dije, por favor.","en":"Please bear in mind what I said."},{"id":1214,"es":"Cuando le dije que me gustaba ese cuadro, lo dije en serio.","en":"When I told him I liked the picture, I really meant that."},{"id":1215,"es":"Te lo dije, pero no hiciste caso.","en":"I told you, but you didn't pay attention."},{"id":1216,"es":"Le dije a Juan que limpiara su habitación, pero no lo hizo.","en":"I told Tom to clean his room, but he didn't."},{"id":1217,"es":"Le dije que no soltara la cuerda, pero eso fue lo que hizo.","en":"I told her not to let the rope go, but that's what she did."},{"id":1218,"es":"Si pudieras

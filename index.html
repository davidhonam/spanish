<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Spanish 7K SRS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spanish SRS">
<style>
  :root{
    --bg:#0f1115; --panel:#1a1d24; --panel2:#222632; --ink:#e8eaf0; --muted:#9aa3b2;
    --accent:#f2a900; --good:#3ecf8e; --hard:#f2c14e; --again:#ff6b6b; --easy:#4cc9f0;
    --line:#2a2f3a; --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%, #2a2030 0%, var(--bg) 60%);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100%;}
  header{display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:5;
    padding:calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
    border-bottom:1px solid var(--line); background:rgba(15,17,21,.7); backdrop-filter:blur(8px);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.3px}
  header .sub{color:var(--muted); font-size:12px}
  .spacer{flex:1}
  .pill{font-size:12px; color:var(--muted); background:var(--panel2); border:1px solid var(--line);
    padding:5px 10px; border-radius:999px; white-space:nowrap}
  .pill b{color:var(--ink)}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; transition:.12s transform,.12s filter; }
  button:active{transform:translateY(1px)}
  .iconbtn{background:var(--panel2); color:var(--muted); border:1px solid var(--line); padding:7px 11px; font-size:13px; border-radius:9px}
  .iconbtn:hover{color:var(--ink); filter:brightness(1.15)}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .card{width:min(620px,94vw); background:linear-gradient(180deg,var(--panel) 0%, #161922 100%);
    border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden}
  .cardtop{padding:36px 30px 10px; text-align:center}
  .sentence{font-size:28px; font-weight:600; line-height:1.4; letter-spacing:.2px}
  .tap{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:18px; letter-spacing:.5px}
  .playrow{display:flex; justify-content:center; padding:6px 0 2px}
  .play{flex:0 0 auto; width:52px; height:52px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); color:var(--accent); font-size:20px; display:flex; align-items:center; justify-content:center}
  .play:hover{filter:brightness(1.25)}
  .play.playing{background:var(--accent); color:#1a1205; border-color:var(--accent)}
  .trans{font-size:22px; color:var(--ink); margin:18px 30px 6px; text-align:center; font-weight:500}
  .divider{height:1px; background:var(--line); margin:20px 0 0}
  .controls{display:flex; gap:10px; padding:18px 22px 22px; justify-content:center; flex-wrap:wrap}
  .show{background:var(--accent); color:#1a1205; font-size:16px; font-weight:700; padding:14px 40px; border-radius:12px}
  .grade{flex:1; min-width:120px; max-width:150px; padding:13px 8px; font-size:14px; font-weight:600; color:#0f1115; text-align:center}
  .grade small{display:block; font-weight:500; opacity:.8; font-size:11px; margin-top:2px}
  .g-again{background:var(--again)} .g-hard{background:var(--hard)} .g-good{background:var(--good)} .g-easy{background:var(--easy)}
  .empty{text-align:center; color:var(--muted)}
  .empty h2{color:var(--ink); font-weight:600}
  footer{display:flex; gap:14px; align-items:center; justify-content:center; padding:10px; color:var(--muted); font-size:12px; border-top:1px solid var(--line)}
  .toolbar{display:flex; gap:8px; align-items:center}
  select{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-family:inherit; font-size:12px}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2);
    border:1px solid var(--line); color:var(--ink); padding:10px 16px; border-radius:10px; box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.2s}
  .toast.show{opacity:1}
  kbd{background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--muted)}
  /* ---- overlay / modal ---- */
  .overlay{position:fixed; inset:0; background:rgba(8,10,14,.72); backdrop-filter:blur(4px); display:none; align-items:flex-start; justify-content:center; z-index:20; padding:40px 16px; overflow:auto}
  .overlay.open{display:flex}
  .modal{width:min(760px,96vw); background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; margin:auto}
  .modal h2{margin:0; font-size:17px; font-weight:600}
  .modalhead{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2}
  .modalhead .spacer{flex:1}
  .closex{background:var(--panel2); color:var(--muted); border:1px solid var(--line); width:32px; height:32px; border-radius:8px; font-size:16px; line-height:1}
  .closex:hover{color:var(--ink)}
  .modalbody{padding:18px 20px 22px}
  /* ---- stats ---- */
  .statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:8px}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px}
  .stat .n{font-size:26px; font-weight:700}
  .stat .l{font-size:12px; color:var(--muted); margin-top:2px}
  .stat .n.good{color:var(--good)} .stat .n.warn{color:var(--hard)} .stat .n.acc{color:var(--easy)}
  .secttitle{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:22px 0 10px}
  .bars{display:flex; align-items:flex-end; gap:4px; height:90px; padding-top:6px}
  .bar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; height:100%}
  .bar .fill{width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; transition:.2s}
  .bar.future .fill{background:var(--panel2); border:1px solid var(--accent)}
  .bar .cap{font-size:9px; color:var(--muted); white-space:nowrap}
  .bar .val{font-size:10px; color:var(--ink); font-weight:600}
  .matbar{display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--line)}
  .matbar > div{display:flex; align-items:center; justify-content:center; font-size:11px; color:#0f1115; font-weight:600}
  /* ---- settings ---- */
  .setrow{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line)}
  .setrow:last-child{border-bottom:none}
  .setrow .lbl{flex:1}
  .setrow .lbl b{display:block; font-size:14px}
  .setrow .lbl span{font-size:12px; color:var(--muted)}
  .setrow input[type=range]{width:160px}
  .setrow .num{font-size:18px; font-weight:700; min-width:42px; text-align:right; color:var(--accent)}
  /* ---- browse ---- */
  .browsebar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .browsebar input[type=text]{flex:1; min-width:160px; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:9px 12px; font-family:inherit; font-size:14px}
  .browsecount{font-size:12px; color:var(--muted); margin:0 0 10px}
  .blist{display:flex; flex-direction:column; gap:6px; max-height:none}
  .brow{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; cursor:pointer}
  .brow:hover{filter:brightness(1.12)}
  .browtop{display:flex; align-items:flex-start; gap:10px}
  .browtop .bes{font-size:15px; font-weight:600; flex:1; min-width:0}
  .browtop .badge{margin-top:2px}
  .badge{font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); white-space:nowrap}
  .badge.new{color:var(--accent); border-color:rgba(242,169,0,.4)}
  .badge.learn{color:var(--hard); border-color:rgba(242,193,78,.4)}
  .badge.mature{color:var(--good); border-color:rgba(62,207,142,.4)}
  .badge.due{color:var(--again); border-color:rgba(255,107,107,.4)}
  .bdetail{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:none}
  .brow.open .bdetail{display:block}
  .bex{display:flex; gap:10px; align-items:center; padding:2px 0}
  .bex .en{font-size:13px; color:var(--muted)}
  .miniplay{flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--accent); font-size:13px}
  .cramwrap{text-align:center}
  /* button icon/label: text on desktop, icon-only on mobile */
  .iconbtn .bi{display:none} .iconbtn .bl{display:inline}
  /* ---------- mobile ---------- */
  @media (max-width:680px){
    header{gap:8px 10px; flex-wrap:wrap;
      padding:calc(9px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 9px calc(12px + env(safe-area-inset-left))}
    header h1{font-size:15px}
    .sub{font-size:11px}
    .pill{font-size:11px; padding:4px 9px; order:3; flex-basis:100%}
    .toolbar{gap:8px}
    .iconbtn{min-height:42px; min-width:46px; padding:8px 12px; font-size:18px; display:flex; align-items:center; justify-content:center}
    .iconbtn .bi{display:inline} .iconbtn .bl{display:none}
    main{padding:14px 10px}
    .card{border-radius:16px}
    .cardtop{padding:26px 18px 8px}
    .sentence{font-size:23px}
    .trans{font-size:19px; margin:16px 12px 4px}
    .play{width:56px; height:56px}
    .controls{gap:8px; padding:16px 12px 20px}
    .show{width:100%; padding:16px}
    .grade{min-width:0; max-width:none; flex:1 1 calc(50% - 5px); padding:15px 6px; font-size:15px}
    footer{display:none}
    .overlay{padding:0; align-items:stretch}
    .modal{width:100%; min-height:100%; border-radius:0; border:none; margin:0}
    .modalhead{padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
    .modalbody{padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
    .closex{width:40px; height:40px; font-size:20px}
    .statgrid{grid-template-columns:repeat(2,1fr); gap:10px}
    .stat .n{font-size:22px}
    .browsebar{gap:8px}
    .browsebar input[type=text]{flex-basis:100%}
    .setrow input[type=range]{width:130px}
    .brow{padding:13px}
    .miniplay{width:40px; height:40px}
  }
  @media (hover:none){ .iconbtn, .play, .miniplay, .grade, .show{ -webkit-tap-highlight-color:transparent } }
</style>
</head>
<body>
<header>
  <h1>Intermediate <span style="color:var(--accent)">Spanish</span></h1>
  <div class="pill" id="stats"></div>
  <div class="sub" id="streak"></div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button class="iconbtn" id="browseBtn" title="Browse & search all sentences"><span class="bi">🔍</span><span class="bl">Browse</span></button>
    <button class="iconbtn" id="statsBtn" title="Statistics"><span class="bi">📊</span><span class="bl">Stats</span></button>
    <button class="iconbtn" id="settingsBtn" title="Settings"><span class="bi">⚙</span><span class="bl">Settings</span></button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none">
</header>

<main id="main"></main>

<footer>
  <span class="kbdhint"><kbd>Space</kbd> flip · <kbd>1</kbd>-<kbd>4</kbd> grade · <kbd>R</kbd> replay audio</span>
</footer>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script id="carddata" type="application/json">[{"id":0,"es":"Ella le quiere por lo que es, no por lo que tiene.","en":"She loves him for what he is, not for what he has."},{"id":1,"es":"No, no es mi casa.","en":"No, that's not my house."},{"id":2,"es":"Él la quiere, pero a ella no le gusta él.","en":"He loves her, but she doesn't like him."},{"id":3,"es":"A Juan le gusta Maria, pero a ella no le gusta él.","en":"Tom likes Mary, but she doesn't like him."},{"id":4,"es":"No, no tienes por qué.","en":"No, you don't have to."},{"id":5,"es":"Juan no tenía nada que hacer, así que se fue a casa.","en":"Tom had nothing to do, so he went home."},{"id":6,"es":"Él me quiere, pero yo no le quiero.","en":"He loves me. But I do not love him."},{"id":7,"es":"¡No, no ! Eso no está bien.","en":"No, no! That's not right."},{"id":8,"es":"Cuando no se puede hacer lo que se quiere, se hace lo que se puede.","en":"When you cannot do what you want, you do what you can."},{"id":9,"es":"Sé lo que quiero, es solo que todavía no lo he encontrado.","en":"I know what I want. I just haven't found it yet."},{"id":10,"es":"Después de eso, él se fue a casa.","en":"After that, he went home."},{"id":11,"es":"Juan es el hermano de Maria, no su padre.","en":"Tom is Mary's brother, not her father."},{"id":12,"es":"Él se fue de casa hace tres años, y nunca más se supo de él desde ese entonces.","en":"He went away from home three years ago, and has never been heard of since."},{"id":13,"es":"Ella me preguntó qué había sido de él, pero yo no lo sabía.","en":"She asked me what had become of him, but I didn't know."},{"id":14,"es":"Tienes algo de dinero, ¿no ?","en":"You have some money, don't you?"},{"id":15,"es":"¿No estás de acuerdo, Juan ?","en":"Don't you agree, Tom?"},{"id":16,"es":"No solo tu padre, también yo estoy en contra de tu plan.","en":"Not only your father but also I am against your plan."},{"id":17,"es":"Se puede saber el nombre de todo el mundo, de tan chiquita que es la ciudad.","en":"This town is so small that you can easily learn everyone's names."},{"id":18,"es":"A pesar de saber tan poco sobre ella, creo que estoy enamorado.","en":"Even though I know so little about her, I think I'm in love."},{"id":19,"es":"De acuerdo, y ¿qué vas a hacer tú por mí ?","en":"OK, and what are you going to do for me?"},{"id":20,"es":"No hay nada que hacer, así que mejor me voy a la cama.","en":"There's nothing to do, so I may as well go to bed."},{"id":21,"es":"Sé que lo tengo, pero no puedo dar con él.","en":"I know I have it, but I can't put my finger on it."},{"id":22,"es":"El hombre me dijo que sí, pero sólo si se lo prometía.","en":"The man said yes, but only if I promised."},{"id":23,"es":"No tenía nada que decir, así que se fue.","en":"He had nothing to say, so he left."},{"id":24,"es":"¿Es eso lo que tú quieres, Juan ?","en":"Is that what you want, Tom?"},{"id":25,"es":"Lo que él quería no es tanto el dinero, sino la fama.","en":"It is not so much money as fame that he wanted."},{"id":26,"es":"No es lo que él dijo, sino la manera en que lo dijo.","en":"It's not what he said, but the way he said it."},{"id":27,"es":"Creo que la música ya no va a estar en un disco rígido, sino en servidores virtuales.","en":"I imagine music will be on a server somewhere - but not on a hard disk."},{"id":28,"es":"No fue lo que él dijo, sino la manera en que lo dijo lo que me hizo desconfiar.","en":"It was not what he said, but the way he said it that made me suspicious."},{"id":29,"es":"Voy a estar por aquí mañana en la tarde, así que por favor pasa a visitarme.","en":"I'm going to be around tomorrow afternoon, so please drop in."},{"id":30,"es":"Tal como yo la quiero, ella también me quería.","en":"As I love her, so she loved me."},{"id":31,"es":"Juan quiere a Maria, pero ella a él no.","en":"Tom loves Mary, but she doesn't love him."},{"id":32,"es":"Puedo ver a Tom, pero él no me puede ver.","en":"I can see Tom, but he can't see me."},{"id":33,"es":"Maria no tiene a nadie con quien hablar, pero no se siente sola.","en":"Mary has nobody to talk with, but she doesn't feel lonely."},{"id":34,"es":"Fui a su casa, pero no estaba.","en":"I went to her house, but she was not at home."},{"id":35,"es":"Y ahora, ¿qué voy a hacer ?","en":"And now, what am I going to do?"},{"id":36,"es":"Ella está en el trabajo, ¿no ?","en":"She's at work, isn't she?"},{"id":37,"es":"El dinero no lo es todo, pero si no tienes dinero no puedes hacer nada.","en":"Money isn't everything, but if you have no money, you can't do anything."},{"id":38,"es":"Hasta donde yo sé, ella no tiene nada que ver con el escándalo.","en":"As far as I know, she has nothing to do with that scandal."},{"id":39,"es":"Todo el mundo habla del tiempo, pero nadie hace nada al respecto.","en":"Everybody talks about the weather, but nobody does anything about it."},{"id":40,"es":"Te gusta el inglés, ¿no ?","en":"You like English, don't you?"},{"id":41,"es":"Para mí, el tiempo no es dinero.","en":"For me, time is not money."},{"id":42,"es":"Es él, ¿no ?","en":"He's the one, isn't he?"},{"id":43,"es":"Eso es mejor, ¿o no ?","en":"That's better, isn't it?"},{"id":44,"es":"No parece, es.","en":"It doesn't seem; it is."},{"id":45,"es":"Ella sabe lo que quiere, eso es lo que importa.","en":"She knows what she wants, that's what matters."},{"id":46,"es":"Él no me gusta, pero ella sí.","en":"I do not like him, but I like her."},{"id":47,"es":"Juan se quiere ir, pero no puede.","en":"Tom wants to leave, but he can't."},{"id":48,"es":"Ya que lo voy a ver mañana, le puedo dar un mensaje si tú quieres.","en":"Since I will see him tomorrow, I can give him a message if you want."},{"id":49,"es":"Este es un buen libro, pero ese es mejor.","en":"This is a good book, but that is better."},{"id":50,"es":"No es un buen coche, pero es un coche.","en":"It's not a good car, but it's a car."},{"id":51,"es":"No tengo un perro, tengo dos.","en":"I have not a single dog, I have two."},{"id":52,"es":"Este es un hombre, esa es una mujer.","en":"This is a man, that is a woman."},{"id":53,"es":"Como hace buen tiempo, tengo ganas de ir a dar un paseo.","en":"Since it's nice out, I'd like to go take a walk."},{"id":54,"es":"Un buen libro es el mejor amigo, ahora y siempre.","en":"A good book is the best friend, now and forever."},{"id":55,"es":"No puede comprar un coche, menos una casa.","en":"He cannot buy a car, still less a house."},{"id":56,"es":"Ahora, Juan no está en casa.","en":"Tom isn't at home now."},{"id":57,"es":"En casa, mi padre no hace nada.","en":"My father doesn't lift a finger at home."},{"id":58,"es":"En cuanto a mí, me gusta más este.","en":"As for me, I like this better."},{"id":59,"es":"Él no está en casa, ¿verdad ?","en":"He isn't at home, is he?"},{"id":60,"es":"Mi padre no está en casa, pero sí mi madre.","en":"Father is out, but Mother is at home."},{"id":61,"es":"No sé por qué, pero me gusta este lugar.","en":"I don't know why but I like this place."},{"id":62,"es":"Quiero hablar con Tom, por favor.","en":"I want to speak with Tom, please."},{"id":63,"es":"Por lo que yo sé, él no va a venir.","en":"To the best of my knowledge, he will not come."},{"id":64,"es":"Él es más viejo que yo por dos años, pero es menos alto que yo.","en":"He is older than I by two years, but less tall than I."},{"id":65,"es":"Por lo que yo sé, él nunca ha llegado a tiempo.","en":"As far as I know, he has never come on time."},{"id":66,"es":"No por cierto, no estoy de acuerdo con usted.","en":"Certainly not, I don't agree with you."},{"id":67,"es":"No importa, lo puedo hacer yo solo.","en":"Never mind, I can do it by myself."},{"id":68,"es":"Usted sabe lo que quiero, ¿no ?","en":"You know what I want, don't you?"},{"id":69,"es":"Y ahora, ¿qué te gustaría hacer ?","en":"And now what would you like to do?"},{"id":70,"es":"Tengo más tiempo, y menos dinero que nunca.","en":"I have more time, and less money than ever."},{"id":71,"es":"Hice lo que tenía que hacer, y si tuviera que hacerlo otra vez, lo haría...","en":"I did what I had to do, and if I had to do it again, I would..."},{"id":72,"es":"Él es profesor, y yo también.","en":"He's a teacher and so am I."},{"id":73,"es":"No quiero ir, y sé que tú tampoco quieres.","en":"I don't want to go and I know you don't want to go either."},{"id":74,"es":"A Juan no le gustaba Maria, y a ella no le gustaba él.","en":"Tom didn't like Mary and she didn't like him."},{"id":75,"es":"No puedo ir, y tampoco quiero.","en":"I can't go, nor do I want to."},{"id":76,"es":"Cuanto más se tiene, más se quiere.","en":"The more one has, the more one wants."},{"id":77,"es":"Se hace tarde, me tengo que ir.","en":"It's getting late, I gotta go."},{"id":78,"es":"Sea como sea, no me gusta.","en":"Anyway, I don't like it."},{"id":79,"es":"Fui no una vez, sino dos.","en":"I went not once, but twice."},{"id":80,"es":"Quería una llave de la casa de Tom, pero él no me daba una.","en":"I wanted a key to Tom's house, but he wouldn't give me one."},{"id":81,"es":"Sé una cosa, que no sé nada.","en":"I know one thing, that I know nothing."},{"id":82,"es":"Si a tus padres les gusta tu trabajo, es que es una mierda.","en":"If your parents like your job, then it's shit."},{"id":83,"es":"Para el mundo eres una persona, pero para alguien tú eres el mundo.","en":"For the world, you are somebody, but for somebody you are the world."},{"id":84,"es":"Ella es una cosa por fuera, pero por dentro es otra.","en":"She is something on the outside, but another on the inside."},{"id":85,"es":"Eso es trabajo para una mujer, dijo Tom.","en":"That's a woman's job, said Tom."},{"id":86,"es":"Si una mujer sabe, todo el mundo sabe.","en":"If a woman knows, the whole world knows."},{"id":87,"es":"De los dos, él es más alto.","en":"He is the taller of the two."},{"id":88,"es":"Juan no viene todos los días aquí, pero viene muy a menudo.","en":"Tom doesn't come here every day, but he comes quite often."},{"id":89,"es":"Las personas pueden hablar, pero los animales id":108,"es":"Entre usted y yo, ¿le gusta mi hermana ?","en":"Just between you and me, do you love my sister?"},{"id":109,"es":"Cuanto más tienes, más quieres.","en":"The more you have, the more you want."},{"id":110,"es":"¿A usted, qué coche le gusta más ?","en":"What car do you like more?"},{"id":111,"es":"Cuanto más lo pienso, menos me gusta.","en":"The more I think about it, the less I like it."},{"id":112,"es":"Solo quiero ser tu amigo, nada más.","en":"I just want to be your friend, nothing more."},{"id":113,"es":"Ella no es su hermana, es su madre.","en":"She's not his sister, but his mother."},{"id":114,"es":"Cada vez que voy a su casa, él está fuera.","en":"Every time I go to his house, he is out."},{"id":115,"es":"Solo sé su nombre, eso es todo.","en":"I just know his name, that's all."},{"id":116,"es":"A esta hora Juan debería estar en casa, pero aún está en su oficina.","en":"Tom should be home by now, but he's still at his office."},{"id":117,"es":"A pesar de que soy mayor que ella, me trata como si fuera su sirviente.","en":"Although I am her elder, she treats me as if I were her servant."},{"id":118,"es":"En todo caso, él nunca hizo su trabajo.","en":"He never did his work anyhow."},{"id":119,"es":"Juan no es el padre de Maria, sino su tío.","en":"Tom isn't Mary's father, but her uncle."},{"id":120,"es":"Ella quería ir, y su padre la dejó.","en":"She wanted to go, and her father let her go."},{"id":121,"es":"Me gustan las mujeres, me gusta el vino.","en":"I like women, I like wine."},{"id":122,"es":"Ven aquí a las seis, no antes.","en":"Come here at six, not before."},{"id":123,"es":"Si estás feliz, mejor dejar las cosas como están.","en":"If you're happy, it's best to just leave things how they are."},{"id":124,"es":"Por favor, llámame mañana en la mañana a las siete.","en":"Please call me at seven tomorrow morning."},{"id":125,"es":"En cualquier caso, deberías venir aquí a las diez.","en":"In any case, you must come here by ten."},{"id":126,"es":"Con un buen libro entre las manos, uno no se siente nunca solo.","en":"With a good book in your hands you need never feel lonely."},{"id":127,"es":"Si alguien me llama mientras no estoy, dile que volveré a las cinco.","en":"If anyone calls me up while I'm away, tell them I'll be back by five."},{"id":128,"es":"A ti no te gustan las historias de amor, ¿no es cierto ?","en":"You don't like love stories, do you?"},{"id":129,"es":"Ahora él está en el trabajo, pero volverá a las siete.","en":"He is at work now, but will return at seven."},{"id":130,"es":"La verdad, no quiero ir con ellos.","en":"To tell the truth, I don't want to go with them."},{"id":131,"es":"Si yo fuera tú, yo no podría vivir con él.","en":"If I were you, I wouldn't live with him."},{"id":132,"es":"Voy a vivir mi vida, con o sin ella.","en":"I'm going to live my life, with or without her."},{"id":133,"es":"Si quieres salir con Tom, puedes.","en":"If you want to go out with Tom, you can."},{"id":134,"es":"Si quiere salir con Tom, puede.","en":"If you want to go out with Tom, you can."},{"id":135,"es":"Hasta lo que yo sé, el libro jamás antes ha sido traducido al japonés.","en":"As far as I know, the book has never been translated into Japanese."},{"id":136,"es":"Al fin y al cabo, la vida es igual que un sueño.","en":"After all, life is just like a dream."},{"id":137,"es":"Sé que no es fácil, pero al menos tienes que tratar.","en":"I know it's not easy, but you've got to at least try."},{"id":138,"es":"Fue un largo y difícil viaje, pero al fin estamos en nuestra meta.","en":"It was a long and hard journey but we're finally at our destination."},{"id":139,"es":"Cuando yo era un niño, iba muy seguido a nadar al mar.","en":"When I was a child, I often went swimming in the sea."},{"id":140,"es":"¿Tiene que ir otra vez al extranjero, o ya no más ?","en":"Do you have to go abroad again or not anymore?"},{"id":141,"es":"Hoy no tengo ganas de trabajar, así que vamos a jugar al fútbol.","en":"I don't feel like working today, so let's go play soccer."},{"id":142,"es":"Si hace buen tiempo, voy a ir a nadar al río.","en":"If the weather is fine, I'll go swimming in the river."},{"id":143,"es":"Trata bien al gato, por favor.","en":"Please treat the cat well."},{"id":144,"es":"¿A usted, qué le gusta hacer ?","en":"You, what do you like to do?"},{"id":145,"es":"Lo conozco de vista, pero la verdad es que nunca le he hablado.","en":"I know him by sight, but I have never actually spoken to him."},{"id":146,"es":"Lo siento, no está en casa.","en":"I'm sorry, but he isn't home."},{"id":147,"es":"Ella no está en casa, sino que en la escuela.","en":"She is not home, but at school."},{"id":148,"es":"Está bien, eso no cuenta.","en":"It's OK, that doesn't count."},{"id":149,"es":"Está bien, pero creo que puedes hacerlo mejor.","en":"It's OK, but I think you can do it better."},{"id":150,"es":"Para ti no lo sé, pero para mí es muy, muy importante.","en":"As for you, I don't know, but for me it's really very important."},{"id":151,"es":"Uno para todos, todos para uno.","en":"One for all, all for one."},{"id":152,"es":"De hecho, lo hizo para él mismo.","en":"As a matter as fact, he did it for himself."},{"id":153,"es":"Quiero un coche, pero no tengo dinero para comprar uno.","en":"I want a car, but I have no money to buy one."},{"id":154,"es":"Para ellos, era el fin.","en":"For them, it was the end."},{"id":155,"es":"Él es, sin lugar a duda, el mejor hombre para el trabajo.","en":"He is, without question, the best man for the job."},{"id":156,"es":"Si eso es verdad, ella es mejor que yo.","en":"If that's true, then she's better than me."},{"id":157,"es":"Juan puede nadar, pero yo no.","en":"Tom can swim, but I can't."},{"id":158,"es":"O vas tú, o voy yo.","en":"Either you go, or I go."},{"id":159,"es":"A decir verdad, yo no soy tu padre.","en":"To tell the truth, I am not your father."},{"id":160,"es":"Yo soy tu amigo, ¿no ?","en":"I am your friend, right?"},{"id":161,"es":"Si a tus padres les gusta tu trabajo, entonces es una mierda.","en":"If your parents like your job, then it's shit."},{"id":162,"es":"¿Puedes decirme una vez más tu nombre, por favor ?","en":"Can you please tell me your name once more?"},{"id":163,"es":"En todo caso, él es tu hermano mayor.","en":"In any case, he's your big brother."},{"id":164,"es":"Tom, no es tu culpa.","en":"Tom, it's not your fault."},{"id":165,"es":"Dime cómo llegar a tu casa, por favor.","en":"Please tell me how to get to your house."},{"id":166,"es":"A pesar de ser muy viejo, mi coche todavía va muy bien.","en":"Although my car is very old, it still runs very well."},{"id":167,"es":"Me gusta el inglés, pero no lo hablo muy bien.","en":"I like English, but I cannot speak well."},{"id":168,"es":"Me encanta el inglés, pero a veces es muy difícil para mí.","en":"I like English so much, but sometimes it is very difficult for me."},{"id":169,"es":"Creo que alguien, y sé muy bien quién, entró a mi habitación.","en":"I think someone, and I know very well who, came in my bedroom."},{"id":170,"es":"Estoy muy feliz, dijo él.","en":"I am very happy, he said."},{"id":171,"es":"El inglés es muy difícil, ¿verdad ?","en":"English is pretty hard, isn't it?"},{"id":172,"es":"Como todos saben, el día de hoy es un día muy importante para nosotros.","en":"As everyone knows, today is a very significant day for us."},{"id":173,"es":"Él es muy amable, como tú.","en":"He is very kind, just like you."},{"id":174,"es":"Te guste o no, tienes que hacer eso ahora mismo.","en":"Like it or not, you have to do that right away."},{"id":175,"es":"Te guste o no, tienes que hacerlo.","en":"Like it or not, you must do it."},{"id":176,"es":"Tienes que hacerlo, te guste o no.","en":"Whether you like it or not, you'll have to do it."},{"id":177,"es":"Por mi parte, no importa si viene o no.","en":"For my part, it doesn't matter whether he comes or not."},{"id":178,"es":"¿Él no come esto, o sí ?","en":"He doesn't eat this, does he?"},{"id":179,"es":"Estés de acuerdo o no, voy a hacerlo.","en":"I am going to do it whether you agree or not."},{"id":180,"es":"No soy tan alto como mi hermano, pero soy más alto que mi padre.","en":"I am not so tall as my brother, but taller than my father."},{"id":181,"es":"Como ella no vino, yo tampoco fui.","en":"Since she didn't come, I didn't go either."},{"id":182,"es":"Sea como sea, eres mi amigo.","en":"Anyway, you're my friend."},{"id":183,"es":"Yo no vivo para comer, sino que como para vivir.","en":"I do not live to eat, but eat to live."},{"id":184,"es":"Me acuerdo de la cara del hombre, pero su nombre se me escapa.","en":"I remember the man's face but I can't call his name to mind."},{"id":185,"es":"Después del juego, él se fue derecho a su casa a alimentar a su perro.","en":"After the game, he went straight home to feed his dog."},{"id":186,"es":"¿Está él cerca del coche ? No, él está dentro del coche.","en":"Is he by the car? No, he is in the car."},{"id":187,"es":"Él no se dio cuenta del cambio, pero yo sí.","en":"He didn't notice the change, but I did."},{"id":188,"es":"Puedes estar de fiesta toda la noche, ¡pero vuelve a tu tumba antes del amanecer !","en":"You may feast all night, but return to your grave before dawn!"},{"id":189,"es":"Ya hice la mitad del trabajo, y ahora puedo hacer un pausa.","en":"I've done half the work, and now I can take a break."},{"id":190,"es":"Lo que se hace por amor, se hace más allá del bien y del mal.","en":"What is done out of love always takes place beyond good and evil."},{"id":191,"es":"Si vas en autobús, puedes llegar allí en más o menos un tercio del tiempo.","en":"If you go by bus, you can get there in about one-third of the time."},{"id":192,"es":"Algunas personas están a favor del plan, y otras están en contra.","en":"Some people are for the plan and others are against it."},{"id":193,"es":"¿Él no puede hablar inglés, no es así ?","en":"He can't speak English, can he?"},{"id":194,"es":"Así que, ¿qué es lo que quieres que haga ?","en":"So what is it you want me to do?"},{"id":195,"es":"Si es así, tanto mejor.","en":"If that's so, all the better."},{"id":196,"es":"Eso es cierto, ¿no es así ?","en":"That's right, isn't it?"},{"id":197,"es":"Si así debe ser, así sea.","en":"If it must be that way, so be it."},{"id":198,"es":"En ese momento, él estaba aquí.","en":"He was here at that time."},{"id":199,"es":"Juan siempre se veía feliz, pero nunca lo estaba.","en":"Tom always looked happy, but never was."},{"id":200,"es":"Estaba buscando algo, pero no lo encontré.","en":"I was looking for something, but couldn't find it."},{"id":201,"es":"Si él hubiera sabido lo que estaba a punto de pasar, habría modificado su plan.","en":"Had he known what was about to happen, he would have changed his plan."},{"id":202,"es":"Siempre parecía feliz, pero nunca lo estaba.","en":"She always looked happy, but never was."},{"id":203,"es":"Quería darte algo, pero no estaba seguro de qué te gustaría.","en":"I wanted to give you something, but I wasn't sure what you'd like."},{"id":204,"es":"Cuando volví a casa, todo estaba fuera de lugar.","en":"Everything was out of place when I came back home."},{"id":205,"es":"Estaba muy cansado, de manera que me fui temprano a la cama.","en":"I was very tired, so I went to bed early."},{"id":206,"es":"Había trabajado todo el día, así que estaba muy cansado.","en":"I worked hard all day, so I was very tired."},{"id":207,"es":"No, no puede ser verdad.","en":"No, it cannot be true."},{"id":208,"es":"Eso podría ser verdad, pero realmente no lo creo.","en":"That could be true, but I don't really think so."},{"id":209,"es":"Si quieres ser mi amigo, entonces sé también amigo de mi amigo.","en":"If you want to become my friend, then also become the friend of my friend."},{"id":210,"es":"Ya que él lo dice, debe ser verdad.","en":"Since he says so, it must be true."},{"id":211,"es":"Nosotros sabemos lo que somos, pero no así de lo que podríamos ser.","en":"We know what we are, but know not what we may be."},{"id":212,"es":"Un hombre puede ser feliz con cualquier mujer, en tanto que él no la ame.","en":"A man can be happy with any woman, as long as he does not love her."},{"id":213,"es":"El hombre no vino a este mundo para ser rico, sino que para ser feliz.","en":"Men do not exist in this world to become rich, but to become happy."},{"id":214,"es":"Esta no es mi hermana, es mi esposa.","en":"She is not my sister, she's my wife."},{"id":215,"es":"Si no hay vida después de la muerte, más te vale hacer que esta vida sirva de algo.","en":"If there's no life after death, then you'd better make this life count."},{"id":216,"es":"Sin duda, esta mujer sabe que no sabe lo que quiere.","en":"This woman definitely knows that she doesn't know what she wants."},{"id":217,"es":"Él se fue, así que Maria se quedó sola en esta oración.","en":"He gone, Mary remained thus alone in this sentence."},{"id":218,"es":"Puede que haya visto antes esta película, pero no me acuerdo de casi nada.","en":"I may have seen that film before, but I can hardly remember it."},{"id":219,"es":"Esta cámara es de Tom, ¿o no ?","en":"This camera is Tom's, isn't it?"},{"id":220,"es":"Hace calor esta mañana, ¿no ?","en":"Warm this morning, isn't it?"},{"id":221,"es":"En vista de lo que él ha hecho por esta compañía, él debería ser promovido.","en":"He should be promoted in the light of what he has done for this company."},{"id":222,"es":"En todo caso, ¿qué horas son ?","en":"What time is it, anyway?"},{"id":223,"es":"Todos los caballos son animales, pero no todos los animales son caballos.","en":"All horses are animals, but not all animals are horses."},{"id":224,"es":"Todos los libros son buenos, pero ninguno es tan bueno como éste.","en":"All of the books are good, but none as good as this one."},{"id":225,"es":"Los hombres, las mujeres, los niños y las niñas son personas.","en":"The men, the women, the boys, and the girls are people."},{"id":226,"es":"Los caballos son más grande que los perros, pero los gatos son más pequeños que los perros.","en":"Horses are bigger than dogs, but cats are smaller than dogs."},{"id":227,"es":"La música no es un idioma, pero algunos idiomas son música para mis oídos.","en":"Music is not a language. But some languages are music to my ears."},{"id":228,"es":"La música no es una lengua, pero algunas lenguas son música para mis oídos.","en":"Music is not a language. But some languages are music to my ears."},{"id":229,"es":"Uno de sus tres autos es azul, y el resto son blancos.","en":"One of her three cars is blue and the others are white."},{"id":230,"es":"¿Quiénes son, cómo vinieron aquí, y por qué ?","en":"Who are you, how did you come here, and why?"},{"id":231,"es":"Para mí, ellos son los mejores.","en":"For me, they are the best."},{"id":232,"es":"Lo siento mucho, pero no puedo.","en":"I'm very sorry, but I can't."},{"id":233,"es":"Sí, siempre que puedo.","en":"Yes. Always when I can."},{"id":234,"es":"Puedes nadar, pero no puedo.","en":"You can swim, but I can't."},{"id":235,"es":"No, no puedo hablar inglés.","en":"No, I can't speak English."},{"id":236,"es":"No puedo estudiar en ningún lugar de mi casa, es demasiado ruidosa.","en":"I can't study anywhere in my house. It's too noisy."},{"id":237,"es":"Ya era tarde, pero ella se fue igual.","en":"It was already late, but she left nonetheless."},{"id":238,"es":"El hombre me preguntó quién era yo, a lo cual no consideré necesario responder.","en":"The man asked me who I was, but I didn't think I had to answer."},{"id":239,"es":"Cuando yo era un niño, solía ir a nadar en aquel estanque.","en":"When I was a child, I used to swim in that pond."},{"id":240,"es":"Cuando era niño, nuestra casa se veía más grande que ahora.","en":"When I was a child, our house seemed bigger than now."},{"id":241,"es":"La última vez que le vi, era sólo un niño.","en":"When I saw him last, he was still a child."},{"id":242,"es":"El aire de Londres no era algo de lo que se pudiera presumir, ni mucho menos.","en":"London air was not much to boast of at best."},{"id":243,"es":"Vi esa película, pero no era muy buena.","en":"I saw that film, but it wasn't very good."},{"id":244,"es":"Hasta donde yo sé, el era un buen estudiante.","en":"So far as I know, he used to be a good student."},{"id":245,"es":"Es tarde, me tengo que ir.","en":"It's late, I have to go."},{"id":246,"es":"Me tengo que ir, ¡es tarde !","en":"I have to go, it's late!"},{"id":247,"es":"Lo siento, pero ahora tengo que ir a casa.","en":"I'm sorry, but I'll have to go home now."},{"id":248,"es":"Me gustaría ir, pero no tengo coche.","en":"I would like to go, but I don't have a car."},{"id":249,"es":"Juan hizo lo que pudo por Maria, pero no fue suficiente.","en":"Tom did what he could for Mary, but it wasn't enough."},{"id":250,"es":"Juan no fue, y tampoco Maria.","en":"Tom didn't go, and neither did Mary."},{"id":251,"es":"Soy un fue, y un será, y un es cansado.","en":"I am a was, a will be, a tired being."},{"id":252,"es":"En este momento, Juan no tiene nada mejor que hacer.","en":"Tom has nothing better to do right now."},{"id":253,"es":"No solo Juan tiene que estudiar, yo también.","en":"Not only Tom has to study, but I have to study, too."},{"id":254,"es":"Nadie quiere, pero uno de nosotros tiene que hacerlo.","en":"Nobody wants to do it, but one of us has to."},{"id":255,"es":"La culpa la tiene él, no tú.","en":"It is not you but he that is to blame."},{"id":256,"es":"Él tiene mucho dinero, pero casi no tiene amigos.","en":"He has a lot of money, but has almost no friends."},{"id":257,"es":"Él tiene dos gatos, uno es blanco y el otro es negro.","en":"He has two cats, one is white and one is black."},{"id":258,"es":"Creo que viene, pero no estoy seguro.","en":"I think he's coming, but I'm not quite sure."},{"id":259,"es":"Como estoy ocupado, no puedo ir.","en":"As I am busy, I cannot go."},{"id":260,"es":"Ahora no puedo hablar, estoy demasiado ocupado.","en":"I can't talk now. I'm too busy."},{ s two sons that don't go to school yet."},{"id":409,"es":"Este libro, que me he leído dos veces, fue un regalo de Peter.","en":"This book, which I've read twice, was a gift from Peter."},{"id":410,"es":"Bien, pero lo puedes hacer mejor.","en":"Good, but you can do better."},{"id":411,"es":"Tú puedes nadar, pero yo no.","en":"You can swim, but I can't."},{"id":412,"es":"En esos momentos es en mi familia en quien pienso, no en mis amigos.","en":"At such times, I think of my family, not my friends."},{"id":413,"es":"En cuanto a hoy, salí con mis amigos.","en":"As for today, I went out with my friends."},{"id":414,"es":"Por favor, cuida a mis gatos mientras no estoy.","en":"Please look after my cats while I'm away."},{"id":415,"es":"En esos momentos, pienso en mi familia, no en mis amigos.","en":"At such times, I think of my family, not my friends."},{"id":416,"es":"Yo vivo en la ciudad, pero mis padres viven en el campo.","en":"I live in a town, but my parents live in the country."},{"id":417,"es":"Veré a mis amigos esta noche, pero mi hermana no verá a los suyos.","en":"I will see my friends tonight, but my sister won't see hers."},{"id":418,"es":"Acepte mis disculpas por lo que acabo de decir, por favor.","en":"Please accept my apologies for what I said just now."},{"id":419,"es":"Y tú, ¿qué tal estás ?","en":"And you, how's it going?"},{"id":420,"es":"No, ¡No sé sobre que estás hablando !","en":"No, I don't! I don't know what you're talking about!"},{"id":421,"es":"Si no estás con nosotros, estás contra nosotros.","en":"If you're not with us then you're against us."},{"id":422,"es":"Dime que estás bien, por favor.","en":"Please tell me you're OK."},{"id":423,"es":"Estás a mi lado, ahora todo está bien.","en":"You're by my side; everything's fine now."},{"id":424,"es":"Así como te ves, no estás en condiciones de que te vean.","en":"You're not fit to be seen."},{"id":425,"es":"Estás feliz, ¿no ?","en":"You're happy, aren't you?"},{"id":426,"es":"Dije que podía, no que lo fuera a hacer.","en":"I said that I could, not that I would."},{"id":427,"es":"Si no fuera por la música, el mundo sería un lugar aburrido.","en":"If not for music, the world would be a dull place."},{"id":428,"es":"Si yo fuera usted, no lo haría.","en":"If I were you, I wouldn't do it."},{"id":429,"es":"Si el mundo no fuera como es, yo podría confiar en cualquiera.","en":"If the world weren't in the shape it is now, I could trust anyone."},{"id":430,"es":"Si no tienes nada que decir, no digas nada.","en":"If you have nothing to say, say nothing."},{"id":431,"es":"Puedes ir a la fiesta, pero tienes que estar en casa a medianoche.","en":"You may go to the party, but you must be home by midnight."},{"id":432,"es":"Si usted me hubiera dicho la verdad, ahora yo no estaría enfadado.","en":"If you had told me the truth, I would not be angry now."},{"id":433,"es":"Si usted me hubiera dicho la verdad, ahora yo no estaría enfadada.","en":"If you had told me the truth, I would not be angry now."},{"id":434,"es":"Si yo hubiera sabido la verdad, te la habría dicho.","en":"Had I known the truth, I would have told it to you."},{"id":435,"es":"Si no hubiera sido por ti, él aún estaría vivo.","en":"If it hadn't been for you, he would still be alive."},{"id":436,"es":"Si lo hubiera sabido, te lo habría dicho.","en":"If I had known about it, I would have told you."},{"id":437,"es":"Si me hubiera dicho la verdad desde el principio, no estaría enojado ahora.","en":"Had she told me the truth in the first place, I wouldn't be angry now."},{"id":438,"es":"Qué bueno que me dijiste, o si no jamás me hubiera acordado.","en":"Good that you told me, otherwise I would never have remembered it."},{"id":439,"es":"Si hubiera tenido un poco más de dinero, lo habría comprado.","en":"Had I had a little more money, I would have bought it."},{"id":440,"es":"Cuanto más la escucho, menos me gusta.","en":"The more I listen to her, the less I like her."},{"id":441,"es":"Bueno, ahora me tengo que ir.","en":"Well, I have to go now."},{"id":442,"es":"Una noche, un hombre vino a mi casa.","en":"One evening a man came to my house."},{"id":443,"es":"Bueno, tú tienes a un hombre.","en":"Well, you have a man."},{"id":444,"es":"El hombre come para vivir, no vive para comer.","en":"Man eats to live, he does not live to eat."},{"id":445,"es":"Si alguien puede hacerlo, ese es Tom.","en":"If anyone can do it, it's Tom."},{"id":446,"es":"¿Cuál te gusta más, este o ese ?","en":"Which do you like better, this or that?"},{"id":447,"es":"Mientras más pienso en ese problema, más difícil parece.","en":"The more I thought about the problem, the more difficult it seemed."},{"id":448,"es":"Sabes, el dinero solo es papel, y ese es un auto verdadero.","en":"You know, money is just paper, and that is a real car."},{"id":449,"es":"Este problema es difícil de resolver, así que sería mejor que empezases por ese otro.","en":"This problem is hard to solve. So you had better begin with that one."},{"id":450,"es":"¿Cuál es tu libro, este o ese ?","en":"Which is your book, this one or that one?"},{"id":451,"es":"Entiendo, pero no puedo estar de acuerdo.","en":"I understand, but I cannot agree."},{"id":452,"es":"Tom, ¿tú vas a estar ahí para mí si lo necesito, no es así ?","en":"Tom, you'll be here for me if I need you, won't you?"},{"id":453,"es":"A ella no le gusta estar sola, pero yo lo prefiero así.","en":"She doesn't like being alone, but I prefer it like that."},{"id":454,"es":"Me gustaría estar solo por unos minutos, por favor.","en":"I'd like to be alone for a few minutes please."},{"id":455,"es":"Por lo que sé, él podría estar en París ahora.","en":"For all I know, he could be in Paris right now."},{"id":456,"es":"¿Qué es el amor ? A decir verdad, yo aún no sé lo que es.","en":"What is love? To tell the truth, I still don't know what it is."},{"id":457,"es":"A decir verdad, no me gusta su forma de hablar.","en":"To tell the truth, I don't like his way of talking."},{"id":458,"es":"¿Podría  have a glass of milk, please?"},{"id":476,"es":"Si tuviera suficiente dinero, podría comprar este libro.","en":"If I had enough money, I could buy this book."},{"id":477,"es":"Él no tenía dinero, y por eso no podía comprar comida.","en":"He had no money and so could not buy any food."},{"id":478,"es":"No tenía dinero, así que no pudo comprar comida.","en":"He had no money and so could not buy any food."},{"id":479,"es":"De verdad que tenía muchas ganas de ir a la fiesta, pero no pude.","en":"I really wanted to go to the party, but I couldn't."},{"id":480,"es":"Hice eso, no porque quisiera, sino porque tenía que hacerlo.","en":"I did so, not because I wanted to, but because I had to."},{"id":481,"es":"Tenía muchas ganas de ir a la fiesta, pero no pude.","en":"I really wanted to go to the party, but I couldn't."},{"id":482,"es":"Cuando ella tenía tres años, murió su padre.","en":"When she was three years old, her father died."},{"id":483,"es":"Juan es tres años más pequeño que tú, ¿verdad ?","en":"Tom is three years younger than you, right?"},{"id":484,"es":"Su madre tenía tres hijos, de los cuales él era el más joven.","en":"His mother had three sons, of whom he was the youngest."},{"id":485,"es":"Cuando era niño, él fue a París tres veces.","en":"As a child, he went to Paris three times."},{"id":486,"es":"Lo creas o no, ella tiene tres hijos.","en":"Believe it or not, she has three children."},{"id":487,"es":"Lo creas o no, esta mujer tiene tres hijos.","en":"Believe it or not, this woman has three kids."},{"id":488,"es":"Iré a las tres, mejor dicho a las tres y cuarto.","en":"I'll go at three, or rather at a quarter past three."},{"id":489,"es":"La casa es demasiado grande para nosotros, y además es demasiado cara.","en":"The house is too big for us, and what is more, it is too expensive."},{"id":490,"es":"El francés es demasiado difícil, así que no creo que quiera aprenderlo.","en":"French is too hard, so I don't think I want to learn it."},{"id":491,"es":"Uno puede beber demasiado, pero nunca suficiente.","en":"One can drink too much, but one never drinks enough."},{"id":492,"es":"Quería decir algo, pero tenía demasiado miedo.","en":"I wanted to say something, but I was too scared."},{"id":493,"es":"Cuando ella le abrió su corazón, era demasiado tarde.","en":"When she opened her heart to him, it was already too late."},{"id":494,"es":"Si algo parece demasiado bueno para ser cierto, probablemente lo sea.","en":"If something sounds too good to be true, then it probably is."},{"id":495,"es":"Tom, si no estás demasiado ocupado, ¿podrías venir a mi oficina un minuto ?","en":"Tom, if you're not too busy, could you come to my office for a minute?"},{"id":496,"es":"Él es mi tío, porque mi padre es su hermano.","en":"He's my uncle, because my father is his brother."},{"id":497,"es":"Juan ayuda a Maria porque quiere, no porque tenga que hacerlo.","en":"Tom helps Mary because he wants to, not because he has to."},{"id":498,"es":"Ella no puede estar en este hotel, porque ella regresó a Canadá.","en":"She cannot be staying at this hotel, because she has gone back to Canada."},{"id":499,"es":"Es porque no lo haces, no porque no puedas hacerlo.","en":"It is because you do not do it, not because you are not able to do it."},{"id":500,"es":"Ella no sale de la habitación, porque no quiere pillar otro resfriado.","en":"She won't leave the room, because she doesn't want to catch another cold."},{"id":501,"es":"¿Por qué ? Porque su familia necesitaba el dinero, por eso.","en":"Why? Because his family needed the money, that's why."},{"id":502,"es":"Yo no puedo responder inmediatamente a tu mensaje, porque no puedo tipear rápido.","en":"I can't reply your message immediately, for I can't type fast."},{"id":503,"es":"No es porque me desagrade el trabajo, sino porque no soy adecuado para él.","en":"Not that I dislike the job, but that I am unfit for it."},{"id":504,"es":"Usted no va a llegar tarde, ¿verdad ?","en":"You won't be late, will you?"},{"id":505,"es":"Lo siento, pero va a venir alguien.","en":"I am sorry, but I have someone coming."},{"id":506,"es":"Su padre no va a venir, está muy ocupado.","en":"His father will not come, he is very busy."},{"id":507,"es":"Si usted conduce su coche así, usted va a terminar en el hospital.","en":"If you drive your car like that, you'll end up in hospital."},{"id":508,"es":"No estudia mucho, pero le va muy bien en el colegio.","en":"He does not study hard, but does very well at school."},{"id":509,"es":"Sí, creo que está bien.","en":"Yes, I think it's okay."},{"id":510,"es":"Me gusta el inglés, pero no lo hablo bien.","en":"I like English, but I cannot speak well."},{"id":511,"es":"A pesar de ser rico, él no es feliz.","en":"Though he is rich, he is not happy."},{"id":512,"es":"Yo nunca le escribí a ella, a pesar de las ganas que tengo de hacerlo.","en":"I never wrote to her, despite the urge to do so."},{"id":513,"es":"A pesar del mal tiempo, decidí salir.","en":"Regardless of the bad weather, I decided to go out."},{"id":514,"es":"A pesar de su poca edad, hizo un buen trabajo.","en":"Despite his young age, he did a very good job."},{"id":515,"es":"A pesar de que Juan era mi mejor amigo, estoy empezando a odiarlo.","en":"Even though Tom used to be my best friend, I'm beginning to hate him."},{"id":516,"es":"Tengo tiempo, así que lo haré.","en":"I have time, so I'll do it."},{"id":517,"es":"No tengo tiempo para eso, y además no tengo dinero.","en":"I have no time for that, and besides, I don't have any money."},{"id":518,"es":"Si tengo tiempo, lo haré.","en":"If I get time, I will."},{"id":519,"es":"Usted sabe dónde está Tom, ¿no ?","en":"You know where Tom is, don't you?"},{"id":520,"es":"Usted habla bien el inglés, ¿no ?","en":"You can speak English well, can't you?"},{"id":521,"es":"No puedo irme de casa, ni siquiera si es solo para un rato.","en":"I can't leave home, even if only for a while."},{"id":522,"es":"Lo siento, no tengo ni idea.","en":"I'm sorry, I have no idea."},{"id":523,"es":"Me gustaría mejorar mi francés, pero no tengo ni un poco de tiempo.","en":"I would like to improve my French but I really have no time."},{"id":524,"es":"Él habla alemán, ni hablar del inglés.","en":"He speaks German, not to mention English."},{"id":525,"es":"Para empeorar las cosas, él ni siquiera es consciente de que fastidia a los vecinos.","en":"To make matters worse, he isn't even conscious of annoying his neighbors."},{"id":526,"es":"No es ni uno ni lo otro, sino todo lo contrario.","en":"It's neither one or the other, but all the opposite."},{"id":527,"es":"Ni una palabra a nadie, por favor.","en":"Not a word to anyone, please."},{"id":528,"es":"No tiene mujer, hijos ni amigos.","en":"He has no wife, no children and no friends."},{"id":529,"es":"Juan sabe nadar, pero Maria no.","en":"Tom can swim, but Mary can't."},{"id":530,"es":"Si tú no vas, yo tampoco.","en":"If you don't go, I won't, either."},{"id":531,"es":"Si te vas, le diré a todo el mundo que me acaricias mientras duermo.","en":"If you leave, I'll tell all the world you fondle me while I sleep."},{"id":532,"es":"Tu vas a la escuela, ¿Cierto ?","en":"You go to school, right?"},{"id":533,"es":"Si vas a pescar mañana, yo también voy.","en":"If you go fishing tomorrow, I will, too."},{"id":534,"es":"Vas a la escuela, ¿verdad ?","en":"You go to school, don't you?"},{"id":535,"es":"Si te vas, no te dejaré entrar más.","en":"If you go out, I won't let you come in again."},{"id":536,"es":"Hasta donde yo sé, él no hizo nada mal.","en":"As far as I know, he did nothing wrong."},{"id":537,"es":"Sí, hasta donde yo sé.","en":"Yes, as far as I know."},{"id":538,"es":"Hasta donde yo sé, él viene en auto.","en":"As far as I know, he is coming by car."},{"id":539,"es":"Hasta donde yo sé, esta es la edición más nueva.","en":"As far as I know, this is the latest edition."},{"id":540,"es":"Mi gato es como un bebé, me sigue a donde quiera que vaya.","en":"My cat is such a baby, she follows me around wherever I go."},{"id":541,"es":"Él fue a París, donde me conoció por primera vez.","en":"He went to Paris, where he met me for the first time."},{"id":542,"es":"Voy a mi cuarto, donde puedo estudiar.","en":"I am going to my room, where I can study."},{"id":543,"es":"Mi padre sabe nadar, pero mi madre no.","en":"My father can swim, but my mother can't."},{"id":544,"es":"Juan sabe nadar realmente bien, ¿no te parece ?","en":"Tom really does swim well, doesn't he?"},{"id":545,"es":"A veces voy, a veces no.","en":"Sometimes I go, sometimes I don't."},{"id":546,"es":"Eres alto, pero él es todavía más alto.","en":"You are tall, but he is still taller."},{"id":547,"es":"Ella está lejos, pero todavía la quiero.","en":"She is far away, but I still love her."},{"id":548,"es":"Si no hubiese sido por ti, él todavía estaría vivo.","en":"If it hadn't been for you, he would still be alive."},{"id":549,"es":"Todavía no ha vuelto a casa, ¿verdad ?","en":"He has not come home yet, has he?"},{"id":550,"es":"Estos zapatos están viejos, pero todavía me gustan.","en":"These shoes are old, but I still like them."},{"id":551,"es":"¡Mañana será otro día, pero no estará aquí hasta mañana !","en":"Tomorrow is another day, but it won't be here until tomorrow!"},{"id":552,"es":"No, hasta ahora ella nunca se ha enamorado.","en":"No, until now she has never fallen in love."},{"id":553,"es":"Uno fue a pescar, el otro fue a comprar.","en":"One went fishing, another went shopping."},{"id":554,"es":"Aunque, es bueno si uno sabe hablar bien inglés.","en":"Although, it is good if one can speak English well."},{"id":555,"es":"Sí, creo que deberías ir.","en":"Yes, I think you should go."},{"id":556,"es":"Lo siento, no creo que yo pueda.","en":"I'm sorry, I don't think I'll be able to."},{"id":557,"es":"Digas lo que digas, yo creo que él es una persona honesta.","en":"Say what you will, I think he is an honest person."},{"id":558,"es":"Yo no sé nada sobre él, además de su nombre.","en":"I don't know anything about him, other than his name."},{"id":559,"es":"Lo que me dijo Jack sobre ti es un montón de mentiras, no le creo.","en":"What Jack told me about you is a pack of lies. I don't believe him."},{"id":560,"es":"Estoy hablando de este bolígrafo, no de aquel que está sobre el escritorio.","en":"I'm talking about this pen, not that one over there on the desk."},{"id":561,"es":"Por favor, piensa unos minutos sobre esto.","en":"Please spend a few minutes thinking about this."},{"id":562,"es":"Y sobre todo, sé verdadero contigo mismo.","en":"Above all, be true to yourself."},{"id":563,"es":"Puede que haya dicho algo sobre ello, pero no recuerdo.","en":"He may have said something about it; but I don't remember."},{"id":564,"es":"Cambié de idea sobre lo de salir, y me quedé en casa.","en":"I changed my mind about going out and stayed home."},{"id":565,"es":"Él habla francés, y además lo hace muy bien.","en":"He speaks French and that very well."},{"id":566,"es":"A menudo, Juan habla con su perro.","en":"Tom often talks to his dog."},{"id":567,"es":"Por favor, habla más alto.","en":"They all burst out laughing."},{"id":568,"es":"No le creas, habla por hablar.","en":"Don't believe him. He's just talking to hear himself talk."},{"id":569,"es":"Ella habla inglés, y también francés.","en":"She speaks English, and French as well."},{"id":570,"es":"Por lo bien que habla francés, puede que haya estudiado en Francia.","en":"As fluently as she speaks French, she may have studied in France."},{"id":571,"es":"Tú habla primero, yo después.","en":"You speak first; I will speak after."},{"id":572,"es":"Si no fuera por tu ayuda, no lo habría podido conseguir.","en":"If it were not for your help, I could not have succeeded."},{"id":573,"es":"Si hubiera sabido la dirección de ella, le habría escrito una carta.","en":"If I had known her address, I would have written her a letter."},{"id":574,"es":"Si hubiese tenido más tiempo, te habría escrito.","en":"If I had had more time, I would have written to you."},{"id":575,"es":"Por favor, ¿dónde están los huevos ?","en":"Where are the eggs, please?"},{"id":576,"es":"Están todos bien, gracias.","en":"They're all fine, thanks."},{"id":577,"es":"A las siete de la tarde, las calles están desiertas en esta ciudad.","en":"The streets here are empty by 7."},{"id":578,"es":"Él, como también su hermana, están invitados a la fiesta.","en":"He, as well as his sister, are invited to the party."},{"id":579,"es":"No me gusta, pero lo haré de todas formas.","en":"I don't like it, but I will do it anyway."},{"id":580,"es":"Sé que está mal, pero lo haré de todas formas.","en":"I know it's wrong, but I'll do it anyway."},{"id":581,"es":"Sólo hay un hijo lindo en el mundo, y todas las madres lo tienen.","en":"There's only one pretty child in the world, and every mother has it."},{"id":582,"es":"Sé que estuvo mal, pero lo hice de todas formas.","en":"I knew it was wrong, but I did it anyway."},{"id":583,"es":"Estoy cansado, pero de todas formas voy a ir.","en":"I'm tired, but I'm going anyway."},{"id":584,"es":"De todas formas, nunca vas a saber.","en":"Anyway, you'll never know."},{"id":585,"es":"¿De todas formas, Juan quién piensa que es él ?","en":"Who does Tom think he is anyway?"},{"id":586,"es":"Considerando todas las cosas, él es un buen profesor.","en":"All things considered, he is a good teacher."},{"id":587,"es":"De todas formas, no me cae bien.","en":"Either way I don't like him."},{"id":588,"es":"De todas formas, quiero ir allí.","en":"Nevertheless, I want to go there."},{"id":589,"es":"Entonces, debe de haber estado en casa.","en":"He must have been home then."},{"id":590,"es":"De no haber sido por tu consejo, yo no hubiera tenido éxito.","en":"If it had not been for your advice, I could not have succeeded."},{"id":591,"es":"Juan podía haber venido ayer, pero no lo hizo.","en":"Tom could have come yesterday, but he didn't."},{"id":592,"es":"Después de haber encontrado su número de teléfono, él la llamó.","en":"After he had found her phone number, he called her up."},{"id":593,"es":"Si hubiera tenido tiempo suficiente, podría haber visto más de Londres.","en":"If I had had enough time, I could have seen more of London."},{"id":594,"es":"Juan debía haber invitado a Maria, pero no lo hizo.","en":"Tom should have invited Mary, but he didn't."},{"id":595,"es":"Después de haber leído la carta, se puso triste.","en":"He got sad after reading the letter."},{"id":596,"es":"Si no querías venir, deberías haber dicho algo.","en":"If you didn't want to come, you should've said something."},{"id":597,"es":"De no haber sido por este error, nuestro equipo podría haber ganado el partido.","en":"Had it not been for this error, our team could have won the match."},{"id":598,"es":"No, no vi a nadie.","en":"No, I didn't see anyone."},{"id":599,"es":"Ella no es amable con él, de hecho, no es amable con nadie.","en":"She isn't kind to him. In fact, she's not kind to anyone."},{"id":600,"es":"Juan sabía la verdad, pero no dejó que nadie supiera que él lo sabía.","en":"Tom knew the truth, but he didn't let anyone know that he knew it."},{"id":601,"es":"Él cree ser alguien, pero en realidad no es nadie.","en":"He thinks he is somebody, but really he is nobody."},{"id":602,"es":"Nadie, excepto él, vino a la fiesta.","en":"With the exception of him, nobody else came to the party."},{"id":603,"es":"No tengo nada que ver con el accidente, y no sé nada.","en":"I have nothing to do with the accident, and I know nothing."},{"id":604,"es":"Ve a ver quién es, por favor.","en":"Please go and see who it is."},{"id":605,"es":"Ayer, Juan fue a ver a Maria temprano por la mañana.","en":"Tom went to see Mary early yesterday morning."},{"id":606,"es":"Si ves a tu alrededor, vas a ver a mucha gente haciendo lo mismo.","en":"If you look around, you'll see many people doing the same thing."},{"id":607,"es":"Uno por uno, los chicos vinieron a ver qué estaba leyendo.","en":"One by one, the boys came to see what I was reading."},{"id":608,"es":"A decir verdad, ella en realidad no me gusta.","en":"To tell the truth, I don't really like her."},{"id":609,"es":"A decir verdad, no lo hice yo mismo.","en":"To tell the truth, I did not make it myself."},{"id":610,"es":"No, no creo que sea mi culpa.","en":"No, I don't think that I am to blame."},{"id":611,"es":"Puede que sea viejo, pero no estoy loco.","en":"I may be old, but I'm not crazy."},{"id":612,"es":"Como sea, por favor pasa.","en":"Anyway, please come in."},{"id":613,"es":"Lo que sea que él diga, no le creas.","en":"Whatever he says, do not trust him."},{"id":614,"es":"Cuanto antes, mejor.","en":"The sooner, the better."},{"id":615,"es":"Cuanto antes lo hagas, mejor.","en":"The sooner you do it, the better it is."},{"id":616,"es":"Lo siento, mi padre no está aquí.","en":"I'm sorry, my father's not here."},{"id":617,"es":"Me gusta nadar, pero no me gusta nadar aquí.","en":"I like swimming, but I don't like to swim here."},{"id":618,"es":"Me gusta nadar, pero no quiero nadar aquí.","en":"I like swimming, but I don't like to swim here."},{"id":619,"es":"Si no quieres que esté aquí, me iré.","en":"If you don't want me to stay here, I'll leave."},{"id":620,"es":"Él se puede quedar aquí por una noche, no más.","en":"He can stay here for one night, no longer."},{"id":621,"es":"Hoy en día, me siento mucho mejor.","en":"Today, I am feeling a lot better."},{"id":622,"es":"Ayer, Juan se quedó en la casa todo el día.","en":"Yesterday Tom stayed home all day."},{"id":623,"es":"Si llueve mañana, me quedaré en casa todo el día.","en":"If it rains tomorrow, I will stay at home all day."},{"id":624,"es":"Hoy en día, la gente sabe el precio de todo y el valor de nada.","en":"Nowadays, people know the price of everything and the value of nothing."},{"id":625,"es":"Por ser joven, puede trabajar todo el día.","en":"Being young, he can work all day long."},{"id":626,"es":"Ven a nuestra ciudad algún día, por favor.","en":"Please come to our town some day."},{"id":627,"es":"Tenemos que aceptar la vida, para bien o para mal.","en":"We must accept life, for good or for evil."},{"id":628,"es":"Debemos aceptar la vida, para bien o para mal.","en":"We must accept life, for good or for evil."},{"id":629,"es":"Él piensa que la vida, en cierto sentido, es como un viaje.","en":"He thinks that life is like a voyage in a sense."},{"id":630,"es":"La vida es un largo, largo camino.","en":"Life is a long, long road."},{"id":631,"es":"Todos tienen el derecho a la vida, a la libertad y a la seguridad personal.","en":"Everyone has the right to life, liberty and the security of person."},{"id":632,"es":"Por lo menos una vez en la vida, logré sacar lo mejor de él.","en":"For once in my life I succeeded in getting the better of him."},{"id":633,"es":"Nada me gustaría más que despedir a Tom, pero no puedo.","en":"I'd like nothing better than to fire Tom, but I can't do that."},{"id":634,"es":"Me gustaría una habitación con una buena vista, por favor.","en":"I'd like a room with a good view, please."},{"id":635,"es":"Si no fuera por el clima, me gustaría un montón quedarme aquí.","en":"If it weren't for the climate, I'd like it here very much."},{"id":636,"es":"Me gustaría ayudar, pero no puedo.","en":"I'd like to help, but I can't."},{"id":637,"es":"Es, incluso ahora, un libro que les encanta tanto a hombres como a mujeres.","en":"It is, even now, a book loved by men and women alike."},{"id":638,"es":"A algunas personas les gusta el verano, y a algunas personas les gusta el invierno.","en":"Some people like summer, and others like winter."},{"id":639,"es":"No les puedo dar nada más, a no ser mi sangre.","en":"There is nothing more I can give you except my blood."},{"id":640,"es":"A nuestros hijos les gustan los perros, pero yo prefiero los gatos.","en":"Our children like dogs, but I prefer cats."},{"id":641,"es":"A algunas personas les gustan los gatos, y otras prefieren los perros.","en":"Some people like cats, and others prefer dogs."},{"id":642,"es":"Les pregunté qué tal estaba la cena, pero no me respondió nadie.","en":"I asked them how dinner was, but nobody answered me."},{"id":643,"es":"A algunos estudiantes les gusta el béisbol, y a otros el fútbol.","en":"Some students like baseball, and others like soccer."},{"id":644,"es":"Eres amigo de Tom, ¿no ?","en":"You're a friend of Tom's, eh?"},{"id":645,"es":"No me importa quién eres, me importa lo que hagas.","en":"I don't care who you are, I care about what you do."},{"id":646,"es":"Si alguien puede hacerlo, eres tú.","en":"If anyone can do it, it's you."},{"id":647,"es":"Muy bien, pero eres capaz de hacerlo mejor.","en":"Very good, but you're capable of doing better."},{"id":648,"es":"Si eres feliz, yo también.","en":"If you're happy, so am I."},{"id":649,"es":"Ella quiere, pero no lo necesita.","en":"She wants but doesn't need it."},{"id":650,"es":"Antes que nada, debo decir esto.","en":"First of all, I must say this."},{"id":651,"es":"Si no hubiese sido por el cinturón de seguridad, yo no estaría vivo hoy.","en":"If it hadn't been for the seatbelt, I wouldn't be alive today."},{"id":652,"es":"Ha sido agradable hablar contigo, pero realmente me debo ir ahora.","en":"It's been nice talking to you, but I really must go now."},{"id":653,"es":"He sido invitado a un viaje por el extranjero, pero no quiero ir.","en":"I've been invited on a trip abroad, but I don't want to go."},{"id":654,"es":"Si hubiera sido rico, os habría dado dinero.","en":"If I had been rich, I would have given you some money."},{"id":655,"es":"No importa quién lo diga, no me lo creo.","en":"No matter who says so, I don't believe it."},{"id":656,"es":"No importa cómo lo digas, no te voy a escuchar.","en":"No matter how you say it, I'm not going to listen to you."},{"id":657,"es":"Es pobre, pero no le importa el dinero.","en":"He is poor, but he doesn't care about money."},{"id":658,"es":"No me importa lo que dice, nunca volveré a creer en él.","en":"I don't care what he says. I will never believe him again."},{"id":659,"es":"No importa lo que él diga, no le creas.","en":"No matter what he says, don't trust him."},{"id":660,"es":"La Navidad será pronto, ¿no es así ?","en":"Christmas is soon, right?"},{"id":661,"es":"Por favor, ven lo más pronto posible.","en":"Please come as soon as possible."},{"id":662,"es":"Tan pronto como Juan estuvo con Maria a solas, le dijo las malas noticias.","en":"As soon as Tom got Mary alone, he told her the bad news."},{"id":663,"es":"A juzgar por cómo está el cielo, va a llover pronto.","en":"Judging from the sky, it will rain soon."},{"id":664,"es":"Como estaba muy cansado, me fui pronto a dormir.","en":"Since I was really tired I went to sleep early."},{"id":665,"es":"No quería, pero tuve que hacerlo.","en":"I didn't want to do it, but I had to."},{"id":666,"es":"Él le preguntó a ella si quería quedarse, pero ella no quiso.","en":"He asked her to stay, but she didn't want to."},{"id":667,"es":"Ella quería volver a casa, pero se perdió.","en":"She wanted to return home, but she got lost."},{"id":668,"es":"Si no fuese por la música, el mundo sería un lugar aburrido.","en":"If it weren’t for music, the world would be a dull place."},{"id":669,"es":"Si él puede hacerlo bien, nosotros podemos hacerlo aún mejor.","en":"If he can do it well, so much more can we."},{"id":670,"es":"A pesar de que Juan aún tenía lágrimas en los ojos, se puso a sonreír.","en":"Even though Tom still had tears in his eyes, he began to smile."},{"id":671,"es":"Se lo dije, pero él no hizo caso.","en":"I told him, but he didn't pay attention."},{"id":672,"es":"Él prometió venir, pero no lo hizo.","en":"He promised to come, but he didn't come."},{"id":673,"es":"No sé cómo lo hice, lo importante es que lo hice.","en":"I don't know how I did it. What's important is that I did it."},{"id":674,"es":"No es lo que dices, sino cómo lo dices.","en":"It's not what you say, but how you say it."},{"id":675,"es":"No sabes cómo hacerlo, ¿verdad ?","en":"You don't know how to do it, do you?"},{"id":676,"es":"Nadie entiende cómo lo hace, pero lo hace.","en":"Nobody understands how he does it, but he does it."},{"id":677,"es":"¿Puede decirme cómo llegar a la playa, por favor ?","en":"Can you please tell me how I can get to the beach?"},{"id":678,"es":"Para ser como ellos, debemos pensar como ellos.","en":"In order to be like them, we must think like them."},{"id":679,"es":"Si dos hombres tienen siempre la misma opinión, uno de ellos es inútil.","en":"If two men always have the same opinion, one of them is unnecessary."},{"id":680,"es":"De seguro, ellos van a manejar bien esto.","en":"They will probably handle this well."},{"id":681,"es":"Ellos no vinieron aquí, ¿verdad ?","en":"They didn't come here, did they?"},{"id":682,"es":"Los niños necesitan muchas cosas, pero antes que todo, ellos necesitan amor.","en":"Children need many things, but above all they need love."},{"id":683,"es":"Cuando ella tenga la edad, ellos se van a casar.","en":"When she comes of age, they are going to get married."},{"id":684,"es":"Normalmente, ellos no se quedan por mucho.","en":"Usually, they did not stay long."},{"id":685,"es":"Esta es una manera mejor de pagar a la gente, según Paula Grayson.","en":"This is a better way of paying people, according to Paula Grayson."},{"id":686,"es":"La gente ama hablar, hablar, hablar.","en":"People love to talk - talk - talk."},{"id":687,"es":"Lo siento, no dejo entrar a gente que no conozco.","en":"I'm sorry, I don't let in people I don't know."},{"id":688,"es":"En verano, la gente va a la playa.","en":"In the summer, people go to the seaside."},{"id":689,"es":"Toda la gente, mayor y joven, salió a dar la bienvenida a los visitantes.","en":"People, old and young, all came out to greet the guests."},{"id":690,"es":"Él es raro, y no me gusta la gente rara.","en":"He is strange, and I don't like strange people."},{"id":691,"es":"A él no le gustan las zanahorias, así que no se lo comió.","en":"He does not like carrots, so he did not eat it."},{"id":692,"es":"Tengo mucho que hacer, así que probablemente no pueda ir mañana.","en":"I'm very busy so probably I won't be able to come tomorrow."},{"id":693,"es":"Por como está el cielo, podría llover por la mañana.","en":"From the look of the sky, it may rain in the afternoon."},{"id":694,"es":"Algunas personas fueron en bus, y otras en tren.","en":"Some people went by bus, and others by train."},{"id":695,"es":"A algunas personas les gustan los gatos, otras prefieren los perros.","en":"Some people like cats, others prefer dogs."},{"id":696,"es":"Algunas personas escriben libros por dinero, otros por placer.","en":"Some people write books for money, others for pleasure."},{"id":697,"es":"Hay personas que se bañan todos los días, y personas que no.","en":"Some people take a bath every day and others don't."},{"id":698,"es":"Tus padres no vinieron, ¿no es así ?","en":"Your parents didn't come, did they?"},{"id":699,"es":"Has invitado a tus amigos también, ¿no ?","en":"You've invited your friends too, haven't you?"},{"id":700,"es":"Tú también has invitado a tus amigos, ¿verdad ?","en":"You've invited your friends too, haven't you?"},{"id":701,"es":"Si vas a dudar de todo, al menos duda de tus propias dudas.","en":"If you're going to doubt everything, at least doubt your doubt."},{"id":702,"es":"Por favor, di hola a tus padres.","en":"Please say hello to your parents."},{"id":703,"es":"Cuando la muerte se aproxima, todo lo que puedes hacer es masticar tus uñas lentamente.","en":"When death approaches, all you can do is slowly chew your fingernails."},{"id":704,"es":"Con tus habilidades, estoy seguro de que no te sería muy difícil encontrar otro trabajo.","en":"With your skills, I'm sure it wouldn't be too hard to find another job."},{"id":705,"es":"Por más ocupado que estés, debes hacer tus tareas.","en":"However busy you may be, you must do your homework."},{"id":706,"es":"Nunca has estado es Europa, ¿no es así ?","en":"You've never been to Europe, have you?"},{"id":707,"es":"Hemos estado hablando de eso durante horas, ¿no podemos dejar el tema ?","en":"We've been talking about this for hours. Can we just drop it?"},{"id":708,"es":"Nunca has estado en París, ¿verdad ?","en":"You've never been to Paris, have you?"},{"id":709,"es":"Si ella vuelve a visitar Francia, habrá estado allí tres veces.","en":"If she visits France again, she will have been there three times."},{"id":710,"es":"Había estado yo solo toda la semana, y me moría por una conversación.","en":"I'd been on my own all week and was starving for conversation."},{"id":711,"es":"De no haber sido por tu ayuda, él hubiera estado arruinado.","en":"Without your help, he would have been ruined."},{"id":712,"es":"No quiero que conduzca Tom, ha estado bebiendo.","en":"I don't want Tom to drive. He's been drinking."},{"id":713,"es":"Ella parece joven, pero de hecho es mayor que tú.","en":"She looks young, but she's actually older than you are."},{"id":714,"es":"Para la edad que tiene, mi madre parece más joven.","en":"My mother appears young for her age."},{"id":715,"es":"Ella parece joven, pero en realidad es mayor que tú.","en":"She looks young, but actually she's older than you are."},{"id":716,"es":"Para un hombre con un martillo, todo se parece a un clavo.","en":"To a man with a hammer, everything looks like a nail."},{"id":717,"es":"Parece que va a llover, ¿verdad ?","en":"It looks like it's going to rain, right?"},{"id":718,"es":"¿Me da la cuenta, por favor ?","en":"May I have the check, please?"},{"id":719,"es":"¿Me da la hora, por favor ?","en":"Can you tell me the time, please?"},{"id":720,"es":"Ven a mi casa, por favor.","en":"Please come to my house."},{"id":721,"es":"Este año, tengo que comprar un auto.","en":"This year, I need to buy a car."},{"id":722,"es":"Necesito comprar comida, pero no tengo suficiente dinero.","en":"I need to buy food, but I don't have enough money."},{"id":723,"es":"Solo creo que deberías tener más cuidado, eso es todo.","en":"I just think you should be more careful, that's all."},{"id":724,"es":"Para ser feliz, deberías pasar el tiempo con alguien a quien quieras.","en":"To be happy, you should spend time with someone you love."},{"id":725,"es":"No lo puedes arreglar, deberías comprar uno nuevo.","en":"You can't fix it. You should buy a new one."},{"id":726,"es":"Si necesitas libros, deberías sacar provecho de los libros en la biblioteca.","en":"If you need books, make the most of the books in the library."},{"id":727,"es":"Te ves cansado, deberías dormir un poco.","en":"You look tired. You should rest a little."},{"id":728,"es":"Con tu talento, deberías ser capaz de conseguir mucho dinero.","en":"With your talent, you should be able to make a lot of money."},{"id":729,"es":"Que lo haga otro, por favor.","en":"Please have someone else do it."},{"id":730,"es":"Sí, conseguí un nuevo trabajo, pero no es nada del otro mundo.","en":"Yeah, I got a new job but it's nothing to write home about."},{"id":731,"es":"A menudo hacemos lo que tenemos que hacer, no lo que queremos hacer.","en":"We often do what we have to do, not what we want to do."},{"id":732,"es":"Si no mal recuerdo, creo que tenemos que dar vuelta a la izquierda en la siguiente esquina.","en":"If I remember correctly, I think we have to turn left at the next corner."},{"id":733,"es":"Vivimos todos bajo el mismo cielo, pero no tenemos todos el mismo horizonte.","en":"We all live under the same sky, but we don't all have the same horizon."},{"id":734,"es":"Aunque no tenemos mucho dinero, quiero comprar esta pintura.","en":"Although we don't have much money, I want to buy this painting."},{"id":735,"es":"Lo lamento, pero eso es todo lo que tenemos ahora mismo.","en":"I'm sorry, but that's all we have right now."},{"id":736,"es":"Hay poco tiempo, tenemos que actuar AHORA.","en":"Time is short, we must act NOW."},{"id":737,"es":"No tenemos mucha nieve aquí, ni siquiera en invierno.","en":"We don't have much snow here even in the winter."},{"id":738,"es":"De hecho, yo mismo acabo de llegar.","en":"As a matter of fact, I've only just arrived myself."},{"id":739,"es":"¡Quiero ir al cielo, pero no quiero morir para llegar ahí !","en":"I want to go to heaven, but I don't want to die to get there!"},{"id":740,"es":"Si tú quieres un buen asiento, debes llegar ahí temprano.","en":"If you want a good seat, you should get there early."},{"id":741,"es":"Al llegar al aeropuerto, llamó a su mujer por teléfono.","en":"Upon arriving at the airport, he made a phonecall to his wife."},{"id":742,"es":"Vete de una vez, o vas a llegar tarde al colegio.","en":"Go at once, or you will be late for school."},{"id":743,"es":"Corre, o vas a llegar tarde.","en":"Run, or else you'll be late."},{"id":744,"es":"Digas lo que digas, es con ella con quien me voy a casar.","en":"Whatever you say, she is the one I'm going to marry."},{"id":745,"es":"No es a ti a quien ella ama, sino a mí.","en":"It's not you that she loves, it's me."},{"id":746,"es":"A quien venga, dile que estoy fuera de casa.","en":"Whoever comes, say I am away from home."},{"id":747,"es":"De nosotros cinco, es ella sin duda quien habla más idiomas.","en":"Among the five of us, she, without a doubt, speaks the most languages."},{"id":748,"es":"No fuiste tú quien se comió el pastel que hice, fue tu hermana.","en":"It was not you who ate the cake I made, it was your sister."},{"id":749,"es":"Sí, la leche está muy buena.","en":"Yes, the milk is very good."},{"id":750,"es":"Sí, tengo una buena idea.","en":"Yes, I have a good idea."},{"id":751,"es":"Suena como una muy buena idea, después de todo.","en":"Sounds like a pretty good idea, after all."},{"id":752,"es":"Por ser muy inteligente y amable, este perro me es buena compañía.","en":"Being very clever and gentle, this dog is a good companion to me."},{"id":753,"es":"Quiero ser una buena amiga, pero es difícil.","en":"I really want to be a good friend, but it is hard."},{"id"

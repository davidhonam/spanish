s":"Cuando los llamo, no contesta nadie.","en":"When I phone them nobody answers."},{"id":2177,"es":"Me llamo Legión, porque somos muchos.","en":"My name is Legion; for we are many."},{"id":2178,"es":"No, no me llamo María. Me llamo Teresa.","en":"No, my name is not Maria. My name is Teresa."},{"id":2179,"es":"Sí, me llamo Karen Smith.","en":"Yes, my name is Karen Smith."},{"id":2180,"es":"Me llamo Noelia, ¿y tú ?","en":"My name is Noelia, and you are?"},{"id":2181,"es":"En cuanto vuelvan, te llamo.","en":"As soon as they return, I will telephone you."},{"id":2182,"es":"Me llamo Tamako, ¿y tú te llamas... ?","en":"My name is Tamako, and yours is?"},{"id":2183,"es":"Espera un minuto, que llamo a Jimmy.","en":"Hang on a minute. I'll call Jimmy."},{"id":2184,"es":"Al llegar Maria a la parada, el último autobús ya se había partido.","en":"When Mary reached the bus stop, the last bus had already left."},{"id":2185,"es":"Aunque ella se apresuró, la mujer mayor perdió el último tren.","en":"Even though she rushed, the elderly woman missed the last train."},{"id":2186,"es":"Quien ríe último, ríe mejor.","en":"He laughs best who laughs last."},{"id":2187,"es":"Imagina que perdemos el último tren, ¿qué deberíamos hacer ?","en":"Suppose that we miss the last train, what should we do?"},{"id":2188,"es":"Quien sea que haya hecho el último comentario, por favor váyase ahora.","en":"Whoever made that last comment, please leave now."},{"id":2189,"es":"Cuando solo queda la muerte, el último recurso es rogar por comida.","en":"When only death remains, the last resort is to beg for food."},{"id":2190,"es":"Cuando fui ahí, la tienda estaba cerrada.","en":"The shop was closed when I went there."},{"id":2191,"es":"Anoche, alguien se metió a la pequeña tienda cerca de mi casa.","en":"Last night someone broke into the small shop near my house."},{"id":2192,"es":"Mamá, ven conmigo a la tienda.","en":"Mom, come with me to the store."},{"id":2193,"es":"Como no había clientes, cerramos la tienda más temprano.","en":"We had no customers, so we shut the shop early."},{"id":2194,"es":"Como era domingo, la tienda estaba cerrada.","en":"Since it was Sunday, the store was closed."},{"id":2195,"es":"Por favor, dime cómo llegar a la tienda XYZ.","en":"Please tell me the way to the XYZ store."},{"id":2196,"es":"Si quieres comprar una correa, anda a una tienda de mascotas.","en":"If you want to buy a leash, go to a pet shop."},{"id":2197,"es":"En cuanto a los perros, los clientes no deben traerlos a esta tienda.","en":"As for dogs, customers may not bring them into this store."},{"id":2198,"es":"Si comes bien, es probable que vivas más.","en":"If you eat well, you're likely to live longer."},{"id":2199,"es":"Lo que comes, o qué clase de vida llevas, lo decides tú mismo.","en":"What you eat, or what kind of life you live, are decided by you alone."},{"id":2200,"es":"Sobre todo, ten cuidado con lo que comes y bebes.","en":"Above all, be careful about what you eat and drink."},{"id":2201,"es":"Si siempre comes tanto, vas a engordar.","en":"If you always eat that much, you'll gain weight."},{"id":2202,"es":"Si comes mucho, vas a engordar.","en":"If you eat too much, you'll become fat."},{"id":2203,"es":"Si comes tanto, vas a engordar.","en":"If you eat that much, you'll get fat."},{"id":2204,"es":"Si comes demasiado, te pondrás gorda.","en":"If you eat too much, you'll get fat."},{"id":2205,"es":"Si no comes, te mueres.","en":"If you don't eat, you die."},{"id":2206,"es":"Realmente, Juan era un tipo agradable.","en":"Tom certainly was a nice guy."},{"id":2207,"es":"El nombre de ese tipo es Ben, si la memoria no me falla.","en":"That guy's name is Ben - if my memory serves me correctly."},{"id":2208,"es":"Él es del tipo haz lo que digo, no lo que hago.","en":"He's of the type do as I say, not as I do."},{"id":2209,"es":"Él es un buen tipo, sin duda, pero no es confiable.","en":"He is a good fellow, to be sure, but he isn't reliable."},{"id":2210,"es":"Pensé que ese tipo tenía un arma, así que le disparé.","en":"I thought that guy had a gun, so I shot him."},{"id":2211,"es":"¡Ten cuidado, este tipo tiene licencia de disparar !","en":"Be careful, this guy has a shooting license!"},{"id":2212,"es":"Él no se desalentará con facilidad, porque es un tipo duro.","en":"He won't be easily discouraged, because he's a tough guy."},{"id":2213,"es":"Juan es un tipo apuesto, pero no es muy amistoso.","en":"Tom is a good-looking guy, but he's not too friendly."},{"id":2214,"es":"Mañana a estas horas, Juan estará ocupado.","en":"Tom will be busy at this time tomorrow."},{"id":2215,"es":"Como no usamos estas cosas, se las damos a quienquiera que las necesite.","en":"As we don't use these things, we give them to whoever needs them."},{"id":2216,"es":"Aprendé estas palabras, una por una.","en":"Learn these words, one by one."},{"id":2217,"es":"En verdad, estas fotos son muy bellas.","en":"These pictures are really very beautiful."},{"id":2218,"es":"Estas toallas son del mismo color, pero de tamaños diferentes.","en":"These towels are the same color but different sizes."},{"id":2219,"es":"No tiene importancia, estas cosas pasan.","en":"It's not important, things happen."},{"id":2220,"es":"Estas galletas no son caras, pero saben rico.","en":"These cookies aren't expensive, but they taste good."},{"id":2221,"es":"Toma el que más te guste, sea cuál sea.","en":"Take the one you like best, whichever it is."},{"id":2222,"es":"Si te gusta la cerveza, puede que te guste el vino.","en":"If you like beer, you might like wine."},{"id":2223,"es":"¿Qué te gusta más, la carne o el pescado ?","en":"Which do you like better, meat or fish?"},{"id":2224,"es":"¿Qué comió, pescado o carne ?","en":"What did you eat? Fish or meat?"},{"id":2225,"es":"Cómo él no tenía modo de prender fuego, se comió el pescado crudo.","en":"As he had no way of making fire, he ate the fish raw."},{"id":2226,"es":"Por favor, congelá el pescado y la carne.","en":"Please freeze the fish and meat."},{"id":2227,"es":"El perro se comió al pescado con huesos, cola y todo.","en":"The dog ate the fish, bones, tail and all."},{"id":2228,"es":"¿Qué comiste, pescado o carne ?","en":"What did you eat? Fish or meat?"},{"id":2229,"es":"¿Qué comieron, pescado o carne ?","en":"What did you eat? Fish or meat?"},{"id":2230,"es":"Es un hombre ocupado, así que la única forma que tienes de contactar con él es por teléfono.","en":"He's a busy man, so the only way you can contact him is by telephone."},{"id":2231,"es":"Me sigue llamando por teléfono, y la verdad no quiero hablar con él.","en":"He keeps on phoning me, and I really don't want to talk to him."},{"id":2232,"es":"Juan siguió intentando llamar a Maria, pero ella nunca contestó su teléfono.","en":"Tom kept trying to call Mary, but she never answered her phone."},{"id":2233,"es":"Por favor, coge el teléfono.","en":"Answer the phone, please."},{"id":2234,"es":"Cuando la llamé por teléfono, no estaba.","en":"She was out when I called."},{"id":2235,"es":"No comió sólo una pera, sino tres.","en":"He didn't just eat 1 pear, but 3."},{"id":2236,"es":"Por otra parte, él tenía otra opinión.","en":"On the other hand, he had a different opinion."},{"id":2237,"es":"Por favor, saluda a tu esposa de mi parte.","en":"Please say hello to your wife for me."},{"id":2238,"es":"Quiero ser parte de la solución, no del problema.","en":"I want to be part of the solution, not part of the problem."},{"id":2239,"es":"Sabemos que es difícil, pero por favor, no traduzcas de forma literal.","en":"We know it's difficult, but please don't translate literally."},{"id":2240,"es":"No tengo mucho dinero, pero me las arreglo de una forma u otra.","en":"I don't have a lot of money, but I get along somehow."},{"id":2241,"es":"De cualquier forma, ¿qué clase de tonto proyecto es ?","en":"What sort of stupid project is this anyway?"},{"id":2242,"es":"Para ser sincero, no me gusta su forma de pensar.","en":"To tell the truth, I don't like his way of thinking."},{"id":2243,"es":"Esta mantequilla es doméstica, pero de ninguna forma es inferior a la mantequilla extranjera.","en":"This butter is domestic, but it is in no way inferior to foreign butter."},{"id":2244,"es":"Después de haberla terminado, se fue a la cama.","en":"Having finished it, he went to bed."},{"id":2245,"es":"Si no hubiera desperdiciado el tiempo, ya habría terminado.","en":"If he hadn't wasted time, he'd be finished by now."},{"id":2246,"es":"Habiendo terminado el trabajo, se fue a la cama.","en":"Having finished the work, he went to bed."},{"id":2247,"es":"Habiendo terminado su trabajo, él fue a la cama.","en":"His work finished, he went to bed."},{"id":2248,"es":"Si me hubieras ayudado, podría haber terminado el trabajo.","en":"If you had helped me, I could have accomplished the work."},{"id":2249,"es":"Por favor, préstame el libro cuando hayas terminado de leerlo.","en":"Please lend me the book when you have finished reading it."},{"id":2250,"es":"Cuando haya terminado mi almuerzo, me recostaré por una hora.","en":"When I have finished my lunch, I will lie down for an hour."},{"id":2251,"es":"A decir verdad, no me agrada su manera de vivir.","en":"To tell the truth, I don't like his way of living."},{"id":2252,"es":"Ahora que soy maestro, pienso de otra manera.","en":"Now I am a teacher, I think otherwise."},{"id":2253,"es":"Para mañana, esta niña lo habrá hecho.","en":"By tomorrow morning this girl will have done it."},{"id":2254,"es":"De acuerdo con el pronóstico del tiempo, habrá más lluvia.","en":"According to the weather forecast, there'll be more rain on the way."},{"id":2255,"es":"Para cuando vuelvas, ella ya se habrá ido.","en":"By the time you get back, she'll have left."},{"id":2256,"es":"Con algo de suerte, mañana no habrá clase.","en":"With any luck, there will be no school tomorrow."},{"id":2257,"es":"Por ahora, él habrá llegado a Osaka.","en":"He will have reached Osaka by now."},{"id":2258,"es":"Si no eres capaz de arreglar la tubería, habrá que llamar a un fontanero.","en":"If you can't fix the pipe, we'll have to call a plumber."},{"id":2259,"es":"Mientras haya vida, habrá esperanza.","en":"As long as there's life, there is hope."},{"id":2260,"es":"Aparentemente, no hay nada que no pueda pasar hoy.","en":"Apparently, there is nothing that cannot happen today."},{"id":2261,"es":"En una ciudad puedes pasar desapercibido, mientras que en un pueblo eso es imposible.","en":"In a town you may pass unnoticed, whereas in a village it's impossible."},{"id":2262,"es":"Permiso, ¿puedo pasar ?","en":"Excuse me, could I get past?"},{"id":2263,"es":"Si no quieres leer, no leas.","en":"If you don't want to read, then don't read."},{"id":2264,"es":"Voy a leer el horóscopo, que es mejor.","en":"I'm going to read the horoscope, which is better."},{"id":2265,"es":"Después de leer la carta, la rompió en pedacitos.","en":"After she had read the letter, she tore it to pieces."},{"id":2266,"es":"Yo quise ayudar, pero no había nada que pudiera hacer.","en":"I wanted to help, but there was nothing I could do."},{"id":2267,"es":"Si se le diera otra oportunidad, él lo haría lo mejor que pudiera.","en":"If he were given another chance, he'd do his best."},{"id":2268,"es":"Salí temprano, así pudiera conseguir un buen asiento.","en":"I left early so I could get a good seat."},{"id":2269,"es":"Si yo pudiera vivir de nuevo, me gustaría ser un músico.","en":"If I could live again, I would like to be a musician."},{"id":2270,"es":"Si pudiera pedir un deseo, desearía que pudiera recuperar el tiempo perdido.","en":"If I could have a wish, I'd wish I could make up for lost time."},{"id":2271,"es":"Si pudiera entenderlo, te lo diría.","en":"If I could understand it, I would tell you so."},{"id":2272,"es":"Él llevaba una máscara, de forma que nadie pudiera reconocerle.","en":"He wore a mask so no one would recognize him."},{"id":2273,"es":"El hecho es, creo, muy importante.","en":"The fact is, I think, very important."},{"id":2274,"es":"¿Qué es más importante, tu carrera o tu familia ?","en":"Which comes first, your career or your family?"},{"id":2275,"es":"Al morir su marido, el bebé se convirtió en lo más importante para ella.","en":"After her husband died, her baby was all in all to her."},{"id":2276,"es":"Para mí, el amor de la comunidad es más importante que el dinero.","en":"The love of the community is more important to me than money."},{"id":2277,"es":"Todos sabíamos que Juan estaba en problemas, pero ninguno hizo nada para ayudar.","en":"We all knew Tom was in trouble, but none of us did anything to help."},{"id":2278,"es":"Tom, creo que tenemos que ayudar a Maria. Parece que está en problemas.","en":"Tom, I think we need to help Mary. It looks like she's in trouble."},{"id":2279,"es":"Si Juan tuviera problemas de dinero, pienso que nos lo contaría.","en":"If Tom had money problems, I think he'd let us know."},{"id":2280,"es":"La vida es, en el mejor de los casos, un mar de problemas.","en":"Life is, in the best case, an ocean of problems."},{"id":2281,"es":"Si le sigue dando así a la bebida, va a tener problemas.","en":"If he carries on drinking like that, he's going to have a problem."},{"id":2282,"es":"Mejor hubieras dejado de fumar, por tu salud.","en":"You had better give up smoking for your health."},{"id":2283,"es":"Si solo me hubieras escuchado, nada de esto hubiera pasado.","en":"If you had only listened to me, none of this would have happened."},{"id":2284,"es":"Si me lo hubieras dicho antes, me habría disfrazado.","en":"If you had told me earlier, I would have dressed up."},{"id":2285,"es":"Si hubieras venido un poco antes, hubieras podido conocerla.","en":"Had you come a little earlier, you could have met her."},{"id":2286,"es":"Si me hubieras llamado, habría venido para ayudarte.","en":"If you had called me, I would have come to help you."},{"id":2287,"es":"Con un poco más de paciencia, hubieras triunfado.","en":"With a little more patience, you would have succeeded."},{"id":2288,"es":"No haga eso, por favor.","en":"Please don't do that."},{"id":2289,"es":"No puedo tocar de memoria, haga el favor de darme la música.","en":"I can't play it from memory. Please give me the music."},{"id":2290,"es":"Ella le escucha, aunque nadie más lo haga.","en":"She listens to him even though no one else does."},{"id":2291,"es":"Aunque sea duro, debo hacerlo.","en":"Whether it may be hard or not, I must do it."},{"id":2292,"es":"Bueno, debo irme.","en":"Well, I must be going."},{"id":2293,"es":"Para comenzar, debo agradecerte por tu ayuda.","en":"To start with, I must thank you for your help."},{"id":2294,"es":"Estoy cansado; sin embargo, debo terminar mi tarea.","en":"I am tired; nevertheless, I must finish my homework."},{"id":2295,"es":"Debo rechazar tu oferta, por más tentadora que sea.","en":"I have to refuse your offer, as tempting as it might be."},{"id":2296,"es":"Los Tigres perdieron el juego, lo que fue una sorpresa para nosotros.","en":"The Tigers lost the game, which was a surprise to us."},{"id":2297,"es":"Yo sé las reglas de memoria, pero no juego muy bien.","en":"I know the rules by heart, but I'm not so good playing."},{"id":2298,"es":"No me gustaba ese juego, hasta que empecé a ganar.","en":"I didn't like this game until I started winning."},{"id":2299,"es":"No, pero juego al tenis.","en":"No, but I play tennis."},{"id":2300,"es":"Si fuera a llover mañana, el juego se pospondría.","en":"If it were to rain tomorrow, the match would be postponed."},{"id":2301,"es":"Jugamos al ajedrez, no tanto por disfrutar del juego como para matar el tiempo.","en":"We played chess not so much to enjoy the game as just to kill time."},{"id":2302,"es":"Juego al tenis, pero tengo muy mal estilo.","en":"I play tennis, but my form is terrible."},{"id":2303,"es":"Cualquier juego que juegue contigo, tú nunca ganas.","en":"Whatever game I play with you, you never win."},{"id":2304,"es":"No seas tan duro conmigo, por favor.","en":"Don't be too hard on me please."},{"id":2305,"es":"Vamos, no seas tonto.","en":"Come on, don't be silly."},{"id":2306,"es":"¡No seas tonto, no se puede conducir sin volante !","en":"Don't be silly, you can't drive without a wheel!"},{"id":2307,"es":"¿Y tú le crees ? ¡No seas bruta, chica !","en":"And you believe him? Don't be stupid, girl!"},{"id":2308,"es":"No seas tan ruidoso, por favor.","en":"Don't be so noisy, please."},{"id":2309,"es":"No seas tímido, habla conmigo.","en":"Don't be shy, talk to me."},{"id":2310,"es":"Lo siento, he llegado tarde.","en":"I'm sorry. I came late."},{"id":2311,"es":"Si no hubiera sido por la tormenta, habría llegado antes.","en":"But for the storm, I would have arrived earlier."},{"id":2312,"es":"Que yo sepa, él no ha llegado jamás a la hora acordada.","en":"As far as I know, he has never come on time."},{"id":2313,"es":"Vamos, ha llegado el autobús.","en":"Come on, the bus is here."},{"id":2314,"es":"¡Mira, ha llegado el tren !","en":"Look! The train has arrived!"},{"id":2315,"es":"Hemos llegado muy rápido, ¿verdad ?","en":"We've arrived pretty quickly, haven't we?"},{"id":2316,"es":"Al ladrón no le agrada la luz de la luna, a un villano no le agrada un buen hombre.","en":"A thief doesn't like the moonlight, a villain doesn't like a good man."},{"id":2317,"es":"Por favor, apaga la luz.","en":"Please turn off the light."},{"id":2318,"es":"Apaga la luz, por favor.","en":"Turn off the light, please."},{"id":2319,"es":"Por favor, apaga la luz cuando dejes la habitación.","en":"Please put the light out when you leave the room."},{"id":2320,"es":"Enciende la luz, por favor.","en":"Turn on the light, please."},{"id":2321,"es":"¡Enciende la luz, por favor !","en":"Please, turn on the light!"},{"id":2322,"es":"Se ha puesto oscuro. Por favor, enciende la luz por mí.","en":"It's gotten dark. Please turn on the light for me."},{"id":2323,"es":"Pasa la sal, por favor.","en":"Pass the salt, please."},{"id":2324,"es":"¿Puede pasarme la sal, por favor ?","en":"Could you pass me the salt, please?"},{"id":2325,"es":"¿Puedes pasarme la sal, por favor ?","en":"Could you please pass me the salt?"},{"id":2326,"es":"Por favor, pásame la sal.","en":"Please pass me the salt."},{"id":2327,"es":"Pásame la sal, por favor.","en":"Pass me the salt, please."},{"id":2328,"es":"¡Rápido, sal de aquí !","en":"Get out of here quickly!"},{"id":2329,"es":"Mamá, ponle un poco más de sal a la sopa.","en":"Mom, add a little more salt to the soup."},{"id":2330,"es":"Has echado demasiada sal en la sopa, ahora no hay quien la coma.","en":"You've put too much salt into the soup. Now, no one's going to eat it."},{"id":2331,"es":"En esos días, el siempre estaba bebiendo.","en":"He was always drinking in those days."},{"id":2332,"es":"Con amigos como esos, no hacen falta enemigos.","en":"With such friends, one needs no enemies."},{"id":2333,"es":"Esperé por diez minutos, aunque esos diez minutos parecieron como diez horas para mí.","en":"I waited for ten minutes, though they seemed like 10 hours to me."},{"id":2334,"es":"Por favor, lústrate esos zapatos.","en":"Please shine those shoes."},{"id":2335,"es":"Soy una persona que tiene muchos defectos, pero esos defectos pueden ser corregidos fácilmente.","en":"I am a flawed person, but these are flaws that can easily be fixed."},{"id":2336,"es":"Mira a esos conformistas, siempre están haciendo la pelota al hombre.","en":"Look at those conformists, they're always sucking up to the man."},{"id":2337,"es":"A mi familia le va bien, gracias.","en":"My family is fine, thanks."},{"id":2338,"es":"En mi familia, la que se levanta más temprano es mi madre.","en":"Mother gets up earliest in my family."},{"id":2339,"es":"Mi familia está bien, gracias.","en":"My family is fine, thanks."},{"id":2340,"es":"Cuando Maria era una niña, su familia era muy pobre.","en":"When Mary was a child, her family was very poor."},{"id":2341,"es":"Extraño como suena, sigue siendo un hecho.","en":"Strange as it may sound, it is still fact."},{"id":2342,"es":"Es imposible ser siempre un héroe, pero siempre puedes seguir siendo un hombre.","en":"It is impossible to be always a hero, but you can always remain a man."},{"id":2343,"es":"Hum, y yo que pensé que estaba siendo amable por permitir que vivieras.","en":"Hmm, and I thought I was being kind by letting you live."},{"id":2344,"es":"No estoy siendo claro, ¿verdad ?","en":"I'm not making myself clear, am I?"},{"id":2345,"es":"Siendo domingo hoy, no tenemos colegio.","en":"It being Sunday today, we have no school."},{"id":2346,"es":"Pese a ser pequeño, sigue siendo un buen coche.","en":"Even though it's small, it's still a great car."},{"id":2347,"es":"¿Estoy siendo paranoico, no es así ?","en":"I am being paranoid, aren't I?"},{"id":2348,"es":"Si sigues tomando tanto, podrías terminar siendo un alcohólico.","en":"If you go on drinking so much, you may well end up an alcoholic."},{"id":2349,"es":"De hecho, él no me cae bien.","en":"As a matter of fact, I dislike him."},{"id":2350,"es":"Él realmente no me cae bien, de hecho, le odio.","en":"I don't really like him, in fact, I hate him."},{"id":2351,"es":"Hablando claro, él no me cae bien.","en":"To put it clearly, I don't like him."},{"id":2352,"es":"No me cae muy bien. Si te digo la verdad, le odio.","en":"I don't like him very much. To tell you the truth, I hate him."},{"id":2353,"es":"¡Cuando la noche cae, los sueños toman vida !","en":"When the night falls, dreams come to life!"},{"id":2354,"es":"Personalmente me cae bien, pero como doctor no le tengo respeto.","en":"I like him personally, but don't respect him as a doctor."},{"id":2355,"es":"Tiene unos defectos, sin embargo me cae bien.","en":"He has some faults, but I like him none the less."},{"id":2356,"es":"El hombre, en pocas palabras, no es de fiar.","en":"The man, in short, is not to be trusted."},{"id":2357,"es":"En pocas palabras, creo que es un payaso.","en":"In a word, I think he's a fool."},{"id":2358,"es":"Había casi cien personas, pocas de las cuales habían sido vistas antes.","en":"There were almost 100 people, few of whom I had seen before."},{"id":2359,"es":"En pocas palabras, el proyecto fue un fracaso.","en":"The project, in short, was a failure."},{"id":2360,"es":"En pocas palabras, rechazó su propuesta.","en":"To put it briefly, she turned down his proposal."},{"id":2361,"es":"Hay muy pocas frases en feroés aquí. Me pregunto, ¿por qué será así ?","en":"There are very few sentences in Faroese here. I wonder, why is that so?"},{"id":2362,"es":"Hay pocas chances de mantenerte esbelto, a menos que te apegues a una dieta.","en":"There's little chance of keeping slim, unless you stick to a diet."},{"id":2363,"es":"A buen entendedor, pocas palabras bastan.","en":"A word to the wise is enough."},{"id":2364,"es":"Juan no siempre llega tarde, pero a menudo sí.","en":"Tom isn't always late, but he often is."},{"id":2365,"es":"Sé que está en el departamento, pero no lo puedo encontrar.","en":"I know it's in the apartment, but I can't find it."},{"id":2366,"es":"A dondequiera que vayas, vas a encontrar lo mismo.","en":"Wherever you go, you will find the same thing."},{"id":2367,"es":"Se suponía que nos íbamos a encontrar en el restaurante, pero Juan nunca apareció.","en":"We were supposed to meet at the restaurant, but Tom never showed up."},{"id":2368,"es":"No sirve de nada culparse el uno al otro, necesitamos encontrar soluciones.","en":"It's no use blaming each other, we need to find solutions."},{"id":2369,"es":"Pasé tres años buscando a un buen director, pero no pude encontrar ninguno.","en":"I spent three years looking for a good director, but couldn't find one."},{"id":2370,"es":"Con vuestras habilidades, estoy segura de que no sería muy difícil encontrar otro trabajo.","en":"With your skills, I'm sure it wouldn't be too hard to find another job."},{"id":2371,"es":"¿Dónde puedo encontrar las frutas, verduras y hortalizas ?","en":"Where can I find the produce?"},{"id":2372,"es":"Ambos, Juan y Maria, quieren ir.","en":"Tom and Mary both want to go."},{"id":2373,"es":"Sobre todo, quieren vivir en paz.","en":"They want, above all things to live in peace."},{"id":2374,"es":"María, Marcelina y el padre José quieren ir a la ciudad.","en":"María, Marcelina and father José want to go to town."},{"id":2375,"es":"Si quieren hablar conmigo, por favor llámenme.","en":"If you want to speak to me, please call me up."},{"id":2376,"es":"Sócrates dijo, aquellos que quieren poca cosa están más cerca de los dioses.","en":"Socrates said, Those who want fewest things are nearest to the gods."},{"id":2377,"es":"Si quieren un sándwich, levanten la mano.","en":"If you want a sandwich, raise your hand."},{"id":2378,"es":"Él lo intentó otra vez, pero fue en vano.","en":"He tried it again, but in vain."},{"id":2379,"es":"Para cuando lo intentó con el 966, Dima había empezado a perder la esperanza.","en":"By the time that he tried 966, Dima was beginning to give up hope."},{"id":2380,"es":"Juan intentó sonreír, pero no pudo.","en":"Tom tried to smile, but couldn't."},{"id":2381,"es":"Por lo que sé, es una chica amable.","en":"As far as I know, she is a kind girl."},{"id":2382,"es":"Chica, qué hermoso cabello tienes.","en":"Girl, what beautiful hair you have."},{"id":2383,"es":"Para ser chica, es valiente.","en":"She is brave for a girl."},{"id":2384,"es":"Lo amo, pero él está enamorado de otra chica.","en":"I love him, but he's in love with another girl."},{"id":2385,"es":"Puesto que los padres se divorciaron, la chica tenía poco contacto con el padre.","en":"Because the parents divorced, the girl had little contact with the father."},{"id":2386,"es":"Al oírle hablar, puede que pienses que es una chica.","en":"To hear him talk, you might think he's a girl."},{"id":2387,"es":"Ella es chica, pero gorda.","en":"She's short, but fat."},{"id":2388,"es":"Esa chica es islandesa, pero ahora vive en los Estados Unidos.","en":"That girl is Icelandic, but now she lives in the United States."},{"id":2389,"es":"Sin el Sol, no podríamos vivir en la tierra.","en":"Without the Sun, we could not live on the Earth."},{"id":2390,"es":"Si no fuera por el sol, todos los seres vivos morirían.","en":"If it were not for the sun, every living thing would die."},{"id":2391,"es":"¿Está hablando en inglés, francés o alemán ?","en":"Is he speaking English, French, or German?"},{"id":2392,"es":"Estoy hablando de esta pluma, no de la que se encuentra sobre el escritorio.","en":"I'm talking about this pen, not that one over there on the desk."},{"id":2393,"es":"En cuanto a mí, me encanta la primavera. Nunca me gustó el verano.","en":"As for myself, I like spring very much. I never liked summer."},{"id":2394,"es":"Me encanta cuando me da un beso en la almejilla. No, en la mejilla.","en":"I love it when he kisses my lips. No, my cheeks."},{"id":2395,"es":"A las mujeres les encantan las mentiras, a los hombres les encanta mentir.","en":"Women love lies, men love lying."},{"id":2396,"es":"Mi perro es ciego, pero le encanta salir a pasear.","en":"My dog is blind, but he loves to go out for a walk."},{"id":2397,"es":"Me encanta Nara, sobre todo en otoño.","en":"I love Nara, particularly in the fall."},{"id":2398,"es":"Maria no tiene talento musical, pero le encanta cantar.","en":"Mary has no musical skill, but she loves to sing."},{"id":2399,"es":"Como es común con las muchachas jóvenes, a Alice le encanta el chocolate.","en":"As usual with young girls, Alice loves chocolate."},{"id":2400,"es":"Si vale la pena hacerlo, hazlo bien.","en":"If it is worth doing, do it well."},{"id":2401,"es":"Es un bonito coche, pero no vale lo que he pagado por él.","en":"It is a beautiful car, but it is not worth the price that I paid for it."},{"id":2402,"es":"De todas las películas que arriendo, esta es la única que vale la pena ver.","en":"Of all the films I rented, this is the only one worth seeing."},{"id":2403,"es":"De todas las películas que alquilé, esta es la única que vale la pena ver.","en":"Of a s a fortune!"},{"id":2419,"es":"¡Querría comprar este ordenador, pero cuesta una barbaridad !","en":"I'd like to buy this computer, but it costs an arm and a leg!"},{"id":2420,"es":"A fin de poder compartirlo, lo vamos a tener que romper en dos pedazos.","en":"In order to share it, we'll have to tear it into two pieces."},{"id":2421,"es":"Una vez ha sido adquirido un hábito, tiene un poder compulsivo sobre nosotros.","en":"Once a habit has been acquired, it has almost compulsive power over us."},{"id":2422,"es":"Una vez adquirido un hábito, tiene un poder compulsivo sobre nosotros.","en":"Once a habit has been acquired, it has almost compulsive power over us."},{"id":2423,"es":"Quiero aprender a hablar hawaiano, para así poder impresionar a mi novia.","en":"I want to learn to speak Hawaiian, so I can impress my girlfriend."},{"id":2424,"es":"El partido en el poder es corrupto, pero la oposición es sólo un poco mejor.","en":"The party in power is corrupt, but the opposition is little better."},{"id":2425,"es":"Oh, desearía poder ir a Francia.","en":"Oh, I do wish I could go to France."},{"id":2426,"es":"Por lo que oí, él no estará por mucho tiempo en este país.","en":"I've heard that he won't be in this country for a long time."},{"id":2427,"es":"Según el periódico, él estará aquí hoy.","en":"According to the newspaper, he will be here today."},{"id":2428,"es":"Según los periódicos, él estará aquí hoy.","en":"According to the newspapers, he will be here today."},{"id":2429,"es":"El barco estará listo para zarpar, si el clima lo permite.","en":"The ship will be ready to sail, if the weather permits."},{"id":2430,"es":"Cuando te levantes, él estará estudiando.","en":"He will be studying when you get up."},{"id":2431,"es":"Cuidado, el hombre tiene una pistola.","en":"Watch out, the man has a gun."},{"id":2432,"es":"Por favor, ten más cuidado en el futuro.","en":"Please take more care in the future."},{"id":2433,"es":"Cuidado, la sopa está muy caliente.","en":"Be careful },{"id":2450,"es":"Pague en la caja, por favor.","en":"Please pay at the register."},{"id":2451,"es":"¡Alguien viene, cierra la caja y escóndela !","en":"Someone's coming, close the box and conceal it!"},{"id":2452,"es":"Sin saber qué hacer, le pedí consejo al profesor.","en":"Not knowing what to do, I asked the teacher for advice."},{"id":2453,"es":"Le pedí que se casara conmigo, y dijo que sí.","en":"I asked her to marry me and she accepted."},{"id":2454,"es":"Le pedí a Juan que viniera ayer, pero no vino.","en":"I asked Tom to come yesterday, but he didn't come."},{"id":2455,"es":"Cuando yo le pedí que me prestara algo de dinero, él rechazó mi petición.","en":"When I asked him to lend me some money, he turned down my request."},{"id":2456,"es":"Al no saber qué debía hacer, le pedí consejo.","en":"Not knowing what to do, I asked him for advice."},{"id":2457,"es":"Tras la comida, pedí que me dieran la cuenta.","en":"After the meal, I asked for the bill."},{"id":2458,"es":"Como no podía pagar el alquiler, le pedí ayuda a él.","en":"Since I couldn't pay the rent, I asked him for help."},{"id":2459,"es":"Cuando ella entró en la habitación, él se levantó.","en":"When she entered the room, he stood up."},{"id":2460,"es":"Tan pronto como sonó la campana, el profesor entró en el salón de clases.","en":"As soon as the bell rang the teacher came into the classroom."},{"id":2461,"es":"Cuando ella entró a la cocina, no había nadie.","en":"When she entered the kitchen, no one was there."},{"id":2462,"es":"Ella lo oyó gritar, así que entró corriendo a su habitación.","en":"She heard him scream, so she ran into his bedroom."},{"id":2463,"es":"Después de la guerra, Ford entró en la política.","en":"After the war, Ford entered politics."},{"id":2464,"es":"Cuando ella entró, habíamos terminado de cenar.","en":"When she came inside, we had finished eating dinner."},{"id":2465,"es":"Ahora que lo mencionas, no recuerdo haber visto a Juan en clase hoy.","en":"Now that you mention it, I don't remember seeing Tom in class today."},{"id":2466,"es":"En cuanto entré a clase, los estudiantes empezaron a hacerme preguntas.","en":"As soon as I entered the class, the students started asking questions."},{"id":2467,"es":"Si ves su casa, sabrás que él es pobre.","en":"If you see his house, you'll know that he is poor."},{"id":2468,"es":"Estoy perdido para siempre, ¿lo ves ? ¡Estoy en un aprieto !","en":"I'm forever lost, can't you see? I'm in a bind!"},{"id":2469,"es":"Si da la casualidad de que le ves, por favor transmítele mis mejores deseos.","en":"If you happen to see him, please give him my best regards."},{"id":2470,"es":"Esta hormiga es la reina, ¿no ves que tiene alas ?","en":"This ant is the queen; don't you see she has wings?"},{"id":2471,"es":"Lamentablemente, los resultados de ayer fueron como los ves.","en":"Unfortunately, the results yesterday were as you see."},{"id":2472,"es":"Ella tiene dos gatos, uno es blanco y otro es negro.","en":"She has two cats. One is white and one is black."},{"id":2473,"es":"Tenemos dos gatos en la casa, uno blanco y uno negro.","en":"We have two cats in the house: one white, and one black."},{"id":2474,"es":"El papel es muy blanco, pero la nieve es más blanca.","en":"The paper is very white but the snow is whiter."},{"id":2475,"es":"Él tiene dos gatos, uno blanco y uno negro.","en":"He has got two cats, one is white, one is black."},{"id":2476,"es":"¡Sea blanco o negro, un gato que caza ratones es un buen gato !","en":"Be it black or white, a cat that catches mice is a good cat!"},{"id":2477,"es":"Sea blanco o negro, un gato que caza ratones es un buen gato.","en":"Whether it's white or black, a cat that chases mice is a good cat."},{"id":2478,"es":"Tenemos 2 perros, uno de ellos es negro y el otro es blanco.","en":"We have two dogs. One is black and the other is white."},{"id":2479,"es":"Si él se hubiese quedado en casa ese día, no se había encontrado con ese desastre.","en":"If he had stayed at home that day, he would not have met with disaster."},{"id":2480,"es":"Si hubiese sabido que estabas aquí, habría venido inmediatamente.","en":"If I had known that were you here, I would have come at once."},{"id":2481,"es":"Si hubiese sabido que estabas aquí, habría venido de inmediato.","en":"If I had known that were you here, I would have come at once."},{"id":2482,"es":"Es un problema de vida o muerte, por así decirlo.","en":"It is, as it were, a life and death problem."},{"id":2483,"es":"Si nada nos salva de la muerte, al menos que el amor nos salve de la vida.","en":"If nothing saves us from death, may love at least save us from life."},{"id":2484,"es":"Todo tiene solución, menos la muerte.","en":"There's a cure for everything, except death."},{"id":2485,"es":"Lo que quiero no es té, sino café.","en":"What I want isn't tea, but coffee."},{"id":2486,"es":"No me gusta el té, por lo que normalmente tomo café en el desayuno.","en":"I do not like tea, so I generally drink coffee for breakfast."},{"id":2487,"es":"¿Cuál te gusta mejor, té o café ?","en":"Which do you like better, tea or coffee?"},{"id":2488,"es":"Querría un poco de té caliente, por favor.","en":"I'd like some hot tea, please."},{"id":2489,"es":"Tuve un empleo de medio tiempo como camarera en un hotel, pero no me gustó mucho.","en":"I had a part-time job as a hotel maid, but I didn't like it very much."},{"id":2490,"es":"¡Necesito ir a mi hotel, el hotel Hilton !","en":"I need to go to my hotel, the Hilton hotel!"},{"id":2491,"es":"Él fue a Osaka, donde montó un hotel.","en":"He went to Osaka, where he put up at a hotel."},{"id":2492,"es":"Perdón, ¿hay un hotel por aquí ?","en":"Excuse me, is there a hotel around here?"},{"id":2493,"es":"Si quieres un hotel, mira, está justo allí abajo.","en":"If you want a hotel, look, it's just down there."},{"id":2494,"es":"¡Al hotel Hilton, por favor !","en":"The Hilton Hotel, please."},{"id":2495,"es":"Te presto dinero, pero ten en cuenta que ésta es la última vez.","en":"I'll lend you money, but mind you, this is the last time."},{"id":2496,"es":"Por favor, ten cuidado de no dejar al perro suelto.","en":"Please be careful not to let the dog loose."},{"id":2497,"es":"Ten cuidado con lo que deseas, podría hacerse realidad.","en":"Be careful what you wish for, it might come true."},{"id":2498,"es":"Cree a aquellos que buscan la verdad, ten cuidado con aquellos que la encuentran.","en":"Believe those who seek truth, beware those who find it."},{"id":2499,"es":"Por favor, ten un poco de torta.","en":"Help yourself to the cake."},{"id":2500,"es":"Ten cuidado de no romper esta jarra, por favor.","en":"Please take care not to break this vase."},{"id":2501,"es":"No, no entiendo.","en":"No, I don't understand."},{"id":2502,"es":"Sí, te entiendo bien.","en":"Yes, I understand you well."},{"id":2503,"es":"Sí, le entiendo bien.","en":"Yes, I understand you well."},{"id":2504,"es":"No hay problema, entiendo.","en":"No problem, I understand."},{"id":2505,"es":"Él habla sólo inglés y alemán, ninguno de los cuales entiendo.","en":"He speaks only English and German, neither of which I understand."},{"id":2506,"es":"Lo entiendo un poco, pero no puedo hablarlo.","en":"I understand it a little, but I can't speak it."},{"id":2507,"es":"Entonces estabas solo, ¿verdad ?","en":"Then you were alone, right?"},{"id":2508,"es":"Pensé que solo estabas enojado conmigo, y no con el resto de mi familia.","en":"I thought you were only angry with me and not with the rest of my family."},{"id":2509,"es":"¿Dónde estabas ? , te estuvimos buscando por todos lados.","en":"Where were you? We've been looking all over for you."},{"id":2510,"es":"Me gusta la carne, pero los huevos no me caen bien.","en":"I like meat, but eggs do not agree with me."},{"id":2511,"es":"Cuando Juan era joven, se comía tres huevos al día.","en":"When Tom was young, he ate three eggs every day."},{"id":2512,"es":"Dos huevos fritos y un café, por favor.","en":"Two fried eggs and coffee, please."},{"id":2513,"es":"En verano, los huevos se pudren rápido.","en":"In summer, eggs soon go bad."},{"id":2514,"es":"Necesitamos harina, azúcar y huevos para hacer este pastel.","en":"We need flour, sugar and eggs to make this cake."},{"id":2515,"es":"Las vacas nos dan leche y las gallinas, huevos.","en":"Cows give us milk and chickens, eggs."},{"id":2516,"es":"Si tuviera que hacer una tortilla de patatas, compraría dos docenas de huevos.","en":"If I were to make a potato tortilla, I would buy two dozen eggs."},{"id":2517,"es":"Si tú quieres ir ahí, entonces nosotros no iremos ahí.","en":"If you don't want to go there, then we won't go there."},{"id":2518,"es":"Él va a estar ahí, pase lo que pase.","en":"He'll be there, rain or shine."},{"id":2519,"es":"Lo llamé, pero él no estaba ahí.","en":"I called him up, but he wasn't there."},{"id":2520,"es":"¡Por favor, no entres ahí !","en":"Please don't go in there."},{"id":2521,"es":"Hombre, ¿qué demonios estás buscando ?","en":"Man, what the hell are you looking for?"},{"id":2522,"es":"Tras tres semanas buscando un trabajo, encontró uno bien pagado.","en":"After spending three weeks looking for a job, he found a well-paid one."},{"id":2523,"es":"Si te metes con las drogas, te estás buscando problemas.","en":"If you mess with drugs, you're asking for trouble."},{"id":2524,"es":"¿Puedo ayudarte ? Sí, estoy buscando un vestido.","en":"May I help you? Yes, I'm looking for a dress."},{"id":2525,"es":"Ella lo convenció de hacerlo, aunque sabía que no era una buena idea.","en":"She persuaded him to do it even though she knew it wasn't a good idea."},{"id":2526,"es":"Bueno, es posible que tengas razón.","en":"Well, possibly you're right."},{"id":2527,"es":"No tengas miedo, porque no hay nada que temer.","en":"Fear not because there is nothing to fear."},{"id":2528,"es":"No tengas una casa, ten un vecino.","en":"Don't have a house, have a neighbour."},{"id":2529,"es":"Aún suponiendo que tengas razón, no podemos aprobar tu plan.","en":"Granting that you are right, we still can't approve of your plan."},{"id":2530,"es":"Cuando estés en problemas o tengas duda, ¡corre en círculos, chilla y grita !","en":"When in trouble or in doubt, run in circles, scream and shout!"},{"id":2531,"es":"«¿Qué quieres de comida ? » «Me da igual, lo que tengas por ahí.»","en":"What would you like for lunch? It doesn't matter, whatever you've got."},{"id":2532,"es":"Chanta la moto, cabrito. No puedes entrar acá a menos que tengas un pase.","en":"Hold your horses, young man. You can't enter here unless you have a pass."},{"id":2533,"es":"Quizás tengas razón, fui un egoísta.","en":"Perhaps you are right, I have been selfish."},{"id":2534,"es":"Sorprendentemente, él resultó ser un ladrón.","en":"Surprisingly enough, he turned out to be a thief."},{"id":2535,"es":"Al final, el rumor resultó ser falso.","en":"The rumor, after all, turned out untrue."},{"id":2536,"es":"Quería atrapar al pájaro, pero resultó muy difícil.","en":"I wanted to catch the bird, but I found it too difficult."},{"id":2537,"es":"Por suerte, ninguno de los pasajeros resultó herido.","en":"Fortunately, no passengers were injured."},{"id":2538,"es":"Ella lo ignoró, lo que resultó ser imprudente.","en":"She ignored him, which proved unwise."},{"id":2539,"es":"Vista desde la Luna, la Tierra parece una pelota.","en":"Seen from the moon, the earth looks like a ball."},{"id":2540,"es":"Estamos en la Tierra para buscar la felicidad, no para encontrarla.","en":"We're on earth to look for happiness, not to find it."},{"id":2541,"es":"En realidad, la tierra se está calentando.","en":"Actually, the earth is getting warmer."},{"id":2542,"es":"Compra tierra, he oído que ya no se fabrica.","en":"Buy land. I hear they aren't making it anymore."},{"id":2543,"es":"Si viviéramos en la luna, ¿qué tan grande se vería la Tierra ?","en":"If we were to live on the moon, how large would the earth look?"},{"id":2544,"es":"La cerveza es la respuesta, ¡pero no puedo recordar qué era la pregunta !","en":"Beer is the answer, but I don't remember what was the question!"},{"id":2545,"es":"El copete es la respuesta, pero ahora no puedo recordar la pregunta.","en":"Booze is the answer, but now I can't remember the question."},{"id":2546,"es":"Como no recibí una respuesta, le escribí otra vez.","en":"Since I didn't receive a reply, I wrote to her again."},{"id":2547,"es":"Si el universo es una respuesta, ¿cuál es la pregunta ?","en":"If the universe is an answer, what Is the question?"},{"id":2548,"es":"Si usted conoce la respuesta a esta pregunta, por favor dígame.","en":"If you know the answer to this question, please tell me."},{"id":2549,"es":"Si yo supiera la respuesta a la pregunta, te diría.","en":"If I knew the answer to the question, I would tell you."},{"id":2550,"es":"Sea quien sea a quien le preguntes, no conseguirás una respuesta satisfactoria.","en":"Whomever you may ask, you can't get a satisfactory answer."},{"id":2551,"es":"Si ahora estás ocupado, te llamaré de vuelta más tarde.","en":"If you are tied up now, I'll call you back later on."},{"id":2552,"es":"Si quieres tu dinero de vuelta, solo dilo.","en":"If you want your money back, just say so."},{"id":2553,"es":"Como estaba muy bebido, no pudo llevar el coche de vuelta a casa.","en":"Since he was very drunk, he couldn't drive his car home."},{"id":2554,"es":"No te preocupes, estaré de vuelta antes de las doce.","en":"Don't worry, I'll be back before twelve."},{"id":2555,"es":"A la ida, el viaje fue mas agradable que a la vuelta.","en":"The trip out was more pleasant than the return."},{"id":2556,"es":"Un billete de ida y vuelta para León, por favor.","en":"A return ticket to Leon, please."},{"id":2557,"es":"Juan lo hizo bien, considerando su edad.","en":"Tom did well considering his age."},{"id":2558,"es":"En la Edad Media, la leche aún era popular como medicina.","en":"In the Middle Ages, milk was still popular as a medicine."},{"id":2559,"es":"¿Cómo se llega a la estación, por favor ?","en":"How do you get to the station, please?"},{"id":2560,"es":"A Maria, el cabello le llega hasta la cintura.","en":"Mary has hair down to her waist."},{"id":2561,"es":"Según ustedes, ¿quién llega a la final ?","en":"According to you, who will make it to the final?"},{"id":2562,"es":"Apenas llega el cartero, él sale corriendo a recoger su correo.","en":"The second the mailman comes, he rushes out to pick up his mail."},{"id":2563,"es":"Parece que el Sr. Taniguchi llega tarde, ¿no ?","en":"It looks like Mr Taniguchi is late, doesn't it?"},{"id":2564,"es":"Cuando llega la primavera, las flores huelen dulce.","en":"When spring sets in, the flowers smell sweet."},{"id":2565,"es":"Por favor, despiértame a las siete de la mañana.","en":"Please wake me up at seven tomorrow morning."},{"id":2566,"es":"Ay, ¡qué pena ! Pensaba que se iba a despejar finalmente.","en":"Aye, what a pity! I thought it would clear up finally."},{"id":2567,"es":"De todos los libros publicados recientemente, sólo unos pocos valen la pena leer.","en":"Of all the books published recently, only a few are worth reading."},{"id":2568,"es":"Es una pena que el hang, la ocarina y la pipa sean tan poco conocidos aquí.","en":"It's a pity that hang, ocarina and pipa are so unpopular around here."},{"id":2569,"es":"Darren será juzgado. ¡Si pierde, es pena de muerte !","en":"Darren is to be put through a trial. If he fails, it's the death penalty!"},{"id":2570,"es":"Estate callado, o di algo que merezca la pena que oiga.","en":"Be silent, or speak something worth hearing."},{"id":2571,"es":"Papá, aquí está el café.","en":"Dad, here's the coffee."},{"id":2572,"es":"Ya está la cena, papá.","en":"Dinner is ready, Father."},{"id":2573,"es":"Aunque era muy tarde, él siguió trabajando.","en":"Though it was very late, he went on working."},{"id":2574,"es":"Le aconsejó que fuera al hospital, pero él no siguió su consejo.","en":"She advised him to go to the hospital, but he didn't follow her advice."},{"id":2575,"es":"Estaba cansado, pero siguió trabajando.","en":"He was tired, but he kept working."},{"id":2576,"es":"A pesar del cansancio, siguió con el trabajo.","en":"Even though he was tired, he went on with his work."},{"id":2577,"es":"Le aconsejó que tomara un descanso, pero no siguió su consejo.","en":"She advised him to take a rest, but he didn't follow her advice."},{"id":2578,"es":"Estaba cansada, pero siguió trabajando.","en":"She was tired, but she kept working."},{"id":2579,"es":"El perro siguió a su amo, moviendo la cola.","en":"The dog followed its master, wagging its tail."},{"id":2580,"es":"Aunque estaba cansada, siguió trabajando.","en":"Though she was tired, she kept on working."},{"id":2581,"es":"Ella le recomendó que no comprara un vehículo usado, pero él no siguió su consejo.","en":"She advised him not to buy a used car, but he didn't follow her advice."},{"id":2582,"es":"Yo puedo conducir un auto, pero Juan no.","en":"I can drive a car, but Tom can't."},{"id":2583,"es":"Juan no puede conducir un auto, así que siempre anda en una bicicleta.","en":"Tom can't drive a car so he always rides a bicycle."},{"id":2584,"es":"Mi mamá tiene licencia de conducir, pero no conduce un auto.","en":"My mother has a driver's license, but she doesn't drive a car."},{"id":2585,"es":"María se convirtió, de un día para otro, en la persona más feliz del mundo.","en":"One day, Maria became the happiest person in the world."},{"id":2586,"es":"Me gusta María, pero es demasiado ingenua.","en":"I like Maria, but she's very naïve."},{"id":2587,"es":"María le esperó, pero él no vino.","en":"Maria waited for him, but he didn't come."},{"id":2588,"es":"Le conté la noticia a Tom, no a María.","en":"I told the news to Tom, not to Mary."},{"id":2589,"es":"Cuando entré a la habitación, Juan y María se reían de algo.","en":"When I entered the room, Tom and Mary were laughing at something."},{"id":2590,"es":"Todos dicen que fui muy valiente, pero solo hice mi trabajo.","en":"Everyone says I was very brave, but I just did my work."},{"id":2591,"es":"Si te crees lo que dicen los políticos, entonces es sólo culpa tuya.","en":"If you believe what politicians say, it's really your own fault."},{"id":2592,"es":"Ellos dicen que él es culpable, pero yo creo lo contrario.","en":"They say he is guilty, but I believe the contrary."},{"id":2593,"es":"A veces ellos dicen, No puedo ir a la escuela hoy. Iré mañana.","en":"Sometimes they say, I can't go to school today. I'll go tomorrow."},{"id":2594,"es":"Dicen que hay ranas de colores chillones, pero yo nunca las he visto.","en":"They say there are bright-colored frogs, but I've never seen them."},{"id":2595,"es":"Algunos dicen esto, otros dicen aquello.","en":"Some say this, and others say that."},{"id":2596,"es":"Para decir «vivir una vida cómoda», los alemanes dicen «vivir como Dios en Francia».","en":"For living the good life, the Germans say, to live like God in France."},{"id":2597,"es":"Quisiera un poco más de pan, por favor.","en":"I'd like some more bread, please."},{"id":2598,"es":"Quisiera pagar la cuenta, por favor.","en":"I'd like to pay the check, please."},{"id":2599,"es":"Si es posible, quisiera irme a casa ahora.","en":"If possible, I would like to go home now."},{"id":2600,"es":"Quisiera un tiempo a solas, por favor.","en":"I'd like some time alone, please."},{"id":2601,"es":"Estar en un barco es estar en una cárcel, con la posibilidad de ahogarse.","en":"Being in a ship is being in a jail, with the chance of being drowned."},{"id":2602,"es":"¿Qué viaja más rápido, un barco o un tren ?","en":"Which goes faster, a ship or a train?"},{"id":2603,"es":"A esta distancia, el barco parece una isla.","en":"At a distance, the ship looks like an island."},{"id":2604,"es":"Desde esa distancia, el barco es similar a una isla.","en":"From that distance, the ship is similar to an island."},{"id":2605,"es":"Para cruzar el río, puedes usar un barco o el puente.","en":"To cross the river, you can use a boat or the bridge."},{"id":2606,"es":"Al empezar a andar el barco, se mareó.","en":"As soon as the ship began to move, he got seasick."},{"id":2607,"es":"Un camello es, por así decirlo, un barco en el desierto.","en":"A camel is, so to speak, a ship on the desert."},{"id":2608,"es":"No quieres que llegue tarde a la escuela, ¿verdad ?","en":"You don't want me to be late for school, do you?"},{"id":2609,"es":"Bueno, ¿se decidió ?","en":"Well, have you decided?"},{"id":2610,"es":"Pensé que vendría a la iglesia con nosotros, pero decidió quedarse en casa.","en":"I thought he would come to church with us, but he decided to stay home."},{"id":2611,"es":"Pensaba que vendría a la iglesia con nosotros, pero decidió quedarse en casa.","en":"I thought he would come to church with us, but he decided to stay home."},{"id":2612,"es":"A ella le gustaban los hombres gordos; por lo tanto, decidió convertirse al budismo.","en":"She loved fat men, so she decided to convert to Buddhism."},{"id":2613,"es":"Ella decidió casarse con él, aunque sus padres no querían.","en":"She decided to marry him even though her parents didn't want her to."},{"id":2614,"es":"Estaba cansada, pero decidió caminar.","en":"She was tired but decided on walking."},{"id":2615,"es":"Nati y yo estábamos regando las flores, así que decidió echarme agua.","en":"Nati and I were watering the flowers, then she decided to water me!"},{"id":2616,"es":"Al día siguiente, Jesús decidió partir a Galilea.","en":"The next day Jesus decided to leave for Galilee."},{"id":2617,"es":"A pesar de nuestro apoyo, decidió tirar la toalla.","en":"In spite of our encouragement he decided to throw in the towel."},{"id":2618,"es":"A decir verdad, nos enteramos de que su nuevo marido era un tío espantoso.","en":"To tell the truth, we learned that her new husband was a terrible guy."},{"id":2619,"es":"De vez en cuando, mi tío me llevaba al puerto.","en":"Once in a while my uncle took me to the harbor."},{"id":2620,"es":"Mi tío se fue a México en 1983, para nunca volver.","en":"My uncle went to Mexico in 1983, never to come back."},{"id":2621,"es":"Mi tío está delgado, pero mi tía está gorda.","en":"My uncle is slim, but my aunt is fat."},{"id":2622,"es":"Cuando sonó el teléfono, yo estaba viendo televisión.","en":"I was watching television when the telephone rang."},{"id":2623,"es":"Cuando vine a casa, ella estaba viendo la televisión.","en":"When I came home, she was watching TV."},{"id":2624,"es":"Viendo que no estás sorprendido, creo que debes estar al corriente.","en":"Seeing that you're not surprised, I think you must have known."},{"id":2625,"es":"Juan se sentó allí en silencio, viendo cómo Maria se terminaba la comida.","en":"Tom sat there silently watching Mary eat the last of the food."},{"id":2626,"es":"Ella se sentó en la playa vacía, viendo las olas venir una tras otra.","en":"She sat on the empty beach watching the waves roll in one after the other."},{"id":2627,"es":"De veinte estudiantes, solo uno ha leído el libro.","en":"Out of twenty students, only one has read the book."},{"id":2628,"es":"Cuando me acuerdo de aquellos estudiantes, me pongo malo.","en":"When I think about those students, it gives me a headache."},{"id":2629,"es":"Los mejores estudiantes de matemáticas también están ahí, y la competencia es dura.","en":"The best math students are there too, and the competition is strong."},{"id":2630,"es":"Estoy regañando a mis estudiantes, no a los tuyos.","en":"I am scolding my students, not yours."},{"id":2631,"es":"En cuanto entre a clase, los estudiantes empezarán a hacerme preguntas.","en":"As soon as I entered the class, the students began asking me questions."},{"id":2632,"es":"En este momento, tenemos 1,600 estudiantes en nuestro colegio.","en":"At present, we have 1,600 students at our school."},{"id":2633,"es":"Se fue a Londres, donde pasó una semana.","en":"He went to London, where he stayed for a week."},{"id":2634,"es":"Para esconderse de la policía, Dima pasó la noche en un contenedor.","en":"Hiding from the police, Dima spent the night in a dumpster."},{"id":2635,"es":"Juan se pasó tres semanas sin afeitarse, hasta que su esposa se quejó.","en":"Tom went for three weeks without shaving before his wife complained."},{"id":2636,"es":"En compañía de buenos amigos, el tiempo pasó volando.","en":"In the company of good friends, the time flew by."},{"id":2637,"es":"¿Sabes algo de Bill ? No, ¿qué le pasó ?","en":"Do you know anything about Bill? No, what happened to him?"},{"id":2638,"es":"La leyenda cuenta que el día en que ella murió, un eclipse oscureció los cielos.","en":"The legend says that the day she died, an eclipse darkened the skies."},{"id":2639,"es":"En verdad, había un solo cristiano, y él murió en la cruz.","en":"In truth, there was only one Christian, and he died on the cross."},{"id":2640,"es":"Su madre murió cuando era joven, y su abuela lo crio.","en":"His mother died when he was young, and his grandmother brought him up."},{"id":2641,"es":"Cinco días más tarde, el presidente Taylor murió.","en":"Five days later, President Taylor died."},{"id":2642,"es":"Cuando murió el perro, lo enterraron en el jardín.","en":"After the dog died, they buried him in the backyard."},{"id":2643,"es":"A causa de la hambruna, el ganado murió de hambre.","en":"Because of the famine, the cattle starved to death."},{"id":2644,"es":"Todos los esfuerzos del médico fueron en vano, enseguida el hombre murió.","en":"All the doctor's efforts were in vain and the man soon died."},{"id":2645,"es":"Cuando su líder murió, pusieron su cuerpo en una gran tumba.","en":"When their leader died, they placed his body in a large tomb."},{"id":2646,"es":"La anciana fue llevada al hospital, pero murió un poco más tarde.","en":"The old woman was taken to a hospital, but she died not long after."},{"id":2647,"es":"Hace mucho, mucho tiempo, vivía en un pueblo un anciano.","en":"Long, long ago, there lived an old man in a village."},{"id":2648,"es":"Nada más llegar al pueblo, fue derecho a verla.","en":"On arriving in the town, he went straight to see her."},{"id":2649,"es":"Desde su llegada al pueblo, todas las mujeres se quedaron cuidando de él.","en":"Since his arrival in town, all the women have remained cautious about him."},{"id":2650,"es":"Como vivo en un pueblo aislado, rara vez tengo visita.","en":"Living as I do in a remote village, I seldom have visitors."},{"id":2651,"es":"El reloj tiene dos manecillas, una para las horas y la otra para los minutos.","en":"The clock has two hands, an hour hand and a minute hand."},{"id":2652,"es":"Las horas pasan, y ella cuenta los minutos.","en":"Hours pass, and she's counting the minutes."},{"id":2653,"es":"Al aceptar el dinero, perdió el respeto de la gente.","en":"In accepting the money, he lost the respect of the people."},{"id":2654,"es":"Digas lo que digas, él no va a aceptar tu invitación.","en":"Say what you will, he won't accept your invitation."},{"id":2655,"es":"Bajo estas circunstancias, no puedo aceptar la oferta.","en":"Under these circumstances, I cannot accept the offer."},{"id":2656,"es":"Lamentablemente, será imposible para nosotros aceptar tu propuesta.","en":"Unfortunately it will be impossible for us to accept your proposal."},{"id":2657,"es":"Si la proposición es verdadera, entonces tendremos que aceptar la conclusión.","en":"If the statement is true, then we will have to accept the conclusion."},{"id":2658,"es":"Tras una madura reflexión, decidí aceptar su oferta.","en":"After mature reflection, I've decided to accept their offer."},{"id":2659,"es":"El que lucha puede perder, el que no lucha ya perdió.","en":"He who fights may lose, but he who doesn't has already lost."},{"id":2660,"es":"Él sabe cómo echar a perder un computador, pero no sabe cómo arreglarlo.","en":"He knows how to break a computer but he doesn't know how to fix it."},{"id":2661,"es":"El pastel se ha echado a perder, ya no hay quien se lo coma...","en":"The cake has gone bad, no one's going to eat it anymore..."},{"id":2662,"es":"Quien lucha puede perder, quien no lucha ya perdió.","en":"He who fights may lose, but he who doesn't has already lost."},{"id":2663,"es":"A menos que tomes una decisión rápido, vas a perder la oportunidad.","en":"Unless you make a decision quickly, the opportunity will be lost."},{"id":2664,"es":"Tengo que perder peso, así que me voy a poner a régimen.","en":"I have to lose weight, so I'm going on a diet."},{"id":2665,"es":"Sí, me sentí mal cuando rompimos, pero no me ha hecho perder el sueño.","en":"Yeah, I felt bad when we broke up, but I don't lose any sleep over it."},{"id":2666,"es":"No sueltes mi mano, o te vas a perder.","en":"Don't let go of my hand, or you'll get lost."},{"id":2667,"es":"Él tenía curiosidad de que sabor tendría, así que le dio una pequeña mordida.","en":"He was curious about how it would taste, so he took a small bite."},{"id":2668,"es":"Mi hermana pequeña siempre está intentando hacerme enfadar, pero nunca lo consigue.","en":"My little sister always tries to get a rise out of me but never succeeds."},{"id":2669,"es":"Cuando era pequeña, sólo me ponía pantalones.","en":"When I was little, I would only wear pants."},{"id":2670,"es":"Cuando era pequeña, me encantaba leer.","en":"I loved reading when I was a child."},{"id":2671,"es":"Es una ciudad pequeña, pero muy hermosa.","en":"It's a little town, but very beautiful."},{"id":2672,"es":"Causa pequeña, gran efecto.","en":"Small cause, great effect."},{"id":2673,"es":"Si alguien tiene la culpa, eres tú.","en":"If anyone is to blame, it's you."},{"id":2674,"es":"Pero entonces, lleno de culpa, una tarde se sentó en mi mesa.","en":"But then, full of guilt, I sat down at my desk one evening."},{"id":2675,"es":"¡Según yo, es tú culpa !","en":"For me it's your fault!"},{"id":2676,"es":"Si no pasa, no me eches la culpa.","en":"If it doesn't happen, don't blame me."},{"id":2677,"es":"Culparon a Tom, a pesar de que no fue su culpa.","en":"Tom got blamed even though it wasn't his fault."},{"id":2678,"es":"Sé que no eres totalmente inocente, tú también tienes tu parte de culpa.","en":"I know you're not completely innocent, you too, share some of the blame."},{"id":2679,"es":"Es fácil de decir, pero no es fácil de hacer.","en":"Easier said than done."},{"id":2680,"es":"Sí, es muy fácil de hacer.","en":"Yes, it can be done very easily."},{"id":2681,"es":"Al principio él encontraba difícil el inglés, pero ahora lo encuentra fácil.","en":"At first, he thought English very difficult, but now he thinks it is easy."},{"id":2682,"es":"Hacer amigos es fácil, pero es difícil deshacerse de ellos.","en":"It's easy to make friends, but hard to get rid of them."},{"id":2683,"es":"Si pensás que esto va a ser fácil, estás equivocado.","en":"If you think that this is going to be easy, you're wrong."},{"id":2684,"es":"Sabes qué, yo voy adonde ti; eso va a ser más fácil.","en":"Tell you what, I'll come to you, that'll be easier."},{"id":2685,"es":"Es la señora Lee, la madre de Susan, en Londres.","en":"It is Mrs. Lee, Susan's mother, in London."},{"id":2686,"es":"Esa señora me da miedo, siempre está dando voces y hablando consigo misma.","en":"That woman scares me. She's always shouting and talking to herself."},{"id":2687,"es":"No, no entiendo a la señora Kunze.","en":"No, I don't understand Ms. Kunze."},{"id":2688,"es":"Si ves al Sr. Long, no te olvides de preguntarle por el estado de su señora, por favor.","en":"If you see Mr. Long, please don't forget to ask him how his wife's doing."},{"id":2689,"es":"¿Cómo está usted, señora Jones ?","en":"How are you, Mrs. Jones?"},{"id":2690,"es":"Mi señora está en su recamara, dijo el sirviente.","en":"My lady is in her chamber, said the servant."},{"id":2691,"es":"Al parecer, la señora Brown es una actriz.","en":"Ms. Brown seems to be an actress."},{"id":2692,"es":"Entonces, ¿qué problema tienes ?","en":"So what's your problem?"},{"id":2693,"es":"Por favor, háblame de tu problema.","en":"Please tell me about your problem."},{"id":2694,"es":"Toma mis manzanas, niño mío, y véndelas en la ciudad.","en":"Take my apples, boy, and sell them in the city."},{"id":2695,"es":"Toma este medicamento, y te sentirás mejor.","en":"Take this medicine, and you will feel better."},{"id":2696,"es":"¿Quieres una fresa ? Toma, coge la que más te guste.","en":"Do you want a strawberry? Here, take the one that pleases you most."},{"id":2697,"es":"Adelante, toma otro.","en":"Please take another one."},{"id":2698,"es":"¿Quieres una fresa ? Toma, elige la que más te guste.","en":"Do you want a strawberry? Here, take the one that pleases you most."},{"id":2699,"es":"De mañana, Sandra come una rodaja de pan y toma una taza de café.","en":"In the morning, Sandra eats a slice of bread and drinks a cup of coffee."},{"id":2700,"es":"Cualquier idioma que estudies, toma tiempo.","en":"Whatever language you study, it takes time."},{"id":2701,"es":"Para él, los cinco minutos parecieron cinco horas.","en":"To him the five minutes seemed like as five hours."},{"id":2702,"es":"Por ahora, no necesitamos nada.","en":"For the time being, we need nothing."},{"id":2703,"es":"¡Por favor, necesitamos tu ayuda !","en":"Please, we need your help!"},{"id":2704,"es":"Queremos comprar una casa, pero para eso necesitamos guardar dinero.","en":"We want to buy a house, but we need to save money for that."},{"id":2705,"es":"No necesitamos ningún voluntario más, pero podríamos utilizar un poco más de dinero.","en":"We don't need any more volunteers, but we could use some more money."},{"id":2706,"es":"Lo que necesitamos ahora es acción, no discusión.","en":"All we need now is action, not discussion."},{"id":2707,"es":"Además de materiales, necesitamos una muestra.","en":"We need a sample in addition to materials."},{"id":2708,"es":"¡Emet, necesitamos más carne !","en":"Emet, we need more meat!"},{"id":2709,"es":"Hace mucho calor, ¿verdad ?","en":"It's very hot, isn't it?"},{"id":2710,"es":"Hace calor hoy, ¿no ?","en":"It's hot today, isn't it?"},{"id":2711,"es":"Hace mucho calor en este cuarto, ¿no es así ?","en":"It is very hot in this room, isn't it?"},{"id":2712,"es":"En verano, hace mucho calor aquí.","en":"In the summer, it is very hot here."},{"id":2713,"es":"Me gusta el verano, pero no puedo soportar el calor.","en":"I like summer, but I can't stand the heat."},{"id":2714,"es":"En Japón, hace mucho calor en verano.","en":"In Japan, it is very hot in summer."},{"id":2715,"es":"Si de verdad querés hablar conmigo, es ahora o nunca.","en":"If you really want to speak to me, it's now or never."},{"id":2716,"es":"Me podés llamar esta tarde, si querés.","en":"You can call me this afternoon if you want."},{"id":2717,"es":"Si querés ver a Tom, tenés que apurarte.","en":"If you want to see Tom, you have to hurry."},{"id":2718,"es":"Obviamente, no puedo obligarte a hacer algo que no querés hacer.","en":"Obviously, I can't force you to do something you don't want to do."},{"id":2719,"es":"Si querés libertad, tendrás que enfrentar a tus padres.","en":"If you want freedom, you'll have to face your parents."},{"id":2720,"es":"Si querés tener éxito, deberías esforzarte.","en":"If you are to succeed, you should make efforts."},{"id":2721,"es":"Si querés ir, entonces andá.","en":"If you want to go, then go."},{"id":2722,"es":"Si no querés escuchar, tapate los oídos.","en":"If you don't want to listen, cover your ears."},{"id":2723,"es":"Compré una cámara, pero la perdí al día siguiente.","en":"I bought a camera, but I lost it the next day."},{"id":2724,"es":"Para decirte la verdad, perdí tu bolígrafo.","en":"To tell you the truth, I lost your pen."},{"id":2725,"es":"Compré un bolígrafo, pero lo perdí.","en":"I bought a pen, but I lost it."},{"id":2726,"es":"A decir verdad, perdí tu pluma.","en":"To tell the truth, I have lost your pen."},{"id":2727,"es":"Me dio un reloj precioso, pero lo perdí.","en":"She gave me a beautiful clock, but I lost it."},{"id":2728,"es":"Me perdí, y para colmo empezó a llover.","en":"I got lost, and to make matter worse, it began to rain."},{"id":2729,"es":"Corrí tan rápido como pude, pero perdí el autobús.","en":"I ran as fast as I could, but I missed the bus."},{"id":2730,"es":"Quería andar en bicicleta, pero perdí la práctica.","en":"I wanted to ride my bike, but I'm out of practice."},{"id":2731,"es":"El corte ya no te duele tanto como antes, ¿verdad ?","en":"Your cut wound doesn't hurt as much as before, right?"},{"id":2732,"es":"De repente, el corazón me duele.","en":"Suddenly my heart hurts."},{"id":2733,"es":"Me duele la úlcera, así que no puedo comer.","en":"My canker hurts, so I can't really eat."},{"id":2734,"es":"Me duele decir esto, pero usted está despedido.","en":"I'm sorry to say this but, you're fired."},{"id":2735,"es":"No te preocupes, cortar el pelo no duele.","en":"Don't worry, cutting your hair doesn't hurt."},{"id":2736,"es":"No tengo fiebre, pero me duele la garganta. Tampoco puedo respirar bien.","en":"I have no fever, but my throat hurts me. I can't either freery breathe."},{"id":2737,"es":"No te preocupes, no duele que te corten el pelo.","en":"Don't worry, cutting your hair doesn't hurt."},{"id":2738,"es":"Doctor, me duele el estómago.","en":"Doctor, my stomach hurts."},{"id":2739,"es":"Doctor, me duele mi estómago.","en":"Doctor, my stomach hurts."},{"id":2740,"es":"Nunca le veo, pero soy feliz.","en":"I never see him but I am happy."},{"id":2741,"es":"Como yo lo veo, él tiene razón.","en":"The way I see it, he is right."},{"id":2742,"es":"Pocos se dan cuenta, pero es verdad.","en":"Few people realize it, but it's true."},{"id":2743,"es":"Se supone que todo el mundo conoce la ley, pero pocos lo hacen.","en":"Everybody is supposed to know the law, but few people really do."},{"id":2744,"es":"Hay pocos errores, si es que hay alguno.","en":"There are few, if any, mistakes."},{"id":2745,"es":"Supuestamente todo el mundo conoce la ley, pero unos pocos lo hacen.","en":"Everybody is supposed to know the law, but few people really do."},{"id":2746,"es":"Tengo pocos alumnos, no más que cinco en total.","en":"My students are few in number, no more than five altogether."},{"id":2747,"es":"Pocos, si es que alguno, lo criticarán.","en":"Few, if any, will criticize him."},{"id":2748,"es":"¿Podrías hacerme un favor, por favor ?","en":"Could you do me a favour please?"},{"id":2749,"es":"¿Puede hacerme un sitio, por favor ?","en":"Will you make room for me?"},{"id":2750,"es":"Si tuviera el dinero, no tardaría ni un segundo en hacerme con este ordenador.","en":"If I had the money, I would immediately acquire this computer."},{"id":2751,"es":"No se moleste, yo puedo hacerme cargo de esto.","en":"Don't bother, I can take care of this myself."},{"id":2752,"es":"Discúlpeme, pero ¿podría hacerme un favor ?","en":"Excuse me, but could you do me a favor?"},{"id":2753,"es":"Por favor, no duden en hacerme cualquier pregunta.","en":"Please don't hesitate to ask me any questions."},{"id":2754,"es":"Esta vez, él consiguió resultados.","en":"This time, he got results."},{"id":2755,"es":"Sea como sea, ella no consiguió lo que esperaba.","en":"Anyway, she didn't get what she hoped for."},{"id":2756,"es":"Juan trató de ver a través de la rendija, pero no consiguió ver nada.","en":"Tom tried to look through the keyhole, but couldn't see anything."},{"id":2757,"es":"Ahora, papá consiguió un puesto superior en su oficina.","en":"Father has now got a superior position in his office."},{"id":2758,"es":"A pesar de sus esfuerzos, no consiguió triunfar.","en":"With all his efforts, he couldn't succeed."},{"id":2759,"es":"A pesar de ser insultado, él consiguió mantener su temperamento.","en":"In spite of being insulted, he managed to keep his temper."},{"id":2760,"es":"A pesar de la adversidad, el ingenioso hombre consiguió fama mundial.","en":"Despite adversity, the ingenious man achieved worldwide fame."},{"id":2761,"es":"A pesar de la adversidad, el arquitecto consiguió fama mundial.","en":"Despite adversity, the architect achieved worldwide fame."},{"id":2762,"es":"Si no tienes nada que hacer, mira el techo de tu habitación.","en":"If you don't have anything to do, look at the ceiling of your room."},{"id":2763,"es":"Por favor, entra en la habitación.","en":"Please come into the room."},{"id":2764,"es":"Bob ha venido aquí, ¿verdad ?","en":"Bob's come here, hasn't he?"},{"id":2765,"es":"Si querías mejorar tu español, no tendrías que haber venido a Chile.","en":"If you wanted to improve your Spanish, you shouldn't have come to Chile."},{"id":2766,"es":"¡Si te gusta comer marisco, has venido al sitio adecuado !","en":"If you like seafood, you've come to the right place!"},{"id":2767,"es":"Cuando llegamos a la estación, el tren ya había partido.","en":"When we got to the station, the train had already left."},{"id":2768,"es":"Por fin, llegamos al lago.","en":"We finally got to the lake."},{"id":2769,"es":"Después de caminar un rato, llegamos al lago.","en":"Having walked for some time, we came to the lake."},{"id":2770,"es":"Aún si llegamos tarde, no nos molesta.","en":"Even if we're late, it doesn't bother us."},{"id":2771,"es":"Demasiado tarde: cuando llegamos allí, Jack ya se había ido.","en":"Too late, when we got there Jack had already gone."},{"id":2772,"es":"Después de haber caminado por un rato, llegamos al mar.","en":"After we had walked for some time, we came to the lake."},{"id":2773,"es":"En cuanto llegamos al puerto, el viento amainó.","en":"When we arrived at the port, the wind subsided."},{"id":2774,"es":"Yo no he pedido ayuda, ni la quiero.","en":"I have not asked for help, nor do I desire it."},{"id":2775,"es":"No me dejes solo, por favor.","en":"Please don't leave me alone."},{"id":2776,"es":"¡No me dejes, por favor !","en":"Please don't leave me!"},{"id":2777,"es":"No me dejes, Tom.","en":"Tom, don't you leave me."},{"id":2778,"es":"No me dejes sola, por favor.","en":"Please don't leave me alone."},{"id":2779,"es":"Por favor, no dejes que se apague el fuego.","en":"Please keep the fire from going out."},{"id":2780,"es":"Si no te gusta el servicio, no dejes una propina.","en":"If you don't like the service, don't leave a tip."},{"id":2781,"es":"Hermana, no dejes que desaparezca de tu vista este paciente.","en":"Sister, don't let this patient out of your sight."},{"id":2782,"es":"Lo siento, no llevo mi reloj.","en":"I'm sorry I don't have my watch with me."},{"id":2783,"es":"Escucha, ¿te importa si me llevo esto conmigo ?","en":"Listen, do you mind if I take this with me?"},{"id":2784,"es":"Me da igual lo que digas, estoy convencido de que llevo razón.","en":"No matter what you say, I am convinced that I am right."},{"id":2785,"es":"Yo llevo traje, pero no llevo corbata.","en":"I wear a suit, but not a tie."},{"id":2786,"es":"Está nublado, me llevo mi paraguas.","en":"It being cloudy, I took my umbrella with me."},{"id":2787,"es":"Por extraño que parezca, él se encontró con alguien que decían estaba muerto.","en":"As strange as it may be, he met with somebody who is said to be dead."},{"id":2788,"es":"Tan pronto como se apeó del tren, se encontró con su primo.","en":"As soon as he got off the train, he was met by his cousin."},{"id":2789,"es":"Una vez, Cristóbal Colón se encontró con Betty, pero NO fue asesinado.","en":"Christopher Columbus once met Betty, but did NOT get murdered."},{"id":2790,"es":"Ella buscó las llaves de la casa en su cartera, pero no las encontró.","en":"She looked in her bag for the key of the house, but could not find it."},{"id":2791,"es":"Ella perdió su gorro, pero lo encontró luego.","en":"She lost her tuque but later found it."},{"id":2792,"es":"Cuando volvió en sí, se encontró tumbado en una pequeña celda desprovista de ventanas.","en":"When he came to he found himself lying in a small, windowless cell."},{"id":2793,"es":"Afortunadamente, él encontró un buen asiento.","en":"Luckily, he found a good seat."},{"id":2794,"es":"Pensé que habíamos encontrado el escondite perfecto, pero la policía nos encontró.","en":"I thought we had found the perfect hiding place, but the police found us."},{"id":2795,"es":"Ojos que no ven, corazón que no siente.","en":"Out of sight, out of mind."},{"id":2796,"es":"Cuando llueve, ella se siente triste.","en":"When it rains, she feels blue."},{"id":2797,"es":"La gente valiente siente miedo, pero eso no les detiene.","en":"Brave people feel fear, but that doesn't stop them."},{"id":2798,"es":"Aquí, todo el mundo se siente respetado y apreciado.","en":"Here, everybody feels respected and appreciated."},{"id":2799,"es":"No parece raro, pero por alguna razón se siente raro...","en":"It doesn't seem strange, but for some reason it feels strange..."},{"id":2800,"es":"Abraza tu vulnerabilidad, siente el miedo, ama plenamente.","en":"Embrace your vulnerability, feel your fear, love fully."},{"id":2801,"es":"Es un buen momento para que te tomes unas vacaciones, dijo el jefe a Jim.","en":"It's a good time for you to take a vacation, the boss said to Jim."},{"id":2802,"es":"Próxima vez que venga, te voy a llevar unas flores.","en":"Next time I come, I'll bring you some flowers."},{"id":2803,"es":"Puse unas galletas sobre la mesa, y los niños se las comieron enseguida.","en":"I put some cookies on the table and the kids ate them right up."},{"id":2804,"es":"Señor, unas disculpas no van a curar cientos de quemaduras de segundo grado.","en":"Apologizing isn't going to heal hundreds of second-degree burns, sir."},{"id":2805,"es":"En mi zona hay unas bonitas y acogedoras ciudades, seguro que te encantan.","en":"In my region there are beautiful and living cities you will surely love."},{"id":2806,"es":"Unas veces está contento, otras melancólico.","en":"Sometimes he's happy, sometimes melancholic."},{"id":2807,"es":"Las tres hienas se sentaron formando un círculo, razonando las unas con las otras.","en":"The three hyenas sat in a circle, reasoning with one another."},{"id":2808,"es":"En febrero, tuvimos unas vacaciones cortas.","en":"We
